<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TCRN Exam Simulator</title>
<style>
:root{--bg:#f6f4ef;--fg:#1f1f1f;--card:#fff;--mut:#666;--acc:#B3261E;--bd:#d9d4c8;--ok:#1e8a4c;--okbg:#e4f5ea;--bad:#b3261e;--badbg:#fbe9e7;--fl:#e2a117}
@media(prefers-color-scheme:dark){:root{--bg:#191817;--fg:#eee;--card:#252321;--mut:#aaa;--bd:#3d3a36;--okbg:#17321f;--badbg:#3a1a17}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 Constantia,Georgia,serif}
button{font:inherit;cursor:pointer;border:2px solid var(--acc);background:var(--card);color:var(--acc);padding:8px 16px;border-radius:10px;font-weight:700}
button.p{background:var(--acc);color:#fff}button:disabled{opacity:.4;cursor:default}
select,input{font:inherit;padding:6px 8px;border-radius:8px;border:1.5px solid var(--bd);background:var(--card);color:var(--fg)}
.wrap{max-width:900px;margin:0 auto;padding:16px}h1{color:var(--acc);margin:.2em 0}h2{margin:.8em 0 .3em}
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}td.r,th.r{text-align:right}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--acc);padding:8px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tm{font:700 20px ui-monospace,Consolas,monospace;color:var(--acc)}.tm.low{animation:bl 1s infinite}@keyframes bl{50%{opacity:.4}}
.q{font-size:18px;font-weight:700;margin:6px 0 12px}
.opt{display:flex;gap:10px;padding:10px 12px;border:2px solid var(--bd);border-radius:12px;margin:8px 0;cursor:pointer;background:var(--card)}
.opt.sel{border-color:var(--acc);background:var(--badbg)}.opt b{flex:0 0 22px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.no{border-color:var(--bad);background:var(--badbg)}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.nv{padding:6px 0;text-align:center;border:1.5px solid var(--bd);border-radius:8px;cursor:pointer;font:700 13px system-ui;background:var(--card);position:relative}
.nv.a{background:var(--acc);color:#fff;border-color:var(--acc)}.nv.c{outline:3px solid var(--fg)}.nv.f::after{content:"";position:absolute;right:2px;top:2px;width:8px;height:8px;border-radius:50%;background:var(--fl)}
.note{font-size:14px;color:var(--mut)}.fb{margin-top:10px;font-size:15px}.fb p{margin:6px 0}.tag{display:inline-block;border-radius:8px;padding:1px 8px;font:700 12px system-ui;background:var(--bd);color:var(--fg)}
.big{font:700 44px system-ui;color:var(--acc)}.pass{color:var(--ok)}.fail{color:var(--bad)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
</style></head><body><div id="app"></div>
<script>
const BANK=[{"id":"T1-1","a":0,"s":"A patient falls from a ladder and reports the worst headache of his life with a stiff neck. CT shows blood in the basal cisterns. Which injury is most likely?","o":[{"t":"Epidural hematoma with a lucid interval","c":false,"r":"An epidural bleed forms a lens shaped collection against the skull, not blood in the cisterns."},{"t":"Subdural hematoma over the brain surface","c":false,"r":"A subdural bleed forms a crescent over the brain, and the headache is usually gradual."},{"t":"Traumatic subarachnoid hemorrhage","c":true,"r":""},{"t":"Diffuse axonal injury with normal findings","c":false,"r":"Diffuse axonal injury shows little or no blood and causes deep coma, not a stiff neck."}],"i":"Recognizing the pattern of an intracranial bleed.","e":"Sudden severe headache, a stiff neck, and blood in the basal cisterns describe subarachnoid hemorrhage. Blood irritates the meninges and can cause vasospasm, so the patient needs close neurologic checks."},{"id":"T1-2","a":0,"s":"A motorcyclist is in a deep coma after a high speed crash. The first CT of the head shows no bleeding. Which injury is most likely?","o":[{"t":"Epidural hematoma from a torn artery","c":false,"r":"An epidural hematoma would be visible on the first CT as a lens shaped collection."},{"t":"Concussion with a brief loss of consciousness","c":false,"r":"A concussion does not cause a prolonged deep coma."},{"t":"Chronic subdural hematoma from old bleeding","c":false,"r":"A chronic subdural bleed develops over weeks and would be seen on CT."},{"t":"Diffuse axonal injury from shearing forces","c":true,"r":""}],"i":"Linking coma with a normal CT to diffuse axonal injury.","e":"Rotation and deceleration shear nerve fibers across the brain. The CT may look normal, yet the patient has a profound deficit, and MRI shows the damage later."},{"id":"T1-3","a":0,"s":"A patient opens the eyes to voice, answers with confused speech, and localizes to pain. What is the Glasgow Coma Scale score?","o":[{"t":"10","c":false,"r":"This undercounts the motor response, because localizing scores 5."},{"t":"11","c":false,"r":"This undercounts by one point, because confused speech scores 4 and localizing scores 5."},{"t":"12","c":true,"r":""},{"t":"13","c":false,"r":"This overcounts, because opening the eyes to voice scores 3, not 4."}],"i":"Scoring the Glasgow Coma Scale.","e":"Eye opening to voice scores 3, confused speech scores 4, and localizing pain scores 5. The total is 12, which is a moderate injury."},{"id":"T1-4","a":0,"s":"A patient with a head injury has a dilated, fixed left pupil, and the Glasgow Coma Scale score has fallen from 12 to 8. What should the nurse do first?","o":[{"t":"Notify the physician, prepare for mannitol","c":true,"r":""},{"t":"Recheck the pupils and vitals in 30 minutes","c":false,"r":"Waiting delays treatment of herniation, which is time critical."},{"t":"Lay the patient flat to raise perfusion","c":false,"r":"Lying flat raises intracranial pressure and increases herniation risk."},{"t":"Give a sedative to calm the agitation","c":false,"r":"Sedation hides the neurologic exam and does not treat the cause."}],"i":"Responding to signs of herniation.","e":"A blown pupil with a falling score signals brain herniation. The team needs to know at once, and measures include elevating the head, osmotic therapy, and a repeat CT."},{"id":"T1-5","a":0,"s":"A patient with a severe brain injury receives mannitol. Which effect should the nurse monitor for?","o":[{"t":"Fluid overload from retained water","c":false,"r":"Mannitol causes diuresis, which removes water, so overload is not the main risk."},{"t":"Hypovolemia and low pressure from diuresis","c":true,"r":""},{"t":"Bradycardia from vagal stimulation","c":false,"r":"Mannitol does not act on the vagus nerve."},{"t":"Hypoglycemia from increased insulin release","c":false,"r":"Mannitol does not alter insulin release."}],"i":"Monitoring hyperosmolar therapy.","e":"Mannitol pulls water out of the brain and increases urine output. Low blood volume and low pressure can lower cerebral perfusion, so the nurse tracks urine output, pressure, and serum osmolality."},{"id":"T1-6","a":0,"s":"A patient has a severe traumatic brain injury and is on intracranial pressure monitoring. Which drug does the nurse expect for seizure prophylaxis during the first week?","o":[{"t":"Diazepam on a set schedule","c":false,"r":"Benzodiazepines are used to stop an active seizure and can cloud the neurologic exam."},{"t":"Haloperidol as needed","c":false,"r":"This drug treats agitation and can lower the seizure threshold."},{"t":"Levetiracetam","c":true,"r":""},{"t":"Phenobarbital","c":false,"r":"It is sedating and is not the first choice for prophylaxis."}],"i":"Knowing seizure prophylaxis after brain injury.","e":"Prophylaxis for the first seven days lowers early seizures, which raise pressure and oxygen demand. Levetiracetam is common because it has few interactions."},{"id":"T1-7","a":0,"s":"A patient with a concussion is ready to go home. Which instruction is most important for the caregiver to hear?","o":[{"t":"Wake the patient every 15 minutes for the first full day","c":false,"r":"Constant waking is not needed, and it prevents rest."},{"t":"Allow a full return to sports once the headache stops","c":false,"r":"Return to activity should be gradual, under guidance."},{"t":"Return for vomiting, worsening headache, or trouble waking","c":true,"r":""},{"t":"Give aspirin or ibuprofen for the headache every four hours","c":false,"r":"Aspirin can raise the risk of bleeding."}],"i":"Teaching concussion warning signs.","e":"Worsening signs can mean a delayed bleed. Caregivers need clear return precautions and a plan for rest and a graded return to activity."},{"id":"T1-8","a":0,"s":"After a fall, a patient with a spinal injury can feel light touch around the anus. How does this finding classify the injury?","o":[{"t":"Incomplete, since sacral sensation remains","c":true,"r":""},{"t":"Complete, because the legs are paralyzed","c":false,"r":"A cord injury is complete only when sacral function is also absent."},{"t":"Stable, because the bones are not broken","c":false,"r":"Stability describes the bones, not the cord function."},{"t":"Spinal shock, because the reflexes are gone","c":false,"r":"Spinal shock describes temporary loss of reflexes, not the extent of injury."}],"i":"Classifying cord injury by sacral sparing.","e":"Sparing of sacral sensation or movement means some pathways are intact. Incomplete injuries have a better chance of recovery."},{"id":"T1-9","a":0,"s":"A patient with a C4 spinal cord injury has shallow breathing, belly movement during inhalation, and a falling oxygen saturation. What should the nurse anticipate?","o":[{"t":"Intubation and ventilator support","c":true,"r":""},{"t":"A nasal cannula at 2 L/min and observation","c":false,"r":"This does not support failing ventilation."},{"t":"A nebulized bronchodilator treatment","c":false,"r":"The problem is weak muscles, not airway spasm."},{"t":"A chest tube on the side of the injury","c":false,"r":"No air or blood in the chest is suggested."}],"i":"Preparing for respiratory failure in a high cervical injury.","e":"Nerves for the diaphragm come from C3 to C5. An injury at that level weakens the diaphragm, and the patient tires quickly."},{"id":"T1-10","a":0,"s":"A patient was thrown forward in a crash and now has loss of movement and loss of pain and temperature below the injury, but can feel vibration and position. Which syndrome is most likely?","o":[{"t":"Central cord syndrome","c":false,"r":"This causes arm weakness greater than leg weakness, usually after hyperextension."},{"t":"Brown Séquard syndrome","c":false,"r":"This causes one sided weakness with opposite sided loss of pain."},{"t":"Anterior cord syndrome","c":true,"r":""},{"t":"Posterior cord syndrome","c":false,"r":"This causes loss of position and vibration, which are preserved here."}],"i":"Recognizing anterior cord syndrome.","e":"A flexion injury or loss of the anterior spinal artery damages the front of the cord. The back columns, which carry vibration and position, are spared."},{"id":"T1-11","a":0,"s":"A patient has saddle numbness, urinary retention, and weak, floppy legs after a lumbar fracture. Which condition is likely?","o":[{"t":"Central cord syndrome","c":false,"r":"This is a cervical injury that mainly weakens the arms."},{"t":"Autonomic dysreflexia","c":false,"r":"This causes high blood pressure in injuries at T6 or above."},{"t":"Anterior cord syndrome","c":false,"r":"This causes loss of pain and temperature with preserved position sense."},{"t":"Cauda equina syndrome","c":true,"r":""}],"i":"Identifying cauda equina syndrome.","e":"Injury to the nerve roots below the cord end causes saddle numbness, bladder and bowel loss, and flaccid legs. It needs urgent surgical decompression."},{"id":"T1-12","a":0,"s":"Four staff members will log roll a patient with a suspected thoracic spine injury. Which step is correct?","o":[{"t":"Two staff turn the shoulders and then the hips later","c":false,"r":"The spine must turn as one unit, not in segments."},{"t":"The patient bends the knees and pushes with the arms","c":false,"r":"The patient should not move or assist."},{"t":"One person controls the head and calls the turn","c":true,"r":""},{"t":"The collar is removed to make the turn easier","c":false,"r":"The collar should stay in place."}],"i":"Performing a log roll safely.","e":"The person at the head keeps the neck in line and directs the move. Others hold the shoulders, hips, and legs and turn on the count."},{"id":"T1-13","a":0,"s":"After a patient with a T5 injury is sat upright and tight clothing is loosened, the blood pressure remains 190/100. What should the nurse do next?","o":[{"t":"Lay the patient flat and raise the legs above the heart","c":false,"r":"This raises the blood pressure further."},{"t":"Give a rapid fluid bolus to treat the headache fast","c":false,"r":"The pressure is high, not low, so fluids can cause harm."},{"t":"Check the catheter for kinks or blockage and flush it","c":true,"r":""},{"t":"Wait ten minutes to see whether the pressure comes down","c":false,"r":"Dysreflexia can cause stroke, so the trigger must be found now."}],"i":"Removing the trigger in autonomic dysreflexia.","e":"A full bladder is the most common trigger. Check the catheter, then the bowel and skin, and give a fast acting drug if the pressure stays high."},{"id":"T1-14","a":0,"s":"A patient with a T6 spinal cord injury has a mean arterial pressure of 68 mmHg after fluids, and the goal is at least 80 mmHg. What should the nurse anticipate?","o":[{"t":"A vasopressor after volume is restored","c":true,"r":""},{"t":"A fluid restriction to protect the heart","c":false,"r":"The goal is to raise, not lower, perfusion."},{"t":"A drug to lower the heart rate further","c":false,"r":"The pressure is already low."},{"t":"A flat bed position and no other action","c":false,"r":"Position alone will not reach the goal."}],"i":"Supporting spinal cord perfusion.","e":"Hypotension worsens cord ischemia. Once bleeding is excluded and volume is restored, a vasopressor helps keep the mean arterial pressure on target."},{"id":"T1-15","a":0,"s":"A patient with a severe brain injury has an oxygen saturation of 86 percent. Why is this urgent?","o":[{"t":"Hypoxia worsens secondary brain injury and outcome","c":true,"r":""},{"t":"Low oxygen speeds recovery of injured brain tissue","c":false,"r":"Low oxygen harms brain tissue."},{"t":"It shows that the intracranial pressure is now normal","c":false,"r":"Saturation does not measure pressure."},{"t":"It is expected after injury and needs no action","c":false,"r":"Saturation should be kept above 90 percent."}],"i":"Preventing secondary injury from hypoxia.","e":"The injured brain is very sensitive to a lack of oxygen. A single episode raises the risk of a poor outcome, so correct it right away."},{"id":"T1-16","a":0,"s":"A patient with a brain injury has a blood glucose of 42 mg/dL. What is the likely effect?","o":[{"t":"Improved protection of the brain cells","c":false,"r":"Low glucose does not protect the brain."},{"t":"A drop in intracranial pressure to normal","c":false,"r":"Glucose changes do not lower pressure."},{"t":"Neuronal injury from a lack of fuel","c":true,"r":""},{"t":"No effect, since fat fuels the brain","c":false,"r":"The brain depends on glucose."}],"i":"Avoiding hypoglycemia after brain injury.","e":"Both low and high glucose raise secondary injury. Treat low values promptly and avoid high values with protocol based insulin."},{"id":"T1-17","a":0,"s":"A patient with a severe brain injury has a temperature of 39.2 degrees Celsius. What should the nurse do?","o":[{"t":"Allow the fever to run, since it fights infection","c":false,"r":"Fever raises brain oxygen demand and worsens injury."},{"t":"Treat the fever with antipyretics and cooling","c":true,"r":""},{"t":"Apply extra blankets to prevent shivering","c":false,"r":"Warming raises the temperature and the demand."},{"t":"Stop the sedative to look for shivering","c":false,"r":"This raises metabolic demand without treating the cause."}],"i":"Controlling temperature.","e":"Fever raises the metabolic rate of the brain and can raise pressure. Treat it and look for a cause, while avoiding shivering."},{"id":"T1-18","a":0,"s":"A ventilated patient with a head injury has a PaCO2 of 22 mmHg and no signs of herniation. What does the nurse anticipate?","o":[{"t":"No change, since a low value protects the brain","c":false,"r":"Low carbon dioxide constricts vessels and cuts flow."},{"t":"A ventilator change to bring PaCO2 to 35 to 45 mmHg","c":true,"r":""},{"t":"A lower ventilator rate to raise the PaCO2 above 55","c":false,"r":"High carbon dioxide dilates vessels and raises pressure."},{"t":"A bolus of sodium bicarbonate given intravenously","c":false,"r":"This does not correct a low carbon dioxide."}],"i":"Avoiding routine hyperventilation.","e":"The goal is a normal carbon dioxide level. Brief hyperventilation is only a bridge for active herniation."},{"id":"T1-19","a":0,"s":"Which action reduces a rise in intracranial pressure during suctioning of a patient with a brain injury?","o":[{"t":"Suction deeply and repeat the pass three times in a row","c":false,"r":"Repeated suctioning raises pressure and drops oxygen."},{"t":"Lay the patient flat before each suctioning pass","c":false,"r":"A flat position raises pressure."},{"t":"Suction without extra oxygen to save some time","c":false,"r":"Hypoxia worsens injury."},{"t":"Preoxygenate and limit each pass to about ten seconds","c":true,"r":""}],"i":"Protecting a patient from pressure spikes.","e":"Suctioning causes coughing and hypoxia. Preoxygenation, short passes, and grouped care reduce spikes."},{"id":"T1-20","a":0,"s":"A cervical collar is applied to a patient with a head injury and swelling of the face. The neck veins look full and the intracranial pressure rises. What should the nurse check?","o":[{"t":"Whether the collar is too tight, then loosen and align","c":true,"r":""},{"t":"Whether the patient needs a tighter collar for support","c":false,"r":"A tight collar blocks venous drainage."},{"t":"Whether the head of the bed can be lowered further","c":false,"r":"Lowering the bed raises pressure."},{"t":"Whether to remove the collar and turn the head aside","c":false,"r":"Spinal precautions must stay in place."}],"i":"Preventing outflow obstruction in the neck.","e":"A tight collar compresses the jugular veins and raises pressure in the head. Fit it correctly and keep the neck midline."},{"id":"T1-21","a":0,"s":"A patient with a fractured mandible is drooling, cannot close the teeth together, and has a swollen floor of the mouth. What is the priority?","o":[{"t":"Apply ice and give a soft diet by mouth","c":false,"r":"The airway comes before comfort."},{"t":"Protect the airway and prepare to intubate","c":true,"r":""},{"t":"Wire the jaw closed at the bedside now","c":false,"r":"Wiring the jaw shut can block the airway."},{"t":"Give oral pain medicine and observe closely","c":false,"r":"Swallowing is unsafe."}],"i":"Prioritizing the airway in a jaw fracture.","e":"Swelling and bleeding in the floor of the mouth can close the airway. A broken mandible can let the tongue fall back."},{"id":"T1-22","a":0,"s":"A patient has double vision when looking upward, a sunken eye, and numbness of the cheek after being punched. What does the nurse suspect?","o":[{"t":"A Le Fort I fracture of the maxilla with a mobile palate","c":false,"r":"This causes a mobile palate and malocclusion, not limited upward gaze."},{"t":"A basilar skull fracture with leakage of spinal fluid","c":false,"r":"This causes raccoon eyes and fluid from the ear or nose, not limited upward gaze."},{"t":"A nasal septal hematoma with swelling inside the nose","c":false,"r":"This causes nasal swelling and blockage, not double vision on upward gaze."},{"t":"An orbital blowout fracture with muscle entrapment","c":true,"r":""}],"i":"Recognizing an orbital blowout fracture.","e":"The orbital floor breaks and the inferior rectus muscle can be trapped. Teach the patient not to blow the nose."},{"id":"T1-23","a":0,"s":"After a blow to the nose, a patient has a bulging, purple swelling on both sides of the nasal septum. What should the nurse expect?","o":[{"t":"Packing of the nostrils and discharge","c":false,"r":"Packing alone leaves the hematoma in place."},{"t":"Incision and drainage of the hematoma","c":true,"r":""},{"t":"Observation until the swelling subsides","c":false,"r":"An untreated hematoma can destroy the cartilage."},{"t":"A hot compress applied to the nose","c":false,"r":"Heat increases swelling."}],"i":"Treating a septal hematoma.","e":"Blood between the septum and its lining can cut off the blood supply to cartilage. Drainage prevents a collapsed nose."},{"id":"T1-24","a":0,"s":"A patient has a long face, bruising around both eyes, and clear fluid from the nose after a crash. Which injury is most likely?","o":[{"t":"Le Fort I fracture","c":false,"r":"This separates only the lower part of the maxilla."},{"t":"Isolated nasal fracture","c":false,"r":"This does not lengthen the face or leak fluid."},{"t":"Le Fort III fracture","c":true,"r":""},{"t":"Zygomatic arch fracture","c":false,"r":"This causes a flat cheek and trouble opening the mouth."}],"i":"Identifying a Le Fort III fracture.","e":"The whole midface separates from the skull base. A leak of cerebrospinal fluid shows that the base of the skull is involved."},{"id":"T1-25","a":0,"s":"After a blow to the eye with a ball, a patient has blood in the front chamber of the eye. How should the nurse position the patient?","o":[{"t":"Lying flat in bed to rest the injured eye","c":false,"r":"A flat position lets blood spread."},{"t":"Head down to help drainage of the blood","c":false,"r":"This raises pressure in the eye."},{"t":"With the head raised 30 to 45 degrees","c":true,"r":""},{"t":"On the injured side with ice on the eye","c":false,"r":"Pressure on the eye is harmful."}],"i":"Positioning for hyphema.","e":"Raising the head lets blood settle and lowers eye pressure. Avoid aspirin and anti inflammatory drugs, and use a shield."},{"id":"T1-26","a":0,"s":"A patient has a bulging, painful eye, loss of vision, and a pupil that reacts poorly after a facial fracture. Which procedure is needed within minutes?","o":[{"t":"Lateral canthotomy and cantholysis","c":true,"r":""},{"t":"Eye irrigation with saline solution","c":false,"r":"Irrigation does not relieve pressure behind the eye."},{"t":"Placing a firm pressure patch on it","c":false,"r":"Pressure worsens the injury."},{"t":"Applying antibiotic ointment to the eye","c":false,"r":"It does not treat the pressure."}],"i":"Recognizing orbital compartment syndrome.","e":"Bleeding behind the eye raises pressure and cuts off the optic nerve. Release of the lateral canthus restores flow."},{"id":"T1-27","a":0,"s":"A patient has a metal shard sticking out of the eye. What is the appropriate action?","o":[{"t":"Pull the shard out and apply a firm patch","c":false,"r":"Removal can cause more damage."},{"t":"Irrigate the eye to wash the shard out","c":false,"r":"Irrigation can push contents out of the globe."},{"t":"Press on the eye to hold the shard and patch","c":false,"r":"Pressure can worsen the injury."},{"t":"Stabilize it with a rigid shield, leave it","c":true,"r":""}],"i":"Handling an impaled object in the eye.","e":"The object is left in place and protected without touching it. The patient also avoids straining or vomiting."},{"id":"T1-28","a":0,"s":"After an acid splash to the eye and thorough irrigation, when can the nurse stop irrigating?","o":[{"t":"After exactly five minutes of irrigation","c":false,"r":"A set time does not show that the acid is neutral."},{"t":"When the surface pH is about 7.0 to 7.4","c":true,"r":""},{"t":"When the patient says that the pain is gone","c":false,"r":"Pain relief can come from anesthetic drops."},{"t":"When the eye is no longer red or swollen","c":false,"r":"Redness can last despite neutral pH."}],"i":"Ending a chemical eye irrigation.","e":"The goal is a neutral pH, checked with litmus paper a few minutes after irrigation stops. Continue until it stays normal."},{"id":"T1-29","a":0,"s":"A stable patient has a stab wound to Zone II of the neck, no hard signs, and normal vital signs. Which test does the nurse expect?","o":[{"t":"CT angiography of the neck and vessels","c":true,"r":""},{"t":"Immediate neck exploration in the operating room","c":false,"r":"Exploration is for hard signs."},{"t":"Probing of the wound with a tool at the bedside","c":false,"r":"Probing can dislodge a clot."},{"t":"Discharge with a neck dressing and follow up","c":false,"r":"Injury can still be hidden."}],"i":"Evaluating a penetrating neck injury without hard signs.","e":"Stable patients with no hard signs are evaluated with CT angiography. It shows vessel and airway injury."},{"id":"T1-30","a":0,"s":"After a punch to the front of the neck, a patient has hoarseness, subcutaneous emphysema, and a lost landmark of the throat. What should the nurse anticipate?","o":[{"t":"A trial of oral fluids to test swallowing","c":false,"r":"Swallowing is unsafe with a possible airway injury."},{"t":"Blind nasal intubation at the bedside","c":false,"r":"Blind attempts can worsen a laryngeal tear."},{"t":"Early airway control by experts","c":true,"r":""},{"t":"A neck massage to relieve the swelling","c":false,"r":"This can cause harm."}],"i":"Recognizing a laryngeal fracture.","e":"These findings suggest injury to the larynx or trachea. The airway can close without warning, so a skilled provider secures it early."},{"id":"T1-31","a":0,"s":"A patient had a seat belt injury to the neck and now has a new weakness on the left side with a normal head CT. Which injury should the nurse suspect?","o":[{"t":"An epidural hematoma from a temporal fracture","c":false,"r":"A normal head CT argues against a head bleed."},{"t":"Brown Sequard syndrome from a cord stab wound","c":false,"r":"This causes a specific pattern of cord deficits."},{"t":"A concussion with a brief loss of memory","c":false,"r":"A concussion does not cause a focal deficit."},{"t":"A blunt carotid artery injury","c":true,"r":""}],"i":"Suspecting an arterial tear in the neck.","e":"A neck vessel tear can cause a stroke hours or days later. CT angiography of the neck and antithrombotic treatment follow."},{"id":"T1-32","a":1,"s":"A patient has fractures of the left ninth and tenth ribs after a fall. Which organ injury should the nurse suspect?","o":[{"t":"Heart and the great vessels","c":false,"r":"The heart lies behind the sternum, not the lower ribs."},{"t":"Stomach and the small bowel","c":false,"r":"The stomach is not usually injured in rib fractures."},{"t":"Spleen and its blood supply","c":true,"r":""},{"t":"Left kidney and the ureter","c":false,"r":"A kidney injury is possible but the spleen is injured most."}],"i":"Linking lower rib fractures with solid organ injury.","e":"The lower left ribs overlie the spleen. Expect a FAST exam, serial exams, and a check for left shoulder pain."},{"id":"T1-33","a":1,"s":"A patient has a sternal fracture after hitting the steering wheel. Which tests does the nurse anticipate?","o":[{"t":"A lumbar puncture for spinal fluid","c":false,"r":"This has no role in chest injury."},{"t":"A serum amylase and a lipase level","c":false,"r":"This tests for pancreatic injury."},{"t":"A 12 lead ECG and a troponin level","c":true,"r":""},{"t":"A pelvic x-ray and a urinalysis","c":false,"r":"This does not test the heart."}],"i":"Screening for blunt cardiac injury.","e":"A sternal fracture raises concern for a bruised heart. An abnormal ECG or troponin leads to monitoring."},{"id":"T1-34","a":1,"s":"A patient with flail chest is struggling to breathe despite oxygen. Which treatment best supports breathing?","o":[{"t":"Regional analgesia such as a nerve block","c":true,"r":""},{"t":"A tight chest binder around the ribs","c":false,"r":"Binding limits expansion and worsens ventilation."},{"t":"Large volumes of crystalloid given quickly","c":false,"r":"Fluid can worsen the pulmonary contusion."},{"t":"Lying flat on the injured side with sandbags","c":false,"r":"This does not relieve pain."}],"i":"Treating pain in flail chest.","e":"Pain limits deep breathing. Good analgesia improves ventilation, and intubation is needed if the patient tires."},{"id":"T1-35","a":1,"s":"A patient has a fracture of the first rib after a crash. What does this finding suggest?","o":[{"t":"A high energy injury with a risk to great vessels","c":true,"r":""},{"t":"A minor injury that needs rest, ice and a sling","c":false,"r":"The first rib is protected, so a break needs great force."},{"t":"A low energy injury seen in older adults","c":false,"r":"It takes great force to break it."},{"t":"An injury that usually occurs as an isolated finding","c":false,"r":"It is commonly linked to other injuries."}],"i":"Interpreting a high risk rib fracture.","e":"Fractures of the first or second rib signal a great force. The nurse looks for injury to the aorta, brachial plexus, and lung."},{"id":"T1-36","a":1,"s":"A patient with a small pneumothorax will be flown to a trauma center. What should the nurse anticipate before departure?","o":[{"t":"No intervention for a small pneumothorax","c":false,"r":"Altitude expands trapped gas."},{"t":"Needle decompression, then removal","c":false,"r":"A needle is a temporary measure."},{"t":"An occlusive dressing over the chest","c":false,"r":"No open wound is present."},{"t":"A chest tube placed before transport","c":true,"r":""}],"i":"Preparing a pneumothorax for transport.","e":"Gas expands at altitude and a small pneumothorax can become a tension pneumothorax. A chest tube is placed first."},{"id":"T1-37","a":1,"s":"A chest tube is draining 250 mL of blood each hour for the third hour in a hypotensive patient. What should the nurse do?","o":[{"t":"Clamp the tube to slow the blood loss","c":false,"r":"Clamping risks a tension hemothorax."},{"t":"Lower the suction and keep watching the drainage","c":false,"r":"Ongoing bleeding needs surgery."},{"t":"Remove the chest tube and replace it tomorrow","c":false,"r":"This removes drainage while the patient bleeds."},{"t":"Notify the surgeon and prepare for thoracotomy","c":true,"r":""}],"i":"Recognizing persistent bleeding.","e":"Drainage above 200 mL an hour for several hours suggests a bleeding vessel. Blood products are given while the team prepares."},{"id":"T1-38","a":1,"s":"A patient with a chest injury is stable at first, but 24 hours later oxygen levels fall and the chest x-ray shows patchy opacities. What is the likely cause?","o":[{"t":"Pulmonary contusion that has evolved","c":true,"r":""},{"t":"Cardiac tamponade with falling output","c":false,"r":"This causes low pressure and distended neck veins."},{"t":"Pulmonary embolism from a leg clot","c":false,"r":"This does not cause patchy opacities."},{"t":"A new tension pneumothorax on one side","c":false,"r":"This causes absent breath sounds on one side."}],"i":"Understanding delayed lung bruising.","e":"A lung contusion often worsens over 24 to 48 hours. Give oxygen, control pain, and avoid fluid overload."},{"id":"T1-39","a":1,"s":"A patient has a chest tube for a pneumothorax and has a large, continuous air leak with a lung that stays collapsed. Which injury should be suspected?","o":[{"t":"Tracheobronchial injury with large leak","c":true,"r":""},{"t":"Simple rib fracture without lung injury","c":false,"r":"This does not cause a large, persistent air leak."},{"t":"Diaphragm rupture with bowel herniation","c":false,"r":"This does not cause a persistent air leak through the chest tube."},{"t":"Pulmonary contusion with a mild air leak","c":false,"r":"This does not cause a large persistent air leak despite suction."}],"i":"Recognizing an airway tear.","e":"A persistent leak with a lung that will not expand suggests a torn airway. Bronchoscopy confirms it."},{"id":"T1-40","a":1,"s":"A patient with cardiac tamponade is waiting for surgery. Which action helps support blood pressure?","o":[{"t":"Give a diuretic to reduce the fluid","c":false,"r":"A diuretic lowers preload further."},{"t":"Lay the patient flat and give oxygen by mask","c":false,"r":"Preload must be supported."},{"t":"Start a nitroglycerin drip for pressure","c":false,"r":"Nitrates lower preload and pressure."},{"t":"Give a fluid bolus to maintain preload","c":true,"r":""}],"i":"Supporting a patient in tamponade.","e":"The squeezed heart depends on high filling pressure. Fluids and blood help until the sac is drained."},{"id":"T1-41","a":1,"s":"A patient with a blunt chest injury develops new atrial fibrillation with a normal troponin. What is the best plan?","o":[{"t":"Discharge with a follow up visit in a week","c":false,"r":"New arrhythmia needs observation."},{"t":"Continuous cardiac monitoring and review of rhythm","c":true,"r":""},{"t":"Routine vital signs checked once every shift","c":false,"r":"Monitoring should be continuous."},{"t":"Stopping the monitor to allow the patient rest","c":false,"r":"This removes needed observation."}],"i":"Managing arrhythmia after blunt cardiac injury.","e":"Arrhythmia can signal a bruised heart. Continuous monitoring and correction of oxygen and electrolytes are standard."},{"id":"T1-42","a":1,"s":"A patient has a stab wound in the left parasternal area with a blood pressure of 70/40 and distended neck veins. What is the priority?","o":[{"t":"A CT scan of the chest and abdomen","c":false,"r":"The patient is unstable."},{"t":"Emergency surgery for a likely heart wound","c":true,"r":""},{"t":"An outpatient follow up in the clinic","c":false,"r":"This is a life threat."},{"t":"A repeat set of vital signs in ten minutes","c":false,"r":"Delay can be fatal."}],"i":"Recognizing a penetrating cardiac wound.","e":"A wound in the cardiac box with shock suggests tamponade or bleeding from the heart. The patient goes to surgery at once."},{"id":"T1-43","a":1,"s":"During a pericardiocentesis, the monitor shows new ST elevation as the needle advances. What does this suggest?","o":[{"t":"The needle has touched the myocardium","c":true,"r":""},{"t":"The pericardial sac has been emptied","c":false,"r":"Emptying does not cause ST elevation."},{"t":"The patient is having a pulmonary embolism","c":false,"r":"This does not follow a needle advance."},{"t":"The needle is in the pleural space","c":false,"r":"This would not cause ST elevation."}],"i":"Recognizing the current of injury.","e":"ST elevation signals contact with the heart muscle. The provider withdraws the needle slightly."},{"id":"T1-44","a":1,"s":"A patient has a confirmed blunt thoracic aortic injury and is waiting for repair. Which drug does the nurse expect to control the heart rate and pressure?","o":[{"t":"A vasoconstrictor for the pressure","c":false,"r":"This raises the pressure and stresses the aorta."},{"t":"A beta blocker such as esmolol","c":true,"r":""},{"t":"A large crystalloid fluid bolus","c":false,"r":"This raises the pressure and the risk of rupture."},{"t":"A rapid acting heparin infusion","c":false,"r":"This can worsen bleeding."}],"i":"Limiting stress on the aortic wall.","e":"Lowering the heart rate and pressure reduces the force on the torn aorta. Beta blockers are used first."},{"id":"T1-45","a":1,"s":"A patient has an arm blood pressure of 130/80 on the right and 90/60 on the left after a crash. What should the nurse suspect?","o":[{"t":"A normal variation between the two arms","c":false,"r":"A large difference suggests arterial injury."},{"t":"A cuff that is too small for the arm","c":false,"r":"The difference is too large."},{"t":"An aortic or subclavian artery injury","c":true,"r":""},{"t":"A pulmonary embolism in the lung","c":false,"r":"This does not cause a difference between arms."}],"i":"Recognizing a pressure difference between arms.","e":"A pulse or pressure difference suggests vessel injury. CT angiography confirms the problem."},{"id":"T1-46","a":1,"s":"A patient has heavy bleeding from a stab wound at the base of the neck and the right subclavian region. What is the best first action?","o":[{"t":"Place a tourniquet around the neck and shoulder","c":false,"r":"A neck tourniquet blocks the airway and blood flow to the brain."},{"t":"Apply firm direct pressure with a gloved finger","c":true,"r":""},{"t":"Remove the clots and look for the vessel tip","c":false,"r":"This increases bleeding."},{"t":"Place the patient sitting upright and leaning","c":false,"r":"This increases bleeding."}],"i":"Controlling bleeding at a junction.","e":"Pressure and surgical care are the treatment. A neck tourniquet is never used."},{"id":"T1-47","a":1,"s":"Which chest x-ray finding after a high speed crash suggests a blunt aortic injury?","o":[{"t":"Small bilateral pleural effusions","c":false,"r":"These are common and do not show aortic injury."},{"t":"A raised right diaphragm on the film","c":false,"r":"This does not suggest aortic injury."},{"t":"An apical cap with a blurred aortic knob","c":true,"r":""},{"t":"A calcified nodule in one lung on the film","c":false,"r":"This is an incidental finding."}],"i":"Reading signs of aortic injury.","e":"A widened mediastinum, a blurred knob, and an apical cap suggest bleeding around the aorta. CT angiography confirms the injury."},{"id":"T1-48","a":1,"s":"A patient with blunt abdominal trauma has free air under the diaphragm on an upright chest x-ray. What does the nurse expect?","o":[{"t":"A clear liquid diet and observation","c":false,"r":"A perforation needs surgery."},{"t":"A repeat x-ray after two days of rest","c":false,"r":"Waiting risks peritonitis."},{"t":"Discharge with a pain prescription","c":false,"r":"This is unsafe."},{"t":"NPO status, antibiotics, and surgery","c":true,"r":""}],"i":"Recognizing a perforated viscus.","e":"Free air means a hollow organ has leaked. The patient needs fluids, antibiotics, and surgery."},{"id":"T1-49","a":1,"s":"Forty eight hours after a lap belt injury, a patient has a fever, a rising white cell count, and increasing abdominal pain. What should the nurse suspect?","o":[{"t":"A normal recovery course","c":false,"r":"These signs are not expected."},{"t":"A urinary tract infection","c":false,"r":"The pain and fever fit a bowel injury better."},{"t":"A missed bowel injury","c":true,"r":""},{"t":"A medication side effect","c":false,"r":"A new fever and pain are not typical."}],"i":"Recognizing a delayed bowel injury.","e":"Bowel injuries can be silent at first. A late fever and peritoneal signs call for repeat exam and imaging."},{"id":"T1-50","a":1,"s":"A patient has an orogastric tube with bright red return after a blow to the upper abdomen. What does this suggest?","o":[{"t":"A lung contusion with a blood leak","c":false,"r":"This does not cause blood in the stomach tube."},{"t":"A bladder injury with blood in the urine","c":false,"r":"This causes blood in the urine."},{"t":"A rib fracture with no organ injury","c":false,"r":"This does not cause bleeding in the stomach."},{"t":"An injury to the stomach or upper bowel","c":true,"r":""}],"i":"Interpreting blood in a gastric tube.","e":"Blood from the tube points to bleeding in the upper gastrointestinal tract. It needs imaging and surgical review."},{"id":"T1-51","a":1,"s":"A patient with a gunshot wound to the abdomen has a rigid abdomen and is hypotensive. What is the priority?","o":[{"t":"Go to the operating room, give blood","c":true,"r":""},{"t":"Order a CT scan and wait for the result","c":false,"r":"An unstable patient needs surgery."},{"t":"Give oral contrast to look for a leak","c":false,"r":"This delays care."},{"t":"Observe with serial exams for 24 hours","c":false,"r":"This is unsafe."}],"i":"Responding to penetrating abdominal injury.","e":"A gunshot wound with peritonitis or shock needs a laparotomy. Give blood, antibiotics, and tetanus."},{"id":"T1-52","a":1,"s":"A stable patient has a grade III splenic injury and is managed without surgery. Which nursing action is the priority?","o":[{"t":"Frequent vital signs and serial hemoglobin","c":true,"r":""},{"t":"Encourage early walking to the bathroom hourly","c":false,"r":"Early activity risks rebleeding."},{"t":"Give aspirin as needed for pain relief","c":false,"r":"Aspirin raises the risk of bleeding."},{"t":"Check the vital signs once at each shift","c":false,"r":"Frequent monitoring is needed."}],"i":"Monitoring non operative management.","e":"Bleeding can resume without warning. Watch for a rising heart rate, falling pressure, or falling hemoglobin."},{"id":"T1-53","a":1,"s":"A stable patient has a grade III liver laceration. Which preparation is appropriate?","o":[{"t":"Oral intake and discharge planning","c":false,"r":"The patient needs monitoring."},{"t":"A single small IV line and routine labs","c":false,"r":"Bleeding can increase quickly."},{"t":"Heparin to prevent clots in the legs","c":false,"r":"Anticoagulation raises bleeding risk."},{"t":"Two large bore IV lines and blood ready","c":true,"r":""}],"i":"Preparing for liver injury.","e":"Liver injuries can bleed heavily. Keep access, a type and screen, and a close watch on the vital signs."},{"id":"T1-54","a":1,"s":"A patient has had a splenectomy after trauma. Which teaching is most important before discharge?","o":[{"t":"Avoid all vaccines for a year after surgery","c":false,"r":"Vaccines protect the patient."},{"t":"Vaccines for encapsulated bacteria and prompt fever care","c":true,"r":""},{"t":"Take antibiotics daily for life without a break","c":false,"r":"Prophylaxis is not always lifelong."},{"t":"Return for care when the wound turns red","c":false,"r":"Fever needs prompt evaluation."}],"i":"Teaching after a splenectomy.","e":"Without a spleen, infection risk rises. The patient receives pneumococcal, meningococcal, and Haemophilus vaccines."},{"id":"T1-55","a":1,"s":"After angioembolization through the femoral artery, which nursing check is the priority?","o":[{"t":"The groin site and the leg pulses and color","c":true,"r":""},{"t":"The blood glucose level checked every hour","c":false,"r":"This is not related to the procedure."},{"t":"The weight of the patient measured each day","c":false,"r":"This does not show a complication."},{"t":"The visual acuity of both eyes together","c":false,"r":"This is not related."}],"i":"Monitoring after an arterial procedure.","e":"The access site can bleed or form a hematoma, and the leg can lose flow. Keep the leg straight and check often."},{"id":"T1-56","a":1,"s":"A chest x-ray after a blunt crash shows the nasogastric tube coiled in the left chest. Which injury is likely?","o":[{"t":"A right sided pneumothorax","c":false,"r":"The tube position does not suggest this."},{"t":"A ruptured left diaphragm","c":true,"r":""},{"t":"A right tension pneumothorax","c":false,"r":"This does not coil the tube."},{"t":"A sternal fracture and a bruise","c":false,"r":"This does not move the stomach."}],"i":"Recognizing a diaphragmatic hernia.","e":"The stomach has moved into the chest through a tear. The left side is hurt more often because the liver protects the right."},{"id":"T1-57","a":1,"s":"A patient has a stab wound at the posterior fifth intercostal space on the left. Which injury should be suspected besides lung injury?","o":[{"t":"A fracture of the cervical spine","c":false,"r":"The neck is far from a wound at the low chest."},{"t":"Diaphragm and organ injury","c":true,"r":""},{"t":"A rupture of the urinary bladder","c":false,"r":"This is too far from the wound."},{"t":"A fracture of the femoral shaft","c":false,"r":"This is not related."}],"i":"Knowing the zone of risk for the diaphragm.","e":"The diaphragm rises to the level of the nipples when we breathe out. A low chest wound can injure the chest and abdomen."},{"id":"T1-58","a":1,"s":"After a crash, a chest x-ray shows an elevated left hemidiaphragm with a gas bubble above it. Which action is appropriate?","o":[{"t":"Place a blind chest tube right away","c":false,"r":"A blind tube can injure the bowel in the chest."},{"t":"Discharge with clinic follow up next week","c":false,"r":"The injury needs repair."},{"t":"Start oral feeding after a short rest","c":false,"r":"This is unsafe."},{"t":"Prepare for imaging and surgical repair","c":true,"r":""}],"i":"Responding to a suspected diaphragm rupture.","e":"Bowel in the chest can strangle. Repair is needed, and tubes are placed with care."},{"id":"T1-59","a":1,"s":"A patient has epigastric pain that radiates to the back, and the lipase level is rising 12 hours after a blow to the upper abdomen. Which organ is injured?","o":[{"t":"Bladder","c":false,"r":"This causes blood in the urine and lower pain."},{"t":"Pancreas","c":true,"r":""},{"t":"Spleen","c":false,"r":"This causes left shoulder pain."},{"t":"Appendix","c":false,"r":"This causes right lower quadrant pain."}],"i":"Recognizing pancreatic injury.","e":"A bike handlebar or steering wheel can crush the pancreas against the spine. The enzymes rise late."},{"id":"T1-60","a":1,"s":"A child hits a bicycle handlebar, has back pain, and shows air near the right kidney on CT. Which injury is likely?","o":[{"t":"A liver abscess that forms over days","c":false,"r":"This does not occur this quickly after the injury."},{"t":"A spleen tear with bleeding into the belly","c":false,"r":"This does not cause retroperitoneal air."},{"t":"A bladder tear with urine in the pelvis","c":false,"r":"This does not cause air around the kidney."},{"t":"Duodenal rupture with air in the retroperitoneum","c":true,"r":""}],"i":"Recognizing duodenal injury.","e":"The duodenum is fixed behind the abdominal cavity and can tear with a direct blow. Air in the retroperitoneum is a clue."},{"id":"T1-61","a":1,"s":"A patient has bruising of the flank with no other external injury after a fall. What does this finding suggest?","o":[{"t":"A simple pulled muscle in the back","c":false,"r":"The bruise suggests deeper bleeding."},{"t":"Bleeding in the retroperitoneum","c":true,"r":""},{"t":"A rib contusion with no concern","c":false,"r":"This may miss a deeper injury."},{"t":"A mild allergic reaction of the skin","c":false,"r":"This is unlikely."}],"i":"Recognizing Grey Turner sign.","e":"Flank bruising can mean bleeding from the kidney, pancreas, or pelvis. FAST does not show retroperitoneal bleeding."},{"id":"T1-62","a":1,"s":"A pedestrian is hit from the side, and the pelvis shows a pattern in which the ring is pushed inward. Which pattern is this?","o":[{"t":"Anteroposterior compression","c":false,"r":"This opens the pelvis like a book."},{"t":"Vertical shear injury","c":false,"r":"This displaces the pelvis up."},{"t":"Acetabular fracture alone","c":false,"r":"This involves the hip socket."},{"t":"Lateral compression injury","c":true,"r":""}],"i":"Naming the fracture pattern.","e":"A side impact compresses the ring. The pelvic volume often decreases, and bladder and bowel injuries are common."},{"id":"T1-63","a":1,"s":"A patient crushed by a vehicle has a widened pubic symphysis, described as an open book fracture. What is the greatest risk?","o":[{"t":"Dislocation of the shoulder with nerve injury","c":false,"r":"This is not related to the pelvis."},{"t":"Isolated loss of sensation in the toes","c":false,"r":"This is not the main risk."},{"t":"Heavy venous bleeding into the pelvic space","c":true,"r":""},{"t":"Fat embolism from a long bone fracture","c":false,"r":"This is a risk of long bone fractures."}],"i":"Recognizing the risk of an open pelvis.","e":"An open pelvis has a larger volume where blood can collect. A binder closes the volume."},{"id":"T1-64","a":1,"s":"A patient who fell from a roof has a vertical shear pelvic fracture. What does the nurse expect about stability?","o":[{"t":"The pelvis is unstable in all planes","c":true,"r":""},{"t":"The pelvis is stable and needs rest","c":false,"r":"This pattern is unstable."},{"t":"Just the front of the pelvis is unstable","c":false,"r":"This is wrong."},{"t":"The pelvis is stable but the spine is not","c":false,"r":"These are separate injuries."}],"i":"Understanding a vertical shear fracture.","e":"Force from a fall pushes one side of the pelvis up. The ring is broken front and back and bleeds heavily."},{"id":"T1-65","a":1,"s":"A patient with an unstable pelvic fracture has a negative FAST exam and a systolic pressure of 70 mmHg despite a binder and two units of blood. What does the nurse anticipate?","o":[{"t":"A repeat CT scan of the head in the bed","c":false,"r":"This does not treat the bleeding."},{"t":"Observation for another hour on the unit","c":false,"r":"The patient is unstable."},{"t":"A diuretic to reduce the pelvic swelling","c":false,"r":"This does not stop the bleeding."},{"t":"Angioembolization or pelvic packing","c":true,"r":""}],"i":"Controlling pelvic bleeding.","e":"A negative FAST points away from abdominal bleeding. The pelvis is the source, and the team uses embolization or packing."},{"id":"T1-66","a":1,"s":"Which resuscitative procedure may be used as a bridge for a patient who is dying of pelvic or abdominal bleeding?","o":[{"t":"Balloon occlusion of the aorta (REBOA)","c":true,"r":""},{"t":"Hyperventilation with a bag valve mask","c":false,"r":"This does not control bleeding."},{"t":"Placement of a gastric tube at the bedside","c":false,"r":"This does not control bleeding."},{"t":"High dose steroids given intravenously","c":false,"r":"These do not stop bleeding."}],"i":"Knowing a bleeding control tool.","e":"A balloon in the aorta cuts blood flow below it and raises pressure above it. It buys time for surgery."},{"id":"T1-67","a":1,"s":"A patient has a pelvic binder in place for 12 hours. What should the nurse check?","o":[{"t":"The skin of the face for a rash or hives","c":false,"r":"This is not related."},{"t":"The skin beneath the binder for injury","c":true,"r":""},{"t":"The urine color for signs of jaundice","c":false,"r":"This is not related."},{"t":"The ankle for swelling, outside the binder","c":false,"r":"The binder site needs checks."}],"i":"Preventing binder complications.","e":"A binder can cause pressure injuries over bony areas. Pad the skin and release it as the surgeon orders."},{"id":"T1-68","a":1,"s":"A patient with an extraperitoneal bladder rupture is stable. Which treatment is typical?","o":[{"t":"Emergency laparotomy through the abdomen","c":false,"r":"This is for intraperitoneal rupture."},{"t":"Urinary catheter bladder drainage","c":true,"r":""},{"t":"Bladder irrigation with plain water","c":false,"r":"This can worsen the leak."},{"t":"No treatment and no catheter at all","c":false,"r":"The bladder needs to be drained."}],"i":"Treating an extraperitoneal bladder rupture.","e":"Most extraperitoneal tears heal with a catheter. Intraperitoneal tears need surgery."},{"id":"T1-69","a":1,"s":"A man falls astride a fence and has a perineal bruise and cannot void. What should the nurse avoid?","o":[{"t":"Providing pain control to the patient","c":false,"r":"Pain control is appropriate care, not something to avoid."},{"t":"Checking the vital signs regularly","c":false,"r":"Regular vital signs are appropriate care, not something to avoid."},{"t":"Attempting to pass a urinary catheter","c":true,"r":""},{"t":"Preparing for a retrograde urethrogram","c":false,"r":"Preparing for a urethrogram is the correct next step, not an error."}],"i":"Avoiding harm in a urethral injury.","e":"A blind catheter can turn a partial tear into a complete one. Imaging comes first, and a suprapubic catheter may be used."},{"id":"T1-70","a":2,"s":"A patient has a lap belt bruise and a horizontal fracture through the lumbar vertebra. Which injury should the nurse also suspect?","o":[{"t":"A tear in the thoracic aorta","c":false,"r":"This is more likely in deceleration injuries of the chest."},{"t":"A rib fracture of the chest","c":false,"r":"This is not linked to the fracture."},{"t":"An injury to the intestine","c":true,"r":""},{"t":"A fractured skull from impact","c":false,"r":"This is not linked to the fracture."}],"i":"Recognizing a Chance fracture.","e":"A flexion injury over a lap belt breaks the vertebra and injures the bowel and pancreas."},{"id":"T1-71","a":2,"s":"A patient with an unstable lumbar fracture reports new numbness in the legs. What is the best action?","o":[{"t":"Sit the patient up to test the leg strength","c":false,"r":"Sitting can worsen the injury."},{"t":"Report the change and keep the spine aligned","c":true,"r":""},{"t":"Wait several hours to see whether it passes","c":false,"r":"A new deficit is urgent."},{"t":"Massage the legs to improve circulation","c":false,"r":"This does not help."}],"i":"Responding to a new neurologic change.","e":"A new deficit means the cord or roots are at risk. Keep the spine straight and call the physician."},{"id":"T1-72","a":2,"s":"Which patient may have the cervical spine cleared without imaging by NEXUS criteria?","o":[{"t":"A patient with a head injury and mild confusion after a fall","c":false,"r":"Altered mental status prevents clinical clearance."},{"t":"A patient with a painful long bone fracture and neck pain","c":false,"r":"A distracting injury and pain prevent clearance."},{"t":"A patient who is intoxicated but calm and cooperative","c":false,"r":"Intoxication prevents clearance."},{"t":"An alert sober patient with no pain or distracting injury","c":true,"r":""}],"i":"Applying clinical clearance rules.","e":"NEXUS requires no tenderness, no deficit, normal alertness, no intoxication, and no distracting injury."},{"id":"T1-73","a":2,"s":"A patient with a tibia fracture has a diastolic pressure of 60 mmHg and a compartment pressure of 40 mmHg. What is the difference, and what does it mean?","o":[{"t":"100 mmHg, which indicates a normal gradient","c":false,"r":"The pressures are subtracted, not added."},{"t":"20 mmHg, which falls within the normal range","c":false,"r":"A difference below 30 mmHg is abnormal."},{"t":"20 mmHg, which supports compartment syndrome","c":true,"r":""},{"t":"40 mmHg, which is not a concern for the limb","c":false,"r":"The diastolic pressure is subtracted from the compartment pressure."}],"i":"Calculating delta pressure.","e":"The difference between the diastolic pressure and the compartment pressure is 20 mmHg. A value under 30 supports the diagnosis and needs fasciotomy."},{"id":"T1-74","a":2,"s":"A patient with a cast has increasing pain unrelieved by opioids and pain on passive toe movement. What should the nurse do?","o":[{"t":"Give a larger dose of opioid and watch","c":false,"r":"This can hide the signs."},{"t":"Notify the physician and loosen the cast","c":true,"r":""},{"t":"Elevate the leg well above the heart","c":false,"r":"Elevation lowers flow."},{"t":"Wrap the cast with an elastic bandage","c":false,"r":"This adds pressure."}],"i":"Responding to pain in a casted limb.","e":"Pain out of proportion in a cast is compartment syndrome until proven otherwise. Releasing the cast reduces the pressure."},{"id":"T1-75","a":2,"s":"A tourniquet is placed on a bleeding arm in the field. What should the receiving nurse make sure of?","o":[{"t":"The tourniquet is loosened every five minutes to check","c":false,"r":"Loosening restarts the bleeding."},{"t":"The tourniquet is removed once the patient arrives","c":false,"r":"This can cause fatal bleeding."},{"t":"The tourniquet is covered and the time is not recorded","c":false,"r":"It must be documented."},{"t":"The time is recorded and the tourniquet stays on","c":true,"r":""}],"i":"Managing a tourniquet.","e":"The time guides care and shows how long the limb has been without blood. A surgeon makes the decision to release it."},{"id":"T1-76","a":2,"s":"A hand is partly amputated and is still attached by a bridge of skin. What should the nurse do?","o":[{"t":"Cut the remaining tissue to finish the amputation","c":false,"r":"The tissue helps keep blood flow."},{"t":"Place the hand directly on ice and wrap it","c":false,"r":"This can freeze the tissue."},{"t":"Soak the whole hand in a basin of antiseptic","c":false,"r":"This can damage the tissue."},{"t":"Splint in alignment and cover with moist gauze","c":true,"r":""}],"i":"Caring for a partial amputation.","e":"The attached tissue may carry blood. The hand is supported and covered, and the patient goes to a replantation center."},{"id":"T1-77","a":2,"s":"An 82 year old patient fell and has a short, outwardly rotated leg and groin pain. What is most likely?","o":[{"t":"A hip fracture with shortening","c":true,"r":""},{"t":"A knee sprain from twisting","c":false,"r":"This does not shorten the leg."},{"t":"An ankle fracture from the fall","c":false,"r":"The pain and rotation point to the hip."},{"t":"A hamstring strain from the fall","c":false,"r":"This does not shorten the leg."}],"i":"Recognizing a hip fracture.","e":"A short, externally rotated leg is the typical picture. Early pain control, with a nerve block, and early surgery are the goals."},{"id":"T1-78","a":2,"s":"During splinting of an open fracture, the exposed bone end slips back under the skin. What should the nurse do?","o":[{"t":"Say nothing since the bone is covered now","c":false,"r":"The surgeon must know about contamination."},{"t":"Report it to the physician and chart it","c":true,"r":""},{"t":"Pull the bone out again for inspection","c":false,"r":"This causes harm."},{"t":"Remove the splint and wash the wound","c":false,"r":"This may add harm."}],"i":"Documenting a retracted bone end.","e":"The bone end may carry dirt into the wound. The surgeon needs to know so that the wound is cleaned in the operating room."},{"id":"T1-79","a":2,"s":"A patient has a dirty puncture wound and the last tetanus booster was seven years ago. Which action is appropriate?","o":[{"t":"Give a tetanus toxoid booster dose","c":true,"r":""},{"t":"Give no vaccine, as the dose is recent","c":false,"r":"For a dirty wound, a booster is due after five years."},{"t":"Give immune globulin and no booster","c":false,"r":"A booster is also needed."},{"t":"Give an antibiotic and no vaccine","c":false,"r":"An antibiotic does not prevent tetanus."}],"i":"Applying tetanus prophylaxis.","e":"A dirty wound needs a booster if the last dose was more than five years ago. Immune globulin is added for unvaccinated patients."},{"id":"T1-80","a":2,"s":"A patient has a cut over the knuckle after punching a tooth. How should the wound be managed?","o":[{"t":"Close the wound tightly with sutures","c":false,"r":"A bite wound should not be closed."},{"t":"Irrigate, leave it open, and give antibiotics","c":true,"r":""},{"t":"Apply a dry bandage and send the patient home","c":false,"r":"This risks a deep infection."},{"t":"Apply an ointment and place a cast on it","c":false,"r":"This hides the wound."}],"i":"Treating a fight bite.","e":"Human bites carry many bacteria and can reach the joint. They are cleaned, left open, and need a hand specialist."},{"id":"T1-81","a":2,"s":"A patient with an anterior shoulder dislocation holds the arm out from the side. Which nerve should the nurse check?","o":[{"t":"The axillary nerve by testing deltoid sensation","c":true,"r":""},{"t":"The sciatic nerve by testing foot sensation","c":false,"r":"This is in the leg."},{"t":"The femoral nerve by testing thigh sensation","c":false,"r":"This is in the leg."},{"t":"The facial nerve by testing the cheek muscles","c":false,"r":"This is in the face."}],"i":"Checking nerve function after a shoulder dislocation.","e":"The axillary nerve wraps around the upper humerus. Check the skin over the deltoid before and after reduction."},{"id":"T1-82","a":2,"s":"A patient has a posterior hip dislocation, a short leg turned inward, and numb foot. What does the nurse anticipate?","o":[{"t":"Delayed reduction until several days later","c":false,"r":"Delay raises the risk of bone death."},{"t":"Heavy exercise of the hip to loosen it","c":false,"r":"This can worsen the injury."},{"t":"Observation alone with no reduction","c":false,"r":"The joint needs reduction."},{"t":"Urgent reduction because of nerve risk","c":true,"r":""}],"i":"Responding to a hip dislocation.","e":"A posterior dislocation can injure the sciatic nerve and the blood supply to the head of the femur. Prompt reduction improves the outcome."},{"id":"T1-83","a":3,"s":"Why is an 81 year old with five rib fractures at higher risk of respiratory failure than a 30 year old with the same injury?","o":[{"t":"Older adults have stronger chest walls that resist pain","c":false,"r":"Chest walls become weaker and stiffer with age."},{"t":"Older adults heal rib fractures at a faster rate","c":false,"r":"Healing is slower in older adults."},{"t":"Older adults have less lung reserve and a weaker cough","c":true,"r":""},{"t":"Older adults breathe more deeply to compensate","c":false,"r":"Shallow breathing is more common after injury."}],"i":"Understanding age related risk.","e":"Aging lowers lung capacity and strength. Pain makes deep breathing worse, and pneumonia follows."},{"id":"T1-84","a":3,"s":"An 86 year old has a hip fracture and severe pain. Which pain plan is most appropriate?","o":[{"t":"High dose opioids given on demand with sedatives","c":false,"r":"These raise the risk of confusion and falls."},{"t":"No analgesia until the surgery is completed","c":false,"r":"Pain should be treated at once."},{"t":"Benzodiazepines for the pain and the anxiety","c":false,"r":"These increase confusion and falls."},{"t":"A regional nerve block with non opioid medicines","c":true,"r":""}],"i":"Choosing safe analgesia for an older adult.","e":"Multimodal care with a nerve block lowers opioid need and delirium risk."},{"id":"T1-85","a":3,"s":"A 74 year old takes apixaban and fell from standing height. The patient has a mild headache and no other findings. What is the best action?","o":[{"t":"Obtain a prompt head CT scan now","c":true,"r":""},{"t":"Observe at home with a relative","c":false,"r":"Bleeding can be delayed on anticoagulants."},{"t":"Wait for symptoms before a scan","c":false,"r":"Waiting delays diagnosis."},{"t":"Give an extra anticoagulant dose","c":false,"r":"This increases bleeding."}],"i":"Screening an anticoagulated older adult.","e":"A low threshold for CT is needed in older adults on anticoagulants, since intracranial bleeding may show late."},{"id":"T1-86","a":3,"s":"A 3 year old is being prepared for a spine board. Which adjustment keeps the neck in a neutral position?","o":[{"t":"Pad the shoulders or use a recessed board","c":true,"r":""},{"t":"Place a firm pillow under the child's head","c":false,"r":"This flexes the neck."},{"t":"Place the head in extension on the board","c":false,"r":"This can worsen an injury."},{"t":"Place a roll under the neck of the child","c":false,"r":"This causes flexion."}],"i":"Positioning a child with a large head.","e":"A child's head is large compared with the body. Lying flat flexes the neck, so the shoulders are raised."},{"id":"T1-87","a":3,"s":"A 6 year old child has a systolic pressure of 78 mmHg. Using the lower limit of 70 plus twice the age, how does the nurse interpret this?","o":[{"t":"It is a normal value for a child of this age","c":false,"r":"The lower limit is 82 mmHg."},{"t":"It is a high value that needs treatment","c":false,"r":"The value is low, not high."},{"t":"It is too uncertain to be useful in children","c":false,"r":"It is below the limit."},{"t":"It is hypotension and a sign of decompensated shock","c":true,"r":""}],"i":"Recognizing late pediatric shock.","e":"The lower limit is 70 plus 12, or 82 mmHg. A reading of 78 shows the child has lost compensation and needs rapid treatment."},{"id":"T1-88","a":3,"s":"A 4 month old is hurt in a crash. Which action best prevents a drop in the body temperature?","o":[{"t":"Expose the infant fully for a long exam","c":false,"r":"Infants lose heat quickly."},{"t":"Give cold fluids to match the body temperature","c":false,"r":"Cold fluids lower the temperature."},{"t":"Place the infant on a cool metal surface","c":false,"r":"A cool surface lowers the temperature."},{"t":"Keep the room warm and use warm blankets","c":true,"r":""}],"i":"Preventing hypothermia.","e":"Infants have a large body surface area and little fat. Hypothermia worsens bleeding and acidosis."},{"id":"T1-89","a":3,"s":"A woman who is 26 weeks pregnant has a cardiac arrest after a crash. If no pulse returns, when is a resuscitative hysterotomy considered?","o":[{"t":"After 20 minutes of resuscitation","c":false,"r":"This is too late."},{"t":"At about four minutes of CPR","c":true,"r":""},{"t":"After the fetal heart tones are heard","c":false,"r":"The mother's arrest comes first."},{"t":"After the blood type is known","c":false,"r":"Delay can harm both patients."}],"i":"Timing a perimortem delivery.","e":"Emptying the uterus relieves pressure on the great vessels and helps the mother. It is considered at about four minutes when the uterus is at or above the navel."},{"id":"T1-90","a":3,"s":"A woman who is 30 weeks pregnant has a minor fall and appears well. How long should the fetus be monitored?","o":[{"t":"Fifteen minutes of monitoring","c":false,"r":"This is too short."},{"t":"Until the mother leaves the room","c":false,"r":"This is not a standard."},{"t":"At least four hours of watch","c":true,"r":""},{"t":"No monitoring is needed at all","c":false,"r":"Fetal distress can occur with minor trauma."}],"i":"Monitoring the fetus after trauma.","e":"Abruption can occur after minor trauma. Monitoring for at least four hours is typical, and longer if there are contractions or bleeding."},{"id":"T1-91","a":3,"s":"A woman who is 28 weeks pregnant has lost about 1,200 mL of blood, and her blood pressure is normal. What should the nurse understand?","o":[{"t":"She cannot be bleeding, since the pressure is normal","c":false,"r":"She can lose a lot of blood before pressure drops."},{"t":"Vital signs may stay normal while the fetus lacks blood","c":true,"r":""},{"t":"The fetus is protected before the mother is affected","c":false,"r":"The fetus is affected first."},{"t":"Blood loss in pregnancy is not a danger to the fetus","c":false,"r":"It is dangerous."}],"i":"Recognizing hidden shock.","e":"Pregnancy raises blood volume by about 50 percent. The mother can lose up to 1,500 mL before changes show, and the uterus loses flow first."},{"id":"T1-92","a":3,"s":"A worker has dry lime powder on the arms and chest. What is the first action?","o":[{"t":"Wet the skin at once and scrub it vigorously","c":false,"r":"Water can activate the powder and burn the skin."},{"t":"Apply a neutralizing acid solution to the skin","c":false,"r":"Neutralizing causes heat and more burns."},{"t":"Brush off the powder, then irrigate with water","c":true,"r":""},{"t":"Cover with a dry dressing and transfer quickly","c":false,"r":"The chemical keeps burning."}],"i":"Treating a chemical burn.","e":"Dry powder is brushed away first. Then flush with water for a long period, and remove contaminated clothing."},{"id":"T1-93","a":3,"s":"A worker has a high voltage electrical injury with a small hand wound. Which action is most important?","o":[{"t":"Discharge home, since the skin wound is small","c":false,"r":"Deep injury is common."},{"t":"Continuous ECG monitoring and fluids for urine","c":true,"r":""},{"t":"Limit fluids to avoid swelling of the injured hand","c":false,"r":"Fluids protect the kidneys."},{"t":"Apply ice to the hand to treat the burn","c":false,"r":"This does not treat the deeper injury."}],"i":"Caring for an electrical burn.","e":"The skin wound hides muscle damage. Watch for arrhythmias and myoglobin in the urine, and give enough fluid to keep urine flowing."},{"id":"T1-94","a":3,"s":"A patient has burns over the entire right arm and the front of the chest and abdomen. What is the estimated percent of total body surface area?","o":[{"t":"27 percent","c":true,"r":""},{"t":"18 percent","c":false,"r":"This counts only the front trunk."},{"t":"36 percent","c":false,"r":"This counts the arm as 18 percent."},{"t":"9 percent","c":false,"r":"This counts only the arm."}],"i":"Using the rule of nines.","e":"An arm is 9 percent and the front of the trunk is 18 percent. The total is 27 percent."},{"id":"T1-95","a":3,"s":"A patient rescued from a fire has a headache and an oxygen saturation of 99 percent on the pulse oximeter. Why can the reading not be trusted?","o":[{"t":"The finger probe cannot read in a fire victim","c":false,"r":"The device reads but misreads."},{"t":"The nurse must multiply the reading by 0.9","c":false,"r":"No such correction exists."},{"t":"Carboxyhemoglobin is read as oxyhemoglobin","c":true,"r":""},{"t":"The reading is falsely high at altitude","c":false,"r":"This is not the cause."}],"i":"Understanding pulse oximetry in smoke exposure.","e":"The device cannot tell carbon monoxide from oxygen. A co oximeter on a blood sample gives the true level."},{"id":"T1-96","a":3,"s":"A patient weighing 190 kg needs intubation. Which positioning helps?","o":[{"t":"Flat on the back with no pillow under the head","c":false,"r":"This worsens the airway view."},{"t":"A ramped position with ear to sternal notch","c":true,"r":""},{"t":"Head down to drain secretions from the airway","c":false,"r":"This worsens oxygenation."},{"t":"Sitting fully upright with the neck flexed","c":false,"r":"The neck must be aligned."}],"i":"Positioning an obese patient.","e":"Ramping lifts the chest and improves the view and the oxygen reserve. Spinal precautions still apply when needed."},{"id":"T1-97","a":3,"s":"A woman says her partner choked her. She has a hoarse voice and tiny red dots on her face and neck. What should the nurse do?","o":[{"t":"Discharge her with a note for safety planning","c":false,"r":"Strangulation injuries can worsen later."},{"t":"Tell her that the exam is reassuring and go home","c":false,"r":"These signs show serious risk."},{"t":"Ask the partner to explain what happened to her","c":false,"r":"This risks her safety."},{"t":"Prepare for neck imaging and watch the airway","c":true,"r":""}],"i":"Recognizing strangulation.","e":"Hoarseness and petechiae suggest a serious injury. Airway swelling and artery injury can appear hours later."},{"id":"T1-98","a":3,"s":"A 5 month old has a subdural hematoma and retinal hemorrhages. The parent reports a fall from the couch. What should the nurse suspect?","o":[{"t":"A normal result of a short fall","c":false,"r":"A short fall rarely causes these injuries."},{"t":"A birth injury from the first week","c":false,"r":"This does not fit the age."},{"t":"A rare clotting disorder in a child","c":false,"r":"The injuries fit abuse."},{"t":"Abusive head trauma from shaking","c":true,"r":""}],"i":"Recognizing child abuse.","e":"The findings do not match the story. The nurse reports concerns, expects a skeletal survey, and protects the child."},{"id":"T1-99","a":3,"s":"An older adult has pressure injuries, dehydration, and soiled clothing. The caregiver will not let the patient speak alone. What should the nurse do?","o":[{"t":"Follow policy and report suspected neglect","c":true,"r":""},{"t":"Wait until the caregiver can prove neglect","c":false,"r":"The nurse reports concern, not proof."},{"t":"Accept the account and discharge the patient","c":false,"r":"The findings are concerning."},{"t":"Confront the caregiver loudly in the hallway","c":false,"r":"This risks the safety of the patient."}],"i":"Reporting elder neglect.","e":"Nurses are mandated reporters in most states. A report goes to adult protective services."},{"id":"T1-100","a":3,"s":"A young woman is accompanied by a man who answers all the questions and holds her identification. She looks fearful. What is the best approach?","o":[{"t":"Ask her questions with the man in the room","c":false,"r":"She may not feel safe."},{"t":"Find a way to speak with her alone per protocol","c":true,"r":""},{"t":"Confront the man about trafficking at once","c":false,"r":"This could endanger her."},{"t":"Discharge her home with the man who came","c":false,"r":"This ignores the warning signs."}],"i":"Responding to possible trafficking.","e":"Controlling behavior and missing documents are red flags. Private screening with an interpreter and the protocol is the safest path."},{"id":"T1-101","a":3,"s":"A patient with chronic heart failure is bleeding after a crash. Which fluid approach is best?","o":[{"t":"Large volumes of crystalloid given as fast as possible","c":false,"r":"This can cause overload."},{"t":"Blood products guided by response and overload checks","c":true,"r":""},{"t":"No fluid at all, since the patient has heart failure","c":false,"r":"Bleeding needs replacement."},{"t":"Diuretics to prevent edema while the patient bleeds","c":false,"r":"This lowers volume."}],"i":"Balancing volume in heart failure.","e":"Replace what was lost with blood and avoid excess volume. Watch for crackles and rising oxygen needs."},{"id":"T1-102","a":3,"s":"A patient with diabetes who takes insulin is confused after a crash. What should the nurse do first?","o":[{"t":"Order a CT of the head first","c":false,"r":"Glucose can be checked at once."},{"t":"Give a sedative and observe","c":false,"r":"This hides the problem."},{"t":"Wait for the family to arrive","c":false,"r":"Confusion is urgent."},{"t":"Check the blood glucose now","c":true,"r":""}],"i":"Checking for hypoglycemia.","e":"Low glucose can mimic a head injury. A bedside test takes seconds."},{"id":"T1-103","a":3,"s":"A patient has an opioid overdose after a crash with slow breathing. After naloxone is given, the patient wakes up. What should the nurse watch for?","o":[{"t":"Return of sedation as naloxone fades","c":true,"r":""},{"t":"Permanent reversal of the opioid effect","c":false,"r":"Naloxone wears off in an hour or two."},{"t":"A sudden drop in the blood pressure","c":false,"r":"This is not a common effect."},{"t":"Seizures caused by the naloxone alone","c":false,"r":"This is uncommon."}],"i":"Monitoring after naloxone.","e":"Many opioids last longer than naloxone, so the patient can stop breathing again. Keep close watch."},{"id":"T1-104","a":3,"s":"On day three, a patient who drinks daily has hallucinations, a heart rate of 130, and a fever. What is the likely cause?","o":[{"t":"A normal recovery from the trauma","c":false,"r":"These signs show a serious condition."},{"t":"Alcohol withdrawal delirium","c":true,"r":""},{"t":"Pain from the fractured bone","c":false,"r":"These signs go beyond pain."},{"t":"An allergic reaction to a drug","c":false,"r":"This does not fit."}],"i":"Recognizing delirium tremens.","e":"Symptoms appear 48 to 96 hours after the last drink. Treat with benzodiazepines, fluids, and thiamine."},{"id":"T1-105","a":4,"s":"A patient arrives with bright red blood spurting from a thigh wound and is unresponsive. What is the first action?","o":[{"t":"Open the airway with a firm jaw thrust","c":false,"r":"Massive bleeding is treated first under xABCDE."},{"t":"Start chest compressions right away","c":false,"r":"The patient has a pulse; bleeding must be stopped."},{"t":"Apply a tourniquet to stop bleeding","c":true,"r":""},{"t":"Insert two large bore IV lines first","c":false,"r":"Bleeding control comes before access."}],"i":"Applying the xABCDE sequence.","e":"The x stands for exsanguinating hemorrhage. A tourniquet stops life threatening limb bleeding at once."},{"id":"T1-106","a":4,"s":"An unresponsive patient has snoring respirations after a fall from a height. Which action opens the airway?","o":[{"t":"Tilt the head back and lift the chin up","c":false,"r":"This moves the neck."},{"t":"Place the patient in a sitting position","c":false,"r":"This moves the spine."},{"t":"Give oxygen by mask and watch for change","c":false,"r":"The airway is blocked."},{"t":"Perform a jaw thrust with neck stabilization","c":true,"r":""}],"i":"Opening the airway with spinal care.","e":"Snoring means the tongue is blocking the airway. A jaw thrust opens it without moving the neck."},{"id":"T1-107","a":4,"s":"Which item is part of the AMPLE history in the secondary survey?","o":[{"t":"The patient's insurance carrier name","c":false,"r":"This is not part of the history."},{"t":"The employer's phone number at work","c":false,"r":"This is not part of the history."},{"t":"The time of the last meal and drink","c":true,"r":""},{"t":"The size of the patient's family","c":false,"r":"This is not part of the history."}],"i":"Knowing the AMPLE mnemonic.","e":"AMPLE stands for allergies, medications, past illness, last meal, and events. The last meal matters for anesthesia."},{"id":"T1-108","a":4,"s":"Which step belongs in the secondary survey and not the primary survey?","o":[{"t":"Control of massive external bleeding","c":false,"r":"This belongs to the primary survey."},{"t":"Opening and clearing the airway","c":false,"r":"This belongs to the primary survey."},{"t":"Needle decompression of a tension pneumothorax","c":false,"r":"This belongs to the primary survey."},{"t":"A head to toe exam with a log roll","c":true,"r":""}],"i":"Separating surveys.","e":"The secondary survey starts after life threats are treated. It includes a full exam and a back check."},{"id":"T1-109","a":4,"s":"A woman of childbearing age is bleeding and the blood type is unknown. Which blood does the nurse expect?","o":[{"t":"Group AB positive red blood cells","c":false,"r":"This is not the universal red cell type."},{"t":"Group O negative red blood cells","c":true,"r":""},{"t":"Group A positive red blood cells","c":false,"r":"This could cause a reaction."},{"t":"Wait until the crossmatch is back","c":false,"r":"Waiting could be fatal."}],"i":"Choosing emergency blood.","e":"O negative is used for women who could become pregnant to avoid Rh sensitization."},{"id":"T1-110","a":4,"s":"During a massive transfusion, a patient has tingling, muscle cramps, and a prolonged QT interval. Which problem is likely?","o":[{"t":"Hypocalcemia from citrate in stored blood","c":true,"r":""},{"t":"Hyperglycemia from the stored blood","c":false,"r":"This does not cause the QT change."},{"t":"Hypernatremia from the blood products","c":false,"r":"This is not typical."},{"t":"Hypothermia from the room air alone","c":false,"r":"This does not explain the ECG."}],"i":"Recognizing citrate toxicity.","e":"Citrate binds calcium. Replace it and monitor the ionized level."},{"id":"T1-111","a":4,"s":"A patient on warfarin has an INR of 4.8 and an intracranial hemorrhage. Which treatment does the nurse expect?","o":[{"t":"Protamine sulfate by slow intravenous push","c":false,"r":"This reverses heparin."},{"t":"Oral vitamin K with no other agent","c":false,"r":"This is too slow."},{"t":"Aspirin to help stabilize the clot","c":false,"r":"This worsens bleeding."},{"t":"Four factor PCC and vitamin K","c":true,"r":""}],"i":"Reversing warfarin.","e":"The concentrate works fast, and vitamin K provid
