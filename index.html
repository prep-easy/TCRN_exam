 for the airway."},{"t":"Through the cricothyroid membrane, between the thyroid and cricoid cartilages","c":true,"r":""},{"t":"Between the second and third tracheal rings, below the thyroid gland","c":false,"r":"This site is used for a surgical tracheostomy and is slower and more difficult in an emergency."},{"t":"Through the skin over the sternal notch, below the cricoid cartilage","c":false,"r":"This site lies too low and risks injury to vessels and the thyroid."}],"i":"Locating the surgical airway site.","e":"The cricothyroid membrane is superficial and has few vessels. A vertical skin incision, then a horizontal cut through the membrane, lets the tube pass into the airway."},{"id":"T6-31","a":0,"s":"After a neck injury, a patient has hoarseness and a weak voice, but breathing is normal and the neck looks normal. Which nerve injury is suspected?","o":[{"t":"The hypoglossal nerve","c":false,"r":"Injury to this nerve causes tongue deviation."},{"t":"The recurrent laryngeal nerve","c":true,"r":""},{"t":"The spinal accessory nerve","c":false,"r":"Injury to this nerve causes weak shoulder shrug."},{"t":"The phrenic nerve","c":false,"r":"Injury to this nerve causes a raised diaphragm."}],"i":"Recognizing nerve injury in the neck.","e":"This branch of the vagus controls the vocal cord. Injury causes hoarseness, and bilateral injury can cause stridor."},{"id":"T6-32","a":1,"s":"A patient has a flail chest and is failing to wean from the ventilator because of pain and instability. Which intervention may shorten ventilation?","o":[{"t":"A tight elastic wrap around the entire chest","c":false,"r":"This restricts breathing and raises the risk of pneumonia."},{"t":"Higher tidal volumes to splint the segment","c":false,"r":"Large volumes injure the lung and do not fix the chest wall."},{"t":"Routine heavy sedation until the ribs heal","c":false,"r":"This prolongs ventilation and increases delirium."},{"t":"Surgical stabilization of the rib fractures","c":true,"r":""}],"i":"Knowing when rib fixation helps.","e":"Plating the ribs restores chest wall stability and can reduce ventilator days in selected patients with flail segments."},{"id":"T6-33","a":1,"s":"A patient with fractured ribs is taught to use an incentive spirometer. Which instruction is correct?","o":[{"t":"Blow out as hard and as fast as possible, five times each day","c":false,"r":"The device measures inhaled volume and needs slow deep breaths."},{"t":"Breathe in slowly and deeply, hold briefly, repeat ten times hourly","c":true,"r":""},{"t":"Take rapid shallow breaths until the pain is gone from the chest wall","c":false,"r":"Shallow breaths do not open the lung bases."},{"t":"Use the device once at bedtime for one minute and then store it","c":false,"r":"Frequent use is needed to prevent atelectasis."}],"i":"Teaching lung expansion.","e":"Deep slow breaths expand the lungs and prevent collapse and pneumonia. Pain control makes the technique possible."},{"id":"T6-34","a":1,"s":"Which adjunct provides topical, nonsedating pain relief for a patient with rib fractures?","o":[{"t":"A heating pad turned to a high setting on the chest","c":false,"r":"Heat can burn the skin and does not treat the pain well."},{"t":"A lidocaine patch applied over the painful area","c":true,"r":""},{"t":"An opioid patch covering the entire chest wall","c":false,"r":"This is sedating and carries a risk of respiratory depression."},{"t":"A tight rib belt secured with adhesive tape","c":false,"r":"This restricts breathing."}],"i":"Using multimodal analgesia.","e":"Topical lidocaine acts locally and adds relief without sedation. It is used along with acetaminophen and regional techniques."},{"id":"T6-35","a":1,"s":"When a chest tube is removed, which technique helps prevent air from entering the pleural space?","o":[{"t":"Have the patient exhale or hold a breath, pull the tube and seal at once","c":true,"r":""},{"t":"Pull the tube quickly while the patient inhales deeply and relaxes","c":false,"r":"Inhalation draws air into the pleural space."},{"t":"Leave the site open to the air without a dressing to heal","c":false,"r":"An open site allows air to enter."},{"t":"Remove the tube slowly over minutes while the patient breathes normally","c":false,"r":"A quick motion prevents air entry."}],"i":"Removing a chest tube safely.","e":"Pressure in the pleural space is highest during exhalation or a held breath. A petrolatum gauze and a tight dressing seal the site."},{"id":"T6-36","a":1,"s":"A patient on chest drainage has the suction control chamber set at minus 20 cm of water. What does this setting mean?","o":[{"t":"The wall suction can be turned up high to speed drainage","c":false,"r":"The water level, not the wall dial, sets the maximum."},{"t":"A regulated suction of 20 cm of water set by the water level","c":true,"r":""},{"t":"The patient must inhale against a force of 20 cm of water","c":false,"r":"The setting does not control the patient's effort."},{"t":"The drain will stop working when the water evaporates","c":false,"r":"The setting stays constant and low water should be refilled."}],"i":"Understanding drainage systems.","e":"In a wet system the depth of the tube in the suction chamber sets the pressure. Bubbling in this chamber is gentle and shows the suction is working."},{"id":"T6-37","a":1,"s":"After a nearby explosion, a patient has dyspnea and a chest film with a bat wing pattern of opacities around the hila. What is the diagnosis?","o":[{"t":"Congestive heart failure from long standing disease","c":false,"r":"The history of an explosion points to injury."},{"t":"Lobar pneumonia from a bacterial infection","c":false,"r":"This causes a single lobar opacity, not a symmetric pattern."},{"t":"A pulmonary embolus from a leg vein clot","c":false,"r":"This does not cause bilateral hilar opacities in this way."},{"t":"Blast lung injury from the pressure wave","c":true,"r":""}],"i":"Recognizing blast lung.","e":"The pressure wave injures alveoli and capillaries and causes bleeding and edema. Careful fluids, lung protective ventilation and a search for air embolism are key."},{"id":"T6-38","a":1,"s":"Three days after a chest tube for hemothorax, a CT shows retained clotted blood in the pleural space. What is the preferred treatment to prevent empyema?","o":[{"t":"Early video assisted thoracoscopic evacuation","c":true,"r":""},{"t":"Wait for months to see if the blood is absorbed","c":false,"r":"Retained blood can become infected and trap the lung."},{"t":"Place a smaller tube higher on the chest wall","c":false,"r":"A tube cannot drain clotted blood well."},{"t":"Give oral antibiotics alone and send the patient home","c":false,"r":"This does not remove the clot."}],"i":"Managing retained hemothorax.","e":"Early thoracoscopy removes clots and frees the lung. Delay raises the risk of empyema and a trapped lung."},{"id":"T6-39","a":1,"s":"A patient with a known small pneumothorax will be transported by helicopter. What is the concern?","o":[{"t":"Gas shrinks at altitude, so there is little concern","c":false,"r":"Pressure drops with altitude and gas expands."},{"t":"The lower pressure at altitude helps the lung expand without care","c":false,"r":"The lung may collapse more as gas expands."},{"t":"Gas expands at altitude, so a chest tube is placed before flight","c":true,"r":""},{"t":"Chest tubes are not used in flight by crews","c":false,"r":"Tubes are often placed before flights."}],"i":"Anticipating effects of altitude.","e":"Boyle law shows that gas volume rises as the pressure falls. A small pneumothorax can become large and cause a tension pneumothorax."},{"id":"T6-40","a":1,"s":"A patient has a stab wound to the left chest, muffled heart sounds and a falling pressure, and the team has no ultrasound. Which finding best supports tamponade?","o":[{"t":"Distended neck veins with hypotension and muffled heart sounds","c":true,"r":""},{"t":"Flat neck veins with hypotension and loud heart sounds","c":false,"r":"Flat veins suggest low volume, and tamponade quiets the sounds."},{"t":"Wheezing with a prolonged exhalation and normal veins","c":false,"r":"This suggests airway disease and not tamponade."},{"t":"A bounding pulse with a wide pulse pressure","c":false,"r":"Tamponade narrows the pulse pressure."}],"i":"Recognizing Beck triad.","e":"Beck triad is hypotension, muffled heart sounds and distended neck veins. It may be absent when the patient is also bleeding."},{"id":"T6-41","a":1,"s":"Which patients with suspected blunt cardiac injury need continuous cardiac monitoring?","o":[{"t":"Patients with a fractured sternum on the x-ray alone","c":false,"r":"The sternal fracture alone does not decide monitoring."},{"t":"Those with an abnormal ECG, raised troponin or low pressure","c":true,"r":""},{"t":"Patients older than 80 years with normal test results","c":false,"r":"Normal tests and a stable course do not need monitoring."},{"t":"All patients, for two weeks after the injury occurs","c":false,"r":"Most problems appear in the first 24 hours."}],"i":"Screening for cardiac injury.","e":"A normal ECG and troponin make serious injury unlikely. Abnormal results call for monitoring and an echocardiogram."},{"id":"T6-42","a":1,"s":"A patient with tamponade has a QRS complex that alternates in size from beat to beat on the monitor. What is this called?","o":[{"t":"Torsades de pointes caused by low magnesium","c":false,"r":"This is a different rhythm with twisting points."},{"t":"Atrial flutter caused by an irritable atrium","c":false,"r":"This has a sawtooth pattern."},{"t":"Ventricular tachycardia caused by an old scar in muscle","c":false,"r":"This is a fast wide rhythm."},{"t":"Electrical alternans from the heart swinging in fluid","c":true,"r":""}],"i":"Recognizing ECG signs of tamponade.","e":"A large effusion lets the heart swing, so the electrical axis changes with each beat. It supports the diagnosis along with low pressure and distended veins."},{"id":"T6-43","a":1,"s":"Which echocardiogram finding supports tamponade in a hypotensive patient after a stab wound to the chest?","o":[{"t":"A dilated aortic root with a flap in the aortic lumen","c":false,"r":"This suggests an aortic dissection."},{"t":"Pericardial effusion with right ventricular collapse","c":true,"r":""},{"t":"A thickened left ventricle with a clear, empty pericardial sac","c":false,"r":"This suggests long standing hypertension."},{"t":"Normal chambers with a prolapsed mitral valve leaflet","c":false,"r":"This suggests valve disease."}],"i":"Recognizing tamponade on ultrasound.","e":"Fluid in the pericardial sac squeezes the right side of the heart first. The patient needs a pericardial window or sternotomy."},{"id":"T6-44","a":1,"s":"Which treatment is preferred for a suitable blunt thoracic aortic injury needing repair?","o":[{"t":"Open repair for the patient with no exception","c":false,"r":"Endovascular repair has lower mortality in many patients."},{"t":"A long course of oral steroids for the wall","c":false,"r":"This does not repair the vessel."},{"t":"Thoracic endovascular repair with a stent graft","c":true,"r":""},{"t":"Observation with no control of the blood pressure","c":false,"r":"The injury can rupture."}],"i":"Knowing repair options.","e":"A stent graft avoids thoracotomy and clamping of the aorta. It lowers complications such as paraplegia and bleeding."},{"id":"T6-45","a":1,"s":"A patient needs a stent graft for aortic injury but also has a brain hemorrhage. Which concern applies?","o":[{"t":"Heparin is required in full dose, whatever the brain shows","c":false,"r":"The risk of brain bleeding needs weighing."},{"t":"Brain bleeding makes the aortic wall heal faster and stronger","c":false,"r":"There is no such link."},{"t":"The aortic repair can be skipped whenever there is brain bleeding","c":false,"r":"Both injuries need a plan."},{"t":"Heparin may worsen the brain bleed, so doses are reduced","c":true,"r":""}],"i":"Balancing bleeding risks.","e":"The teams plan a strategy that treats the aorta while limiting anticoagulation. Neurosurgical advice is sought."},{"id":"T6-46","a":1,"s":"After a stab wound to the base of the neck, the right arm pulse is absent and the right carotid pulse is weak. Which vessel is likely injured?","o":[{"t":"The left femoral artery","c":false,"r":"This does not affect the pulses in the right arm."},{"t":"The abdominal aorta","c":false,"r":"This does not explain the arm and neck findings."},{"t":"The innominate artery","c":true,"r":""},{"t":"The internal iliac artery","c":false,"r":"This does not explain the arm and neck findings."}],"i":"Recognizing arch vessel injury.","e":"The innominate artery supplies the right subclavian and carotid arteries. Injury reduces flow to both, and urgent imaging or surgery is needed."},{"id":"T6-47","a":1,"s":"A patient with a stab wound next to the sternum is stable. The initial chest film is normal, but he has a large hemothorax six hours later. Which vessel may be bleeding?","o":[{"t":"The carotid artery in the neck","c":false,"r":"This is not near the sternum."},{"t":"The internal mammary artery","c":true,"r":""},{"t":"The popliteal artery behind the knee","c":false,"r":"This is not in the chest."},{"t":"The renal artery behind the abdomen","c":false,"r":"This is not in the chest wall."}],"i":"Recognizing delayed bleeding.","e":"Vessels in the chest wall can bleed after the first films. Drainage, angioembolization or surgery stops the bleeding."},{"id":"T6-48","a":1,"s":"Which finding on abdominal examination most strongly suggests peritonitis from a perforated bowel?","o":[{"t":"A soft, nontender abdomen with active bowel sounds","c":false,"r":"These findings are normal and do not suggest peritonitis."},{"t":"Bruising of the flank with a soft abdomen and normal bowel sounds","c":false,"r":"Flank bruising points to retroperitoneal bleeding and not to peritonitis."},{"t":"Mild distension with high pitched bowel sounds and no pain","c":false,"r":"These findings suggest a bowel obstruction and not peritonitis."},{"t":"A rigid abdomen with guarding and rebound tenderness","c":true,"r":""}],"i":"Recognizing peritonitis.","e":"Spilled bowel contents irritate the peritoneum and cause a rigid abdomen, guarding and rebound pain. A patient with these findings needs surgery and not further observation."},{"id":"T6-49","a":1,"s":"A patient with a spinal cord injury at T6 has a fall with abdominal pain and no tenderness or guarding. Why is the abdominal exam unreliable?","o":[{"t":"The spinal cord injury makes the abdomen more sensitive","c":false,"r":"Sensation is lost, not increased."},{"t":"Abdominal injuries do not occur with cord injuries","c":false,"r":"Injury can occur and be silent."},{"t":"Loss of sensation below the injury hides pain","c":true,"r":""},{"t":"Spinal injury causes a normal exam in most patients","c":false,"r":"The exam is unreliable but not always normal."}],"i":"Recognizing silent abdomen.","e":"Without sensation the usual signs of peritonitis are lost. Imaging and a low threshold for further study are used."},{"id":"T6-50","a":1,"s":"A stable patient has a colon injury from a gunshot wound with little contamination. Which management may be chosen?","o":[{"t":"A permanent colostomy for a colon injury seen","c":false,"r":"Many injuries can be repaired without diversion."},{"t":"No surgery and an oral diet at home","c":false,"r":"The perforation must be repaired."},{"t":"Drainage of the colon with a chest tube","c":false,"r":"This is not used for colon injury."},{"t":"Primary repair of the wound without a colostomy","c":true,"r":""}],"i":"Choosing repair for colon injury.","e":"Stable patients with limited contamination can have primary repair. Unstable patients or those with severe contamination may need resection or diversion."},{"id":"T6-51","a":1,"s":"Two weeks after a liver injury treated without surgery, a patient has bleeding from the gut, right upper quadrant pain and jaundice. What is suspected?","o":[{"t":"A gastric ulcer from stress","c":false,"r":"This does not explain the combination."},{"t":"Hemobilia, a bleed into the bile ducts","c":true,"r":""},{"t":"A pancreatic pseudocyst","c":false,"r":"This does not cause this triad."},{"t":"A urinary tract infection","c":false,"r":"This does not cause these signs."}],"i":"Recognizing hemobilia.","e":"A vascular injury connects with the biliary tree. Angioembolization is the usual treatment."},{"id":"T6-52","a":1,"s":"A child has a grade III splenic injury and is stable. Which management is correct?","o":[{"t":"Nonoperative care with monitoring and fewer restrictions","c":true,"r":""},{"t":"Immediate splenectomy in a child with a splenic injury","c":false,"r":"Most children are managed without surgery."},{"t":"No monitoring and discharge after the first scan is read","c":false,"r":"The child needs observation."},{"t":"Surgery only if the child asks for it from staff","c":false,"r":"The decision follows clinical signs."}],"i":"Managing pediatric spleen injury.","e":"Children tolerate nonoperative care well. Repeated exams and hemoglobin checks guide care, and restrictions are based on the grade."},{"id":"T6-53","a":1,"s":"After splenic artery embolization, a patient has left upper quadrant pain, a low grade fever and a mild rise in white count for two days, with a stable hemoglobin. What is expected?","o":[{"t":"A splenic abscess that needs immediate surgical drainage","c":false,"r":"An abscess usually appears later and causes a high fever and a worsening course."},{"t":"Postembolization syndrome, treated with supportive care","c":true,"r":""},{"t":"A missed bowel injury that needs urgent laparotomy","c":false,"r":"The picture and the stable hemoglobin do not point to a bowel injury."},{"t":"A pulmonary embolism that needs anticoagulation now","c":false,"r":"The pain and fever are local and the patient has no breathing signs."}],"i":"Recognizing a complication of embolization.","e":"Dead splenic tissue causes pain, fever and a raised white count for several days. Pain control, fluids and watching for worsening signs are enough in most patients."},{"id":"T6-54","a":1,"s":"On CT, the stomach is seen to be narrowed as it passes through a defect in the diaphragm. What is this finding called?","o":[{"t":"The halo sign","c":false,"r":"This is a different finding."},{"t":"The collar sign","c":true,"r":""},{"t":"The whirl sign","c":false,"r":"This describes a twisted bowel."},{"t":"The target sign","c":false,"r":"This describes bowel wall layers."}],"i":"Reading CT signs of rupture.","e":"The organ is constricted at the tear, like a collar. It supports herniation of abdominal contents."},{"id":"T6-55","a":1,"s":"After a penetrating injury, a patient has a raised left hemidiaphragm on the film and difficulty weaning from the ventilator. Which nerve injury is a consideration?","o":[{"t":"The vagus nerve","c":false,"r":"Injury is not the usual cause of a raised diaphragm."},{"t":"The facial nerve","c":false,"r":"This does not control the diaphragm."},{"t":"The phrenic nerve","c":true,"r":""},{"t":"The sciatic nerve","c":false,"r":"This does not control the diaphragm."}],"i":"Recognizing phrenic injury.","e":"The phrenic nerve supplies the diaphragm. Injury leaves it weak and raised, which delays weaning."},{"id":"T6-56","a":1,"s":"Why are acute diaphragm tears usually repaired through an abdominal incision?","o":[{"t":"The surgeon can look for other injuries","c":true,"r":""},{"t":"The chest cannot be entered during surgery","c":false,"r":"The chest can be entered if needed."},{"t":"The incision is smaller than the chest approach","c":false,"r":"The approach is chosen for exposure."},{"t":"It avoids the need for general anesthesia","c":false,"r":"Anesthesia is needed."}],"i":"Choosing a surgical approach.","e":"Associated abdominal injuries are common, so laparotomy is favored in the acute setting. Chronic hernias are often repaired through the chest."},{"id":"T6-57","a":1,"s":"Why must small penetrating wounds of the diaphragm be repaired even if no herniation is seen?","o":[{"t":"They close on their own within a day or two without repair","c":false,"r":"The motion and pressure gradient prevent healing."},{"t":"They are harmless and rarely cause problems later","c":false,"r":"Late herniation can be severe."},{"t":"Repair is for cosmetic reasons and can be skipped","c":false,"r":"Repair prevents life threatening problems."},{"t":"Pressure differences prevent healing and herniation follows","c":true,"r":""}],"i":"Knowing the need to repair.","e":"The diaphragm moves with every breath and the pressure is lower in the chest. Small holes enlarge over time and trap bowel."},{"id":"T6-58","a":1,"s":"A patient has flank pain after a deceleration injury and no blood in the urine. CT shows a kidney that does not enhance. Which injury is suspected?","o":[{"t":"A simple bladder contusion with no leak","c":false,"r":"This would not cause a nonenhancing kidney."},{"t":"Renal artery thrombosis or injury","c":true,"r":""},{"t":"A rib fracture with some bruising","c":false,"r":"This does not explain the CT."},{"t":"A pancreatic contusion with swelling","c":false,"r":"This does not explain the kidney finding."}],"i":"Recognizing vascular renal injury.","e":"Stretching of the artery tears the intima, and flow is blocked. Hematuria is absent in many cases, and revascularization is time critical."},{"id":"T6-59","a":1,"s":"A patient has persistent low blood pressure and a low sodium and high potassium after a severe abdominal injury. CT shows large bilateral adrenal hemorrhage. What does this suggest?","o":[{"t":"Adrenal insufficiency needing steroid replacement","c":true,"r":""},{"t":"A urinary tract infection from the catheter in place","c":false,"r":"This does not explain the electrolytes."},{"t":"Diabetes insipidus from the brain injury","c":false,"r":"This causes high sodium."},{"t":"Hyperthyroidism from the stress of injury","c":false,"r":"This does not explain the pattern."}],"i":"Recognizing adrenal injury.","e":"Both glands are damaged, so cortisol and aldosterone are lost. Hydrocortisone is given when shock is not responding."},{"id":"T6-60","a":1,"s":"A patient on anticoagulants has a retroperitoneal bleed and weakness of hip flexion with numbness of the thigh. What is the likely cause?","o":[{"t":"A fracture of the cervical spine with a cord injury","c":false,"r":"This does not explain the thigh findings."},{"t":"A tear of the rotator cuff of the shoulder and arm","c":false,"r":"This is not in the leg."},{"t":"A blocked artery in the upper arm from a clot or injury","c":false,"r":"This does not explain the leg findings."},{"t":"Femoral nerve compression by blood in the psoas muscle","c":true,"r":""}],"i":"Recognizing nerve compression.","e":"The femoral nerve runs in the psoas muscle. Bleeding there compresses it and also hides a large loss of blood."},{"id":"T6-61","a":1,"s":"A patient has flank pain, fever and ileus four days after blunt abdominal trauma. CT with delayed images shows contrast outside the ureter. What is the diagnosis?","o":[{"t":"A normal finding after trauma","c":false,"r":"Contrast outside the ureter is abnormal."},{"t":"An injury to the gallbladder","c":false,"r":"This is not shown by the contrast pattern."},{"t":"A ureteral injury with a urinoma","c":true,"r":""},{"t":"A pancreatic pseudocyst","c":false,"r":"This is not shown by the contrast pattern."}],"i":"Recognizing ureteral injury.","e":"Ureteral injuries are easy to miss, and delayed images show leakage. Stents or surgical repair are used."},{"id":"T6-62","a":1,"s":"Which element of the pelvic ring determines its stability?","o":[{"t":"The width of the pubic symphysis on the plain x-ray alone","c":false,"r":"The posterior ligaments carry most of the load."},{"t":"The length of the femoral neck","c":false,"r":"This does not define the ring stability."},{"t":"Integrity of the posterior sacroiliac ligament complex","c":true,"r":""},{"t":"The size of the iliac wing","c":false,"r":"This does not define the ring stability."}],"i":"Understanding pelvic stability.","e":"Disruption of the posterior ligaments allows the hemipelvis to move. Unstable patterns need fixation."},{"id":"T6-63","a":1,"s":"A patient has a vertical fracture through the sacral foramina and has new loss of bladder control and numbness of the perineum. What is the concern?","o":[{"t":"A stroke from a clot in the brain, with face droop","c":false,"r":"This does not explain the findings."},{"t":"Compartment syndrome of the forearm","c":false,"r":"This does not explain the findings."},{"t":"A tear of the rotator cuff of the shoulder","c":false,"r":"This does not explain the findings."},{"t":"Sacral nerve root injury from a foraminal fracture","c":true,"r":""}],"i":"Linking sacral fractures to nerve injury.","e":"The fracture crosses the foramina where the nerves exit. Bowel, bladder and sexual function may be affected."},{"id":"T6-64","a":1,"s":"Which artery is most commonly injured in pelvic fractures needing embolization?","o":[{"t":"The radial artery at the wrist, which supplies the hand","c":false,"r":"This is in the arm."},{"t":"The common carotid artery in the neck, a branch of the aorta","c":false,"r":"This is in the neck."},{"t":"The superior gluteal artery, a branch of the internal iliac","c":true,"r":""},{"t":"The coronary artery, a branch of the ascending aorta","c":false,"r":"This is in the heart."}],"i":"Knowing vascular injuries.","e":"The branch is fixed near the sciatic notch and tears with displacement. Embolization of the internal iliac branches controls it."},{"id":"T6-65","a":1,"s":"After 24 hours, a patient with a pelvic binder has a red, broken area of skin over the hip bone. What does this indicate?","o":[{"t":"A normal healing rash that will fade if the binder is left in place","c":false,"r":"This is a pressure injury."},{"t":"An allergic reaction to the blood products given in the trauma bay","c":false,"r":"This is not an allergy."},{"t":"A sign that the binder is too loose and should be tightened further","c":false,"r":"Tightening worsens the injury."},{"t":"Pressure injury from the binder, so fixation should replace it soon","c":true,"r":""}],"i":"Preventing binder injury.","e":"Binders over bony areas cause skin breakdown. The skin is checked, and the binder is removed once other control is in place."},{"id":"T6-66","a":1,"s":"A patient with an unstable pelvic fracture and a positive FAST exam is hypotensive. What is a reasonable approach?","o":[{"t":"Send the patient to angiography before other action","c":false,"r":"The positive FAST suggests an abdominal source that needs surgery."},{"t":"Observe the patient with fluids alone","c":false,"r":"The patient is in shock."},{"t":"Bind the pelvis and take the patient to the operating room now","c":true,"r":""},{"t":"Place a chest tube and recheck the FAST in one hour","c":false,"r":"This does not address the bleeding."}],"i":"Looking for multiple bleeding sources.","e":"A positive FAST in an unstable patient points to an abdominal bleed. The pelvis is stabilized, and packing may be done during surgery."},{"id":"T6-67","a":1,"s":"A female patient has a pelvic fracture and blood at the vaginal opening. Which injury should be suspected?","o":[{"t":"A normal finding in a woman after a trauma or straddle injury","c":false,"r":"Blood at the opening is abnormal."},{"t":"A rib fracture that happened at the same time","c":false,"r":"This does not explain the finding."},{"t":"A urethral or vaginal laceration needing further evaluation","c":true,"r":""},{"t":"A kidney stone that passed at the time of the injury","c":false,"r":"This does not explain the finding."}],"i":"Recognizing urethral injury in females.","e":"Female urethral injury is rare but associated with pelvic fractures. A careful exam and imaging precede catheter placement."},{"id":"T6-68","a":1,"s":"Why is an excretory phase CT without bladder filling inadequate to exclude a bladder rupture?","o":[{"t":"The CT scan cannot show the bladder wall or a leak","c":false,"r":"The bladder can be seen but must be filled."},{"t":"An empty bladder may not leak, so retrograde filling is used","c":true,"r":""},{"t":"Contrast leaks even when no tear of the bladder is present","c":false,"r":"A leak occurs only with a tear."},{"t":"The test is used for the kidneys and nothing else","c":false,"r":"Special filling is used for the bladder."}],"i":"Choosing the right test.","e":"At least about 300 mL of dilute contrast is instilled to distend the bladder and reveal a tear."},{"id":"T6-69","a":1,"s":"A patient has a swollen, bent and bruised penis after a sexual injury and reports a snapping sound. What is the diagnosis and treatment?","o":[{"t":"A simple bruise treated with ice and rest and no surgery","c":false,"r":"The deformity and the snapping sound suggest a tear."},{"t":"A urinary tract infection treated with oral antibiotics","c":false,"r":"This does not explain the injury."},{"t":"Penile fracture with a torn tunica, needing surgery","c":true,"r":""},{"t":"A kidney contusion treated with bed rest and fluids","c":false,"r":"This does not explain the injury."}],"i":"Recognizing penile fracture.","e":"Blood collects under the skin and gives an eggplant shape. Early repair protects erectile function and the urethra."},{"id":"T6-70","a":2,"s":"A patient dove into shallow water and has a triangular fragment off the front of the C5 vertebral body and loss of motor function with pain sensation lost below the injury. What is this injury?","o":[{"t":"A flexion teardrop fracture, which is highly unstable","c":true,"r":""},{"t":"A clay shoveler fracture, a stable spinous process injury","c":false,"r":"This injury is stable and does not cause cord loss."},{"t":"A Chance fracture, from a lap belt in the lumbar spine","c":false,"r":"This injury occurs in the lumbar spine and not at C5."},{"t":"A simple compression fracture that heals without treatment","c":false,"r":"This injury does not cause a displaced fragment with cord loss."}],"i":"Recognizing a teardrop fracture.","e":"Severe flexion and compression break off a piece of the vertebral body, with damage to the ligaments. The injury often causes an anterior cord syndrome and needs surgery."},{"id":"T6-71","a":2,"s":"Which feature suggests that a thoracic compression fracture is stable?","o":[{"t":"Wedge shaped with an intact posterior wall and no deficit","c":true,"r":""},{"t":"A fracture with bone pushed back into the spinal canal and cord","c":false,"r":"This describes a burst fracture that may be unstable."},{"t":"A fracture with new leg weakness and loss of sensation","c":false,"r":"A deficit suggests cord or root injury and potential instability."},{"t":"A fracture with dislocation of the vertebrae and cord signs","c":false,"r":"Translation shows ligament disruption and instability."}],"i":"Judging fracture stability.","e":"The middle and posterior columns hold when only the front of the vertebra collapses. Bracing and pain control are often sufficient."},{"id":"T6-72","a":2,"s":"A patient who had spinal surgery two hours ago has severe back pain and new leg weakness. What should the nurse suspect?","o":[{"t":"Normal postoperative pain that needs more analgesia and rest","c":false,"r":"New weakness is not expected."},{"t":"A spinal epidural hematoma needing urgent notification","c":true,"r":""},{"t":"A wound infection that appears within hours of surgery","c":false,"r":"Infection does not cause weakness this early."},{"t":"Muscle fatigue from lying flat for hours","c":false,"r":"This does not cause new weakness."}],"i":"Recognizing postoperative cord compression.","e":"Blood can press on the cord within hours. Decompression within a short window gives the best chance of recovery."},{"id":"T6-73","a":2,"s":"Which set lists the four compartments of the lower leg that may need fasciotomy?","o":[{"t":"Anterior, medial, plantar and dorsal groups of the foot","c":false,"r":"The plantar and dorsal compartments are in the foot."},{"t":"Flexor, extensor, thenar and hypothenar groups of the hand","c":false,"r":"These are compartments of the hand and forearm."},{"t":"Deltoid, biceps, triceps and brachial muscle groups of the arm","c":false,"r":"These are muscles of the arm."},{"t":"Anterior, lateral, superficial posterior and deep posterior","c":true,"r":""}],"i":"Knowing leg compartments.","e":"A four compartment fasciotomy releases all the muscle groups. The anterior compartment is the most often affected."},{"id":"T6-74","a":2,"s":"A limb was without blood flow for eight hours before a vascular repair. What is the concern after flow is restored?","o":[{"t":"The limb will shrink in size and become pale as blood flow returns to it","c":false,"r":"Reperfusion leads to swelling."},{"t":"The limb will become too cold to touch and turn black within hours","c":false,"r":"Warmth returns with flow."},{"t":"No further problems are expected once the artery has been repaired","c":false,"r":"Reperfusion injury is common after long ischemia."},{"t":"Reperfusion swelling can cause compartment syndrome, needing fasciotomy","c":true,"r":""}],"i":"Anticipating reperfusion injury.","e":"Injured muscle cells leak fluid when flow returns. Prophylactic fasciotomy is common after more than about six hours of ischemia."},{"id":"T6-75","a":2,"s":"A surgeon uses the Mangled Extremity Severity Score to decide on a limb. Which score suggests that amputation is likely to be needed?","o":[{"t":"A score of 7 or higher","c":true,"r":""},{"t":"A score of 1 or 2","c":false,"r":"This suggests a good chance of salvage."},{"t":"A score of 3 or 4","c":false,"r":"This suggests a good chance of salvage."},{"t":"A score of 0","c":false,"r":"This suggests a minimal injury."}],"i":"Using a limb salvage score.","e":"The score combines injury energy, limb ischemia, shock and age. A higher number predicts that salvage will fail."},{"id":"T6-76","a":2,"s":"A patient with a below knee amputation has burning pain in the missing foot. Which treatment is supported?","o":[{"t":"Mirror therapy with a neuropathic agent such as gabapentin","c":true,"r":""},{"t":"Reassurance that the pain is imaginary and cannot be treated","c":false,"r":"Phantom limb pain is real and can be treated."},{"t":"Escalating doses of opioids as the sole treatment","c":false,"r":"Opioids alone are not effective for nerve pain."},{"t":"Early reamputation at a higher level of the leg","c":false,"r":"Surgery does not reliably relieve the pain."}],"i":"Managing phantom limb pain.","e":"Pain comes from the nervous system and not from the foot. A mix of therapy, drugs and rehabilitation works best."},{"id":"T6-77","a":2,"s":"A patient has a Gustilo type III open tibia fracture with a large contaminated wound. Which antibiotic change is recommended?","o":[{"t":"Give no antibiotics until the culture result returns","c":false,"r":"Delay raises the infection rate."},{"t":"Give an antiviral drug along with a steroid for a week","c":false,"r":"This does not treat bacterial contamination."},{"t":"Add gram negative coverage to the gram positive cover","c":true,"r":""},{"t":"Give gram positive coverage alone for a week","c":false,"r":"Large wounds need broader coverage."}],"i":"Choosing antibiotics for open fractures.","e":"Large, contaminated wounds are exposed to gram negative bacteria. Antibiotics start within an hour, and surgical cleaning follows."},{"id":"T6-78","a":2,"s":"A child has tenderness over the distal radial growth plate, swelling and a normal x-ray after a fall. What is the best management?","o":[{"t":"Discharge with no splint and no follow up, since the x-ray is normal","c":false,"r":"A normal film does not rule out a growth plate fracture."},{"t":"Treat as a Salter Harris type I fracture with a splint and follow up","c":true,"r":""},{"t":"Apply a heating pad and allow full use of the wrist during play","c":false,"r":"Heat and full use risk displacement and damage to the growth plate."},{"t":"Order a bone scan and allow sports until the result returns","c":false,"r":"Sports risk displacement, and treatment should start now."}],"i":"Managing a growth plate injury.","e":"Tenderness over the growth plate is treated as a fracture even when the film is normal. Early splinting protects the growth plate, and repeat imaging shows healing."},{"id":"T6-79","a":2,"s":"A patient has a degloving injury of the forearm with a flap of skin still attached. What should the nurse do before transfer?","o":[{"t":"Replace the flap over the wound and cover with moist gauze","c":true,"r":""},{"t":"Cut away the flap to prevent infection and leave the wound open","c":false,"r":"The flap may be salvageable."},{"t":"Leave it open to the air to dry out","c":false,"r":"Drying damages the tissue."},{"t":"Soak it in alcohol before wrapping the limb","c":false,"r":"Alcohol damages the tissue."}],"i":"Caring for avulsion injuries.","e":"Flaps with intact blood supply may survive. A surgeon decides on cleaning and closure."},{"id":"T6-80","a":2,"s":"A heavily contaminated wound from a barn accident is cleaned and debrided. Which closure plan is common?","o":[{"t":"Immediate tight closure with deep stitches and glue","c":false,"r":"This traps bacteria and raises infection risk."},{"t":"Closure with adhesive tape over the debris left in","c":false,"r":"Debris must be cleaned out."},{"t":"Leaving the wound open, whatever the later course of healing","c":false,"r":"Wounds are usually closed once clean."},{"t":"Delayed primary closure after several days, when risk is lower","c":true,"r":""}],"i":"Timing wound closure.","e":"Leaving the wound open for a few days allows drainage and monitoring. It is then closed if clean."},{"id":"T6-81","a":2,"s":"After a seizure, a patient holds the arm tightly against the body in internal rotation and cannot rotate it outward. X-ray shows a light bulb appearance of the humeral head. What is the diagnosis?","o":[{"t":"A posterior shoulder dislocation","c":true,"r":""},{"t":"An anterior shoulder dislocation with the arm out to the side","c":false,"r":"The classic anterior dislocation has a different position."},{"t":"A clavicle fracture with a bump over the bone","c":false,"r":"The film and arm position do not suggest this."},{"t":"A rotator cuff tear with a normal film","c":false,"r":"The film shows an abnormal humeral head."}],"i":"Recognizing posterior shoulder dislocation.","e":"Seizures and electric shock cause strong internal rotation. The injury is often missed on plain films."},{"id":"T6-82","a":2,"s":"After a fall onto the wrist, a patient has a dislocated lunate and tingling in the thumb, index and middle fingers. Which complication is suspected?","o":[{"t":"Acute carpal tunnel syndrome from median nerve pressure","c":true,"r":""},{"t":"Cubital tunnel syndrome from ulnar nerve compression","c":false,"r":"This affects the ring and small fingers."},{"t":"Radial nerve palsy with a wrist drop","c":false,"r":"This does not produce this sensory pattern."},{"t":"Thoracic outlet syndrome from a cervical rib","c":false,"r":"This is not caused by a wrist injury."}],"i":"Recognizing nerve compression.","e":"The displaced bone narrows the carpal tunnel. Urgent reduction relieves the nerve."},{"id":"T6-83","a":3,"s":"An 82 year old has a fall and a temperature of 36.8 degrees Celsius, but is newly confused and has a high white count and a urinary infection on testing. What does this show?","o":[{"t":"A normal temperature means infection is not present in older adults","c":false,"r":"Fever is often absent in older adults."},{"t":"Confusion after a fall is due to the fall","c":false,"r":"Infection and other causes must be looked for."},{"t":"A high white count is a normal finding in older adults","c":false,"r":"It suggests infection."},{"t":"Older adults may not mount a fever, and confusion can be the first sign","c":true,"r":""}],"i":"Recognizing atypical presentation.","e":"Age blunts the fever response. Mental status change, falls and weakness are frequent signs of infection."},{"id":"T6-84","a":3,"s":"Why can a normal serum creatinine mislead drug dosing in a frail older adult?","o":[{"t":"Older adults have a high creatinine value because of age alone","c":false,"r":"Creatinine may be normal despite poor function."},{"t":"Low muscle mass can keep creatinine normal despite poor kidneys","c":true,"r":""},{"t":"Creatinine measures liver function and not the kidneys","c":false,"r":"It reflects kidney clearance."},{"t":"Creatinine is not affected by muscle mass in adults","c":false,"r":"Muscle mass affects the level."}],"i":"Dosing in older adults.","e":"A calculated clearance is used to adjust drugs. This prevents toxicity with antibiotics and opioids."},{"id":"T6-85","a":3,"s":"Which anticholinergic effect makes some common drugs risky for an older adult after trauma?","o":[{"t":"Improved memory, clearer thinking and better sleep","c":false,"r":"These are not expected effects."},{"t":"Confusion, urinary retention and constipation","c":true,"r":""},{"t":"A lower risk of falls and a calmer mood","c":false,"r":"These drugs increase falls."},{"t":"Increased urine output with more thirst","c":false,"r":"These drugs reduce bladder emptying."}],"i":"Recognizing drug effects.","e":"Drugs such as diphenhydramine are on the Beers list. They add to delirium and falls."},{"id":"T6-86","a":3,"s":"A critically injured child has a heart rate that falls from 140 to 70. What is the most likely cause?","o":[{"t":"A normal response to the injury","c":false,"r":"A falling rate is an ominous sign."},{"t":"Improvement in the condition of the child","c":false,"r":"The rate falls in impending arrest."},{"t":"Hypoxia, which needs oxygen and ventilation","c":true,"r":""},{"t":"The effect of a good night of sleep","c":false,"r":"This does not explain the change."}],"i":"Interpreting bradycardia in children.","e":"Children respond to shock and hypoxia with a fast rate, and a fall signals arrest. Airway and breathing are secured first."},{"id":"T6-87","a":3,"s":"Why is the Lund and Browder chart preferred over the rule of nines for estimating burns in a young child?","o":[{"t":"A child has a smaller head than an adult in proportion to the body","c":false,"r":"The head is relatively larger."},{"t":"The rule of nines is accurate for all ages","c":false,"r":"It overestimates leg burns in children."},{"t":"A child has a larger head and shorter legs for body size","c":true,"r":""},{"t":"The chart ignores the size of the body","c":false,"r":"It adjusts for age."}],"i":"Estimating pediatric burns.","e":"Proportions change with age. Using the adult rule would underestimate the head and overestimate the legs."},{"id":"T6-88","a":3,"s":"A child has a forward shift of C2 on C3 of 2 mm on a lateral film, and no neck pain or deficits. What is the likely explanation?","o":[{"t":"A hangman's fracture that needs immediate fusion","c":false,"r":"There is no sign of fracture."},{"t":"Pseudosubluxation, a normal variant in children","c":true,"r":""},{"t":"A complete cord transection at the level","c":false,"r":"There is no deficit."},{"t":"An odontoid fracture of C2 with displacement","c":false,"r":"The film does not show this."}],"i":"Recognizing a normal variant.","e":"Ligaments in children are lax, which permits mild movement at C2 and C3. Clinical findings and a line along the spinolaminar contour help decide."},{"id":"T6-89","a":3,"s":"How should a pregnant patient wear a lap and shoulder belt?","o":[{"t":"The lap portion across the top of the uterus and abdomen","c":false,"r":"This can injure the uterus."},{"t":"Lap belt low across the pelvis, strap over the collarbone","c":true,"r":""},{"t":"The shoulder strap placed behind the back or under the arm","c":false,"r":"This gives no protection."},{"t":"No belt at all, to protect the baby from pressure","c":false,"r":"Belts protect both the mother and the fetus."}],"i":"Teaching crash safety.","e":"A properly placed belt lowers the risk of injury to the placenta and fetus. The best way to protect the fetus is to protect the mother."},{"id":"T6-90","a":3,"s":"A pregnant trauma patient at 24 weeks needs a CT of the abdomen. What is the correct approach?","o":[{"t":"Refuse imaging for the entire pregnancy to protect the fetus","c":false,"r":"Needed imaging should not be withheld."},{"t":"Delay all imaging until after delivery of the baby","c":false,"r":"This risks a missed injury."},{"t":"Do the needed CT, since maternal injury comes first","c":true,"r":""},{"t":"Use a chest film alone for the injury","c":false,"r":"This will not diagnose abdominal injuries."}],"i":"Balancing imaging and radiation.","e":"Fetal harm is unlikely below about 50 mGy. Shielding does not reduce internal scatter, and the mother's health protects the fetus."},{"id":"T6-91","a":3,"s":"A pregnant patient at 34 weeks has severe abdominal pain, a rigid uterus, easily palpable fetal parts and a nonreassuring tracing after a crash. What is suspected?","o":[{"t":"Uterine rupture, which needs emergency surgery","c":true,"r":""},{"t":"Braxton Hicks contractions that need hydration","c":false,"r":"These are mild and the signs do not fit."},{"t":"Early labor that needs observation","c":false,"r":"The picture is of a dangerous injury."},{"t":"A simple muscle strain of the abdomen","c":false,"r":"This does not explain the fetal findings."}],"i":"Recognizing uterine rupture.","e":"The uterus tears and the fetus may move into the abdomen. Maternal shock and fetal distress follow."},{"id":"T6-92","a":3,"s":"A worker has a burn from white phosphorus particles on the arm. What is the proper first aid?","o":[{"t":"Irrigate with water and keep particles under wet dressings","c":true,"r":""},{"t":"Apply a dry bandage over the particles to starve the fire of air","c":false,"r":"The particles ignite on drying."},{"t":"Apply an oil based ointment to the skin to seal in the particles","c":false,"r":"Oil can dissolve the phosphorus and speed absorption."},{"t":"Leave the skin exposed to the air so that the particles can dry","c":false,"r":"The particles burn in the air."}],"i":"Treating phosphorus burns.","e":"White phosphorus burns on contact with air. The particles stay under water or wet cloth until they are removed."},{"id":"T6-93","a":3,"s":"Why can a person who grips a live alternating current wire fail to let go?","o":[{"t":"The current relaxes the muscles of the hand and causes weakness","c":false,"r":"The current causes spasm and not relaxation of the muscle."},{"t":"The heat of the wire fuses the skin of the palm to the metal","c":false,"r":"Burns occur, but the failure to release comes from muscle spasm."},{"t":"The brain stops sending signals to the arm during the shock","c":false,"r":"The cause lies in the muscle spasm and not in a loss of brain signals."},{"t":"Tetanic contraction of the forearm flexor muscles","c":true,"r":""}],"i":"Understanding electrical injury.","e":"The flexor muscles of the forearm are stronger than the extensors, so the hand closes on the wire. Longer contact raises the injury, so rescuers must make the circuit safe before touching the victim."},{"id":"T6-94","a":3,"s":"Which method gives a quick estimate of a small, scattered burn in an adult?","o":[{"t":"The palm with the fingers, about 1 percent of body surface","c":true,"r":""},{"t":"The palm without the fingers, which equals about 5 percent","c":false,"r":"The palm with fingers is about 1 percent and not 5 percent."},{"t":"The whole hand and wrist, which equals about 9 percent","c":false,"r":"The whole hand and wrist is far less than 9 percent of the body surface."},{"t":"The rule of nines applied to each small patch","c":false,"r":"The rule of nines is for large burns of body regions and not small patches."}],"i":"Estimating burn size.","e":"The palm method suits small or irregular burns. The rule of nines or a Lund and Browder chart is used for larger burns."},{"id":"T6-95","a":3,"s":"Which bronchoscopy finding confirms an inhalation injury below the vocal cords?","o":[{"t":"A smooth pale airway with clear secretions","c":false,"r":"These findings are normal."},{"t":"Carbonaceous deposits with mucosal redness","c":true,"r":""},{"t":"A foreign body lodged in the right main bronchus","c":false,"r":"This finding suggests aspiration and not smoke injury."},{"t":"Thick yellow secretions with bacteria on culture","c":false,"r":"These findings suggest pneumonia and not an acute smoke injury."}],"i":"Confirming inhalation injury.","e":"Soot, redness, swelling and sloughing of the mucosa confirm the diagnosis and grade the injury. Early bronchoscopy also clears debris."},{"id":"T6-96","a":3,"s":"A patient with a body mass index of 48 is given a standard dose of enoxaparin for clot prevention after trauma. What should be considered?","o":[{"t":"A lower dose, since fat tissue removes the drug quickly","c":false,"r":"Dosing often needs to rise, not fall."},{"t":"No prophylaxis, since clots do not occur in obesity","c":false,"r":"Obesity raises the risk of clots."},{"t":"Weight adjusted dosing, since standard doses may be too low","c":true,"r":""},{"t":"Aspirin by mouth for clot prevention","c":false,"r":"This is less effective for this purpose."}],"i":"Dosing in obesity.","e":"Larger patients may have too little drug at standard doses. Anti factor Xa levels or weight based dosing are used."},{"id":"T6-97","a":3,"s":"Which tool is designed to screen older adults for suspected abuse or neglect?","o":[{"t":"The Elder Abuse Suspicion Index","c":true,"r":""},{"t":"The Confusion Assessment Method","c":false,"r":"This tool screens for delirium."},{"t":"The Braden Scale for skin","c":false,"r":"This tool screens for pressure injury risk."},{"t":"The Morse Fall Scale for falls","c":false,"r":"This tool screens for fall risk."}],"i":"Using screening tools.","e":"The index asks the patient and the nurse brief questions about abuse. A positive screen leads to a full assessment and a report as the law requires."},{"id":"T6-98","a":3,"s":"A 15 year old has signs of commercial sexual exploitation and says that the relationship is her choice. What must the nurse do?","o":[{"t":"Respect her choice as an adult decision and take no action","c":false,"r":"A minor cannot consent, so the nurse must report."},{"t":"Discharge her with her companion after the visit","c":false,"r":"This returns a child to the person who may be exploiting her."},{"t":"Report to child protective services, as a minor cannot consent","c":true,"r":""},{"t":"Wait until she asks for help before a report","c":false,"r":"The report is a legal duty and does not depend on her request."}],"i":"Reporting trafficking of minors.","e":"Any minor involved in commercial sex is treated as a victim of trafficking. Care includes safety, a private interview and a report as required by law."},{"id":"T6-99","a":3,"s":"Which step helps document wounds as forensic evidence?","o":[{"t":"Photograph the wounds after they are cleaned and fully bandaged","c":false,"r":"Wounds are photographed before cleaning when possible, to show the true injury."},{"t":"Describe the wounds in a detailed note with no photograph","c":false,"r":"A photograph adds objective evidence to the written description."},{"t":"Photograph each wound with a scale ruler and record the time","c":true,"r":""},{"t":"Photograph the face of the patient for identification","c":false,"r":"The photographs must show the wounds with a scale for size."}],"i":"Documenting forensic evidence.","e":"Photographs with a scale and a label show the size and location of the injury. They are stored under policy with the consent of the patient."},{"id":"T6-100","a":3,"s":"A nurse needs to assess a patient who survived an intentional overdose. How should she ask about suicidal thoughts?","o":[{"t":"Avoid the topic, since it may plant the idea","c":false,"r":"Asking does not increase risk."},{"t":"Ask indirectly through the family alone","c":false,"r":"The patient should be asked directly."},{"t":"Wait for the patient to bring it up first","c":false,"r":"Direct questions are needed."},{"t":"Ask directly and calmly, since asking does not add risk","c":true,"r":""}],"i":"Screening for suicide risk.","e":"Direct questions open the door to help. Positive answers lead to safety precautions and psychiatric evaluation."},{"id":"T6-101","a":3,"s":"A patient with end stage kidney disease has bleeding after trauma and a normal platelet count. Which agent may improve platelet function?","o":[{"t":"Desmopressin","c":true,"r":""},{"t":"Protamine sulfate","c":false,"r":"This reverses heparin and does not help uremic platelets."},{"t":"Vitamin K","c":false,"r":"This helps liver clotting factors and does not help uremic platelets."},{"t":"Furosemide","c":false,"r":"This increases urine output and does not help clotting."}],"i":"Managing uremic bleeding.","e":"Uremia impairs platelet function even when the count is normal. Desmopressin raises von Willebrand factor and improves platelet adhesion."},{"id":"T6-102","a":3,"s":"A patient with sickle cell disease is injured. Which measure helps prevent a crisis?","o":[{"t":"Maintain oxygenation, hydration, warmth and pain control","c":true,"r":""},{"t":"Restrict oxygen and fluids to lower the work of the heart","c":false,"r":"Hypoxia and dehydration trigger sickling."},{"t":"Keep the patient cold to slow metabolism","c":false,"r":"Cold promotes sickling."},{"t":"Avoid pain medicine to prevent sedation","c":false,"r":"Pain and stress worsen crisis."}],"i":"Preventing sickle cell crisis.","e":"Low oxygen, dehydration, acidosis and cold cause red cells to sickle. Early treatment keeps the patient stable."},{"id":"T6-103","a":3,"s":"A patient dependent on opioids has yawning, sweating, dilated pupils and muscle aches 24 hours after admission. Which tool helps assess severity?","o":[{"t":"The CIWA scale used for alcohol","c":false,"r":"This is for alcohol withdrawal."},{"t":"The Braden scale for skin","c":false,"r":"This does not assess withdrawal."},{"t":"The Morse scale for falls","c":false,"r":"This does not assess withdrawal."},{"t":"The Clinical Opiate Withdrawal Scale","c":true,"r":""}],"i":"Assessing opioid withdrawal.","e":"The scale guides drugs such as buprenorphine or clonidine. Withdrawal is uncomfortable but not usually life threatening."},{"id":"T6-104","a":3,"s":"A patient who used phencyclidine is agitated and has vertical nystagmus, hypertension and a blank stare. What is the best approach?","o":[{"t":"Restrain the patient tightly without drugs until the agitation stops","c":false,"r":"Restraint alone raises the risk of injury and rhabdomyolysis."},{"t":"Use a quiet low stimulation space and a benzodiazepine if needed","c":true,"r":""},{"t":"Give a stimulant to improve alertness and reduce the sleepiness","c":false,"r":"This worsens agitation."},{"t":"Argue with the patient to show that the fears are not real","c":false,"r":"Confrontation increases agitation."}],"i":"Managing PCP intoxication.","e":"Patients can be violent and feel little pain. Low stimulation and benzodiazepines are used, and temperature and muscle breakdown are monitored."},{"id":"T6-105","a":4,"s":"During the disability step of the primary survey, which quick tool describes level of consciousness?","o":[{"t":"SAMPLE: signs, allergies, medications, past history, events","c":false,"r":"This is a history tool and not a measure of consciousness."},{"t":"AVPU: alert, responds to voice, responds to pain, unresponsive","c":true,"r":""},{"t":"FAST: face, arm, speech and time to call","c":false,"r":"This is a stroke screen and not a trauma tool."},{"t":"RICE: rest, ice, compression and elevation","c":false,"r":"This is a treatment for sprains."}],"i":"Assessing consciousness quickly.","e":"AVPU gives a fast score during the primary survey. The GCS and the pupil exam follow in the more detailed neurologic check."},{"id":"T6-106","a":4,"s":"Which finding during the secondary survey suggests a basilar skull fracture?","o":[{"t":"Bruising over the knee and ankle","c":false,"r":"This does not suggest a skull fracture."},{"t":"A swollen thumb and a bruised palm","c":false,"r":"This does not suggest a skull fracture."},{"t":"Redness of the skin of the chest","c":false,"r":"This does not suggest a skull fracture."},{"t":"Bruising around both eyes and behind the ear","c":true,"r":""}],"i":"Recognizing signs of skull base injury.","e":"Raccoon eyes and Battle sign appear hours after the fracture. A leak of cerebrospinal fluid may also occur."},{"id":"T6-107","a":4,"s":"In an injured older adult, which medicines are most urgent to identify during the AMPLE history?","o":[{"t":"Vitamins and herbal teas, because they raise infection risk","c":false,"r":"These have little effect on early bleeding or on the first care."},{"t":"Anticoagulants and antiplatelet drugs, because of bleeding risk","c":true,"r":""},{"t":"Eye drops and skin creams, because they raise allergy risk","c":false,"r":"These rarely change the first treatment."},{"t":"Laxatives and antacids, because they raise bowel injury risk","c":false,"r":"These do not change the early care of the patient."}],"i":"Using the AMPLE history.","e":"Anticoagulants change the need for CT and for reversal. Beta blockers also matter because they hide a rise in heart rate."},{"id":"T6-108","a":4,"s":"Which definition is commonly used for massive transfusion?","o":[{"t":"Ten or more units of red cells in 24 hours, or four in one hour","c":true,"r":""},{"t":"Two units of red cells given over 24 hours to a stable patient","c":false,"r":"Two units is a usual transfusion and not a massive one."},{"t":"One unit of plasma given slowly over 12 hours in the ward","c":false,"r":"One unit of plasma is not a massive transfusion."},{"t":"A transfusion given in the emergency department","c":false,"r":"The setting does not define a massive transfusion."}],"i":"Defining massive transfusion.","e":"The protocol is started early, using scores such as the ABC score, so that products reach the patient before the numbers are met."},{"id":"T6-109","a":4,"s":"What platelet count is generally maintained in a patient with active bleeding after trauma?","o":[{"t":"Above 5,000 per microliter","c":false,"r":"This is too low for active bleeding."},{"t":"Above 50,000 per microliter","c":true,"r":""},{"t":"Above 10,000 per microliter","c":false,"r":"This is too low for active bleeding."},{"t":"Above 500,000 per microliter","c":false,"r":"This is above the needed level."}],"i":"Setting transfusion targets.","e":"A higher target of about 100,000 is used when the brain is injured. Platelets are given early in massive transfusion."},{"id":"T6-110","a":4,"s":"Which risk is increased by prothrombin complex concentrate?","o":[{"t":"Hemolysis of red cells from antibodies","c":false,"r":"This is a risk of mismatched red cell products."},{"t":"Hyperkalemia from the potassium in the product","c":false,"r":"This is a risk of stored red cells."},{"t":"Volume overload from a large fluid volume","c":false,"r":"The product is given in a small volume."},{"t":"Thromboembolic events such as leg or lung clots","c":true,"r":""}],"i":"Knowing risks of reversal agents.","e":"The concentrate contains clotting factors that may form clots. It is used for life threatening bleeding, and the risk is weighed against the need."},{"id":"T6-111","a":4,"s":"Which components does cryoprecipitate contain?","o":[{"t":"Red cells and plasma proteins in a balanced mix","c":false,"r":"This describes whole blood."},{"t":"Platelets suspended in plasma and nothing else","c":false,"r":"This describes a platelet concentrate."},{"t":"Fibrinogen, factor VIII, factor XIII and von Willebrand factor","c":true,"r":""},{"t":"Albumin and sodium chloride in water","c":false,"r":"This describes a crystalloid and albumin mix."}],"i":"Knowing blood products.","e":"A small volume gives a large amount of fibrinogen. It is used when the fibrinogen is low during bleeding."},{"id":"T6-112","a":4,"s":"Which approach is used for an unstable patient with a femur fracture and severe lung injury?","o":[{"t":"Immediate intramedullary nailing of the femur in the first hour","c":false,"r":"A long operation adds blood loss and lung injury in an unstable patient."},{"t":"Damage control orthopedics, with external fixation then later nailing","c":true,"r":""},{"t":"Casting the femur and discharging the patient with crutches","c":false,"r":"A femur fracture needs fixation and cannot be managed this way."},{"t":"Delaying all treatment of the fracture for several weeks","c":false,"r":"Early stabilization lowers pain, bleeding and lung complications."}],"i":"Applying damage control to fractures.","e":"A quick external frame stabilizes the bone with little added stress. Definitive fixation follows when the patient is resuscitated."},{"id":"T6-113","a":4,"s":"Which combination of actions best addresses all four parts of the trauma diamond of death?","o":[{"t":"Give large volumes of cold crystalloid and sodium bicarbonate","c":false,"r":"Cold fluid worsens hypothermia and dilutes clotting factors."},{"t":"Give vasopressors alone and keep the patient cool","c":false,"r":"This does not correct the problem."},{"t":"Observe in the unit and recheck labs in the morning","c":false,"r":"This delays treatment."},{"t":"Control bleeding, give warmed blood products and calcium","c":true,"r":""}],"i":"Preventing the diamond.","e":"Bleeding control, warming, balanced products and calcium address coagulopathy, hypothermia, acidosis and low calcium together."},{"id":"T6-114","a":4,"s":"A patient with a crush injury three days ago needs rapid sequence intubation. Which paralytic should be avoided?","o":[{"t":"Rocuronium, because it can cause a rise in potassium","c":false,"r":"Rocuronium does not cause a rise in potassium."},{"t":"Vecuronium, because it can cause a rise in potassium","c":false,"r":"Vecuronium does not cause a rise in potassium."},{"t":"Succinylcholine, since it can raise the potassium","c":true,"r":""},{"t":"Cisatracurium, because it can cause a rise in potassium","c":false,"r":"Cisatracurium does not cause a rise in potassium."}],"i":"Choosing a paralytic.","e":"Injured muscle has extra receptors that release potassium after succinylcholine. A nondepolarizing drug such as rocuronium is safer."},{"id":"T6-115","a":4,"s":"A healthy adult has lost about 20 percent of blood volume. Which findings are expected?","o":[{"t":"A heart rate of 100 to 120, a narrow pulse pressure and a normal systolic pressure","c":true,"r":""},{"t":"A heart rate under 100, a wide pulse pressure and no sign of anxiety","c":false,"r":"These findings fit a small loss under 15 percent."},{"t":"A heart rate over 140, a very low pressure and confusion","c":false,"r":"These findings fit a loss over 40 percent."},{"t":"A slow heart rate, warm skin and a high pressure","c":false,"r":"These findings do not fit blood loss."}],"i":"Classifying hemorrhage.","e":"This is class II hemorrhage. The pressure is held by the body, so the heart rate and pulse pressure give the first warning."},{"id":"T6-116","a":4,"s":"A patient has a massive pulmonary embolism with shock four days after a liver laceration. Which treatment suits the bleeding risk?","o":[{"t":"Catheter therapy or embolectomy, not systemic lysis","c":true,"r":""},{"t":"Full dose systemic alteplase given through a peripheral vein","c":false,"r":"Systemic lysis carries a high risk of bleeding from the liver injury."},{"t":"Oral anticoagulation with observation on the ward","c":false,"r":"This is too slow and unsafe for a patient in shock."},{"t":"Fluid restriction with a loop diuretic to unload the heart","c":false,"r":"This reduces filling of the right heart and worsens shock."}],"i":"Treating obstructive shock from embolism.","e":"Systemic lysis is risky after recent injury. Catheter or surgical removal of the clot relieves the block with less bleeding risk."},{"id":"T6-117","a":4,"s":"Which finding helps tell neurogenic shock from hemorrhagic shock?","o":[{"t":"Cool, clammy skin with a fast heart rate and low pressure","c":false,"r":"This pattern fits hemorrhage."},{"t":"Cool skin with a narrow pulse pressure and low urine output","c":false,"r":"This pattern fits hemorrhage."},{"t":"Warm, dry skin with a slow heart rate despite low pressure","c":true,"r":""},{"t":"Warm skin with fever and a very high white count","c":false,"r":"This pattern points to infection."}],"i":"Differentiating types of shock.","e":"Loss of sympathetic tone widens vessels and slows the heart. Hemorrhage must still be ruled out because both can occur together."},{"id":"T6-118","a":4,"s":"A trauma patient with sepsis has a pressure of 80/40 and a lactate of 4.5. What initial fluid is recommended?","o":[{"t":"A crystalloid bolus of about 30 mL/kg in the first three hours","c":true,"r":""},{"t":"No fluid and an immediate vasopressor infusion at a high dose","c":false,"r":"Volume is given first unless the patient is overloaded."},{"t":"A liter of dextrose in water given over the first hour","c":false,"r":"This is not recommended for resuscitation."},{"t":"Fluid restriction to avoid pulmonary edema during the first hours","c":false,"r":"The patient needs volume."}],"i":"Using the sepsis bundle.","e":"The bundle also includes cultures, antibiotics within an hour and measurement of lactate. Fluid response is reassessed."},{"id":"T6-119","a":4,"s":"A patient in cardiogenic shock has an intra aortic balloon pump. When does the balloon inflate?","o":[{"t":"During systole, to raise the afterload on the heart","c":false,"r":"Inflation during systole would harm."},{"t":"During exhalation and not during inhalation","c":false,"r":"The balloon follows the cardiac cycle."},{"t":"During diastole, to improve coronary blood flow","c":true,"r":""},{"t":"At a random time during the cycle","c":false,"r":"Timing is linked to the ECG or the pressure waveform."}],"i":"Understanding balloon pump timing.","e":"Inflation in diastole raises the pressure in the aorta and coronary perfusion. Deflation just before systole lowers the work of the heart."},{"id":"T6-120","a":4,"s":"What position is required for a patient with an intra aortic balloon pump placed through the femoral artery?","o":[{"t":"Head of the bed at 90 degrees with the knee flexed for comfort","c":false,"r":"Flexing the hip can kink the catheter and move the balloon."},{"t":"Head of the bed up to 30 degrees, with the leg straight","c":true,"r":""},{"t":"Prone with the leg bent to protect the line","c":false,"r":"The prone position is unsafe for the catheter and the groin site."},{"t":"Trendelenburg at all times to help venous return","c":false,"r":"This position raises the work of the heart and the risk of aspiration."}],"i":"Caring for a patient with a balloon pump.","e":"The catheter must stay straight to work and to protect the leg. Pulses, color and temperature of the leg are checked often."},{"id":"T6-121","a":4,"s":"A nurse gives IV morphine to a trauma patient. When should she reassess pain and sedation?","o":[{"t":"After 8 hours have passed","c":false,"r":"This is too long."},{"t":"At the next shift change","c":false,"r":"This is too long."},{"t":"When the patient or the family calls for help","c":false,"r":"The patient may be too sedated to call."},{"t":"Within 15 to 30 minutes of the dose","c":true,"r":""}],"i":"Reassessing after drugs.","e":"Peak effect comes within minutes after an IV dose. Checking pain, sedation and breathing prevents harm."},{"id":"T6-122","a":4,"s":"A 78 year old with heart failure develops dyspnea, hypertension, distended neck veins and a high BNP during a transfusion. What is the best action?","o":[{"t":"Stop the transfusion, sit the patient upright, give a diuretic","c":true,"r":""},{"t":"Raise the rate so the unit is finished before it expires","c":false,"r":"A faster rate adds more volume to a failing heart."},{"t":"Give an antihistamine and restart the same unit","c":false,"r":"This treats an allergic reaction and not volume overload."},{"t":"Lay the patient flat with the legs raised and add fluid","c":false,"r":"This worsens pulmonary congestion."}],"i":"Managing TACO.","e":"Circulatory overload is common in older patients and those with heart or kidney disease. Slow rates and one unit at a time lower the risk."},{"id":"T6-123","a":4,"s":"A radiology overread the next day finds a rib fracture not noted earlier. What should the team do?","o":[{"t":"Notify the provider, tell the patient and document the plan","c":true,"r":""},{"t":"Set it aside since the patient has no pain from the fracture","c":false,"r":"Missed findings must be addressed."},{"t":"Change the earlier report quietly so the record looks complete","c":false,"r":"Records must show the true course."},{"t":"Wait until the patient returns to the clinic","c":false,"r":"This delays care."}],"i":"Handling missed injuries.","e":"Missed injuries are found by repeat exams and overreads. The patient is told and the plan is updated."},{"id":"T6-124","a":4,"s":"Which change in creatinine meets the criteria for acute kidney injury?","o":[{"t":"A fall of 0.3 mg/dL over a week","c":false,"r":"A fall is not injury."},{"t":"A rise of 0.01 mg/dL in a month","c":false,"r":"This is too small."},{"t":"A rise of at least 0.3 mg/dL in 48 hours","c":true,"r":""},{"t":"A stable value of 1.0 mg/dL for days","c":false,"r":"This is stable."}],"i":"Defining AKI.","e":"A rise of 0.3 mg/dL in 48 hours or low urine output defines stage 1. Early treatment of the cause protects the kidneys."},{"id":"T6-125","a":4,"s":"Which measure helps prevent surgical site infection?","o":[{"t":"Clip hair when needed, keep the patient warm and control glucose","c":true,"r":""},{"t":"Shave the area with a razor on the night before surgery","c":false,"r":"Shaving causes small skin cuts that raise the risk of infection."},{"t":"Keep the patient cool in the operating room to slow bacteria","c":false,"r":"Cold raises the risk of infection and impairs healing."},{"t":"Allow glucose to rise to improve healing of the wound","c":false,"r":"High glucose raises the risk of infection."}],"i":"Preventing surgical site infection.","e":"The bundle also includes antibiotics within one hour before incision and skin antisepsis. Warmth and glucose control support the body's defenses."},{"id":"T6-126","a":4,"s":"Which measure helps prevent delirium in an ICU trauma patient?","o":[{"t":"Continuous deep sedation with benzodiazepines through the night","c":false,"r":"These drugs increase delirium."},{"t":"Constant bright light and noise through the day and the night","c":false,"r":"This disturbs sleep."},{"t":"Restraints for all patients to keep the lines and tubes safe","c":false,"r":"These increase delirium."},{"t":"Early mobility, glasses, hearing aids and sleep protection","c":true,"r":""}],"i":"Preventing delirium.","e":"The bundle focuses on pain control, light sedation, early movement and orientation."},{"id":"T6-127","a":4,"s":"When does delirium tremens typically begin after the last drink in alcohol withdrawal?","o":[{"t":"Within 15 minutes of the last drink","c":false,"r":"This is too early."},{"t":"After 3 weeks of abstinence","c":false,"r":"This is too late."},{"t":"About 48 to 96 hours after the last drink","c":true,"r":""},{"t":"After a month of abstinence","c":false,"r":"This is too late."}],"i":"Knowing the timing of withdrawal.","e":"Seizures come earlier, at 12 to 48 hours. Delirium tremens carries a risk of death and needs ICU care."},{"id":"T6-128","a":4,"s":"Which intervention may help trauma survivors cope after discharge?","o":[{"t":"Advice to avoid talking about the injury with anyone","c":false,"r":"Avoidance can worsen distress."},{"t":"Isolation from family and friends","c":false,"r":"Support is protective."},{"t":"Peer support from other survivors and referral","c":true,"r":""},{"t":"No follow up after discharge","c":false,"r":"Follow up helps find problems."}],"i":"Supporting recovery.","e":"Peer programs reduce isolation. Screening for depression and posttraumatic stress is done during follow up."},{"id":"T6-129","a":4,"s":"Which tool is commonly used to measure a patient's independence in daily activities during rehabilitation?","o":[{"t":"The Glasgow Coma Scale","c":false,"r":"This scale measures level of consciousness."},{"t":"The Braden Scale","c":false,"r":"This scale measures risk of pressure injury."},{"t":"The Injury Severity Score","c":false,"r":"This score measures the severity of injury."},{"t":"The Functional Independence Measure","c":true,"r":""}],"i":"Measuring function in rehabilitation.","e":"The measure scores self care, mobility and thinking. The scores guide therapy goals and discharge planning."},{"id":"T6-130","a":4,"s":"After a patient is declared brain dead and the family is considering donation, what should the nurse do?","o":[{"t":"Continue ventilation and support until the procurement team evaluates","c":true,"r":""},{"t":"Stop the ventilator at once and remove the breathing tube from the patient","c":false,"r":"This ends the donation option."},{"t":"Remove all lines and monitors, since the patient is declared dead","c":false,"r":"Support is needed to preserve organs."},{"t":"Move the patient to a ward without monitoring, to give the family quiet time","c":false,"r":"The patient needs ICU support."}],"i":"Supporting potential donors.","e":"Organ function must be maintained. Pressure, oxygen, temperature and sodium are controlled."},{"id":"T6-131","a":4,"s":"How does a POLST form differ from a living will?","o":[{"t":"It is a document that names a health care agent alone","c":false,"r":"This describes a durable power of attorney for health care."},{"t":"It is a set of medical orders across care settings","c":true,"r":""},{"t":"It is a billing form completed at discharge","c":false,"r":"The form is not used for billing."},{"t":"It applies after death to guide organ donation","c":false,"r":"The form guides treatment while the patient is alive."}],"i":"Understanding advance care documents.","e":"A POLST is signed by a clinician and travels with the patient. A living will states wishes but is not a medical order."},{"id":"T6-132","a":4,"s":"When is it appropriate to ask a family member to leave a resuscitation?","o":[{"t":"At no time, since the family might disrupt the care","c":false,"r":"The team leader can ask them to leave."},{"t":"As soon as the patient is intubated and the airway is secure","c":false,"r":"Presence is allowed if the family wishes."},{"t":"When a family member disrupts care, as the team leader decides","c":true,"r":""},{"t":"When the nurse feels uncomfortable with the family present","c":false,"r":"The team leader makes the decision."}],"i":"Managing family presence.","e":"Presence is supported, and the support person stays with the family. Safety and care come first."},{"id":"T6-133","a":4,"s":"Which model divides an injury event into pre event, event and post event phases?","o":[{"t":"The Glasgow Outcome Scale","c":false,"r":"This scale measures recovery after brain injury."},{"t":"The SBAR format","c":false,"r":"This format structures a clinical report."},{"t":"The Pareto chart","c":false,"r":"This chart ranks causes by their frequency."},{"t":"The Haddon matrix","c":true,"r":""}],"i":"Using injury prevention models.","e":"The matrix lists the host, the agent and the environment in each phase. It helps plan actions to prevent the event, lessen the injury and improve care."},{"id":"T6-134","a":4,"s":"Which crash finding meets the mechanism criteria for trauma center triage?","o":[{"t":"A minor dent in the bumper with no damage to the passenger space","c":false,"r":"This is not a mechanism criterion."},{"t":"Intrusion of more than 12 inches into the occupant space","c":true,"r":""},{"t":"A cracked windshield with no intrusion","c":false,"r":"This is not a mechanism criterion."},{"t":"A low speed scrape with no injury","c":false,"r":"This is not a mechanism criterion."}],"i":"Using triage criteria.","e":"Large intrusion, ejection and death in the same vehicle are high risk. They raise the need for trauma center care."},{"id":"T6-135","a":4,"s":"What does the MIST report given by prehospital providers include?","o":[{"t":"Medication, insurance, symptoms and time","c":false,"r":"This is not the meaning."},{"t":"Money, identity, speed and transport","c":false,"r":"This is not the meaning."},{"t":"Monitor, IV, suction and tube","c":false,"r":"This is not the meaning."},{"t":"Mechanism, injuries, signs and treatment","c":true,"r":""}],"i":"Using a handoff tool.","e":"MIST gives the trauma team a short, structured report on arrival."},{"id":"T6-136","a":4,"s":"Before moving a ventilated patient to CT, how much portable oxygen should be available?","o":[{"t":"A few minutes, since the trip to the scanner is short","c":false,"r":"This is not enough."},{"t":"Enough for the transport time plus a reserve, often double","c":true,"r":""},{"t":"None, since the CT room has wall oxygen outlets","c":false,"r":"Pipes may not be available during the trip."},{"t":"The exact amount needed for the trip, with no extra tanks","c":false,"r":"Delays can occur."}],"i":"Preparing for transport.","e":"Equipment, batteries, drugs and oxygen are checked. Delays are common."},{"id":"T6-137","a":4,"s":"A hospital cannot provide neurosurgical care for a patient with a severe head injury. What is the correct approach?","o":[{"t":"Wait until a full set of studies and labs is done first","c":false,"r":"Delay worsens outcomes."},{"t":"Keep the patient until the condition has improved enough to move","c":false,"r":"The patient needs a higher level of care."},{"t":"Arrange transfer without delay for tests that do not change care","c":true,"r":""},{"t":"Discharge the patient to home with instructions to return later","c":false,"r":"This is unsafe."}],"i":"Transferring to a higher level.","e":"Transfer is not delayed for tests that do not change care. Images and records go along."},{"id":"T6-138","a":4,"s":"A patient is discharged with an opioid prescription. Which teaching is essential?","o":[{"t":"Share tablets with family members who have similar pain","c":false,"r":"This is unsafe."},{"t":"Take with alcohol for better relief","c":false,"r":"This can cause fatal depression of breathing."},{"t":"Do not drive, store the tablets safely and dispose of extras","c":true,"r":""},{"t":"Keep the bottle in an open place for easy access","c":false,"r":"Storage should be secure."}],"i":"Teaching safe use.","e":"Opioids cause sedation and carry a risk of misuse. Teaching covers storage, disposal and use of the lowest dose."},{"id":"T6-139","a":4,"s":"A patient is going home after nonoperative management of a liver injury. Which instruction is correct?","o":[{"t":"Return to contact sports within a week if there is no pain","c":false,"r":"Healing takes weeks and late bleeding can occur."},{"t":"Avoid heavy lifting, and return for belly pain or fainting","c":true,"r":""},{"t":"Take ibuprofen regularly for pain relief, with food","c":false,"r":"Anti inflammatory drugs may raise the risk of bleeding."},{"t":"No follow up is needed if the patient feels well","c":false,"r":"Follow up detects late bleeding and complications."}],"i":"Teaching safe recovery.","e":"Late bleeding can follow injury to the liver or spleen. Clear return precautions save lives."},{"id":"T6-140","a":4,"s":"A patient will go home with a negative pressure dressing. What must be arranged before discharge?","o":[{"t":"Caregiver training with return demonstration, supplies and visits","c":true,"r":""},{"t":"Nothing, since the device is simple and the caregiver will learn it","c":false,"r":"Training and supplies are needed."},{"t":"A single verbal explanation of the device from the discharge nurse","c":false,"r":"This does not confirm skill."},{"t":"A plan to remove the device at home on the day after discharge","c":false,"r":"This is unsafe without training."}],"
