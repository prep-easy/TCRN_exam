es a lasting effect."},{"id":"T1-112","a":4,"s":"A trauma patient is bleeding from the abdomen and has no head injury. Which blood pressure approach is typical until bleeding is controlled?","o":[{"t":"A systolic target of 160 mmHg to protect organs","c":false,"r":"A higher pressure can increase bleeding."},{"t":"Permissive hypotension with a lower target","c":true,"r":""},{"t":"No blood pressure monitoring until surgery starts","c":false,"r":"Monitoring is essential."},{"t":"Vasopressors as the first line treatment","c":false,"r":"Blood is the treatment."}],"i":"Using permissive hypotension.","e":"A lower pressure limits bleeding until it is controlled. This does not apply to patients with brain or spinal cord injury."},{"id":"T1-113","a":4,"s":"A patient is cold, acidotic, and bleeding in the operating room. Which action best helps to break the lethal cycle?","o":[{"t":"Cool the patient down to slow the bleeding","c":false,"r":"Cold worsens clotting."},{"t":"Give large volumes of cold normal saline","c":false,"r":"This dilutes the clotting factors."},{"t":"Warm the fluids and room, and give balanced blood","c":true,"r":""},{"t":"Stop all blood products until labs return","c":false,"r":"This worsens the bleeding."}],"i":"Breaking the lethal triad.","e":"Warmth, blood, and calcium restore clotting. Cold, acidosis, and bleeding feed each other."},{"id":"T1-114","a":4,"s":"A patient with a heart rate of 130 and a systolic pressure of 92 needs intubation. Which preparation is appropriate?","o":[{"t":"Induce at once with a full dose of propofol","c":false,"r":"This can drop the pressure."},{"t":"Delay the airway and give oral fluids","c":false,"r":"The patient needs a secure airway."},{"t":"Give blood and have a vasopressor ready","c":true,"r":""},{"t":"Give a large sedative dose and skip monitoring","c":false,"r":"This is unsafe."}],"i":"Resuscitating before intubating.","e":"The shock index is above 1. Restore volume and use reduced doses of drugs."},{"id":"T1-115","a":4,"s":"A patient has a heart rate of 124, a narrow pulse pressure, cool clammy skin, and a capillary refill of 4 seconds. Which type of shock is this?","o":[{"t":"Neurogenic shock","c":false,"r":"This causes warm skin and a slow pulse."},{"t":"Hypovolemic shock","c":true,"r":""},{"t":"Obstructive shock","c":false,"r":"This causes distended neck veins."},{"t":"Septic shock state","c":false,"r":"This causes warm skin early."}],"i":"Naming hypovolemic shock.","e":"A fast pulse, a narrow pulse pressure, and cool skin show blood loss."},{"id":"T1-116","a":4,"s":"Which laboratory value best shows that tissue perfusion is inadequate in a trauma patient?","o":[{"t":"A low white cell count","c":false,"r":"This does not show perfusion."},{"t":"A high albumin level","c":false,"r":"This does not show perfusion."},{"t":"A low platelet count alone","c":false,"r":"This shows clotting risk."},{"t":"An elevated lactate level","c":true,"r":""}],"i":"Using lactate.","e":"Cells that lack oxygen make lactate. A high level or a base deficit shows ongoing shock."},{"id":"T1-117","a":4,"s":"A ventilated patient suddenly has a blood pressure of 68/40, high airway pressures, and absent breath sounds on the right. What is the priority?","o":[{"t":"Increasing the tidal volume on the ventilator","c":false,"r":"This worsens the tension."},{"t":"Needle or finger decompression of the chest","c":true,"r":""},{"t":"A repeat chest x-ray before acting","c":false,"r":"This delays care."},{"t":"Giving a sedative and observing the patient","c":false,"r":"This does not treat the cause."}],"i":"Treating a ventilator related tension pneumothorax.","e":"Positive pressure can turn a small pneumothorax into a tension pneumothorax."},{"id":"T1-118","a":4,"s":"Three days after a femur fracture, a patient has sudden shortness of breath, a fast heart rate, and clear lungs. Which problem should the nurse suspect?","o":[{"t":"Pulmonary embolism from fat or clot","c":true,"r":""},{"t":"Pulmonary contusion from the injury","c":false,"r":"This worsens in the first two days with abnormal x-ray findings."},{"t":"Simple pneumothorax from a rib","c":false,"r":"This causes absent breath sounds on one side."},{"t":"Pneumonia from aspiration of food","c":false,"r":"This causes abnormal breath sounds."}],"i":"Suspecting an embolus.","e":"Immobility and fracture raise the risk of clots. Obstructive shock follows a large clot in the lung."},{"id":"T1-119","a":4,"s":"On day five, a patient has a temperature of 39 degrees Celsius, warm flushed skin, bounding pulses, and a blood pressure of 78/40 after fluids. What does the nurse expect?","o":[{"t":"A norepinephrine infusion and cultures","c":true,"r":""},{"t":"Stopping all fluids and drugs until morning","c":false,"r":"The patient is in shock."},{"t":"Giving a beta blocker to slow the pulse","c":false,"r":"This lowers the pressure further."},{"t":"Discharge planning for the next morning","c":false,"r":"The patient is unstable."}],"i":"Treating septic shock.","e":"Warm skin and bounding pulses with hypotension suggest sepsis. Cultures, antibiotics, and a vasopressor follow."},{"id":"T1-120","a":4,"s":"A patient with a blunt cardiac injury has crackles, distended neck veins, cool skin, and a blood pressure of 80/50. What should the nurse anticipate?","o":[{"t":"A large crystalloid bolus of saline","c":false,"r":"This can worsen pulmonary edema."},{"t":"A pericardiocentesis at the bedside","c":false,"r":"This is for tamponade."},{"t":"An inotrope and careful fluid limits","c":true,"r":""},{"t":"A vasodilator to lower the pressure more","c":false,"r":"The patient is already hypotensive."}],"i":"Supporting the failing heart.","e":"The pump is failing, not empty. Inotropes improve output, and overload makes things worse."},{"id":"T1-121","a":4,"s":"A patient's blood pressure rises after two liters of fluid, then falls again. What does this show?","o":[{"t":"A normal and expected response to fluids","c":false,"r":"A good response stays stable."},{"t":"Ongoing bleeding, so repeat the primary survey","c":true,"r":""},{"t":"Improved control of the blood loss overall","c":false,"r":"Falling pressure means worsening."},{"t":"The need to stop all vital sign monitoring","c":false,"r":"Monitoring must continue."}],"i":"Reading a transient response.","e":"A transient responder is still bleeding. Repeat the survey, call the surgeon, and give blood."},{"id":"T1-122","a":4,"s":"Which patient is at highest risk of transfusion associated circulatory overload?","o":[{"t":"A 25 year old with a leg fracture receiving one unit slowly","c":false,"r":"The risk is lower."},{"t":"A 40 year old with no illness receiving one unit","c":false,"r":"The risk is low."},{"t":"A child with a minor cut who has lost little blood","c":false,"r":"The child does not need blood."},{"t":"An 82 year old with heart failure given two units fast","c":true,"r":""}],"i":"Identifying overload risk.","e":"Older adults and patients with heart or kidney disease cannot handle a fast volume. Slow the rate and watch."},{"id":"T1-123","a":4,"s":"On day two, an alert patient reports wrist pain that was not noticed earlier. What is the likely explanation?","o":[{"t":"The tertiary exam found a missed injury","c":true,"r":""},{"t":"The wrist injury happened in the hospital","c":false,"r":"Missed injuries are more likely."},{"t":"The pain is psychological and needs no workup","c":false,"r":"This should not be assumed."},{"t":"The pain needs no action or testing now","c":false,"r":"A fracture could be missed."}],"i":"Understanding the tertiary survey.","e":"Distracting injuries and sedation hide pain. A repeat exam within 24 hours finds many of them."},{"id":"T1-124","a":4,"s":"A patient with crush injuries has a urine output of 0.3 mL/kg/hour and a rising creatinine. Which action protects the kidneys?","o":[{"t":"Maintain volume and avoid nephrotoxic drugs","c":true,"r":""},{"t":"Give a nonsteroidal drug for the pain","c":false,"r":"These can harm the kidney."},{"t":"Restrict all fluids to protect the heart","c":false,"r":"Volume protects the kidney."},{"t":"Order an extra contrast study of the abdomen","c":false,"r":"Contrast can harm the kidney."}],"i":"Preventing kidney injury.","e":"Low flow and myoglobin injure the kidney. Keep the volume, check the drug list, and watch potassium."},{"id":"T1-125","a":4,"s":"A patient with a carotid artery tear has a sudden facial droop and slurred speech. What is the priority?","o":[{"t":"Give a sedative and let the patient sleep it off","c":false,"r":"This hides the signs."},{"t":"Wait for the family to confirm the new signs","c":false,"r":"Time is critical."},{"t":"Call the stroke alert and note the onset","c":true,"r":""},{"t":"Give aspirin without waiting for an order","c":false,"r":"This needs medical direction."}],"i":"Responding to a stroke.","e":"Treatment options depend on the time of onset. Call the team and record the time."},{"id":"T1-126","a":4,"s":"A patient on day six has a urinary catheter, a fever, and suprapubic pain. What is the best action?","o":[{"t":"Leave the catheter in to measure the urine output","c":false,"r":"It may be the source."},{"t":"Irrigate the bladder with an antibiotic solution","c":false,"r":"This is not routine."},{"t":"Review need, remove the catheter, send a culture","c":true,"r":""},{"t":"Give an antipyretic and recheck in a day","c":false,"r":"The cause must be treated."}],"i":"Responding to a catheter infection.","e":"Early removal is the main prevention and treatment. A culture guides therapy."},{"id":"T1-127","a":4,"s":"A confused patient in the intensive care unit tries to climb out of bed. Which intervention best prevents a fall?","o":[{"t":"Apply wrist restraints and leave the patient alone","c":false,"r":"Restraints increase agitation and injury."},{"t":"Use a bed alarm, a toileting schedule, and rounding","c":true,"r":""},{"t":"Raise all four side rails and leave the room","c":false,"r":"This increases the risk of climbing."},{"t":"Give a sedative every hour to prevent climbing","c":false,"r":"This increases confusion."}],"i":"Preventing falls.","e":"Meeting needs and monitoring reduce risk. Restraints are a last resort."},{"id":"T1-128","a":4,"s":"Two weeks after a crash, a patient has nightmares and avoids hospital visits. What is the best nursing action?","o":[{"t":"Tell the patient to try to forget the event","c":false,"r":"This is not helpful."},{"t":"Reassure the patient and give no referral","c":false,"r":"Support may be needed."},{"t":"Warn the patient to avoid talking about it","c":false,"r":"Avoidance can worsen symptoms."},{"t":"Screen for stress symptoms and refer","c":true,"r":""}],"i":"Recognizing posttraumatic stress.","e":"Screening and early referral help. Trauma informed care offers information and choices."},{"id":"T1-129","a":4,"s":"Which team member helps a patient relearn dressing and bathing after a hand injury?","o":[{"t":"The occupational therapist, who trains daily skills","c":true,"r":""},{"t":"The respiratory therapist, who supports breathing","c":false,"r":"This role supports breathing."},{"t":"The dietitian, who supports nutrition","c":false,"r":"This role supports nutrition."},{"t":"The pharmacist, who manages medication","c":false,"r":"This role supports medication."}],"i":"Knowing team roles.","e":"Occupational therapists focus on daily activities and hand function."},{"id":"T1-130","a":4,"s":"A patient has been declared brain dead. The family asks whether care will continue. What is the best response?","o":[{"t":"Say the patient might still recover if care continues","c":false,"r":"This is untrue."},{"t":"Say that the bedside nurse will make the donation decision alone","c":false,"r":"The procurement team handles this."},{"t":"Explain that death was declared and involve the donation team","c":true,"r":""},{"t":"Stop all care at once without explaining anything to them","c":false,"r":"Support may be needed for donation."}],"i":"Supporting the family after death by neurologic criteria.","e":"The family needs a clear explanation and support. Trained staff handle the donation conversation."},{"id":"T1-131","a":4,"s":"Which document names a person to make health decisions when the patient cannot?","o":[{"t":"A living will that states wishes alone","c":false,"r":"This states wishes but does not name a person."},{"t":"A discharge summary from the hospital","c":false,"r":"This is a record of care."},{"t":"A consent form for a single surgery","c":false,"r":"This applies to one procedure."},{"t":"A health care power of attorney","c":true,"r":""}],"i":"Knowing advance directives.","e":"A health care proxy acts when the patient lacks capacity. A living will states wishes."},{"id":"T1-132","a":4,"s":"A family asks to be at the bedside during a resuscitation. Which action is best?","o":[{"t":"Offer presence with a support person","c":true,"r":""},{"t":"Deny presence without giving a reason","c":false,"r":"Many families benefit."},{"t":"Allow them to stay with no staff support","c":false,"r":"They need guidance."},{"t":"Ask them to wait in the parking area","c":false,"r":"This is not respectful."}],"i":"Supporting family presence.","e":"A support person explains what is happening and escorts them if needed."},{"id":"T1-133","a":4,"s":"A hospital gives out child car seats and teaches installation. Which level of prevention is this?","o":[{"t":"Secondary prevention","c":false,"r":"This reduces the harm after injury."},{"t":"Tertiary prevention","c":false,"r":"This limits disability."},{"t":"Primary prevention","c":true,"r":""},{"t":"Quaternary prevention","c":false,"r":"This is not used for injury programs."}],"i":"Classifying prevention.","e":"Primary prevention stops the injury from happening."},{"id":"T1-134","a":4,"s":"For a patient with a penetrating torso wound, which prehospital approach is preferred?","o":[{"t":"A long scene time to start several IV lines","c":false,"r":"Delay worsens bleeding."},{"t":"Transport to the nearest primary care clinic","c":false,"r":"A trauma center is needed."},{"t":"Wait for the family to arrive at the scene","c":false,"r":"This delays care."},{"t":"Brief scene time, bleeding control, and transport","c":true,"r":""}],"i":"Choosing prehospital care.","e":"Penetrating torso injuries need surgery, not field treatment."},{"id":"T1-135","a":4,"s":"Which finding calls for transport to the highest level trauma center under field triage guidance?","o":[{"t":"A small abrasion on the left elbow","c":false,"r":"An elbow abrasion does not meet any field triage criterion."},{"t":"A Glasgow Coma Scale score of 13 or less","c":true,"r":""},{"t":"A sprained wrist with mild swelling","c":false,"r":"A sprained wrist is not a physiologic or anatomic criterion."},{"t":"A shallow cut on the finger with bleeding","c":false,"r":"A shallow finger cut is controlled easily and is not a criterion."}],"i":"Applying field triage.","e":"A low GCS, low pressure, or abnormal breathing mark a high risk patient."},{"id":"T1-136","a":4,"s":"A patient will go from the emergency department to CT. Which step makes the move safest?","o":[{"t":"Send the patient with a family member alone","c":false,"r":"This is unsafe."},{"t":"Send a monitor, airway equipment, and a nurse","c":true,"r":""},{"t":"Send the monitor but leave the airway kit","c":false,"r":"Airway equipment is needed."},{"t":"Send a transport aide with no nurse","c":false,"r":"A nurse is needed."}],"i":"Preparing an intrafacility transfer.","e":"Planning and handoff reduce events during transport."},{"id":"T1-137","a":4,"s":"Which information is most important in the handoff to a receiving trauma center?","o":[{"t":"The patient's insurance and billing details","c":false,"r":"This is not critical."},{"t":"The hospital's visiting hours and parking","c":false,"r":"This is not critical."},{"t":"The injuries, treatments, and blood given","c":true,"r":""},{"t":"The names of all the nurses on the shift","c":false,"r":"This is not critical."}],"i":"Giving a handoff.","e":"The receiving team needs the trends and the times of treatments."},{"id":"T1-138","a":4,"s":"Which warning signs should the nurse teach a patient to report after discharge with a sutured wound?","o":[{"t":"Spreading redness, drainage, pain, or fever","c":true,"r":""},{"t":"Mild itching and tightness as it heals","c":false,"r":"This is expected."},{"t":"A small scab forming at the edge as it heals","c":false,"r":"This is expected."},{"t":"Slight tenderness around the wound for a day","c":false,"r":"This is expected."}],"i":"Teaching warning signs.","e":"Signs of infection need prompt return."},{"id":"T1-139","a":4,"s":"A patient cannot afford the prescribed medicine and has no way to get to the follow up visit. Which referral is most helpful?","o":[{"t":"A dietitian for diet counseling","c":false,"r":"This does not address transport or cost."},{"t":"Respiratory therapy for breathing care","c":false,"r":"This does not address transport or cost."},{"t":"A chaplain for spiritual support","c":false,"r":"This does not address transport or cost."},{"t":"Case management or social work","c":true,"r":""}],"i":"Identifying barriers.","e":"A case manager arranges transport and assistance with medicines."},{"id":"T1-140","a":4,"s":"A patient will return to a home with steps and no help. What is the best action before discharge?","o":[{"t":"Request a therapy evaluation and a home safety plan","c":true,"r":""},{"t":"Discharge as planned and assume that all will be well","c":false,"r":"Safety is not assured."},{"t":"Delay the discharge for weeks with no clear reason","c":false,"r":"This is not needed."},{"t":"Cancel the follow up visits after discharge","c":false,"r":"The patient needs follow up."}],"i":"Assessing home readiness.","e":"Therapy can test stairs and equipment needs before the patient leaves."},{"id":"T1-141","a":5,"s":"During a mass casualty incident, an adult is not breathing after the airway is opened. How is this patient tagged under START?","o":[{"t":"Red, immediate care","c":false,"r":"Red patients breathe after the airway is opened."},{"t":"Yellow, delayed care","c":false,"r":"Yellow patients have adequate breathing."},{"t":"Green, minor care","c":false,"r":"Green patients can walk."},{"t":"Black, expectant","c":true,"r":""}],"i":"Applying START triage.","e":"An adult who does not breathe after repositioning is tagged black."},{"id":"T1-142","a":5,"s":"In a chemical incident, where does decontamination take place?","o":[{"t":"In the hot zone where the release occurred","c":false,"r":"This is where the hazard is."},{"t":"In the warm zone between the other zones","c":true,"r":""},{"t":"In the cold zone beside the other patients","c":false,"r":"This spreads the hazard."},{"t":"In the waiting room near the entrance","c":false,"r":"This spreads the hazard."}],"i":"Knowing decontamination zones.","e":"The warm zone holds the decontamination line. Staff wear the right protective equipment."},{"id":"T1-143","a":5,"s":"A review shows that CT scans for unstable patients are often delayed by more than an hour. What is the best performance improvement action?","o":[{"t":"Warn the staff on the night shift about delays","c":false,"r":"Systems cause most delays."},{"t":"Set the finding aside because it affects few patients","c":false,"r":"This would not improve care."},{"t":"Move the CT scanner to a remote building","c":false,"r":"This is not a fix."},{"t":"Create a protocol for scanner access and track times","c":true,"r":""}],"i":"Choosing a system fix.","e":"Quality programs use protocols and monitoring and close the loop."},{"id":"T1-144","a":5,"s":"What is the main purpose of a trauma registry?","o":[{"t":"To bill patients and insurers for care","c":false,"r":"This is the role of billing."},{"t":"To store the images from all CT scans","c":false,"r":"This is the role of imaging systems."},{"t":"To collect data for quality review","c":true,"r":""},{"t":"To schedule the staff for each shift","c":false,"r":"This is not its purpose."}],"i":"Understanding registries.","e":"Data from the registry shows trends and compares outcomes with national programs."},{"id":"T1-145","a":5,"s":"A trauma program wants to share results with EMS crews who brought in patients. Which activity does this describe?","o":[{"t":"Outcome follow up and feedback to crews","c":true,"r":""},{"t":"A mortality review of deaths alone","c":false,"r":"This reviews deaths."},{"t":"Disaster drills and exercises for staff","c":false,"r":"These test the plan."},{"t":"Event reporting by staff members","c":false,"r":"This reports errors."}],"i":"Closing the loop with referring teams.","e":"Feedback helps crews learn from the outcomes of their care."},{"id":"T1-146","a":5,"s":"A unit wants to change a protocol based on new research. Which step comes first in an evidence based practice project?","o":[{"t":"Change the protocol at once","c":false,"r":"Evidence should be reviewed first."},{"t":"Define a clear clinical question","c":true,"r":""},{"t":"Ask staff to guess the best practice","c":false,"r":"Opinion is not evidence."},{"t":"Wait for another hospital to act","c":false,"r":"This delays improvement."}],"i":"Starting an evidence project.","e":"A clear question guides the search for evidence. Appraisal, a pilot, and evaluation follow."},{"id":"T1-147","a":5,"s":"The nurse tells the physician, \"The patient needs a CT of the abdomen now, and I request an order.\" Which part of SBAR is this?","o":[{"t":"Situation of the patient now","c":false,"r":"This states the problem."},{"t":"Background of the patient history","c":false,"r":"This gives the history."},{"t":"Recommendation for the next step","c":true,"r":""},{"t":"Assessment by the nurse at bedside","c":false,"r":"This gives the nurse's conclusion."}],"i":"Using SBAR.","e":"The recommendation states what the nurse wants."},{"id":"T1-148","a":5,"s":"A nurse sees a coworker give the wrong dose of a drug. The patient is not harmed. What is the best action?","o":[{"t":"Complete a factual event report in the system","c":true,"r":""},{"t":"Say nothing, because there was no harm","c":false,"r":"Near misses reveal system problems."},{"t":"Note in the chart that a report was filed","c":false,"r":"The chart should not mention the report."},{"t":"Post about it on a social media page","c":false,"r":"This breaks privacy rules."}],"i":"Reporting events.","e":"Reports are factual and non punitive. They help find system causes."},{"id":"T1-149","a":5,"s":"A police officer asks for the name and condition of a gunshot victim. What should the nurse do?","o":[{"t":"Follow policy and release what the law allows","c":true,"r":""},{"t":"Release the whole record on police request","c":false,"r":"This breaks privacy rules."},{"t":"Refuse contact with police in the department","c":false,"r":"Some reports are required."},{"t":"Share details with the media for public safety","c":false,"r":"This breaks privacy rules."}],"i":"Applying HIPAA.","e":"Release the minimum needed and follow state law and policy."},{"id":"T1-150","a":5,"s":"A smaller hospital asks a trauma center with capacity to accept an unstable patient. What does EMTALA require of the trauma center?","o":[{"t":"Refuse the patient because there is no insurance","c":false,"r":"Insurance cannot block a transfer."},{"t":"Refuse because the unit is busy, even with beds open","c":false,"r":"A hospital with capacity must accept."},{"t":"Accept the patient, as it has the capacity","c":true,"r":""},{"t":"Delay acceptance until the paperwork is complete","c":false,"r":"Delay can harm the patient."}],"i":"Applying EMTALA to specialty centers.","e":"Hospitals with specialized care and capacity cannot refuse an appropriate transfer."},{"id":"T2-1","a":0,"s":"A patient with a severe head injury has stiff arms extended and turned inward, with the legs also extended, in response to pain. How should the nurse interpret this posture?","o":[{"t":"Decorticate posturing from injury above the midbrain","c":false,"r":"Decorticate posturing shows flexed arms held against the chest, not extended arms."},{"t":"Decerebrate posturing from a midbrain or pons injury","c":true,"r":""},{"t":"A normal withdrawal response from a painful stimulus","c":false,"r":"Normal withdrawal pulls the limb away from the pain, not stiff extension."},{"t":"A seizure that needs a loading dose of medicine now","c":false,"r":"Seizures cause rhythmic jerking, not a sustained stiff extension of all limbs."}],"i":"Interpreting abnormal motor responses on the Glasgow Coma Scale.","e":"Extension of the arms and legs to pain is decerebrate posturing and scores 2 on the motor scale. It points to a brainstem injury and a poor outlook, so the nurse reports it right away."},{"id":"T2-2","a":0,"s":"Which patient most clearly meets the Brain Trauma Foundation indication for intracranial pressure monitoring?","o":[{"t":"A patient with a GCS score of 7 and an abnormal head CT","c":true,"r":""},{"t":"A patient with a GCS score of 14 and a scalp laceration","c":false,"r":"A mild injury with a high score does not need an invasive monitor."},{"t":"A patient with a GCS score of 15 and brief loss of consciousness","c":false,"r":"This describes a concussion, which is managed with observation."},{"t":"A patient with a GCS score of 13 and a normal head CT","c":false,"r":"A moderate injury with a normal scan is observed with serial exams."}],"i":"Knowing when intracranial pressure monitoring is indicated.","e":"Monitoring is advised for a salvageable patient with a score of 3 to 8 and an abnormal CT. It is also considered with a normal CT if two of three risk factors are present: age over 40, posturing, or low systolic pressure."},{"id":"T2-3","a":0,"s":"A patient with a brain injury is receiving 3 percent saline. Which laboratory values should the nurse watch most closely?","o":[{"t":"Serum calcium and magnesium levels","c":false,"r":"These are not the targets that limit hypertonic saline therapy."},{"t":"Serum sodium and osmolality levels","c":true,"r":""},{"t":"Hemoglobin and platelet count levels","c":false,"r":"These do not show the effect of a hypertonic solution."},{"t":"Blood urea nitrogen and bilirubin levels","c":false,"r":"These do not guide the dose of hypertonic saline."}],"i":"Monitoring hyperosmolar therapy for raised intracranial pressure.","e":"Hypertonic saline lowers pressure by drawing water out of the brain. Too much sodium causes harm to the brain and kidneys, so sodium and osmolality are checked often, and the dose is held if the sodium rises too high."},{"id":"T2-4","a":0,"s":"Two days after a severe head injury, a patient has urine output of 400 mL per hour that is pale and watery, with a serum sodium of 152 mEq/L. Which condition is most likely?","o":[{"t":"Syndrome of inappropriate antidiuretic hormone secretion","c":false,"r":"This causes low sodium and concentrated urine in small amounts."},{"t":"Acute tubular necrosis from the kidney injury","c":false,"r":"This usually causes low urine output, not a large amount of dilute urine."},{"t":"Normal diuresis after the patient received mannitol","c":false,"r":"Mannitol does not explain the rising sodium and very dilute urine."},{"t":"Diabetes insipidus from loss of antidiuretic hormone","c":true,"r":""}],"i":"Recognizing endocrine complications of brain injury.","e":"Injury to the pituitary or hypothalamus stops antidiuretic hormone release. The patient loses water, so the urine is dilute and the sodium climbs. Desmopressin and careful fluid replacement are the usual treatment."},{"id":"T2-5","a":0,"s":"A patient with a head injury has a large pupil on the right that reacts poorly to light and weakness on the left side of the body. Which process explains the pupil?","o":[{"t":"Direct damage to the left optic nerve from the blow","c":false,"r":"This would affect vision on one side, not a fixed large pupil with weakness."},{"t":"A side effect of the opioid given earlier","c":false,"r":"Opioids make the pupils small and equal, not large on one side."},{"t":"Pressure on the third cranial nerve from uncal herniation","c":true,"r":""},{"t":"A normal difference in pupil size between the eyes","c":false,"r":"A new change with weakness is never a normal variation."}],"i":"Linking pupil changes to herniation.","e":"The temporal lobe pushes down on the third cranial nerve, which controls pupil constriction. The pupil on the same side as the bleed becomes large and sluggish. The weakness is on the opposite side because the motor tracts cross."},{"id":"T2-6","a":0,"s":"A teenage athlete is hit in the head during a game, still has a headache, and is sent back in. A second hit causes collapse and rapid swelling of the brain. What is this called?","o":[{"t":"Coup contrecoup injury from a single force","c":false,"r":"This describes one blow that bruises opposite sides of the brain."},{"t":"Second impact syndrome with brain swelling","c":true,"r":""},{"t":"Posttraumatic epilepsy from old scar tissue","c":false,"r":"This causes recurrent seizures, not sudden brain swelling after a second blow."},{"t":"Chronic traumatic encephalopathy from long exposure","c":false,"r":"This develops over years of repeated hits, not within one event."}],"i":"Understanding the danger of returning to play too early.","e":"A second blow before the first concussion has healed can cause loss of blood flow control and fast swelling. It is mostly seen in young athletes, so no one should return to play while symptoms remain."},{"id":"T2-7","a":0,"s":"A patient has a scalp laceration over the temple with a palpable bony step off beneath it. Which injury should the nurse suspect?","o":[{"t":"A simple scalp bruise needing cleaning and a dressing","c":false,"r":"A bony step off is a sign of a fracture beneath the skin."},{"t":"A depressed skull fracture needing a CT scan","c":true,"r":""},{"t":"A cervical spine fracture causing neck pain","c":false,"r":"The finding is on the skull, not in the neck."},{"t":"A fractured mandible blocking the airway","c":false,"r":"The mandible lies lower and is not at the temple."}],"i":"Recognizing fractures of the skull.","e":"A palpable step off under a laceration suggests a depressed fracture. The nurse should not probe the wound, and the patient needs a CT scan and neurosurgical review for possible repair and antibiotics."},{"id":"T2-8","a":0,"s":"A patient with a C5 spinal cord injury develops a heart rate of 38 beats per minute during tracheal suctioning. Which action best prevents this response?","o":[{"t":"Hyperoxygenate first and keep each pass very short","c":true,"r":""},{"t":"Suction for a longer time to clear secretions fully","c":false,"r":"Long passes cause low oxygen, which worsens the slow heart rate."},{"t":"Place the patient flat and tilt the head to the side","c":false,"r":"This does not reduce the vagal response to the suction catheter."},{"t":"Skip oxygen before the pass to save time","c":false,"r":"Low oxygen increases the vagal response and the risk of arrest."}],"i":"Preventing bradycardia from unopposed vagal tone.","e":"After a high cord injury, the vagus nerve acts without the balance of the sympathetic system. Suctioning and low oxygen trigger severe slowing. Preoxygenation and short passes lower the risk, and atropine should be ready."},{"id":"T2-9","a":0,"s":"How soon should a patient with a suspected spinal injury be moved off the rigid backboard?","o":[{"t":"After the patient has spent 24 hours in the emergency room","c":false,"r":"Long board time raises the risk of pressure injury."},{"t":"When the patient asks for a more comfortable position","c":false,"r":"The decision should not depend on the patient's request."},{"t":"As soon as possible, once moved to a padded surface","c":true,"r":""},{"t":"When the spine is cleared fully with imaging","c":false,"r":"The board is for transport and should come off early with precautions."}],"i":"Preventing pressure injuries in spinal injury care.","e":"A rigid board causes skin breakdown within hours, especially in a patient who cannot feel. The nurse log rolls the patient off the board with spinal precautions and checks the skin during the roll."},{"id":"T2-10","a":0,"s":"A patient with a spinal cord injury has intact sensation down to the nipple line and loss of sensation below it. Which sensory level does this represent?","o":[{"t":"C4","c":false,"r":"The C4 dermatome is at the top of the shoulders."},{"t":"T4","c":true,"r":""},{"t":"T10","c":false,"r":"The T10 dermatome is at the level of the umbilicus."},{"t":"L1","c":false,"r":"The L1 dermatome is near the groin crease."}],"i":"Identifying the neurologic level from sensory landmarks.","e":"The nipple line corresponds to T4 and the umbilicus to T10. Knowing these landmarks lets the nurse describe the level quickly and detect a rising level, which signals worsening injury or swelling."},{"id":"T2-11","a":0,"s":"A patient with a cervical injury can shrug the shoulders and bend the elbows, but cannot extend the wrists. What is the lowest functional level?","o":[{"t":"C5","c":true,"r":""},{"t":"C4","c":false,"r":"At C4 the patient can shrug but cannot bend the elbows."},{"t":"C6","c":false,"r":"At C6 the patient can extend the wrists."},{"t":"C7","c":false,"r":"At C7 the patient can also extend the elbows."}],"i":"Linking muscle function to the cord level.","e":"Shoulder shrug is C4, elbow flexion is C5, wrist extension is C6, elbow extension is C7, and finger flexion is C8. The lowest level with good strength is the functional level."},{"id":"T2-12","a":0,"s":"A patient with a spinal cord injury cannot empty the bladder and the volume is 700 mL. Which method is preferred for long term bladder care?","o":[{"t":"Intermittent catheterization on a set schedule","c":true,"r":""},{"t":"A urinary catheter left in place indefinitely","c":false,"r":"Long term catheters raise the risk of infection and stones."},{"t":"Pressing on the lower abdomen to force urine out","c":false,"r":"Manual pressure can cause reflux and kidney injury."},{"t":"Limiting fluids to reduce the amount of urine made","c":false,"r":"This leads to concentrated urine and a higher risk of infection."}],"i":"Managing a neurogenic bladder.","e":"Scheduled catheterization keeps the volume low, protects the kidneys, and has fewer infections than an indwelling catheter. Early in the injury an indwelling catheter may be used while fluid status is watched."},{"id":"T2-13","a":0,"s":"A patient with a C6 spinal cord injury has a vital capacity of 10 mL/kg and tires easily. What should the nurse anticipate?","o":[{"t":"A switch to a nasal cannula at a lower flow rate","c":false,"r":"The patient is failing from weak muscles, not from low flow."},{"t":"Chest physiotherapy alone and an overnight rest","c":false,"r":"This will not correct weak breathing muscles."},{"t":"Intubation and mechanical ventilation support","c":true,"r":""},{"t":"A sedative to help the patient relax and breathe","c":false,"r":"Sedatives can make breathing worse."}],"i":"Recognizing impending respiratory failure after a cervical injury.","e":"A vital capacity below about 15 mL/kg, rising carbon dioxide, and fatigue warn of failure. Because the cord swells over days, the nurse measures vital capacity often and prepares for a planned airway before collapse."},{"id":"T2-14","a":0,"s":"A 30 year old patient with a severe brain injury has a systolic pressure of 98 mmHg. What is the best action?","o":[{"t":"Restore the systolic pressure to at least 110 mmHg","c":true,"r":""},{"t":"Accept the pressure because it is above 90 mmHg","c":false,"r":"The target is at least 110 mmHg for patients aged 15 to 49."},{"t":"Lower the pressure further to protect the brain","c":false,"r":"A low pressure starves the injured brain of blood flow."},{"t":"Give a diuretic to reduce the swelling of the brain","c":false,"r":"A diuretic would lower blood volume and pressure further."}],"i":"Preventing hypotension after a brain injury.","e":"Brain Trauma Foundation guidance sets a systolic goal of 100 mmHg or more for ages 50 to 69 and 110 mmHg or more for ages 15 to 49 and over 70. A single low reading worsens outcome."},{"id":"T2-15","a":0,"s":"A patient with a brain injury and a suspected spinal injury needs the head raised. Which position is correct?","o":[{"t":"Sitting upright with the hips bent at ninety degrees","c":false,"r":"Bending the hips puts the spine at risk without protecting the neck."},{"t":"Lying flat with the legs raised above the heart","c":false,"r":"This increases intracranial pressure by reducing venous drainage."},{"t":"Reverse Trendelenburg with the body kept straight","c":true,"r":""},{"t":"Trendelenburg with the head lower than the feet","c":false,"r":"This raises pressure inside the head and increases swelling."}],"i":"Positioning to lower pressure while protecting the spine.","e":"Raising the head about 30 degrees helps venous drainage. When the spine is not cleared, the whole bed is tilted in reverse Trendelenburg, which keeps the spine aligned."},{"id":"T2-16","a":0,"s":"Which intravenous fluid should the nurse avoid in a patient with a severe brain injury?","o":[{"t":"5 percent dextrose in water solution","c":true,"r":""},{"t":"0.9 percent sodium chloride solution","c":false,"r":"This isotonic fluid is the usual choice for these patients."},{"t":"Packed red blood cells during bleeding","c":false,"r":"Blood is appropriate when the patient is losing it."},{"t":"3 percent sodium chloride when ordered","c":false,"r":"Hypertonic saline is used to treat raised pressure."}],"i":"Choosing fluids that do not worsen brain swelling.","e":"Dextrose in water is free water once the sugar is used. It moves into brain cells and worsens swelling, and it also raises the glucose level. Isotonic saline is preferred."},{"id":"T2-17","a":0,"s":"At what intracranial pressure is treatment usually started after a severe head injury?","o":[{"t":"A sustained pressure above 5 mmHg","c":false,"r":"This is within the normal range and does not need treatment."},{"t":"A sustained pressure above 12 mmHg","c":false,"r":"This is a high normal value and treatment is not yet started."},{"t":"A sustained pressure above 40 mmHg","c":false,"r":"Treatment is started well before the pressure reaches this level."},{"t":"A sustained pressure above 22 mmHg","c":true,"r":""}],"i":"Knowing the treatment threshold for intracranial pressure.","e":"Guidelines advise treating a sustained intracranial pressure above 22 mmHg, because higher values are linked to herniation and worse outcomes."},{"id":"T2-18","a":0,"s":"A patient with a brain injury has a blood glucose of 290 mg/dL. What is the best action?","o":[{"t":"Give no treatment since a high value protects the brain","c":false,"r":"High glucose worsens brain injury and raises infection risk."},{"t":"Give a dextrose bolus to raise the level even higher","c":false,"r":"This would worsen the high glucose and the brain injury."},{"t":"Stop all tube feeding and fluids for the next day","c":false,"r":"This does not address the high glucose and risks other harm."},{"t":"Start insulin to keep glucose between 140 and 180 mg/dL","c":true,"r":""}],"i":"Controlling glucose after a brain injury.","e":"High glucose raises lactic acid in injured brain tissue and increases infection. A moderate target avoids both high levels and the danger of low levels."},{"id":"T2-19","a":0,"s":"A patient with a severe brain injury has intracranial pressure that rises to 28 mmHg each time the nurse turns the patient or the patient grimaces. What is the best action?","o":[{"t":"Stop all turning for the first week to avoid the rise","c":false,"r":"The patient still needs skin care and lung care."},{"t":"Hold the sedation and pain medicine to check the exam","c":false,"r":"Pain and agitation raise the pressure, so this would worsen it."},{"t":"Give analgesia and sedation before turning and care","c":true,"r":""},{"t":"Restrain the arms and legs so the patient cannot move","c":false,"r":"Restraints increase agitation and pressure."}],"i":"Reducing pressure spikes from stimulation.","e":"Pain, agitation, and stimulation raise intracranial pressure. Treating pain, clustering care, and sedating before procedures prevent the spikes."},{"id":"T2-20","a":0,"s":"A patient with a brain injury has a cervical collar fastened very tightly around the neck. The pressure rises each time the head is turned. What is the best action?","o":[{"t":"Keep the head midline so nothing compresses the neck veins","c":true,"r":""},{"t":"Tighten the collar further to keep the head still","c":false,"r":"A tighter collar blocks venous drainage and raises pressure."},{"t":"Turn the head to one side to drain the neck veins","c":false,"r":"A turned head can kink the jugular vein and raise pressure."},{"t":"Lay the patient flat so the head is level with the heart","c":false,"r":"This reduces venous drainage and raises the pressure."}],"i":"Avoiding neck compression that blocks venous return.","e":"Blood leaves the head through the jugular veins. A tight collar, tape, or a tube holder around the neck blocks drainage. A midline head and a collar that fits well keep the pressure lower."},{"id":"T2-21","a":0,"s":"A patient has a loose, floating upper jaw and teeth when the front teeth are rocked, but the nose and cheekbones do not move. Which fracture is likely?","o":[{"t":"A Le Fort I fracture across the lower maxilla","c":true,"r":""},{"t":"A Le Fort III fracture with separation of the skull base","c":false,"r":"In this type the whole face moves and the nose and cheeks are involved."},{"t":"A nasal fracture with swelling of the nose","c":false,"r":"This does not make the upper teeth and palate mobile."},{"t":"A condylar fracture of the mandible near the ear","c":false,"r":"This affects the lower jaw, not the upper teeth and palate."}],"i":"Recognizing the Le Fort pattern by what moves.","e":"A Le Fort I fracture separates the tooth bearing part of the maxilla from the upper face. The palate and teeth move together, and the bite is off."},{"id":"T2-22","a":0,"s":"A patient has severe facial fractures and a possible skull base injury. Which tube should the nurse prepare for gastric decompression?","o":[{"t":"A nasogastric tube passed through the right nostril","c":false,"r":"A nasal tube can pass into the brain through a skull base fracture."},{"t":"A nasogastric tube passed through the left nostril","c":false,"r":"A nasal tube on either side has the same risk."},{"t":"An orogastric tube placed through the mouth","c":true,"r":""},{"t":"A nasal airway placed to help ventilate the patient","c":false,"r":"A nasal airway is also unsafe with midface and skull base fractures."}],"i":"Avoiding nasal tubes in midface injury.","e":"Fractures of the midface and skull base can open a path to the brain. An orogastric tube avoids the risk. The nurse also avoids nasal airways and nasal intubation."},{"id":"T2-23","a":0,"s":"After a blow to the cheek, a patient cannot open the mouth fully and the cheek looks flattened. Which fracture is likely?","o":[{"t":"A nasal fracture with a deviated septum","c":false,"r":"A nasal break does not stop the jaw from opening."},{"t":"A frontal sinus fracture of the forehead","c":false,"r":"This affects the forehead and does not limit jaw opening."},{"t":"A fracture of the hyoid bone in the neck","c":false,"r":"This is rare and does not cause a flat cheek."},{"t":"A zygomatic arch fracture pressing on the jaw muscle","c":true,"r":""}],"i":"Recognizing trismus from a cheekbone fracture.","e":"A depressed arch can press on the coronoid process of the jaw. The patient has trismus, a flat cheek, and sometimes numbness. Imaging confirms the fracture."},{"id":"T2-24","a":0,"s":"A patient has severe midface fractures with heavy bleeding, cannot be intubated through the mouth, and the oxygen saturation is falling. What is the best action?","o":[{"t":"Keep trying oral intubation for more minutes","c":false,"r":"Repeated attempts waste time while the patient is hypoxic."},{"t":"Place a nasal airway to help the patient breathe","c":false,"r":"A nasal airway is unsafe with midface fractures."},{"t":"Wait for the swelling to go down before acting","c":false,"r":"Waiting allows the patient to become severely hypoxic."},{"t":"Prepare for a surgical cricothyrotomy","c":true,"r":""}],"i":"Securing a failed airway in facial trauma.","e":"When the airway cannot be secured from above and the patient is hypoxic, a surgical airway through the cricothyroid membrane is the rescue. The nurse prepares the kit and suction at once."},{"id":"T2-25","a":0,"s":"A patient reports flashes of light, floaters, and a dark curtain moving across the vision of one eye after a blow to the head. What should the nurse suspect?","o":[{"t":"A retinal detachment needing urgent eye evaluation","c":true,"r":""},{"t":"A corneal abrasion from the blow to the surface","c":false,"r":"A scratch causes pain and tearing, not a curtain over the vision."},{"t":"A hyphema with blood in the front of the eye","c":false,"r":"This shows blood in the front chamber, not a curtain of vision loss."},{"t":"Simple eye strain that needs rest and fluids","c":false,"r":"The signs are of a sight threatening problem."}],"i":"Recognizing a retinal detachment.","e":"Flashes, floaters, and a curtain are classic signs. Early treatment saves sight, so the patient needs prompt ophthalmology review and rest with limited eye movement."},{"id":"T2-26","a":0,"s":"A patient with a corneal abrasion asks to take home a bottle of numbing eye drops for pain. What should the nurse say?","o":[{"t":"Use the drops every hour until the pain is gone","c":false,"r":"Repeated use delays healing and can cause corneal damage."},{"t":"Use the drops at night to help with sleep","c":false,"r":"Even limited use at home is unsafe."},{"t":"These drops can damage the cornea, so they are not sent home","c":true,"r":""},{"t":"The drops are safe if the patient wears an eye patch","c":false,"r":"A patch does not make home use of the drops safe."}],"i":"Safe pain control for a corneal injury.","e":"Topical anesthetics help the exam but must not be used at home. They hide pain, delay healing, and can cause ulcers. Oral pain relief and antibiotic ointment are used."},{"id":"T2-27","a":0,"s":"A patient with a suspected open globe injury is vomiting. What should the nurse do first?","o":[{"t":"Give an antiemetic to prevent vomiting and straining","c":true,"r":""},{"t":"Press on the closed eye to reduce the swelling","c":false,"r":"Pressure can push eye contents out of the globe."},{"t":"Ask the patient to bear down for an easier exam","c":false,"r":"Straining raises eye pressure and risks loss of contents."},{"t":"Remove the eye shield to check the pupil again","c":false,"r":"A shield protects the eye and should stay in place."}],"i":"Protecting a ruptured globe from pressure.","e":"Vomiting and straining raise pressure inside the eye and can force contents out. The nurse gives an antiemetic, keeps a rigid shield without pressure, and keeps the patient NPO for surgery."},{"id":"T2-28","a":0,"s":"A patient has a stab wound just above the clavicle. Which zone of the neck is involved, and why is it the most dangerous?","o":[{"t":"Zone II, because the thyroid and larynx are exposed","c":false,"r":"Zone II is the middle neck and is easy to examine and treat."},{"t":"Zone III, because it is close to the skull base","c":false,"r":"Zone III lies near the angle of the jaw and is hard to reach."},{"t":"Zone IV, because it is near the collar bone","c":false,"r":"The neck has three zones only, so no zone is named Zone IV."},{"t":"Zone I, because the great vessels and lung apex are close","c":true,"r":""}],"i":"Using the zones of the neck.","e":"Zone I runs from the clavicles to the cricoid cartilage. It contains the great vessels, the lung apex, and the esophagus, so injuries often need imaging and sometimes surgery in the chest."},{"id":"T2-29","a":0,"s":"A patient has a stab wound to the neck with air bubbling through the wound with each breath. What does this finding represent?","o":[{"t":"A minor skin wound with a small air leak","c":false,"r":"Air bubbling means the airway has been entered."},{"t":"A hard sign of airway injury needing urgent care","c":true,"r":""},{"t":"A normal escape of air from the sinuses","c":false,"r":"Sinus air does not move through a neck wound."},{"t":"A sign of infection in the soft tissue","c":false,"r":"Infection does not cause air to bubble with each breath."}],"i":"Recognizing hard signs of neck injury.","e":"Air bubbling means a hole in the larynx or trachea. The nurse protects the airway, keeps oxygen and suction ready, and prepares for intubation and the operating room."},{"id":"T2-30","a":0,"s":"A patient is cut down after a hanging attempt, is breathing, and has a hoarse voice. Which action is the priority?","o":[{"t":"Remove the collar so the neck can be checked at once","c":false,"r":"The spine may be injured, so the collar stays on."},{"t":"Place the patient flat and wait for the voice to return","c":false,"r":"The airway may swell, and waiting may allow it to close."},{"t":"Give oral fluids to soothe the throat injury","c":false,"r":"The patient may need intubation and should not eat or drink."},{"t":"Protect the airway and keep the cervical spine aligned","c":true,"r":""}],"i":"Managing a hanging injury.","e":"Hanging can injure the larynx and the spine and can cause delayed airway swelling. The airway comes first, with spinal care, careful observation, and imaging. The patient also needs mental health assessment."},{"id":"T2-31","a":0,"s":"A patient had a penetrating neck wound and now has fever, chest pain, and air in the tissues of the neck two days later. Which injury was missed?","o":[{"t":"A perforation of the esophagus with chest infection","c":true,"r":""},{"t":"A fracture of the cervical spine with swelling","c":false,"r":"This would not cause a fever and air in the tissues."},{"t":"A tear in the carotid artery with a clot","c":false,"r":"This would cause stroke signs, not air in the neck tissue."},{"t":"A bruise of the thyroid gland with swelling","c":false,"r":"This would not cause fever and chest infection."}],"i":"Recognizing delayed signs of an esophageal injury.","e":"Esophageal injuries are easy to miss and leak into the neck and chest. Fever, pain, and air in the tissues develop over hours to days, and delay greatly raises the death rate."},{"id":"T2-32","a":1,"s":"A patient has a scapular fracture after a fall from a ladder. Why should the nurse look carefully for other injuries?","o":[{"t":"It is a low energy injury that rarely has other damage","c":false,"r":"A scapular fracture takes a large force to occur."},{"t":"It causes a spinal cord injury at the same level","c":false,"r":"Spinal cord injury is not a regular result of this fracture."},{"t":"It is usually seen with an isolated broken collar bone","c":false,"r":"The fracture is linked to chest and head injuries, not just the clavicle."},{"t":"It takes great force, so lung and vessel injuries are common","c":true,"r":""}],"i":"Recognizing injuries that signal a high energy force.","e":"The scapula is protected by thick muscle, so a break means a large force. Pulmonary contusion, rib fractures, and vascular injury are often present, so the nurse reassesses the chest closely."},{"id":"T2-33","a":1,"s":"A patient was crushed under a vehicle and has a blue purple face and neck, tiny red spots, and swollen eyes, while the skin below the chest looks normal. What is the cause?","o":[{"t":"Traumatic asphyxia from sudden high pressure on the chest","c":true,"r":""},{"t":"Carbon monoxide poisoning from the vehicle exhaust","c":false,"r":"This causes a cherry red color and headache, not a blue purple face."},{"t":"Anaphylaxis from an allergic reaction to a medicine","c":false,"r":"This causes hives and wheeze, not petechiae above the chest."},{"t":"Strangulation by a seat belt around the neck area","c":false,"r":"The pattern follows chest crush with a sudden rise in venous pressure."}],"i":"Recognizing traumatic asphyxia.","e":"A sudden squeeze of the chest sends blood backward into the veins of the head and neck. The skin above the compression looks purple with petechiae. The patient needs airway and chest care, and other injuries are often present."},{"id":"T2-34","a":1,"s":"Which finding best confirms a flail chest in a patient with multiple rib fractures?","o":[{"t":"Pain on deep breathing over one single rib fracture","c":false,"r":"Pain is common with any rib fracture and does not confirm a flail segment."},{"t":"A segment of chest that moves in on breathing in","c":true,"r":""},{"t":"Bruising over the chest wall with no movement","c":false,"r":"Bruising alone does not show an unstable segment."},{"t":"A slightly reduced breath sound on the injured side","c":false,"r":"This can occur with many injuries and is not specific."}],"i":"Identifying paradoxical chest movement.","e":"A flail segment is formed by fractures in two or more places on three or more ribs. During breathing it moves opposite to the rest of the chest, and this paradoxical motion is the confirming sign."},{"id":"T2-35","a":1,"s":"A patient has chest tube drainage that has stopped, yet the chest x-ray shows a large collection of blood that remains in the pleural space. What is the best next step?","o":[{"t":"Prepare for video assisted thoracoscopic surgery","c":true,"r":""},{"t":"Observe for one more week with no treatment","c":false,"r":"Retained blood can cause infection and a trapped lung."},{"t":"Remove the chest tube and discharge the patient","c":false,"r":"The retained blood is still a risk and needs treatment."},{"t":"Give a diuretic to help the blood leave the chest","c":false,"r":"A diuretic does not remove blood from the pleural space."}],"i":"Managing a retained hemothorax.","e":"Blood that is not drained can form an empyema or trap the lung. Thoracoscopic surgery removes the clot, and it is usually done within a few days of injury."},{"id":"T2-36","a":1,"s":"A patient has a chest tube with continuous bubbling in the water seal chamber, not only when coughing. What should the nurse do first?","o":[{"t":"Document it as a normal finding for this system","c":false,"r":"Continuous bubbling means air is entering or leaving constantly."},{"t":"Clamp the chest tube close to the chest wall","c":false,"r":"Clamping can cause a tension pneumothorax if the leak is in the lung."},{"t":"Check the tubing and connections for a leak and notify the provider","c":true,"r":""},{"t":"Turn off the suction and lower the drain to the floor","c":false,"r":"This does not locate the leak and could worsen the problem."}],"i":"Troubleshooting a chest drainage system.","e":"Continuous bubbling in the water seal chamber means a leak in the system or the lung. The nurse checks connections from the patient to the drain. If it persists after the tubing is secure, the leak is likely from the lung."},{"id":"T2-37","a":1,"s":"A patient with a pulmonary contusion is receiving intravenous fluid at a high rate. Why should the nurse question the order?","o":[{"t":"A contused lung needs a very large fluid load to heal","c":false,"r":"Overload worsens a lung that already leaks fluid."},{"t":"Fluid is not needed after a chest injury","c":false,"r":"The patient still needs enough fluid to keep perfusion adequate."},{"t":"Extra fluid worsens swelling and oxygen exchange in the lung","c":true,"r":""},{"t":"Fluid is harmful when given through a vein","c":false,"r":"The route is not the issue, but the volume is."}],"i":"Balancing fluid in pulmonary contusion.","e":"Injured lung tissue leaks fluid, so extra fluid increases swelling and lowers oxygen. Fluids are given to maintain perfusion without overload, with pain control and chest care to support breathing."},{"id":"T2-38","a":1,"s":"The chest tube is accidentally pulled out of the drainage system, and the end of the tube is open to the air. What should the nurse do?","o":[{"t":"Clamp the tube and leave it clamped until the next shift","c":false,"r":"Clamping can build up air and cause a tension pneumothorax."},{"t":"Place the end of the tube in sterile water and call for help","c":true,"r":""},{"t":"Leave the tube open to the air until the provider comes","c":false,"r":"Open air can enter the chest and collapse the lung."},{"t":"Remove the tube from the chest and cover the site","c":false,"r":"This leaves the patient without a way for air to leave."}],"i":"Responding to a disconnected chest tube.","e":"Putting the tube end in sterile water makes a temporary water seal so air can leave and not enter. The nurse then gets a new system and notifies the provider."},{"id":"T2-39","a":1,"s":"A patient has a chest tube and a new, rapidly spreading swelling of the skin of the neck and chest with a crackling feel. What does this suggest?","o":[{"t":"Air leaking into the tissue from a lung or airway injury","c":true,"r":""},{"t":"A normal reaction of the skin to the tape","c":false,"r":"Spreading crackling swelling is not a normal tape reaction."},{"t":"Normal fat that collects under the skin after surgery","c":false,"r":"Fat does not crackle or spread quickly."},{"t":"An allergic reaction to the antibiotic given","c":false,"r":"An allergy causes hives and swelling, not crackling under the skin."}],"i":"Recognizing subcutaneous emphysema.","e":"Air under the skin crackles and spreads when air escapes from the lung or airway. The nurse checks that the tube is not blocked, marks the edges, and reports it, since it can signal a worsening leak."},{"id":"T2-40","a":1,"s":"A young athlete collapses with ventricular fibrillation after being hit in the chest with a baseball. What is the most important action?","o":[{"t":"Wait for an echocardiogram to confirm the cause","c":false,"r":"This delays the care that is needed immediately."},{"t":"Begin CPR and defibrillate as soon as possible","c":true,"r":""},{"t":"Give oral aspirin and observe the patient closely","c":false,"r":"This does not treat a lethal rhythm."},{"t":"Place the patient in a seated position and give fluids","c":false,"r":"This will not restore a heartbeat."}],"i":"Responding to commotio cordis.","e":"A blow during a narrow window of the heartbeat can cause ventricular fibrillation without structural injury. Immediate CPR and early defibrillation give the best chance of survival."},{"id":"T2-41","a":1,"s":"A patient had blunt chest trauma and now has a new loud systolic murmur, shortness of breath, and crackles. Which test is most useful?","o":[{"t":"A urine drug screen for stimulants and other drugs","c":false,"r":"This does not explain a new murmur after injury."},{"t":"A repeat head CT to look for new bleeding","c":false,"r":"The signs point to the heart, not the head."},{"t":"A rectal exam to check the sphincter tone","c":false,"r":"This is not related to a new murmur."},{"t":"An echocardiogram to find valve or septal injury","c":true,"r":""}],"i":"Evaluating a possible valve or septal injury.","e":"Blunt force can tear a valve, a papillary muscle, or the septum. A new murmur with pulmonary edema suggests this, and an echocardiogram shows the damage."},{"id":"T2-42","a":1,"s":"A patient with cardiac tamponade has a systolic pressure that falls by 15 mmHg when the patient breathes in. What is this finding called?","o":[{"t":"Pulsus alternans","c":false,"r":"This is a beat to beat change in strength seen in failure."},{"t":"Water hammer pulse","c":false,"r":"This is a bounding pulse seen with a leaking aortic valve."},{"t":"Pulsus paradoxus","c":true,"r":""},{"t":"Orthostatic hypotension","c":false,"r":"This is a fall in pressure when standing."}],"i":"Recognizing a sign of tamponade.","e":"In tamponade the fluid around the heart limits filling. During inspiration the right side fills more and crowds the left, so the systolic pressure drops by more than 10 mmHg."},{"id":"T2-43","a":1,"s":"Which FAST view is used to check for blood around the heart?","o":[{"t":"The subxiphoid view of the heart","c":true,"r":""},{"t":"The right upper quadrant view of the liver","c":false,"r":"This view looks for blood around the liver and kidney."},{"t":"The left upper quadrant view of the spleen","c":false,"r":"This view looks for blood around the spleen."},{"t":"The suprapubic view of the bladder","c":false,"r":"This view looks for blood in the pelvis."}],"i":"Using the FAST exam for the heart.","e":"The subxiphoid or subcostal view shows the heart through the liver window. Black fluid around the heart in an unstable patient suggests hemopericardium and the need for urgent surgical care."},{"id":"T2-44","a":1,"s":"Where does a blunt traumatic aortic injury most often occur?","o":[{"t":"At the aortic root next to the heart valve","c":false,"r":"This area is held by the heart and is less often torn."},{"t":"At the bifurcation of the aorta at the pelvis","c":false,"r":"This is a site of abdominal, not chest, injury."},{"t":"At the origin of the carotid artery in the neck","c":false,"r":"The most common site is in the chest, not in the neck."},{"t":"At the isthmus, just past the left subclavian","c":true,"r":""}],"i":"Knowing the common site of aortic injury.","e":"The isthmus is where the mobile arch meets the fixed descending aorta near the ligamentum arteriosum. Sudden deceleration shears the aorta at this point."},{"id":"T2-45","a":1,"s":"A stable patient has a high risk mechanism for aortic injury. Which test confirms the diagnosis?","o":[{"t":"A plain chest x-ray with a repeat view","c":false,"r":"An x-ray can raise suspicion but cannot confirm the injury."},{"t":"An electrocardiogram with a rhythm strip","c":false,"r":"This does not show injury to the aorta."},{"t":"A CT angiogram of the chest and aorta","c":true,"r":""},{"t":"A urine pregnancy test and a blood count","c":false,"r":"This is not related to an aortic injury."}],"i":"Confirming a great vessel injury.","e":"CT angiography is fast and accurate and is the test of choice in a stable patient. An unstable patient goes straight to surgery."},{"id":"T2-46","a":1,"s":"A patient has an absent right arm pulse, a bruise at the sternal notch, and the trachea is pushed to the left. Which vessel injury is likely?","o":[{"t":"The innominate artery","c":true,"r":""},{"t":"The left common carotid artery","c":false,"r":"This would affect the left neck and left side of the brain."},{"t":"The abdominal aorta","c":false,"r":"This is in the abdomen, far from the neck."},{"t":"The femoral artery","c":false,"r":"This would affect the leg, not the right arm."}],"i":"Recognizing a brachiocephalic injury.","e":"The innominate artery supplies the right arm and right carotid. A hematoma at the thoracic inlet can push the trachea and reduce the right arm pulse."},{"id":"T2-47","a":1,"s":"A patient has a suspected tear of the inferior vena cava. Where should the nurse place large bore intravenous access?","o":[{"t":"In both legs for faster fluid delivery","c":false,"r":"Fluid given below the tear can leak out through the injury."},{"t":"In the femoral vein on the side of the injury","c":false,"r":"This route drains through the injured vessel."},{"t":"In an upper extremity, above the diaphragm","c":true,"r":""},{"t":"In the umbilical vein of the patient","c":false,"r":"This is a route for newborns, not for adults."}],"i":"Choosing the access site that avoids a venous injury.","e":"Fluid and blood given below an inferior vena cava tear return to the heart through the torn vessel and leak out. Access above the diaphragm is the safer route."},{"id":"T2-48","a":1,"s":"A diagnostic peritoneal lavage returns fluid that contains bile. Which injury does this suggest?","o":[{"t":"A bruise of the abdominal wall muscle and skin","c":false,"r":"This would not release bile into the peritoneum."},{"t":"A rib fracture on the left side of the chest","c":false,"r":"A rib fracture does not release bile."},{"t":"A fractured vertebra in the lumbar spine","c":false,"r":"This does not cause bile in the lavage."},{"t":"A hollow organ injury such as the small bowel","c":true,"r":""}],"i":"Interpreting peritoneal lavage fluid.","e":"Bile, vegetable matter, or bacteria in the fluid point to a hollow organ injury. A positive tap also includes gross blood or a red cell count over 100,000 per cubic millimeter."},{"id":"T2-49","a":1,"s":"A patient with an open pelvic fracture has blood on the rectal exam. What does this finding suggest?","o":[{"t":"A rectal injury from bone fragments or the force","c":true,"r":""},{"t":"Normal hemorrhoids that are not related to the injury","c":false,"r":"New blood after a major injury should not be assumed to be benign."},{"t":"A urinary tract infection from the catheter","c":false,"r":"A urinary infection does not cause blood on the rectal exam."},{"t":"Bleeding from the nose that was swallowed","c":false,"r":"Swallowed blood would appear dark and not be fresh on the exam."}],"i":"Identifying rectal injury.","e":"Blood on a rectal exam after pelvic fracture or penetrating injury suggests a rectal tear. This needs evaluation and often a diverting colostomy and antibiotics."},{"id":"T2-50","a":1,"s":"A CT of the abdomen after a lap belt injury shows free fluid but no solid organ injury. What should the nurse suspect?","o":[{"t":"A normal finding that needs no follow up","c":false,"r":"Free fluid without an organ injury is a warning sign."},{"t":"A bowel or mesenteric injury needing review","c":true,"r":""},{"t":"A kidney stone that has passed already","c":false,"r":"This is not a trauma finding and does not cause free fluid."},{"t":"A rib fracture that is not visible on CT","c":false,"r":"This is not shown as free fluid in the abdomen."}],"i":"Recognizing signs of bowel injury.","e":"Free fluid with no solid organ injury suggests bowel or mesenteric bleeding. These patients need frequent exams, and surgery is considered if they worsen."},{"id":"T2-51","a":1,"s":"A stable patient with a splenic injury has a contrast blush on CT. What is the best treatment?","o":[{"t":"Observation alone with bed rest","c":false,"r":"A blush means active bleeding that needs treatment."},{"t":"Immediate discharge with a follow up in a week","c":false,"r":"This is unsafe with active bleeding."},{"t":"Oral iron tablets and a high protein diet","c":false,"r":"This does not stop the bleeding."},{"t":"Angioembolization of the bleeding vessel","c":true,"r":""}],"i":"Choosing treatment for an active splenic bleed.","e":"A blush shows active arterial bleeding. Embolization controls it in a stable patient and often saves the spleen, while an unstable patient goes to the operating room."},{"id":"T2-52","a":1,"s":"An unstable patient has a positive FAST exam and a systolic pressure of 70 mmHg after blunt abdominal trauma. What is the next step?","o":[{"t":"Take the patient to the operating room now","c":true,"r":""},{"t":"Order a CT scan of the abdomen first","c":false,"r":"An unstable patient should not go to the CT scanner."},{"t":"Observe for six hours with serial exams","c":false,"r":"The patient will die without control of the bleeding."},{"t":"Start a clear liquid diet and pain medicine","c":false,"r":"This does not address the bleeding."}],"i":"Recognizing unstable bleeding that needs surgery.","e":"Nonoperative care is only for stable patients. A hypotensive patient with free fluid has an intraabdominal bleed and needs surgery."},{"id":"T2-53","a":1,"s":"A patient being observed for a liver injury has a hemoglobin that falls from 12 to 9.5 g/dL and a heart rate that rises to 118. What should the nurse do?","o":[{"t":"Record the values and recheck in the morning hours","c":false,"r":"This delays recognition of ongoing bleeding."},{"t":"Encourage the patient to walk in the hallway","c":false,"r":"Activity can worsen the bleeding."},{"t":"Give an extra dose of aspirin for comfort","c":false,"r":"Aspirin increases bleeding risk."},{"t":"Notify the provider, since bleeding is likely","c":true,"r":""}],"i":"Recognizing failure of nonoperative management.","e":"A falling hemoglobin with a rising heart rate signals continued bleeding. The provider may order a repeat CT, embolization, or surgery, and blood products may be needed."},{"id":"T2-54","a":1,"s":"Which side of the diaphragm is more often found injured after blunt trauma?","o":[{"t":"The right side, since it is thinner and weaker","c":false,"r":"The right side is shielded by the liver."},{"t":"Both sides equally, with no difference between them","c":false,"r":"The injury is more often found on the left."},{"t":"The left side, because the liver protects the right","c":true,"r":""},{"t":"The center, since it has no muscle in it","c":false,"r":"The injury is most often a tear of the left dome."}],"i":"Knowing the pattern of diaphragmatic injury.","e":"The liver cushions the right side and blocks the herniation of organs. A left tear lets the stomach or bowel move into the chest, so it is found more often."},{"id":"T2-55","a":1,"s":"A stable patient has a stab wound to the left lower chest, a normal chest x-ray, and a negative CT. What is the best way to check the diaphragm?","o":[{"t":"Repeat the plain x-ray in six months","c":false,"r":"A delay risks a missed injury and later herniation."},{"t":"Take no further action since imaging was normal","c":false,"r":"Imaging can miss small tears of the diaphragm."},{"t":"Give a laxative and observe the bowel pattern","c":false,"r":"This does not check the diaphragm."},{"t":"Laparoscopy or thoracoscopy to see it directly","c":true,"r":""}],"i":"Detecting an occult diaphragmatic injury.","e":"Imaging can miss small penetrating tears, so direct viewing is advised in a patient with a thoracoabdominal wound. Missed tears can herniate months or years later."},{"id":"T2-56","a":1,"s":"Why do surgeons repair all diaphragmatic tears, even small ones, after penetrating trauma?","o":[{"t":"The diaphragm heals fully and quickly without repair","c":false,"r":"Muscle in constant motion does not heal by itself."},{"t":"Repair prevents the patient from needing a chest tube","c":false,"r":"Repair is not meant to replace a chest tube."},{"t":"Small tears turn cancerous and need removal","c":false,"r":"Tears from trauma are not cancerous."},{"t":"The diaphragm cannot heal and organs may herniate","c":true,"r":""}],"i":"Understanding why diaphragm injuries need repair.","e":"The constant motion and pressure difference keep a tear open. Over time bowel or stomach can move into the chest and strangle, so surgery is advised."},{"id":"T2-57","a":1,"s":"A patient with a diaphragmatic hernia after trauma has diminished breath sounds on the left and what other finding?","o":[{"t":"Crackles over both lung fields equally","c":false,"r":"This would suggest pulmonary edema."},{"t":"Bowel sounds heard in the chest","c":true,"r":""},{"t":"A loud murmur over the right sternal border","c":false,"r":"This is a cardiac sign."},{"t":"A high pitched wheeze over the neck","c":false,"r":"This suggests airway narrowing."}],"i":"Recognizing the signs of a diaphragmatic hernia.","e":"Abdominal contents in the chest reduce breath sounds, and bowel sounds may be heard. The patient may have respiratory distress and a scaphoid abdomen."},{"id":"T2-58","a":1,"s":"A patient has a deceleration injury and a major renal artery tear, yet the urine is clear. What does this mean?","o":[{"t":"The kidneys must be uninjured because the urine looks clear","c":false,"r":"A pedicle injury can occur with no hematuria."},{"t":"The patient has a bladder injury instead of a kidney one","c":false,"r":"This is not the explanation for a clear urine finding."},{"t":"The urine test was drawn at the wrong time of day","c":false,"r":"A pedicle injury can occur with no hematuria at any time."},{"t":"A lack of blood in the urine does not exclude a major kidney injury","c":true,"r":""}],"i":"Knowing the limits of hematuria as a sign.","e":"A torn or thrombosed renal artery can stop urine from the kidney, so no blood appears. A CT with contrast finds the injury, and a high risk mechanism calls for imaging."},{"id":"T2-59","a":1,"s":"A patient has bruising around the umbilicus two days after pancreatic injury. What is this sign?","o":[{"t":"Kehr sign, from a bleeding spleen","c":false,"r":"Kehr sign is shoulder pain, not a bruise at the umbilicus."},{"t":"Battle sign, from a skull base fracture","c":false,"r":"Battle sign is a bruise behind the ear."},{"t":"Seat belt sign, from the lap belt","c":false,"r":"This is a stripe of bruising from the belt, not a ring at the umbilicus."},{"t":"Cullen sign, from blood tracking in the retroperitoneum","c":true,"r":""}],"i":"Recognizing signs of retroperitoneal bleeding.","e":"Blood and enzymes from a pancreatic or retroperitoneal injury can track to the umbilicus and cause bruising. The finding is delayed and signals serious bleeding."},{"id":"T2-60","a":1,"s":"During surgery after blunt trauma, the surgeon finds a stable hematoma in the pelvic retroperitoneum, called zone 3. What should be done?","o":[{"t":"Open it at once to find the bleeding vessel","c":false,"r":"Opening it removes the tamponade and can cause severe bleeding."},{"t":"Drain it with a large open suction drain","c":false,"r":"A drain does not treat a stable pelvic hematoma."},{"t":"Leave it undisturbed and avoid opening it","c":true,"r":""},{"t":"Remove the tissue around the hematoma","c":false,"r":"This is not advised and may cause greater bleeding."}],"i":"Managing a stable retroperitoneal hematoma.","e":"In blunt trauma a stable pelvic hematoma is contained by the tissue around it. Opening it releases the pressure and can lead to uncontrolled bleeding, so it is left alone."},{"id":"T2-61","a":1,"s":"A patient with a pancreatic injury has a drain with high amylase fluid. What does this indicate?","o":[{"t":"A pancreatic leak or fistula from the injury","c":true,"r":""},{"t":"A normal wound drainage that needs no action","c":false,"r":"High amylase is not a normal finding in a surgical drain."},{"t":"An infection of the lung from the injury","c":false,"r":"Amylase in drain fluid is not a sign of a lung infection."},{"t":"A bladder leak from the urinary catheter","c":false,"r":"Urine would show a high creatinine, not a high amylase."}],"i":"Interpreting drain fluid.","e":"Pancreatic enzymes leak from a ductal injury. The fluid is rich in amylase and can digest tissue, so the patient needs nutrition support and a plan for the leak."},{"id":"T2-62","a":1,"s":"Why should the nurse avoid repeatedly rocking or springing the pelvis of a patient with a suspected pelvic fracture?","o":[{"t":"It can break up clots and restart bleeding","c":true,"r":""},{"t":"It causes a rise in the blood sugar level","c":false,"r":"This is not an effect of examining the pelvis."},{"t":"It makes the patient more likely to vomit","c":false,"r":"This is not the main concern with pelvic manipulation."},{"t":"It lowers the body temperature of the patient","c":false,"r":"This is not an effect of moving the pelvis."}],"i":"Protecting clots in a pelvic fracture.","e":"Pelvic bleeding is held by clots and fixed bone. Repeated compression or rocking can disturb them. The pelvis is assessed once, gently, and a binder is applied if the patient is unstable."},{"id":"T2-63","a":1,"s":"A patient has an open pelvic fracture with a laceration of the perineum. Why does this carry the highest death rate?","o":[{"t":"It involves the spinal cord at the lumbar level","c":false,"r":"The spine is not the usual problem in an open pelvic fracture."},{"t":"It opens to the outside, so bleeding and infection are severe","c":true,"r":""},{"t":"It is the most painful fracture a patient can have","c":false,"r":"Pain does not explain the high risk of death."},{"t":"It is easy to treat with a pelvic binder alone","c":false,"r":"A binder alone does not control an open injury."}],"i":"Understanding open pelvic fractures.","e":"The tissue around the pelvis can no longer contain the bleeding, and bowel and vaginal injuries lead to infection. The patient needs antibiotics, hemorrhage control, and often a diverting colostomy."},{"id":"T2-64","a":1,"s":"A patient with an unstable pelvic fracture has a binder applied. When may the binder be loosened or removed?","o":[{"t":"As soon as the patient complains of tightness","c":false,"r":"Loosening may restart severe bleeding."},{"t":"Only by the provider, once bleeding is controlled","c":true,"r":""},{"t":"After the patient has been in the unit for an hour","c":false,"r":"Time alone does not show that the bleeding has stopped."},{"t":"When the family asks to check the skin","c":false,"r":"The binder is not removed for this reason."}],"i":"Managing a pelvic binder safely.","e":"The binder compresses the pelvic volume and slows bleeding. It stays on until bleeding is controlled or stabilization is done. The nurse checks the skin and pulses and reports concerns."},{"id":"T2-65","a":1,"s":"Which CT finding in a patient with a pelvic fracture indicates active arterial bleeding?","o":[{"t":"A contrast blush in the pelvis","c":true,"r":""},{"t":"A small amount of gas in the bladder","c":false,"r":"This is not a sign of arterial bleeding."},{"t":"A calcified lymph node near the vessel","c":false,"r":"This is not a sign of bleeding."},{"t":"A small fracture of the pubic ramus","c":false,"r":"A fracture does not show that blood vessels are bleeding."}],"i":"Reading CT signs of pelvic bleeding.","e":"A blush means contrast is leaving the artery. These patients are candidates for angioembolization."},{"id":"T2-66","a":1,"s":"What is the most common source of bleeding in a pelvic fracture?","o":[{"t":"The aorta just below the diaphragm","c":false,"r":"This is far from the pelvis."},{"t":"The venous plexus and the raw bone surfaces","c":true,"r":""},{"t":"The carotid artery in the neck","c":false,"r":"This is not in the pelvis."},{"t":"The pulmonary arteries in the lungs","c":false,"r":"This is not in the pelvis."}],"i":"Knowing the source of pelvic hemorrhage.","e":"About 85 percent of bleeding comes from veins and the raw bone, while about 15 percent is arterial. This is why binders and packing control most of it."},{"id":"T2-67","a":1,"s":"A patient with an intraperitoneal bladder rupture has a CT cystogram that shows contrast around the bowel. What is the treatment?","o":[{"t":"Surgical repair of the bladder wall","c":true,"r":""},{"t":"A urinary catheter alone for several weeks","c":false,"r":"This treats an extraperitoneal tear but not an intraperitoneal tear."},{"t":"Oral antibiotics and a repeat scan in a month","c":false,"r":"This will not close the tear."},{"t":"Fluids and observation with no catheter at all","c":false,"r":"Urine in the abdomen needs repair."}],"i":"Treating an intraperitoneal bladder tear.","e":"A tear in the dome leaks urine into the abdomen and causes peritonitis. It requires surgical closure, and a catheter drains the bladder afterward."},{"id":"T2-68","a":1,"s":"A patient with an intraperitoneal bladder rupture has a rising creatinine and potassium, but the kidneys are normal. What explains this?","o":[{"t":"The kidneys were injured by the contrast dye used","c":false,"r":"The kidneys are normal in this case."},{"t":"The patient has eaten too much protein","c":false,"r":"This does not raise creatinine so quickly."},{"t":"Urine in the abdomen is absorbed into the blood","c":true,"r":""},{"t":"The laboratory made an error in the test","c":false,"r":"The values reflect a real change from the leaked urine."}],"i":"Recognizing pseudo renal failure.","e":"The peritoneum absorbs creatinine and potassium from urine that has leaked. The values rise even though the kidneys work, and they fall after repair."},{"id":"T2-69","a":1,"s":"A stable patient has flank swelling and a urinoma several days after a penetrating injury. Which test best shows a ureteral injury?","o":[{"t":"A CT of th
