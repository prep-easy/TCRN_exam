inal detachment from a blunt blow to the head","c":false,"r":"This does not follow light exposure and has a curtain of vision loss."},{"t":"Acute glaucoma from a sudden rise in eye pressure","c":false,"r":"This does not follow light exposure and often has a fixed pupil."},{"t":"Photokeratitis from ultraviolet light exposure","c":true,"r":""},{"t":"A foreign body lodged deep in the eye","c":false,"r":"This usually affects one eye, not both."}],"i":"Recognizing arc eye.","e":"Ultraviolet light burns the surface of the cornea in both eyes after a delay of hours. Treatment is pain control, lubricant, and a short rest, and it usually resolves within one to two days."},{"id":"T3-28","a":0,"s":"A patient has a stab wound in the neck above the angle of the jaw. Why is a Zone III wound difficult to manage?","o":[{"t":"It is the zone that holds the airway of the patient","c":false,"r":"The airway lies mostly in Zone II."},{"t":"It is hard to reach, and vessels lie near the skull","c":true,"r":""},{"t":"It rarely bleeds or damages the vessels","c":false,"r":"Vessels and nerves are at risk in this zone."},{"t":"It is the easiest zone to see and treat in surgery","c":false,"r":"It is the hardest zone to reach."}],"i":"Understanding the zones of the neck.","e":"Zone III lies between the angle of the jaw and the skull base. Surgical exposure is hard, so angiography and sometimes embolization are used to find and control vessel injuries."},{"id":"T3-29","a":0,"s":"A patient arrives with a kitchen knife in the side of the neck and is stable. What should the prehospital and emergency team do?","o":[{"t":"Pull out the knife and press on the wound with a cloth","c":false,"r":"The knife may be sealing a torn vessel."},{"t":"Leave the object in place and stabilize it for surgery","c":true,"r":""},{"t":"Cut the knife handle off to make the patient comfortable","c":false,"r":"Movement of the blade can cause greater damage."},{"t":"Push the knife deeper to feel where the wound ends","c":false,"r":"This can cause severe injury."}],"i":"Managing an impaled object in the neck.","e":"The blade may plug a torn artery or airway. It is stabilized with bulky padding, and removal takes place in the operating room where bleeding can be controlled."},{"id":"T3-30","a":0,"s":"A stab wound to the neck has penetrated the platysma muscle. What does this mean for the management?","o":[{"t":"The wound can be closed with glue and sent home","c":false,"r":"A deep wound may injure vessels or the airway."},{"t":"The wound is superficial and needs a clean bandage","c":false,"r":"Passing the muscle means the wound is deep."},{"t":"The injury needs imaging or exploration","c":true,"r":""},{"t":"The patient needs no check of the airway or vessels","c":false,"r":"The airway and vessels may be damaged."}],"i":"Evaluating a penetrating neck wound.","e":"The platysma is the thin muscle just under the skin. If the wound goes through it, deeper structures may be hit, so the patient needs CT angiography, or exploration if signs are present."},{"id":"T3-31","a":0,"s":"Which patient should be screened for blunt cerebrovascular injury using the Denver criteria?","o":[{"t":"A patient with a minor sprain of the right ankle joint after a fall","c":false,"r":"There is no risk factor for vessel injury in the neck."},{"t":"A patient with a small abrasion on the left elbow skin","c":false,"r":"There is no risk factor for vessel injury in the neck."},{"t":"A patient with a fracture through the cervical transverse foramen","c":true,"r":""},{"t":"A patient with a mild headache and a normal neck exam","c":false,"r":"There is no risk factor for vessel injury in the neck."}],"i":"Screening for carotid and vertebral artery injury.","e":"Risk factors include a fracture through the transverse foramen, a Le Fort II or III fracture, a basilar skull fracture, and a seat belt sign. A CT angiogram of the neck is the screening test."},{"id":"T3-32","a":1,"s":"After a crash, a patient has a swollen, painful sternoclavicular joint with a hoarse voice, trouble swallowing, and trouble breathing. Which injury should the nurse suspect?","o":[{"t":"An anterior sternoclavicular sprain with mild swelling","c":false,"r":"An anterior injury does not press on the airway or the esophagus."},{"t":"A posterior sternoclavicular dislocation of the chest","c":true,"r":""},{"t":"A simple clavicle fracture in the middle third","c":false,"r":"This does not press on structures behind the sternum."},{"t":"A fracture of the acromion at the tip of the shoulder","c":false,"r":"This is far from the sternum and the airway."}],"i":"Recognizing a dangerous joint dislocation in the chest.","e":"The inner end of the clavicle can be driven backward into the mediastinum. It can compress the trachea, esophagus, or great vessels, so the patient needs urgent imaging and reduction."},{"id":"T3-33","a":1,"s":"Which measurement helps predict respiratory failure in an older adult with multiple rib fractures?","o":[{"t":"The number of steps walked in the hallway each hour","c":false,"r":"This does not directly measure the breathing ability of the patient."},{"t":"An incentive spirometry volume that is low or falling","c":true,"r":""},{"t":"The color of the bruising on the chest wall skin","c":false,"r":"This does not directly measure the breathing ability of the patient."},{"t":"The body temperature taken at the start of a shift","c":false,"r":"This does not directly measure the breathing ability of the patient."}],"i":"Monitoring lung function after rib fractures.","e":"A low or falling spirometry volume shows that pain is limiting breathing. Patients with poor numbers, older age, or several fractures need stronger pain control and closer monitoring."},{"id":"T3-34","a":1,"s":"A patient with six rib fractures takes an anticoagulant and has an elevated INR. Which analgesic technique is likely to be avoided?","o":[{"t":"Scheduled acetaminophen given by mouth or vein","c":false,"r":"This is a safe part of a multimodal plan."},{"t":"A low dose ketamine infusion given by protocol","c":false,"r":"This is a safe part of a multimodal plan when ordered."},{"t":"Lidocaine patches applied over the painful chest","c":false,"r":"This is a safe part of a multimodal plan."},{"t":"A thoracic epidural catheter placed early","c":true,"r":""}],"i":"Choosing safe pain control for rib fractures.","e":"An epidural can cause a spinal blood clot in a patient with a clotting problem. Other options such as nerve blocks in compressible areas, patches, and oral drugs are used."},{"id":"T3-35","a":1,"s":"A patient with rib fractures asks for a tight elastic wrap around the chest for comfort. What should the nurse explain?","o":[{"t":"A tight wrap speeds up the healing of the rib bones","c":false,"r":"Wraps do not speed bone healing."},{"t":"A tight wrap limits breathing and raises pneumonia risk","c":true,"r":""},{"t":"A tight wrap is the main treatment for a flail chest","c":false,"r":"Treatment is pain control and breathing support."},{"t":"A tight wrap prevents all damage to the underlying lung","c":false,"r":"It does not protect the lung and it restricts movement."}],"i":"Avoiding restrictive devices after rib fractures.","e":"Binding stops deep breathing and coughing, which leads to collapsed lung areas and infection. Pain is controlled with medicine and blocks, and the patient is helped to cough and breathe deeply."},{"id":"T3-36","a":1,"s":"A patient with a penetrating lung injury is on positive pressure ventilation and suddenly has seizures, with air bubbles seen in the retinal vessels. What is the cause?","o":[{"t":"A simple pneumothorax that is small in size","c":false,"r":"This does not cause seizures or air in the retinal vessels."},{"t":"A sudden attack of anxiety from the ventilator alarm","c":false,"r":"This does not cause air in the retinal vessels."},{"t":"A drug reaction to the sedative that was just given","c":false,"r":"This does not cause air in the retinal vessels."},{"t":"A systemic air embolism from a bronchovenous fistula","c":true,"r":""}],"i":"Recognizing air embolism after lung trauma.","e":"Positive pressure pushes air from a torn airway into a torn vein, and the air reaches the brain and heart. The patient is placed with the injured side down, given 100 percent oxygen, and rushed to the operating room."},{"id":"T3-37","a":1,"s":"A chest tube is placed for a hemothorax. Where is the tube inserted?","o":[{"t":"In the second space at the midclavicular line, under the rib","c":false,"r":"This is the site for a needle decompression and the vessels run below the rib."},{"t":"In the eighth space at the posterior axillary line, above the rib","c":false,"r":"This is too low and risks injury to the diaphragm."},{"t":"In the fifth space, anterior to the midaxillary line","c":true,"r":""},{"t":"In the first space beside the sternum at the midline","c":false,"r":"This is not a standard site and risks injury to the vessels."}],"i":"Knowing the site of chest tube placement.","e":"The safe triangle in the fifth space avoids the diaphragm and the breast tissue. The tube passes over the top of the rib because the nerve and vessels run along the lower edge."},{"id":"T3-38","a":1,"s":"A chest tube drains milky white fluid several days after a penetrating chest injury. What does this suggest?","o":[{"t":"A chylothorax from injury to the thoracic duct","c":true,"r":""},{"t":"A normal drainage of blood that has thinned over time","c":false,"r":"Blood looks red or dark, not milky white."},{"t":"An infection of the skin around the tube insertion site","c":false,"r":"This does not change the color of the drainage."},{"t":"A leak from the stomach into the left side of the chest","c":false,"r":"Stomach fluid would not look like milk."}],"i":"Recognizing a chylothorax.","e":"The thoracic duct carries fat rich lymph, which is milky. A leak needs a lower fat diet or fasting, and sometimes surgery."},{"id":"T3-39","a":1,"s":"A patient with a lung injury is coughing up large amounts of blood. How should the nurse position the patient?","o":[{"t":"Lying on the uninjured side with the injured side up","c":false,"r":"The blood would run into the healthy lung."},{"t":"Sitting upright and leaning back on the headboard","c":false,"r":"This does not protect the healthy lung from blood."},{"t":"Lying face up and flat with the legs raised","c":false,"r":"The blood could be aspirated into both lungs."},{"t":"Lying on the injured side with that side down","c":true,"r":""}],"i":"Protecting the good lung from bleeding.","e":"Gravity keeps blood in the injured lung and away from the healthy one. The nurse also keeps suction ready, gives oxygen, and prepares for bronchoscopy or intubation."},{"id":"T3-40","a":1,"s":"Which chamber of the heart is most often injured by a penetrating wound to the chest?","o":[{"t":"The left atrium, at the back","c":false,"r":"This lies at the back and is rarely hit."},{"t":"The right atrium","c":false,"r":"This is hit less often, because it is smaller than the front chamber."},{"t":"The right ventricle","c":true,"r":""},{"t":"The left ventricle","c":false,"r":"This is second in frequency, but it is behind the right ventricle."}],"i":"Knowing common sites of heart injury.","e":"The right ventricle lies directly behind the sternum, so it is the most exposed chamber. The left ventricle is the second most common."},{"id":"T3-41","a":1,"s":"A patient has a traumatic cardiac arrest with a pulseless electrical rhythm. Which approach is correct?","o":[{"t":"Give repeated epinephrine and continue chest compressions","c":false,"r":"Drugs and compressions do not fix the underlying cause."},{"t":"Delay all treatment until the cause is found on CT","c":false,"r":"Immediate action is needed."},{"t":"Use a defibrillator and repeat shocks every two minutes","c":false,"r":"The rhythm is not shockable and the cause must be treated."},{"t":"Treat reversible causes such as bleeding and tension","c":true,"r":""}],"i":"Managing traumatic cardiac arrest.","e":"Most traumatic arrests are caused by blood loss, a tension pneumothorax, or tamponade. The team gives blood, decompresses the chest, and relieves tamponade, with thoracotomy for selected patients."},{"id":"T3-42","a":1,"s":"A patient has chest pain and ST elevation in the anterior leads after a blow to the chest with a steering wheel. Which injury is likely?","o":[{"t":"A simple bruise of the skin over the sternum","c":false,"r":"This does not cause ST elevation."},{"t":"A strain of the muscles between the ribs","c":false,"r":"This does not cause ST elevation."},{"t":"An injury to the thoracic duct in the lower chest","c":false,"r":"This does not cause ST elevation."},{"t":"A coronary artery injury, often the left anterior descending","c":true,"r":""}],"i":"Recognizing a coronary injury after blunt trauma.","e":"Blunt force can tear the inner wall of a coronary artery and form a clot. The left anterior descending artery lies in front of the heart and is most often affected."},{"id":"T3-43","a":1,"s":"Why can only 100 to 150 mL of blood cause tamponade when it collects quickly in the pericardial sac?","o":[{"t":"The pericardium does not stretch, so filling is limited","c":true,"r":""},{"t":"The heart muscle becomes thicker after a sudden shock","c":false,"r":"This does not explain a sudden pressure effect."},{"t":"The blood clots and turns into scar tissue in the sac","c":false,"r":"This is not the cause."},{"t":"The lungs fill with the blood from the sac","c":false,"r":"This is not the cause."}],"i":"Understanding why acute tamponade is dangerous.","e":"A slow collection lets the sac stretch, so a large amount can be tolerated. A sudden small amount cannot, and it compresses the heart, so relief by surgery or drainage is urgent."},{"id":"T3-44","a":1,"s":"Two days after endovascular repair of a thoracic aortic injury, a patient cannot move the legs. What is the likely cause?","o":[{"t":"A normal reaction to the pain medicine that was given","c":false,"r":"This does not cause new loss of leg movement."},{"t":"Spinal cord ischemia from loss of blood supply to the cord","c":true,"r":""},{"t":"A pulled muscle in the back from the position on the table","c":false,"r":"This does not cause loss of movement in both legs."},{"t":"A food allergy that has caused a nerve to be inflamed","c":false,"r":"This does not cause loss of movement in both legs."}],"i":"Recognizing a complication of aortic repair.","e":"Covering the aorta can block segmental arteries that feed the spinal cord. The nurse checks leg movement often, and the team may raise the blood pressure or drain spinal fluid."},{"id":"T3-45","a":1,"s":"A patient with a blunt aortic injury is awaiting repair. Which heart rate and blood pressure targets are used?","o":[{"t":"A heart rate above 120 and a systolic pressure above 160 mmHg","c":false,"r":"High pressure raises the wall stress and the risk of rupture."},{"t":"A heart rate of 100 and a systolic pressure of 200 mmHg","c":false,"r":"High pressure raises the wall stress and the risk of rupture."},{"t":"A heart rate of 90 and a systolic pressure below 60 mmHg","c":false,"r":"The pressure would be too low to supply the organs."},{"t":"A heart rate below 80 and a systolic pressure below 120 mmHg","c":true,"r":""}],"i":"Reducing stress on an injured aorta.","e":"Lowering the heart rate and pressure reduces the force on the damaged wall. A beta blocker is used first, and another drug is added if needed, while the patient waits for repair."},{"id":"T3-46","a":1,"s":"Which finding is a hard sign of vascular injury to a limb?","o":[{"t":"Bruising over the thigh without swelling","c":false,"r":"This is a soft sign that may need more tests."},{"t":"A small hematoma that is not growing","c":false,"r":"This is a soft sign that may need more tests."},{"t":"Pulsatile bleeding from the wound","c":true,"r":""},{"t":"Pain in the limb that is relieved by rest","c":false,"r":"This is a soft sign that may need more tests."}],"i":"Separating hard from soft signs of vascular injury.","e":"Hard signs include pulsatile bleeding, an expanding hematoma, absent pulses, a thrill, or a bruit. These signs call for surgery without more tests."},{"id":"T3-47","a":1,"s":"A patient has a stab wound within the box formed by the nipples, the sternal notch, and the costal margins, and is stable. What is the priority?","o":[{"t":"An echocardiogram or pericardial window","c":true,"r":""},{"t":"Discharge with a dressing and wound care at home","c":false,"r":"The wound may involve the heart."},{"t":"Observation for two days with no imaging tests","c":false,"r":"A heart injury can worsen suddenly."},{"t":"A urine drug screen followed by a psychiatric consult","c":false,"r":"This does not address the wound."}],"i":"Evaluating a wound in the cardiac box.","e":"The box covers the area over the heart and great vessels. A stable patient is checked with a FAST exam of the heart or a window, because tamponade can develop quickly."},{"id":"T3-48","a":1,"s":"A patient has fecal contamination found at laparotomy after a colon injury. Which antibiotic coverage is needed?","o":[{"t":"An antiviral drug used for influenza infection","c":false,"r":"Bacteria, not viruses, cause the infection."},{"t":"An antifungal drug used for skin infections","c":false,"r":"The main risk is bacteria."},{"t":"A narrow drug that covers skin organisms","c":false,"r":"Colon bacteria include gram negative and anaerobic organisms."},{"t":"Broad coverage for gram negatives and anaerobes","c":true,"r":""}],"i":"Preventing infection after bowel injury.","e":"Stool is full of anaerobes and gram negative bacteria. The patient gets early antibiotics that cover them, and the wound is often left open."},{"id":"T3-49","a":1,"s":"After a seat belt injury, a patient's CT shows a torn mesentery with no bowel perforation. Why is the patient observed closely for several days?","o":[{"t":"The mesentery grows back and makes a new bowel loop","c":false,"r":"This does not occur."},{"t":"The mesentery injury heals completely within a day","c":false,"r":"The injury can cause delayed loss of blood supply."},{"t":"The bowel may lose its blood supply and perforate later","c":true,"r":""},{"t":"The patient will develop a new rib fracture in a week","c":false,"r":"This is not related."}],"i":"Recognizing delayed bowel ischemia.","e":"A torn mesentery can cut off the blood to a segment of bowel. The bowel may die and perforate after hours or days, so the patient needs serial exams and a low threshold for surgery."},{"id":"T3-50","a":1,"s":"A stable patient has a stab wound to the anterior abdomen and no signs of peritonitis. What is an acceptable approach?","o":[{"t":"Discharge after a single exam within minutes","c":false,"r":"The patient may have a delayed injury."},{"t":"An emergency laparotomy for each stab wound","c":false,"r":"Surgery is not required in a stable patient without peritonitis."},{"t":"A pain medicine and no further exams overnight","c":false,"r":"Delayed signs could be missed."},{"t":"Serial abdominal exams, with CT or surgery if it changes","c":true,"r":""}],"i":"Selective management of abdominal stab wounds.","e":"A stable patient without peritonitis, evisceration, or shock can be observed with repeated exams. Surgery follows any sign of change."},{"id":"T3-51","a":1,"s":"A child hits a bicycle handlebar and has repeated bilious vomiting with a thickened duodenal wall on CT, but no free air. Which diagnosis fits best?","o":[{"t":"An intramural duodenal hematoma managed with decompression","c":true,"r":""},{"t":"A perforation of the stomach with a large air leak","c":false,"r":"There is no free air on the CT."},{"t":"A fracture of the pelvis with bleeding into the bladder wall","c":false,"r":"This does not cause vomiting and a thick duodenal wall."},{"t":"An injury to the spleen with a large blood collection","c":false,"r":"This does not cause a thick duodenal wall."}],"i":"Recognizing duodenal hematoma in a child.","e":"Blunt force can bleed into the duodenal wall and block it. Most children improve with nothing by mouth, a gastric tube, and nutrition by vein for one to two weeks."},{"id":"T3-52","a":1,"s":"Five days after a liver laceration, a patient has fever, right upper quadrant pain, and a fluid collection on CT that contains bile. What is the diagnosis?","o":[{"t":"A normal healing process that needs no treatment","c":false,"r":"Fever and a collection are not normal."},{"t":"A kidney stone that has moved into the bladder","c":false,"r":"This does not match the findings."},{"t":"A biloma from a bile leak, often treated by drainage","c":true,"r":""},{"t":"A spleen infarct from a blocked artery in the abdomen","c":false,"r":"This does not match the findings."}],"i":"Recognizing complications of liver injury.","e":"Injured bile ducts can leak and form a collection. Image guided drainage, and sometimes a stent, treats it, and antibiotics are used if there is infection."},{"id":"T3-53","a":1,"s":"A patient with a splenic injury has pain in the left shoulder when lying flat. What is this sign called?","o":[{"t":"Kehr sign, from blood irritating the diaphragm","c":true,"r":""},{"t":"Cullen sign, from blood tracking to the umbilicus","c":false,"r":"Cullen sign is a bruise at the umbilicus."},{"t":"Grey Turner sign, from bleeding into the flank","c":false,"r":"Grey Turner sign is a bruise on the flank."},{"t":"Battle sign, from a fracture at the base of the skull","c":false,"r":"Battle sign is a bruise behind the ear."}],"i":"Recognizing referred pain from the spleen.","e":"Blood under the left diaphragm irritates the phrenic nerve, so the pain is felt in the left shoulder. It is more obvious when the patient lies flat or with the feet raised."},{"id":"T3-54","a":1,"s":"A patient who is discharged after a nonoperative splenic injury asks about sports. What should the nurse teach?","o":[{"t":"Avoid contact sports and heavy lifting as advised","c":true,"r":""},{"t":"Return to full contact sports the next day","c":false,"r":"The spleen is still healing and can bleed again."},{"t":"Train hard to speed up recovery of the spleen","c":false,"r":"Heavy exertion risks a delayed rupture."},{"t":"Wear a tight belt and play when comfortable","c":false,"r":"A belt does not protect the spleen."}],"i":"Teaching after a splenic injury.","e":"A healing spleen can rupture with a new blow or strain. The patient is told to avoid contact and heavy lifting for weeks to months, and to return for new left sided or shoulder pain."},{"id":"T3-55","a":1,"s":"After liver packing in a damage control operation, when are the packs typically removed?","o":[{"t":"Right away in the intensive care unit at the bedside","c":false,"r":"The packs control bleeding and are removed in the operating room."},{"t":"After 30 days when the patient is back at home","c":false,"r":"This is far too long and risks infection."},{"t":"At no point, since they are designed to stay in the body","c":false,"r":"Packs are removed to prevent infection and other problems."},{"t":"After resuscitation, often within one to three days","c":true,"r":""}],"i":"Understanding packing after liver injury.","e":"Packs control bleeding while the patient is warmed and the clotting is corrected. They are removed at a planned operation, usually within one to three days."},{"id":"T3-56","a":1,"s":"Which entry wound locations suggest a possible diaphragmatic injury?","o":[{"t":"A wound on the scalp above the forehead hairline","c":false,"r":"This is far from the diaphragm."},{"t":"A wound on the lower leg below the knee joint","c":false,"r":"This is far from the diaphragm."},{"t":"A wound on the forearm near the wrist crease","c":false,"r":"This is far from the diaphragm."},{"t":"A wound below the nipple or the scapular tip","c":true,"r":""}],"i":"Knowing the thoracoabdominal zone.","e":"The diaphragm rises to the fourth space on full breathing out. Wounds between the nipple line and the lower ribs, or the scapula and the lower ribs, can injure both chest and abdomen."},{"id":"T3-57","a":1,"s":"A patient who was stabbed in the left lower chest two years ago has vomiting and abdominal pain, and the x-ray shows bowel loops in the left chest. What is the likely cause?","o":[{"t":"A new pneumonia from a recent cold in the family","c":false,"r":"This does not explain bowel in the chest."},{"t":"A normal variation in the shape of the lung","c":false,"r":"This is not normal."},{"t":"A missed diaphragmatic injury with a late herniation","c":true,"r":""},{"t":"A food allergy that causes swelling of the stomach","c":false,"r":"This does not explain bowel in the chest."}],"i":"Recognizing late presentation of a diaphragm injury.","e":"A small tear does not heal, and the pressure difference pulls organs through it. It can present months or years later with obstruction or strangulation."},{"id":"T3-58","a":1,"s":"A patient with a diaphragmatic rupture after a crash most often has which other injuries?","o":[{"t":"A broken finger from a minor fall at home","c":false,"r":"The force that tears the diaphragm is large."},{"t":"A mild sunburn from time spent outdoors","c":false,"r":"This is not related."},{"t":"A minor bruise of the knee from a bump","c":false,"r":"The force that tears the diaphragm is large."},{"t":"Liver, spleen, and pelvic injuries","c":true,"r":""}],"i":"Expecting associated injuries.","e":"Blunt rupture needs a sudden rise in abdominal pressure, so it usually occurs with other significant abdominal and pelvic injuries. The nurse looks for them."},{"id":"T3-59","a":1,"s":"During a laparotomy for penetrating trauma, which retroperitoneal hematoma is always explored?","o":[{"t":"A small stable hematoma in the pelvis in zone 3","c":false,"r":"Zone 3 hematomas are usually left alone."},{"t":"A central midline hematoma in zone 1","c":true,"r":""},{"t":"A small contained hematoma at the edge of the flank","c":false,"r":"These are often observed when stable."},{"t":"A hematoma in the abdominal wall muscles","c":false,"r":"This is not retroperitoneal."}],"i":"Knowing how retroperitoneal hematomas are managed.","e":"Zone 1 holds the aorta, vena cava, pancreas, and duodenum. A central hematoma may hide a major injury, so it is explored."},{"id":"T3-60","a":1,"s":"A stable patient has a grade III kidney laceration on CT with no active bleeding. Which plan is correct?","o":[{"t":"Immediate removal of the kidney in the operating room today","c":false,"r":"Most kidney injuries in stable patients are managed without surgery."},{"t":"Discharge home on the same day with no follow up","c":false,"r":"The patient needs monitoring for bleeding."},{"t":"Nonoperative care with bed rest, serial exams, and labs","c":true,"r":""},{"t":"Intense exercise to help the kidney heal quickly","c":false,"r":"Exercise can cause bleeding."}],"i":"Managing a stable kidney injury.","e":"Most blunt kidney injuries heal without surgery. The nurse watches for falling hemoglobin, rising pain, and flank swelling, and follow up imaging is used for high grade tears."},{"id":"T3-61","a":1,"s":"Why might amylase and lipase be normal in the first hours after a pancreatic injury?","o":[{"t":"The pancreas is rarely injured by blunt trauma","c":false,"r":"The pancreas can be injured by a blow to the upper abdomen."},{"t":"Enzymes take hours to rise, so repeat tests and CT","c":true,"r":""},{"t":"The enzymes are removed by the lungs at once","c":false,"r":"They are not cleared this way."},{"t":"The enzymes stay normal in many pancreatic injuries","c":false,"r":"The levels often rise later."}],"i":"Interpreting enzymes in pancreatic trauma.","e":"An early normal value does not rule out injury. The nurse expects repeat tests and a CT, and a high or rising level suggests injury."},{"id":"T3-62","a":1,"s":"An 82 year old falls from standing and has groin pain and fractures of the pubic rami. Which statement is correct?","o":[{"t":"It can cause major blood loss and needs pain control","c":true,"r":""},{"t":"It is trivial and needs no analgesia or assessment","c":false,"r":"These fractures can bleed and cause serious pain."},{"t":"It requires an immediate operation on the pelvis","c":false,"r":"Many are treated without surgery."},{"t":"It can be treated with bed rest for several weeks","c":false,"r":"Prolonged bed rest leads to complications."}],"i":"Caring for a low energy pelvic fracture.","e":"Even a low energy fracture can bleed, especially on anticoagulants. Good pain control and early movement lower the risk of pneumonia, clots, and loss of function."},{"id":"T3-63","a":1,"s":"A patient with a sacral fracture reports numbness in the perineum and trouble passing urine. What should the nurse suspect?","o":[{"t":"A simple muscle strain of the lower back","c":false,"r":"A strain does not cause numbness and retention."},{"t":"Injury to the sacral nerve roots from the fracture","c":true,"r":""},{"t":"A skin rash of the groin from a recent fall","c":false,"r":"This does not cause retention."},{"t":"A mild fever from an infection of the urine","c":false,"r":"This does not cause retention."}],"i":"Recognizing nerve injury with a sacral fracture.","e":"The sacral roots control the bladder, bowel, and perineal sensation. Fractures through the sacral foramina can injure them, and the patient needs a neurologic exam and bladder care."},{"id":"T3-64","a":1,"s":"Which placement zone is used for REBOA in a patient with severe pelvic hemorrhage?","o":[{"t":"Zone 3, below the renal arteries","c":true,"r":""},{"t":"Zone 1, above the diaphragm in the upper chest","c":false,"r":"This zone is used for bleeding in the abdomen."},{"t":"Zone 2, between the celiac and renal arteries","c":false,"r":"This zone is not used because it blocks the blood to the organs."},{"t":"Zone 0, in the neck near the carotid arteries","c":false,"r":"There is no such zone."}],"i":"Knowing REBOA zones.","e":"Zone 3 lies between the lowest renal artery and the aortic split. A balloon here stops bleeding into the pelvis and keeps the blood going to the kidneys and gut."},{"id":"T3-65","a":1,"s":"Which complication is a major risk of leaving the aortic balloon inflated for a long time?","o":[{"t":"A permanent rise in the blood pressure of the arms","c":false,"r":"The main risk is ischemia below the balloon."},{"t":"Ischemia of the legs and organs below the balloon","c":true,"r":""},{"t":"A long term loss of hearing in both ears","c":false,"r":"This is not related to the procedure."},{"t":"A new kidney stone that forms in the bladder","c":false,"r":"This is not related to the procedure."}],"i":"Knowing the risks of aortic occlusion.","e":"The balloon stops all flow below it. The time is recorded and kept as short as possible, and the nurse watches the legs for pallor and loss of pulse."},{"id":"T3-66","a":1,"s":"A patient had bilateral internal iliac artery embolization for a pelvic bleed and now has buttock pain when walking. What is the likely cause?","o":[{"t":"Ischemia of the gluteal muscles from low blood flow","c":true,"r":""},{"t":"An allergic reaction to the antibiotic that was given","c":false,"r":"This does not cause pain with walking."},{"t":"An infection of the lung from the long time in bed","c":false,"r":"This does not cause pain in the buttock."},{"t":"Dehydration from the contrast used during the study","c":false,"r":"This does not cause pain in the buttock."}],"i":"Recognizing a complication of embolization.","e":"The internal iliac arteries supply the buttock muscles. Blocking them can lead to pain, weakness, and sometimes tissue death, so the nurse checks the skin and reports pain."},{"id":"T3-67","a":1,"s":"Why can a standard CT scan with intravenous contrast miss a bladder rupture?","o":[{"t":"The bladder is not visible on a CT scan","c":false,"r":"The bladder is visible, but a leak needs distension."},{"t":"The bladder must be filled with contrast to show a leak","c":true,"r":""},{"t":"The contrast from the vein goes straight to the bladder wall","c":false,"r":"Contrast in the urine does not distend the bladder."},{"t":"Bladder injuries are seen when the kidneys look normal","c":false,"r":"Kidneys can be normal with a bladder tear."}],"i":"Knowing how bladder injuries are diagnosed.","e":"A leak shows only when the bladder is filled to at least 300 mL with dilute contrast. The test is a CT cystogram."},{"id":"T3-68","a":1,"s":"A man with a pelvic fracture cannot void, and a catheter cannot be passed after a retrograde urethrogram shows a urethral disruption. Which drainage is placed?","o":[{"t":"A suprapubic catheter through the abdominal wall","c":true,"r":""},{"t":"A larger urinary catheter forced through the urethra","c":false,"r":"Forcing worsens the urethral injury."},{"t":"No drainage while waiting for the bladder to empty","c":false,"r":"The bladder will become over distended."},{"t":"A nephrostomy tube placed in the kidney itself","c":false,"r":"The bladder drainage is needed instead."}],"i":"Draining the bladder after a urethral injury.","e":"A suprapubic catheter bypasses the injured urethra. The urethra is repaired later, once the swelling has gone down."},{"id":"T3-69","a":1,"s":"After a repair of a bladder rupture, when is the urinary catheter usually removed?","o":[{"t":"On the same day as the surgery, before the patient wakes","c":false,"r":"The bladder needs time to heal."},{"t":"After the patient has been home for three months","c":false,"r":"This is far too long."},{"t":"After 7 to 14 days, once a cystogram shows healing","c":true,"r":""},{"t":"At no time, since the catheter is permanent","c":false,"r":"The catheter is temporary."}],"i":"Caring for a bladder repair.","e":"The catheter keeps the bladder empty while the suture line heals. A cystogram confirms that no leak remains before the catheter is removed."},{"id":"T3-70","a":2,"s":"A patient was in a crash with sudden deceleration and has a fracture through the pedicles of C2 with forward slip of C2 on C3. What is this injury called?","o":[{"t":"A Jefferson fracture, a burst fracture of the ring of C1","c":false,"r":"This is a burst of the C1 ring from an axial load."},{"t":"A Hangman fracture, or traumatic spondylolisthesis of C2","c":true,"r":""},{"t":"A clay shoveler fracture of a spinous process","c":false,"r":"This is a stable avulsion of a spinous process."},{"t":"A Chance fracture, a flexion distraction injury","c":false,"r":"This is an injury of the lower thoracic or lumbar spine."}],"i":"Naming a cervical fracture.","e":"Hyperextension with distraction breaks both pedicles of C2. The injury is often unstable, so the patient needs a collar and spinal care, and the cord may be spared."},{"id":"T3-71","a":2,"s":"A patient has a burst fracture of L1 with bone fragments pushed into the spinal canal. Which assessment is a priority?","o":[{"t":"Repeated checks of the grip strength of the hand","c":false,"r":"The injury is in the lower spine, not the arms."},{"t":"Serial exams of leg strength, sensation, and bladder","c":true,"r":""},{"t":"Daily hearing tests for both ears of the patient","c":false,"r":"This does not relate to the injury."},{"t":"Measurement of the temperature of the forehead","c":false,"r":"This does not detect a worsening cord injury."}],"i":"Monitoring a thoracolumbar burst fracture.","e":"Fragments can compress the conus or the roots. A new weakness, numbness, or urinary retention signals worsening and may need urgent decompression."},{"id":"T3-72","a":2,"s":"A patient has a bilateral facet dislocation at C6 and C7 after a diving injury. Which finding is most likely?","o":[{"t":"A normal neurologic exam with mild neck pain","c":false,"r":"This injury is severe and is often unstable."},{"t":"An isolated pain in the elbow joint with no other signs","c":false,"r":"This does not describe the injury."},{"t":"A loss of smell with normal strength and sensation","c":false,"r":"This is not related to the neck injury."},{"t":"A complete spinal cord injury with loss of function below","c":true,"r":""}],"i":"Recognizing a severe cervical injury.","e":"Both facets jump forward and the spinal canal narrows to half its width. Complete cord injury is common, and the patient needs urgent reduction and strict precautions."},{"id":"T3-73","a":2,"s":"Which finding is a late sign of compartment syndrome?","o":[{"t":"Pain that increases with passive stretch of the muscle","c":false,"r":"This is an early and reliable sign."},{"t":"Tense swelling of the limb under tight skin","c":false,"r":"This is an early sign."},{"t":"Pain that is greater than expected for the injury","c":false,"r":"This is an early sign."},{"t":"Pulselessness and paralysis of the limb","c":true,"r":""}],"i":"Recognizing the stages of compartment syndrome.","e":"Loss of pulse, paralysis, and pallor come late, when muscle and nerve are already dying. The nurse acts on the early signs of tense swelling and pain."},{"id":"T3-74","a":2,"s":"A sedated, ventilated patient has a crushed lower leg with tense swelling. Why is measuring the compartment pressure important?","o":[{"t":"The patient cannot report pain, so the exam fails","c":true,"r":""},{"t":"The pressure measurement replaces the need for an exam","c":false,"r":"Both the exam and pressures are used."},{"t":"The pressure is normal in a sedated patient","c":false,"r":"Sedation does not change the pressure."},{"t":"The test is needed for the arm and not for the leg","c":false,"r":"Any compartment can be affected."}],"i":"Diagnosing compartment syndrome in a patient who cannot report symptoms.","e":"Pain is the main early sign, and sedation hides it. Pressure measurement and a high index of suspicion find the problem early so that fasciotomy can be done."},{"id":"T3-75","a":2,"s":"After a below the knee amputation, how should the nurse position the residual limb to prevent contracture?","o":[{"t":"Keep a pillow under the knee at all times for comfort","c":false,"r":"This bends the knee and leads to a contracture."},{"t":"Hang the limb over the side of the bed for a day","c":false,"r":"This causes swelling and a contracture."},{"t":"Keep the knee straight, with no pillow under the knee","c":true,"r":""},{"t":"Keep the knee bent and the hip bent while sitting for hours","c":false,"r":"This leads to a contracture."}],"i":"Preventing contracture after amputation.","e":"A bent knee or hip stiffens quickly and makes a prosthesis hard to use. The nurse keeps the joints straight when lying, and elastic wrap shapes the limb."},{"id":"T3-76","a":2,"s":"What is the usual maximum time that a limb tourniquet should stay on before the risk of nerve and muscle injury rises sharply?","o":[{"t":"About ten minutes","c":false,"r":"This is much too short."},{"t":"About two hours","c":true,"r":""},{"t":"About twelve hours","c":false,"r":"This is far too long."},{"t":"About two days","c":false,"r":"This is far too long."}],"i":"Knowing the safe tourniquet time.","e":"Injury to nerve and muscle increases after about two hours. The time must be recorded, and the tourniquet is moved or changed by the surgical team as soon as bleeding can be controlled otherwise."},{"id":"T3-77","a":2,"s":"How soon should surgery be done for a hip fracture in an older adult who is medically stable?","o":[{"t":"After about two weeks of bed rest in the hospital","c":false,"r":"Delay increases the risk of complications."},{"t":"After the patient is able to walk well again","c":false,"r":"Surgery is needed to allow walking."},{"t":"After six months of rehabilitation at home","c":false,"r":"Surgery is not delayed this long."},{"t":"Within 24 to 48 hours of admission","c":true,"r":""}],"i":"Timing hip fracture surgery.","e":"Early repair reduces pain, pneumonia, pressure injury, and death. The team treats anticoagulants and other issues fast so that surgery is not delayed."},{"id":"T3-78","a":2,"s":"A patient has a fracture of the middle of the humerus and now cannot extend the wrist or fingers, which hang down. Which nerve is injured?","o":[{"t":"The median nerve","c":false,"r":"Injury causes weakness of the thumb and the first fingers."},{"t":"The ulnar nerve","c":false,"r":"Injury causes weakness of the little and ring fingers."},{"t":"The radial nerve","c":true,"r":""},{"t":"The musculocutaneous nerve","c":false,"r":"Injury causes weak elbow bending."}],"i":"Linking fractures to nerve injury.","e":"The radial nerve winds around the shaft of the humerus. Injury causes a wrist drop, and the nurse documents the nerve function before and after the splint."},{"id":"T3-79","a":2,"s":"A patient has a flap of skin torn from the lower leg, still attached at one edge, with a bruised and pale color. What is this injury?","o":[{"t":"A minor scrape that heals with a bandage and ointment","c":false,"r":"The wound is much deeper than a scrape."},{"t":"A first degree burn that needs cool water","c":false,"r":"It is not a burn."},{"t":"A degloving injury that needs surgical evaluation","c":true,"r":""},{"t":"A healthy flap that the nurse can stitch back","c":false,"r":"The flap may not survive and needs a surgeon."}],"i":"Recognizing a degloving injury.","e":"The skin and fat are torn from the deeper tissue and the blood supply is cut. The flap is covered with a moist dressing and not discarded, because a surgeon may use it."},{"id":"T3-80","a":2,"s":"A patient has a dirty laceration and has never received a tetanus vaccine. What is the correct prevention?","o":[{"t":"A tetanus booster given in the same arm as the last one","c":false,"r":"A patient with no vaccine needs immune globulin too."},{"t":"No treatment since the wound is clean enough","c":false,"r":"The wound is dirty and the patient has no immunity."},{"t":"An oral antibiotic for several days alone","c":false,"r":"Antibiotics do not prevent tetanus."},{"t":"Tetanus immune globulin and the vaccine at separate sites","c":true,"r":""}],"i":"Preventing tetanus.","e":"A patient without full immunization and with a dirty wound needs both immediate passive protection and the start of the vaccine series. Different sites are used so the products do not interact."},{"id":"T3-81","a":2,"s":"A patient has a patellar dislocation to the side with the knee bent. What is the usual reduction method?","o":[{"t":"Gently extend the knee and guide the patella back","c":true,"r":""},{"t":"Bend the knee further to force the patella into place","c":false,"r":"This worsens the dislocation."},{"t":"Apply heat for several days and wait for it to settle","c":false,"r":"The patella needs to be reduced."},{"t":"Remove the kneecap in the emergency department","c":false,"r":"This is not done."}],"i":"Reducing a patellar dislocation.","e":"Straightening the knee relaxes the quadriceps, and the patella slides back easily. The knee is then checked for fractures and splinted."},{"id":"T3-82","a":2,"s":"Why should a posterior hip dislocation be reduced within about six hours?","o":[{"t":"The hip becomes a different shape after six hours of delay","c":false,"r":"The concern is the blood supply."},{"t":"The patient will have an infection of the skin","c":false,"r":"The concern is the blood supply."},{"t":"The pain medicine stops working after six hours","c":false,"r":"This is not the reason."},{"t":"Delay raises the risk of death of the femoral head","c":true,"r":""}],"i":"Preventing avascular necrosis.","e":"The femoral head has a fragile blood supply that is kinked in a dislocation. Quick reduction lowers the risk of avascular necrosis."},{"id":"T3-83","a":3,"s":"Why is a clinical frailty assessment useful for an older trauma patient?","o":[{"t":"It replaces the need for a physical examination","c":false,"r":"It supports the exam and does not replace it."},{"t":"It decides which medicines the patient must avoid","c":false,"r":"It does not assess allergies."},{"t":"It predicts outcome and guides goals of care talks","c":true,"r":""},{"t":"It measures the severity of the injury to the bone","c":false,"r":"It measures the patient's baseline health."}],"i":"Using frailty to guide care.","e":"Frail patients have higher death and complication rates from the same injury. Early talks with the patient and family about goals help match care to wishes."},{"id":"T3-84","a":3,"s":"An 85 year old has a wound infection but a temperature of only 37.1 degrees Celsius. What is the explanation?","o":[{"t":"The patient has no infection since the temperature is normal","c":false,"r":"A normal temperature does not rule out infection."},{"t":"Older adults often have a weaker fever response","c":true,"r":""},{"t":"The thermometer is wrong in older adults","c":false,"r":"The reading is likely correct."},{"t":"The wound cannot be infected without a high fever","c":false,"r":"Infection can occur without a fever."}],"i":"Recognizing an atypical presentation.","e":"Aging dampens the fever response. Confusion, a fast heart rate, or a new weakness may be the only sign of infection."},{"id":"T3-85","a":3,"s":"An older adult has thin fragile skin and is receiving a dressing change. Which action reduces the risk of skin tears?","o":[{"t":"Use strong adhesive tape and pull the dressings off fast","c":false,"r":"This tears fragile skin."},{"t":"Use silicone based tape and remove dressings gently","c":true,"r":""},{"t":"Use a rough cloth to scrub the skin clean","c":false,"r":"This tears fragile skin."},{"t":"Leave the dressing on for several weeks","c":false,"r":"This risks infection and skin breakdown."}],"i":"Protecting fragile skin.","e":"Aging skin is thin. Silicone adhesives are gentle, and adhesive remover and padded surfaces help protect the skin."},{"id":"T3-86","a":3,"s":"Which cuffed endotracheal tube size is estimated for an 8 year old child?","o":[{"t":"5.5 mm, using age divided by 4 plus 3.5","c":true,"r":""},{"t":"3.0 mm, the size used for a newborn baby","c":false,"r":"This is too small."},{"t":"8.0 mm, the same as the age in years","c":false,"r":"This is too large."},{"t":"7.5 mm, the size used for a small adult","c":false,"r":"This is too large."}],"i":"Choosing an airway size in a child.","e":"The formula for a cuffed tube is age divided by 4 plus 3.5, so 8 divided by 4 is 2, and 2 plus 3.5 is 5.5. A length based tape is also used."},{"id":"T3-87","a":3,"s":"A child in hemorrhagic shock has not improved after three 20 mL/kg crystalloid boluses. What is the next step?","o":[{"t":"Give a fourth and fifth crystalloid bolus without blood","c":false,"r":"More crystalloid dilutes clotting factors."},{"t":"Give packed red blood cells at 10 mL/kg","c":true,"r":""},{"t":"Give oral fluids by a bottle every hour","c":false,"r":"This does not replace blood."},{"t":"Wait and observe for another hour in a warm room","c":false,"r":"Delay is harmful in shock."}],"i":"Resuscitating a child with ongoing bleeding.","e":"After about 40 to 60 mL/kg of crystalloid, a child with ongoing shock needs blood. Packed red cells at 10 mL/kg are given, and the team looks for a bleeding source."},{"id":"T3-88","a":3,"s":"Which pain scale is best for a 2 year old who cannot report pain?","o":[{"t":"The numeric rating scale from 0 to 10 for pain","c":false,"r":"The child is too young to use this."},{"t":"The FLACC scale of face, legs, activity, cry","c":true,"r":""},{"t":"The Glasgow Coma Scale for level of coma","c":false,"r":"This rates consciousness."},{"t":"The Braden scale for pressure injury risk","c":false,"r":"This rates pressure injury risk."}],"i":"Assessing pain in a young child.","e":"FLACC uses behaviors in five categories and gives a score from 0 to 10. It is used for infants and children who cannot report pain."},{"id":"T3-89","a":3,"s":"A pregnant woman at 32 weeks has a PaCO2 of 40 mmHg and is breathing fast and tiring. How should the nurse interpret the value?","o":[{"t":"It is a normal value and means all is well","c":false,"r":"The normal value in pregnancy is about 30 mmHg."},{"t":"It is too low and needs a rebreathing bag","c":false,"r":"It is not too low."},{"t":"It is abnormally high for pregnancy and may mean failure","c":true,"r":""},{"t":"It is an error from the position of the patient","c":false,"r":"It should be taken at face value."}],"i":"Knowing the changes of pregnancy.","e":"Pregnant women breathe faster, so the PaCO2 normally falls to about 28 to 32 mmHg. A value of 40 in a tiring patient means that she is failing."},{"id":"T3-90","a":3,"s":"How should a pregnant patient wear a three point seat belt?","o":[{"t":"With the lap belt over the top of the abdomen and bump","c":false,"r":"This can cause uterine injury."},{"t":"With the lap belt low across the hips, under the bump","c":true,"r":""},{"t":"Without the shoulder belt for more comfort","c":false,"r":"The shoulder belt adds protection."},{"t":"Not at all, because belts can harm the fetus","c":false,"r":"Belts protect the mother and fetus."}],"i":"Teaching injury prevention in pregnancy.","e":"The lap belt below the bump and the shoulder belt between the breasts spread force over the strong pelvis and chest. Use of a belt greatly reduces harm to the fetus."},{"id":"T3-91","a":3,"s":"What is the best way to protect the fetus of a pregnant trauma patient who is in shock?","o":[{"t":"Perform an immediate cesarean birth for each patient","c":false,"r":"Delivery is only for selected patients."},{"t":"Treat the fetus and delay care of the mother","c":false,"r":"The mother's condition comes first."},{"t":"Resuscitate the mother first and fully","c":true,"r":""},{"t":"Give no blood products to avoid exposing the fetus","c":false,"r":"Blood is needed to save both."}],"i":"Prioritizing care in pregnancy.","e":"The fetus depends on the mother's blood flow. Fixing her airway, breathing, and circulation is the best care for both."},{"id":"T3-92","a":3,"s":"A worker has an alkali burn on the forearm from wet cement. How long should the skin be irrigated?","o":[{"t":"For 30 seconds, until the skin looks visibly clean","c":false,"r":"This is too short for an alkali burn."},{"t":"With a strong acid to neutralize the alkali","c":false,"r":"This can cause a heat reaction and further injury."},{"t":"Not at all, since the burn is on the skin","c":false,"r":"Prompt irrigation is the most important treatment."},{"t":"For at least 30 minutes, until the pH is neutral","c":true,"r":""}],"i":"Treating chemical burns.","e":"Alkali burns penetrate and continue to injure, so irrigation lasts longer than for acids. The nurse checks the pH with litmus paper and keeps going until it is neutral."},{"id":"T3-93","a":3,"s":"Lightning has struck a group of people, and several are not breathing and have no pulse. Which patients are treated first?","o":[{"t":"Those in cardiac arrest, since they often respond to CPR","c":true,"r":""},{"t":"Those who are talking and have minor burns on the arms","c":false,"r":"They are lower priority than patients in arrest."},{"t":"Those who have been dead for hours and are cold","c":false,"r":"These patients are lower priority."},{"t":"Those who are walking and have minor pain","c":false,"r":"They are lower priority than patients in arrest."}],"i":"Triage after lightning.","e":"Lightning can stop the heart and breathing in many victims at once. The usual triage is reversed, so apparently dead patients are treated first since they often respond to quick CPR."},{"id":"T3-94","a":3,"s":"Which fluid target is used to guide resuscitation in an adult with a major burn?","o":[{"t":"A urine output of about 10 mL/kg per hour","c":false,"r":"This indicates overload."},{"t":"A urine output of about 0.5 mL/kg per hour","c":true,"r":""},{"t":"No urine output at all, with dry skin","c":false,"r":"This is a sign of poor perfusion."},{"t":"A urine output of 5 mL per hour in total","c":false,"r":"This is too low and is a sign of shock."}],"i":"Titrating burn fluids.","e":"The formula gives a starting rate. The nurse then adjusts the rate every hour to keep the urine output at about 0.5 mL/kg per hour, to avoid under and over resuscitation."},{"id":"T3-95","a":3,"s":"A patient with burns of the face has a hoarse voice, singed nasal hairs, and soot in the mouth. What should the nurse anticipate?","o":[{"t":"Early intubation before airway swelling progresses","c":true,"r":""},{"t":"Observation until breathing becomes difficult","c":false,"r":"Swelling can close the airway quickly and make intubation impossible."},{"t":"Humidified air by mask alone and no airway","c":false,"r":"The risk is swelling in the airway."},{"t":"Discharge after a throat lozenge for the hoarseness","c":false,"r":"The patient has a high risk of airway loss."}],"i":"Recognizing an inhalation injury.","e":"Heat and smoke cause swelling that can close the airway over hours. Early intubation is safer than waiting, when the airway may be too swollen to open."},{"id":"T3-96","a":3,"s":"Which action helps prevent skin injury in a patient who weighs 200 kg?","o":[{"t":"Use a standard stretcher and drag the patient across","c":false,"r":"This risks injury to the patient and staff."},{"t":"Leave the skin folds damp to keep them soft","c":false,"r":"Moisture causes skin breakdown."},{"t":"Turn the patient once each day and no more","c":false,"r":"This is not often enough."},{"t":"Use rated beds and lifts, and check the skin folds","c":true,"r":""}],"i":"Caring for a bariatric patient.","e":"Large body size raises pressure and moisture in skin folds. Proper equipment, enough staff, frequent turns, and dry folds lower the risk of injury."},{"id":"T3-97","a":3,"s":"An older adult has unexplained bank withdrawals and a caregiver who controls access to all money, and the patient appears afraid. Which type of abuse is this?","o":[{"t":"A normal part of aging that needs no report","c":false,"r":"This should be reported."},{"t":"Financial exploitation, reported to protective services","c":true,"r":""},{"t":"Self neglect with no other person involved","c":false,"r":"A caregiver is involved."},{"t":"An allergic reaction to a new medicine","c":false,"r":"This is not related to the findings."}],"i":"Recognizing elder abuse.","e":"Elder abuse includes physical, emotional, financial, and sexual abuse and neglect. Nurses are mandated reporters in most states."},{"id":"T3-98","a":3,"s":"A patient who may be a victim of trafficking is not ready to speak about it. What should the nurse do?","o":[{"t":"Insist on an immediate full confession","c":false,"r":"This can harm trust and safety."},{"t":"Call the suspected trafficker in to answer questions","c":false,"r":"This can endanger the patient."},{"t":"Tell the patient to leave and not return","c":false,"r":"This does not help the patient."},{"t":"Offer the hotline number discreetly and ensure safety","c":true,"r":""}],"i":"Supporting a possible trafficking victim.","e":"A trusting, safe contact leaves the door open. A small card with the hotline can be given in private, and the policy for reporting is followed."},{"id":"T3-99","a":3,"s":"The surgeon removes a bullet from a patient with a gunshot wound. How should the nurse handle it?","o":[{"t":"Throw it in the sharps container with the needles","c":false,"r":"It is evidence and should be kept."},{"t":"Wear gloves, avoid marking it, and use chain of custody","c":true,"r":""},{"t":"Scratch the patient's name on the metal to label it","c":false,"r":"Marking alters the evidence."},{"t":"Give it to the family as a keepsake of the event","c":false,"r":"It is evidence and must go to the police."}],"i":"Preserving evidence.","e":"Marks from instruments can destroy features that match a bullet to a gun. The item is placed in a labeled container, and each person who handles it signs."},{"id":"T3-100","a":3,"s":"Which tool is used to screen a trauma patient for the risk of suicide?","o":[{"t":"The Braden scale for pressure injury risk","c":false,"r":"This rates the risk of pressure injury."},{"t":"The Morse Fall Scale for fall risk","c":false,"r":"This rates the risk of falling."},{"t":"The Ask Suicide Screening Questions tool","c":true,"r":""},{"t":"The Glasgow Coma Scale for coma","c":false,"r":"This rates the level of consciousness."}],"i":"Screening for suicide risk.","e":"A brief set of questions finds patients at risk. A positive screen leads to a safe room, observation, and a full mental health evaluation."},{"id":"T3-101","a":3,"s":"A patient who takes prednisone daily for years is hypotensive after trauma and does not respond to fluids and blood. Which treatment should be considered?","o":[{"t":"A high dose of insulin to lower the glucose","c":false,"r":"This does not treat the low pressure."},{"t":"Stress dose steroids for adrenal insufficiency","c":true,"r":""},{"t":"A large dose of a diuretic to remove fluid","c":false,"r":"This would lower the pressure further."},{"t":"Oral calcium tablets to raise the blood pressure","c":false,"r":"This does not treat adrenal insufficiency."}],"i":"Recognizing adrenal insufficiency.","e":"Long term steroids suppress the adrenal glands, and injury raises the need for cortisol. Hydrocortisone is given when shock does not respond to fluids."},{"id":"T3-102","a":3,"s":"Why does a patient with cirrhosis bleed more after a trauma?","o":[{"t":"The liver makes fewer clotting factors, and platelets fall","c":true,"r":""},{"t":"The liver makes extra clotting factors in cirrhosis disease","c":false,"r":"The opposite is true."},{"t":"The blood becomes thicker and slows the bleeding","c":false,"r":"The blood does not clot well."},{"t":"The kidneys remove clotting factors from the blood","c":false,"r":"The liver is the cause."}],"i":"Recognizing the effect of liver disease.","e":"A scarred liver produces fewer clotting factors, and an enlarged spleen traps platelets. Patients bleed more, and mortality after trauma is higher."},{"id":"T3-103","a":3,"s":"A patient with a head injury smells of alcohol and is drowsy. How should the nurse interpret the drowsiness?","o":[{"t":"Assume the alcohol explains the drowsiness","c":false,"r":"A brain injury could be missed."},{"t":"Wait for the patient to sober up before testing","c":false,"r":"Delay could be fatal."},{"t":"Treat it as a possible brain injury until ruled out","c":true,"r":""},{"t":"Discharge the patient to a friend for the night","c":false,"r":"The patient may have a serious injury."}],"i":"Avoiding bias in intoxicated patients.","e":"Alcohol can mask a brain injury. A drowsy patient needs a full exam, a CT of the head, and repeated neurologic checks."},{"id":"T3-104","a":3,"s":"A patient who takes buprenorphine for opioid use disorder has a painful fracture. Which approach is correct?","o":[{"t":"Stop buprenorphine and refuse pain medicine","c":false,"r":"This leaves pain untreated and risks relapse."},{"t":"Continue buprenorphine and add multimodal pain control","c":true,"r":""},{"t":"Give pain medicine from the street if needed","c":false,"r":"This is unsafe."},{"t":"Give a standard dose of a mild drug and nothing more","c":false,"r":"The patient may need higher doses."}],"i":"Managing pain in a patient on maintenance therapy.","e":"Stopping therapy risks relapse. Buprenorphine is continued, often split into more frequent doses, and nerve blocks and nonopioid drugs are added."},{"id":"T3-105","a":4,"s":"Which films are obtained as adjuncts to the primary survey in a trauma patient?","o":[{"t":"A skull x-ray and a wrist x-ray film","c":false,"r":"These are not routine adjuncts to the primary survey."},{"t":"A spine series and a foot x-ray","c":false,"r":"These are not routine adjuncts to the primary survey."},{"t":"A chest x-ray and a pelvic x-ray","c":true,"r":""},{"t":"A knee x-ray and an ankle x-ray","c":false,"r":"These are not routine adjuncts to the primary survey."}],"i":"Knowing primary survey adjuncts.","e":"The chest and pelvis can hide life threats such as a hemothorax or a pelvic fracture. They are done in the trauma bay without delaying resuscitation, along with the FAST exam."},{"id":"T3-106","a":4,"s":"When may an oropharyngeal airway be used?","o":[{"t":"In an unconscious patient with no gag reflex","c":true,"r":""},{"t":"In an awake patient who is gagging and coughing","c":false,"r":"It can cause vomiting and aspiration."},{"t":"In a patient who is talking and breathing normally","c":false,"r":"It is not needed."},{"t":"In a patient with a clenched jaw and a gag reflex","c":false,"r":"It cannot be placed and can cause vomiting."}],"i":"Using airway adjuncts.","e":"The device holds the tongue off the back of the throat. A patient with a gag reflex will vomit, so a nasopharyngeal airway or other options are used."},{"id":"T3-107","a":4,"s":"During the secondary survey, a patient with a pelvic fracture has a high riding prostate and blood at the meatus. What does the nurse do?","o":[{"t":"Avoid placing a urinary catheter and report it","c":true,"r":""},{"t":"Insert a large urinary catheter to drain the bladder","c":false,"r":"This can worsen a urethral injury."},{"t":"Remove the pelvic binder for a better exam","c":false,"r":"This could restart bleeding."},{"t":"Perform repeated rectal exams to check the prostate","c":false,"r":"This is not needed."}],"i":"Finding a urethral injury.","e":"These signs suggest a urethral tear. A retrograde urethrogram is done first, and if the bladder needs draining, a suprapubic catheter may be used."},{"id":"T3-108","a":4,"s":"During the secondary survey, the nurse feels crackling under the skin of the lateral chest wall. Which condition should be suspected?","o":[{"t":"A skin infection from a bacterial wound","c":false,"r":"This does not cause the crackling feel."},{"t":"A fat deposit from a recent weight gain","c":false,"r":"This does not crackle."},{"t":"A food allergy with swelling of the face","c":false,"r":"This does not cause the crackling feel."},{"t":"A pneumothorax or air leak from the lung","c":true,"r":""}],"i":"Finding subcutaneous emphysema.","e":"Air in the tissues means the lung, airway, or esophagus has leaked. The nurse checks breath sounds, gets a chest x-ray, and prepares for a chest tube."},{"id":"T3-109","a":4,"s":"What is the main advantage of low titer group O whole blood in a bleeding trauma patient?","o":[{"t":"It contains red cells and no other parts of blood","c":false,"r":"Whole blood has all components."},{"t":"It does not need to be matched to a patient","c":false,"r":"It is group O and is low in titer to reduce the risk."},{"t":"It gives red cells, plasma, and platelets in one unit","c":true,"r":""},{"t":"It replaces the need to control the bleeding","c":false,"r":"The bleeding must be controlled."}],"i":"Knowing about whole blood.","e":"Whole blood provides balanced replacement in one bag. Many centers use it for severe bleeding, especially in the first resuscitation."},{"id":"T3-110","a":4,"s":"A patient on unfractionated heparin has a head injury and a growing hematoma. Which drug reverses the heparin?","o":[{"t":"Vitamin K given by slow infusion","c":false,"r":"This reverses warfarin."},{"t":"Protamine sulfate given by slow infusion","c":true,"r":""},{"t":"Idarucizumab given by vein","c":false,"r":"This reverses dabigatran."},{"t":"Naloxone given by vein","c":false,"r":"This reverses opioids."}],"i":"Reversing anticoagulants.","e":"Protamine binds heparin. The dose depends on the heparin given in the last few hours, and the nurse watches for low blood pressure and allergy."},{"id":"T3-111","a":4,"s":"Why do surgeons place a temporary shunt in a damaged major artery during damage control surgery?","o":[{"t":"It restores blood flow quickly so surgery is short","c":true,"r":""},{"t":"It permanently replaces the artery of the leg","c":false,"r":"It is temporary."},{"t":"It removes the need to repair the artery later","c":false,"r":"The artery is repaired later."},{"t":"It slows the blood flow to the organs","c":false,"r":"The aim is to restore blood flow."}],"i":"Understanding damage control surgery.","e":"A shunt returns flow to the limb in minutes and avoids a long repair in a patient who is cold, acidotic, and bleeding. The definitive repair is done later."},{"id":"T3-112","a":4,"s":"A patient has a pH of 7.18, a temperature of 34.6 degrees Celsius, and an INR of 2.0 after multiple transfusions, and the ionized calcium is 0.85 mmol/L. Which treatment targets the component that completes the diamond of death?","o":[{"t":"Intravenous potassium chloride as a rapid bolus","c":false,"r":"This does not treat low calcium."},{"t":"Intravenous insulin given with dextrose","c":false,"r":"This does not treat low calcium."},{"t":"Oral magnesium tablets given by mouth","c":false,"r":"This does not treat low calcium quickly."},{"t":"Intravenous calcium chloride or gluconate","c":true,"r":""}],"i":"Recognizing hypocalcemia in the diamond of death.","e":"Citrate in stored blood binds calcium, and low calcium weakens the heart and clotting. Calcium is given during massive transfusion."},{"id":"T3-113","a":4,"s":"Which technique extends the time before desaturation during intubation of a trauma patient?","o":[{"t":"Hyperventilation with room air in the first minute","c":false,"r":"This does not increase oxygen stores."},{"t":"Apneic oxygenation with nasal oxygen during the attempt","c":true,"r":""},{"t":"Removing all oxygen before the laryngoscope is inserted","c":false,"r":"The patient would desaturate faster."},{"t":"Asking the patient to hold the breath and relax","c":false,"r":"The patient may be unable to cooperate."}],"i":"Preparing to intubate safely.","e":"Preoxygenation fills the lungs with oxygen, and a nasal cannula at 15 L per minute keeps oxygen moving to the lungs during the attempt, adding precious minutes."},{"id":"T3-114","a":4,"s":"During intubation of a patient with a suspected cervical injury, how is the neck managed?","o":[{"t":"A helper holds in line stabilization, collar open","c":true,"r":""},{"t":"The collar is left on and the neck is gently extended","c":false,"r":"Extension is unsafe."},{"t":"The head is tilted back to align the airway","c":false,"r":"This moves the cervical spine."},{"t":"The patient is asked to turn the head to the side","c":false,"r":"This moves the cervical spine."}],"i":"Protecting the spine during intubation.","e":"The collar blocks mouth opening, so the front is removed. A helper keeps the head in a neutral position with hands on the mastoid processes."},{"id":"T3-115","a":4,"s":"Why is a large volume of normal saline avoided in a bleeding patient?","o":[{"t":"It raises the blood pressure of the patient to normal","c":false,"r":"Raising pressure too much can cause more bleeding."},{"t":"It increases the number of red cells in the blood","c":false,"r":"It dilutes the red cells."},{"t":"It warms the body to a high temperature","c":false,"r":"It is usually cold and can cool the patient."},{"t":"It causes acidosis and dilutes the clotting factors","c":true,"r":""}],"i":"Choosing resuscitation fluids.","e":"Large volumes of crystalloid worsen acidosis and clotting. Blood products are the preferred fluid in major hemorrhage, with a balanced fluid only when needed."},{"id":"T3-116","a":4,"s":"What does a shock index above 0.9 suggest in a trauma patient?","o":[{"t":"A higher chance of major bleeding and need for blood","c":true,"r":""},{"t":"A very low risk of bleeding in a stable patient","c":false,"r":"A high index suggests more risk."},{"t":"A normal response to pain and anxiety alone","c":false,"r":"It can be caused by hemorrhage."},{"t":"A fault in the blood pressure cuff in use","c":false,"r":"It is a calculated value from vital signs."}],"i":"Using the shock index.","e":"The shock index is the heart rate divided by the systolic pressure. A value above 0.9 can show hidden shock even when the vital signs seem normal."},{"id":"T3-117","a":4,"s":"A patient is bagged very fast during resuscitation and develops low blood pressure with a rise in chest size and absent breath movement. What is the cause?","o":[{"t":"A sudden bleeding from the lung that fills the chest","c":false,"r":"This does not match the bagging."},{"t":"A drug allergy with swelling of the throat","c":false,"r":"This does not match the bagging."},{"t":"Dynamic hyperinflation that reduces venous return","c":true,"r":""},{"t":"A dislocation of the hip joint of the patient","c":false,"r":"This does not match the bagging."}],"i":"Recognizing breath stacking.","e":"Fast bagging does not allow full exhalation, so pressure builds in the chest and blocks the venous return. Disconnecting the bag and pressing on the chest allows the air to leave, and rates of about 10 breaths per minute prevent it."},{"id":"T3-118","a":4,"s":"Which finding most favors a tension pneumothorax over cardiac tamponade?","o":[{"t":"Muffled heart sounds with distended neck veins","c":false,"r":"This points to tamponade."},{"t":"Low voltage on the ECG tracing of the patient","c":false,"r":"This points to tamponade."},{"t":"Absent breath sounds on one side with hyperresonance","c":true,"r":""},{"t":"A fluid collection seen around the heart on the scan","c":false,"r":"This points to tamponade."}],"i":"Separating obstructive causes of shock.","e":"A tension pneumothorax shows unilateral absent breath sounds, hyperresonance, and later tracheal shift. Tamponade shows muffled heart tones and pericardial fluid."},{"id":"T3-119","a":4,"s":"What is the usual mean arterial pressure goal in septic shock?","o":[{"t":"At least 30 mmHg","c":false,"r":"This is too low."},{"t":"At least 120 mmHg","c":false,"r":"This is too high."},{"t":"At least 150 mmHg","c":false,"r":"This is too high."},{"t":"At least 65 mmHg","c":true,"r":""}],"i":"Knowing sepsis targets.","e":"A mean pressure of at least 65 mmHg keeps the organs perfused. Fluids and vasopressors are used to reach it."},{"id":"T3-120","a":4,"s":"Which hemodynamic profile fits cardiogenic shock?","o":[{"t":"High cardiac output with low vascular resistance and low pressures","c":false,"r":"This is a profile of distributive shock."},{"t":"Low output with high resistance and high filling pressures","c":true,"r":""},{"t":"Low cardiac output with low filling pressures","c":false,"r":"This is a profile of hypovolemic shock."},{"t":"High cardiac output with high filling pressures","c":false,"r":"This is not a profile of shock."}],"i":"Reading hemodynamic patterns.","e":"A weak pump cannot move blood, so the output is low. The body squeezes the vessels, and blood backs up, which raises filling pressures."},{"id":"T3-121","a":4,"s":"After a splint is applied, a patient reports worse pain in the hand. What should the nurse do first?","o":[{"t":"Reassess circulation, sensation, and movement","c":true,"r":""},{"t":"Give a higher dose of opioid and leave the room","c":false,"r":"The cause of the pain must be checked."},{"t":"Tell the patient that pain is normal after a splint","c":false,"r":"Pain may be a sign of a problem."},{"t":"Apply a tighter wrap over the splint","c":false,"r":"This could worsen the problem."}],"i":"Reassessing after interventions.","e":"New pain after a splint can mean pressure or poor blood flow. The nurse checks the pulses, color, warmth, sensation, and movement, and loosens the splint if needed."},{"id":"T3-122","a":4,"s":"Which laboratory result helps to distinguish transfusion associated circulatory overload from TRALI?","o":[{"t":"A low hemoglobin value, which favors TRALI","c":false,"r":"Both can have a low or normal hemoglobin."},{"t":"An elevated BNP, which favors overload","c":true,"r":""},{"t":"A high platelet count, which favors overload","c":false,"r":"This does not separate the two."},{"t":"A low blood sugar, which favors TRALI","c":false,"r":"This does not separate the two."}],"i":"Distinguishing transfusion reactions.","e":"Overload raises filling pressure and brain natriuretic peptide, and the blood pressure is often high. In TRALI the peptide is usually normal or low and the pressure is low, with fever."},{"id":"T3-123","a":4,"s":"Why is the final radiology report reviewed during the tertiary survey?","o":[{"t":"Preliminary reads can miss fractures the final read finds","c":true,"r":""},{"t":"Final reads are the same as the first read","c":false,"r":"They can be different."},{"t":"The final report replaces the need for an exam","c":false,"r":"The exam is still needed."},{"t":"The final report is used for billing the insurer","c":false,"r":"It is used for care."}],"i":"Closing the loop on imaging.","e":"Images are often first read in a rush. A later review may find injuries that were missed, and the team changes the plan if needed."},{"id":"T3-124","a":4,"s":"Which finding defines acute kidney injury by urine output criteria?","o":[{"t":"A urine output above 5 mL/kg per hour for 6 hours","c":false,"r":"This is a high output."},{"t":"A urine output of 1 mL/kg per hour for 12 hours","c":false,"r":"This is normal."},{"t":"A urine output of 2 mL/kg per hour for 24 hours","c":false,"r":"This is normal."},{"t":"Urine output below 0.5 mL/kg per hour for 6 hours","c":true,"r":""}],"i":"Recognizing acute kidney injury.","e":"Low urine output for six hours or more, or a rise in creatinine, defines injury. The nurse looks for causes such as low volume, rhabdomyolysis, and drugs that harm the kidney."},{"id":"T3-125","a":4,"s":"A patient has severe pain out of proportion to a leg wound, a dusky skin, blisters, and crepitus. What should the nurse suspect?","o":[{"t":"A necrotizing soft tissue infection needing surgery","c":true,"r":""},{"t":"A simple bruise that will resolve with ice","c":false,"r":"This does not match the findings."},{"t":"A mild skin allergy to the bandage used","c":false,"r":"This does not match the findings."},{"t":"A superficial sunburn from time outdoors","c":false,"r":"This does not match the findings."}],"i":"Recognizing a necrotizing infection.","e":"This infection spreads fast through the tissue planes and causes shock. It needs surgery to remove dead tissue, antibiotics, and intensive care support."},{"id":"T3-126","a":4,"s":"Which sedative strategy is associated with less delirium than benzodiazepines in ventilated patients?","o":[{"t":"Continuous high dose lorazepam with no breaks","c":false,"r":"Benzodiazepines raise the risk of delirium."},{"t":"Heavy sedation with deep unconsciousness for days","c":false,"r":"This raises delirium and delays recovery."},{"t":"No pain control and a low dose of midazolam","c":false,"r":"Pain control is needed."},{"t":"Dexmedetomidine or propofol with daily breaks","c":true,"r":""}],"i":"Reducing delirium in the intensive care unit.","e":"Light sedation, daily breaks, and drugs such as dexmedetomidine lower delirium and ventilator days. Pain is treated first."},{"id":"T3-127","a":4,"s":"An anticoagulated patient is found on the floor after a fall in the hospital and is awake. What should the nurse do?","o":[{"t":"Do a neurologic exam and ask about a head CT","c":true,"r":""},{"t":"Help the patient back to bed and document nothing","c":false,"r":"The patient may have a bleed."},{"t":"Wait until the next shift to check for changes","c":false,"r":"Delay may be harmful."},{"t":"Give a sedative to calm the patient and let sleep","c":false,"r":"This hides the neurologic signs."}],"i":"Responding to a fall in an anticoagulated patient.","e":"Anticoagulants increase the risk of delayed bleeding. The nurse checks vital signs and neurologic status, looks for injury, notifies the provider, and a CT of the head is usually ordered."},{"id":"T3-128","a":4,"s":"After a long intensive care stay, a patient has new weakness, memory problems, and anxiety. Which term describes this?","o":[{"t":"Acute respiratory distress syndrome","c":false,"r":"This is a lung condition."},{"t":"Systemic inflammatory response syndrome","c":false,"r":"This is an early inflammation state."},{"t":"Compartment syndrome","c":false,"r":"This is a limb condition."},{"t":"Post intensive care syndrome","c":true,"r":""}],"i":"Recognizing long term effects of critical illness.","e":"Survivors of critical illness can have physical, thinking, and mental health problems. Early mobility, diaries, and follow up clinics help."},{"id":"T3-129","a":4,"s":"After a traumatic brain injury, which team member tests thinking skills, memory, and attention?","o":[{"t":"A respiratory therapist","c":false,"r":"This role supports breathing."},{"t":"A radiology technician","c":false,"r":"This role takes images."},{"t":"A neuropsychologist","c":true,"r":""},{"t":"A pharmacy technician","c":false,"r":"This role prepares medicines."}],"i":"Knowing the rehabilitation team.","e":"A neuropsychologist tests memory, attention, and judgment. The results guide rehabilitation, school or work return, and safety planning."},{"id":"T3-130","a":4,"s":"A patient has no advance directive and cannot decide. Who is usually the first surrogate decision maker, if legally recognized?","o":[{"t":"A neighbor who knows the patient well","c":false,"r":"A neighbor is not first in the order."},{"t":"The nurse caring for the patient","c":false,"r":"The nurse is not a surrogate."},{"t":"The spouse or legally recognized partner","c":true,"r":""},{"t":"A distant relative living in another country","c":false,"r":"This relative is not first in the order."}],"i":"Identifying a surrogate decision maker.","e":"State law sets an order, usually spouse, then adult children, then parents and siblings. The surrogate decides as the patient would have."},{"id":"T3-131","a":4,"s":"A family member wants to be present during resuscitation. Which action supports family presence?","o":[{"t":"Allow them in the room with no explanation or support","c":false,"r":"They need support and explanation."},{"t":"Assign a staff member to stay with the family","c":true,"r":""},{"t":"Refuse all family members without a reason","c":false,"r":"Family presence is supported by policy."},{"t":"Ask them to give hands on care during the code","c":false,"r":"The family should not take part in care."}],"i":"Supporting family presence.","e":"A trained staff member explains what is happening, offers comfort, and escorts them out if needed. Many families do better when they are allowed to be present."},{"id":"T3-132","a":4,"s":"What is the purpose of a family meeting for a patient with a poor prognosis?","o":[{"t":"To share information, clarify goals, and decide","c":true,"r":""},{"t":"To obtain consent for a research study alone","c":false,"r":"This is not the main purpose."},{"t":"To inform the family of the hospital bill","c":false,"r":"This is not the main purpose."},{"t":"To assign blame for the injury to a family member","c":false,"r":"This is not appropriate."}],"i":"Using shared decision making.","e":"A planned meeting with the team, the patient, and the family explains the prognosis, learns the patient's values, and sets goals such as full treatment or comfort."},{"id":"T3-133","a":4,"s":"Which community program reduces falls in older adults?","o":[{"t":"A program that encourages bed rest for all older adults","c":false,"r":"This increases weakness."},{"t":"A program that discourages the use of walking aids","c":false,"r":"Walking aids can prevent falls."},{"t":"A program that adds more sedating medicines","c":false,"r":"Sedating medicines increase falls."},{"t":"A strength and balance program with a home safety check","c":true,"r":""}],"i":"Preventing injury in older adults.","e":"Exercise, medicine review, vision checks, and home changes lower falls. They are the most effective prevention strategies."},{"id":"T3-134","a":4,"s":"Which patient can be considered for no spinal motion restriction in the field under selective protocols?","o":[{"t":"A patient with a high fall and neck pain","c":false,"r":"Neck pain calls for motion restriction."},{"t":"An alert, sober patient who walks with no neck pain","c":true,"r":""},{"t":"A patient with a head injury and confusion","c":false,"r":"Confusion makes the exam unreliable."},{"t":"A patient with weakness in both legs after a crash","c":false,"r":"This signals possible injury."}],"i":"Applying selective spinal motion restriction.
