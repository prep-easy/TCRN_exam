follows reporting rules."},{"id":"T4-98","a":3,"s":"A 3 month old has bruises on the torso and a subdural hematoma with retinal hemorrhages. Which diagnosis is suspected?","o":[{"t":"A normal birth event","c":false,"r":"This does not match."},{"t":"Abusive head trauma","c":true,"r":""},{"t":"A fall from a crib of a short height","c":false,"r":"A short fall rarely causes subdural and retinal bleeding with bruises on the torso."},{"t":"A viral infection with a mild fever","c":false,"r":"A viral infection does not cause a subdural hematoma with retinal hemorrhages."}],"i":"Recognizing abusive head trauma.","e":"Bruising in an infant who does not crawl, and the triad of subdural blood, brain swelling, and retinal bleeding are strong signs. A report is required."},{"id":"T4-99","a":3,"s":"An older adult has unexplained bruising, poor hygiene and weight loss, and the caregiver is unwilling to leave. What is the best action?","o":[{"t":"Accept the caregiver account as given","c":false,"r":"The signs suggest neglect or abuse."},{"t":"Discharge without a follow up plan","c":false,"r":"This places the patient at risk."},{"t":"Assess alone, document, and report to adult protective services","c":true,"r":""},{"t":"Wait and see if more injuries occur before acting","c":false,"r":"Delay causes harm."}],"i":"Responding to elder abuse.","e":"Reporting is mandated in most places. The nurse also assesses the safety of discharge."},{"id":"T4-100","a":3,"s":"A teenager has no identification, appears fearful, has a controlling companion and signs of malnutrition. Which concern is raised?","o":[{"t":"Human trafficking","c":true,"r":""},{"t":"A routine school visit","c":false,"r":"The fear, controlling companion, no identification and malnutrition do not fit a routine visit."},{"t":"A seasonal food allergy","c":false,"r":"A food allergy does not explain the controlling companion and lack of identification."},{"t":"A simple vitamin deficiency","c":false,"r":"A vitamin deficiency does not explain the controlling companion and lack of identification."}],"i":"Recognizing trafficking.","e":"Warning signs include a controlling companion, no ID, and fear. The nurse interviews alone, uses a trained interpreter, and follows the facility protocol."},{"id":"T4-101","a":3,"s":"A patient with chronic kidney disease has a crush injury. Which lab value is most urgent?","o":[{"t":"Serum cholesterol","c":false,"r":"This is not urgent."},{"t":"Vitamin D level","c":false,"r":"This is not urgent."},{"t":"Thyroid hormone","c":false,"r":"This is not urgent."},{"t":"Serum potassium","c":true,"r":""}],"i":"Recognizing hyperkalemia risk.","e":"Muscle injury releases potassium, and the kidneys may not clear it. An ECG is done and treatment is started."},{"id":"T4-102","a":3,"s":"A patient with chronic obstructive pulmonary disease is on high flow oxygen after rib fractures and becomes drowsy. What is the concern?","o":[{"t":"Carbon dioxide retention from too much oxygen","c":true,"r":""},{"t":"Low blood sugar from fasting","c":false,"r":"This is not the cause."},{"t":"A drug allergy to the pain medicine","c":false,"r":"This is not the cause."},{"t":"Low blood pressure from the cold room in the unit","c":false,"r":"This is not the cause."}],"i":"Managing COPD in trauma.","e":"The nurse titrates oxygen to a target of 88 to 92 percent and checks a blood gas. Pain control with regional blocks helps ventilation."},{"id":"T4-103","a":3,"s":"A patient with alcohol use disorder has a tremor, sweats, and a heart rate of 120 on day 2 after admission. What is the best action?","o":[{"t":"Use a validated scale such as CIWA and treat","c":true,"r":""},{"t":"Give a strong sedative to stop all cravings at once","c":false,"r":"This is not specific."},{"t":"Restrain the patient to prevent falls","c":false,"r":"This worsens agitation."},{"t":"Observe and recheck in 24 hours","c":false,"r":"This risks seizures."}],"i":"Managing alcohol withdrawal.","e":"A score guides symptom triggered dosing. Thiamine is given before glucose to prevent Wernicke encephalopathy."},{"id":"T4-104","a":3,"s":"A patient has pinpoint pupils, a respiratory rate of 6 and is unresponsive. What is the first intervention?","o":[{"t":"Give a stimulant by mouth","c":false,"r":"This is not appropriate."},{"t":"Let the patient sleep and recheck the pupils in an hour","c":false,"r":"This is dangerous."},{"t":"Ventilate with a bag mask and give naloxone now","c":true,"r":""},{"t":"Give a large fluid bolus and observe","c":false,"r":"This does not treat opioid toxicity."}],"i":"Treating opioid overdose.","e":"Breathing support comes first, and naloxone reverses opioid effects. Repeat doses may be needed because naloxone wears off sooner than many opioids."},{"id":"T4-105","a":4,"s":"During the primary survey of a patient with a gunshot wound to the thigh, blood is spurting from the wound. What is the first action?","o":[{"t":"Apply direct pressure or a tourniquet to control bleeding","c":true,"r":""},{"t":"Check the pupils with a penlight","c":false,"r":"This follows control of bleeding."},{"t":"Insert a gastric tube","c":false,"r":"This is not part of the first step."},{"t":"Obtain a full history from the family before other care","c":false,"r":"This is not the first step."}],"i":"Prioritizing massive hemorrhage.","e":"In the xABCDE approach, life threatening external bleeding is controlled first, before the airway."},{"id":"T4-106","a":4,"s":"Which element belongs to the secondary survey and not to the primary survey?","o":[{"t":"A head to toe exam, log roll and AMPLE","c":true,"r":""},{"t":"Control of life threatening external bleeding","c":false,"r":"This is in the primary survey."},{"t":"Placing an oxygen mask for hypoxia","c":false,"r":"This is in the primary survey."},{"t":"Assessing the airway with a jaw thrust","c":false,"r":"This is in the primary survey."}],"i":"Separating the surveys.","e":"The secondary survey follows after the patient is stable. It covers a complete exam, history, and review of all injuries."},{"id":"T4-107","a":4,"s":"Which ratio of plasma to platelets to red cells is commonly targeted in a massive transfusion protocol?","o":[{"t":"Red cells without plasma","c":false,"r":"This worsens dilutional coagulopathy."},{"t":"Crystalloid in a 3 to 1 ratio","c":false,"r":"This dilutes clotting factors."},{"t":"Platelets without red cells","c":false,"r":"This does not replace volume."},{"t":"A balanced ratio close to 1:1:1","c":true,"r":""}],"i":"Using balanced resuscitation.","e":"Balanced products replace what is lost and prevent coagulopathy. The ratio is adjusted by laboratory data once bleeding is controlled."},{"id":"T4-108","a":4,"s":"A patient receiving blood has a fever, chills and flank pain 10 minutes after the start of a unit. What is the first action?","o":[{"t":"Slow the rate and continue the unit while watching for a worse reaction","c":false,"r":"The unit must be stopped."},{"t":"Stop the transfusion, keep the line open, notify the provider","c":true,"r":""},{"t":"Give an antipyretic and continue the transfusion","c":false,"r":"This can hide a hemolytic reaction."},{"t":"Flush the tubing with the unit still running as before","c":false,"r":"This may give more incompatible blood."}],"i":"Responding to a transfusion reaction.","e":"A hemolytic reaction is an emergency. The unit and tubing go back to the blood bank with a clerical check and sample."},{"id":"T4-109","a":4,"s":"A patient is on rivaroxaban and has life threatening bleeding. Which agent is a specific reversal?","o":[{"t":"Vitamin K alone","c":false,"r":"This does not reverse this drug quickly."},{"t":"Protamine sulfate given by slow infusion over ten minutes","c":false,"r":"This reverses heparin."},{"t":"Desmopressin alone","c":false,"r":"This does not reverse the drug."},{"t":"Andexanet alfa, or four factor PCC if unavailable","c":true,"r":""}],"i":"Reversing factor Xa inhibitors.","e":"Factor Xa inhibitors are reversed with a specific agent or four factor PCC. Fresh frozen plasma is less effective."},{"id":"T4-110","a":4,"s":"Why is fibrinogen replacement important in massive trauma bleeding?","o":[{"t":"Fibrinogen is the first factor to fall critically","c":true,"r":""},{"t":"It lowers the blood pressure and slows the heart rate quickly","c":false,"r":"It does not lower the pressure."},{"t":"It replaces red cells in the circulation","c":false,"r":"It does not carry oxygen."},{"t":"It treats a fever in the patient","c":false,"r":"It is not used for fever."}],"i":"Understanding coagulant therapy.","e":"Cryoprecipitate or fibrinogen concentrate is given when the level is below about 150 to 200 mg/dL, since clots need fibrinogen to form."},{"id":"T4-111","a":4,"s":"Which condition is part of the lethal triad that damage control surgery aims to prevent?","o":[{"t":"Hypertension, fever and anemia","c":false,"r":"These are not the triad."},{"t":"Bradycardia, alkalosis and hypoglycemia","c":false,"r":"These are not the triad."},{"t":"Hypothermia, acidosis and coagulopathy","c":true,"r":""},{"t":"Obesity, pain and anxiety","c":false,"r":"These are not the triad."}],"i":"Knowing the lethal triad.","e":"These three feed one another and lead to death. Surgery is abbreviated to control bleeding and contamination, and the patient goes to the ICU to be warmed and corrected."},{"id":"T4-112","a":4,"s":"After damage control laparotomy, the abdomen is left open with a temporary closure. Which complication should the nurse watch for?","o":[{"t":"A decreased risk of infection with the open wound","c":false,"r":"Open abdomen raises risk."},{"t":"Improved lung function from the open abdomen","c":false,"r":"The lung function may worsen."},{"t":"Reduced need for fluids after the surgery","c":false,"r":"The patient needs more fluid."},{"t":"Abdominal compartment syndrome and fluid loss","c":true,"r":""}],"i":"Caring for an open abdomen.","e":"Rising bladder pressures, oliguria and high airway pressures suggest compartment syndrome. Planned return to the operating room follows."},{"id":"T4-113","a":4,"s":"Which four findings form the diamond of death in trauma?","o":[{"t":"Fever, alkalosis, hypertension and high blood sugar levels","c":false,"r":"These do not match."},{"t":"Anemia, anxiety, pain and nausea","c":false,"r":"These do not match."},{"t":"Hypothermia, acidosis, coagulopathy and low calcium","c":true,"r":""},{"t":"Obesity, diabetes, smoking and older age","c":false,"r":"These are risk factors."}],"i":"Recalling the diamond of death.","e":"Low ionized calcium is added to the lethal triad because it impairs clotting and heart contraction in massive transfusion."},{"id":"T4-114","a":4,"s":"Which drug is often preferred for induction in a hypotensive trauma patient who needs intubation?","o":[{"t":"Propofol at a full dose","c":false,"r":"This can cause more hypotension."},{"t":"Midazolam at a full dose","c":false,"r":"This can cause more hypotension."},{"t":"Ketamine or etomidate at a reduced dose","c":true,"r":""},{"t":"No drug because the patient is in shock","c":false,"r":"The patient still needs the drug."}],"i":"Choosing an induction drug.","e":"Hemodynamically stable agents lower the risk of collapse. Resuscitation with blood is started before intubation when possible."},{"id":"T4-115","a":4,"s":"Which finding is an early sign of hemorrhagic shock in a young healthy patient?","o":[{"t":"A sudden fall in the blood pressure as the very first sign in the patient","c":false,"r":"This is a late sign."},{"t":"Warm dry skin and a slow pulse","c":false,"r":"This is not shock."},{"t":"A rise in urine output over the hour","c":false,"r":"This is not a sign of shock."},{"t":"A narrow pulse pressure and rising heart rate with cool skin","c":true,"r":""}],"i":"Recognizing early hemorrhagic shock.","e":"Compensation keeps the systolic pressure normal early. The diastolic rises, the pulse pressure narrows, and the skin turns cool."},{"id":"T4-116","a":4,"s":"A ventilated patient has a sudden drop in pressure, distended neck veins and absent breath sounds on the right. What is the immediate treatment?","o":[{"t":"A fluid bolus of 3 liters of warm crystalloid first","c":false,"r":"This does not fix the cause."},{"t":"Needle or finger decompression, then chest tube","c":true,"r":""},{"t":"A chest x-ray first to confirm the cause","c":false,"r":"The patient is in danger."},{"t":"A vasopressor alone to raise the pressure","c":false,"r":"This does not fix the cause."}],"i":"Treating tension pneumothorax.","e":"The air under tension blocks venous return. Immediate release is a lifesaving action and is done on the clinical findings."},{"id":"T4-117","a":4,"s":"A patient with a cervical cord injury is bradycardic and hypotensive with warm skin. Which drug is most useful?","o":[{"t":"Large boluses of crystalloid given over an hour","c":false,"r":"This risks pulmonary edema."},{"t":"Norepinephrine, with atropine for slow rates","c":true,"r":""},{"t":"A beta blocker to slow the heart","c":false,"r":"This worsens bradycardia."},{"t":"A diuretic to remove the fluid","c":false,"r":"This lowers volume."}],"i":"Treating neurogenic shock.","e":"Loss of sympathetic tone widens vessels and leaves the vagus unopposed. Vasopressors support the pressure."},{"id":"T4-118","a":4,"s":"A trauma patient on day 5 has fever, a heart rate of 125, warm flushed skin, and a low pressure. Which type of shock is likely?","o":[{"t":"Septic shock","c":true,"r":""},{"t":"Hemorrhagic shock","c":false,"r":"The skin would be cool."},{"t":"Obstructive shock","c":false,"r":"The signs do not suggest this."},{"t":"Cardiogenic shock","c":false,"r":"The skin would be cool."}],"i":"Recognizing septic shock.","e":"Warm shock with fever follows infection. Cultures are drawn, antibiotics are given within an hour, and fluids and vasopressors are used."},{"id":"T4-119","a":4,"s":"A trauma patient with blunt cardiac injury has a low blood pressure, crackles and a cold, clammy skin. What is this?","o":[{"t":"Septic shock","c":false,"r":"The skin would be warm."},{"t":"Neurogenic shock","c":false,"r":"The heart rate would be slow."},{"t":"Hypovolemic shock","c":false,"r":"The lungs would be clear."},{"t":"Cardiogenic shock","c":true,"r":""}],"i":"Recognizing cardiogenic shock.","e":"The pump fails, which backs blood into the lungs. Fluids can worsen it, and inotropes are used."},{"id":"T4-120","a":4,"s":"Which hemodynamic profile fits neurogenic shock?","o":[{"t":"High resistance and low output with a fast heart rate and cool skin","c":false,"r":"This profile fits hypovolemic shock, where the vessels tighten."},{"t":"Low resistance and low pressure with a normal or slow heart rate","c":true,"r":""},{"t":"Low output and high wedge pressure with raised resistance","c":false,"r":"This profile fits cardiogenic shock from pump failure."},{"t":"High central venous pressure with low output and muffled sounds","c":false,"r":"This profile fits obstructive shock such as tamponade."}],"i":"Interpreting hemodynamics in neurogenic shock.","e":"Loss of sympathetic tone widens the vessels, so resistance and pressure fall. The heart rate stays normal or slow because the sympathetic drive to the heart is lost."},{"id":"T4-121","a":4,"s":"A patient had stable vital signs 2 hours ago and now has a rising heart rate and a falling urine output. What is the best action?","o":[{"t":"Wait for the next set of vital signs to decide","c":false,"r":"This delays care."},{"t":"Reassess the patient from the start and report the change","c":true,"r":""},{"t":"Record the change and take no further action","c":false,"r":"The change must be acted on."},{"t":"Reduce the monitoring since the signs were stable","c":false,"r":"This is not safe."}],"i":"Reassessing after a change.","e":"Any change means returning to the primary survey. The cause, such as hidden bleeding, must be found."},{"id":"T4-122","a":4,"s":"Which complication of massive transfusion is caused by citrate in the stored blood?","o":[{"t":"High potassium with peaked T waves and a slow rhythm","c":false,"r":"This can follow old stored blood, but it is not caused by citrate."},{"t":"Low core temperature with shivering and a slow pulse","c":false,"r":"This follows cold blood and is not caused by citrate."},{"t":"Low ionized calcium with a long QT interval and poor clotting","c":true,"r":""},{"t":"Fluid overload with crackles and a high venous pressure","c":false,"r":"This follows a large volume and is not caused by citrate."}],"i":"Knowing the complications of massive transfusion.","e":"Citrate binds calcium, and the liver may not clear it fast enough during rapid transfusion. Low ionized calcium weakens the heart and clotting, so calcium is given."},{"id":"T4-123","a":4,"s":"What is the purpose of a tertiary survey?","o":[{"t":"To replace the primary survey in all stable patients","c":false,"r":"It is done later."},{"t":"To prepare the discharge plan for the patient","c":false,"r":"It is not a discharge process."},{"t":"To find missed injuries within 24 hours of admission","c":true,"r":""},{"t":"To order a blood type and screen for the patient","c":false,"r":"It is a full exam."}],"i":"Understanding the tertiary survey.","e":"A repeat full exam with review of all images and labs finds missed injuries, especially in patients who were sedated or unconscious."},{"id":"T4-124","a":4,"s":"A trauma patient develops bilateral infiltrates, a PaO2 to FiO2 ratio of 120 and no heart failure. Which strategy is recommended?","o":[{"t":"Lung protective ventilation at 6 mL/kg tidal volumes","c":true,"r":""},{"t":"High tidal volumes to open up collapsed lung areas","c":false,"r":"These cause lung injury."},{"t":"Removal of all PEEP to lower the lung pressure","c":false,"r":"PEEP helps oxygenation."},{"t":"Large fluid loading to wash out the lungs","c":false,"r":"This worsens the edema."}],"i":"Managing ARDS.","e":"Low tidal volume with plateau pressure under 30 cm H2O reduces ventilator induced injury. Prone positioning is used in severe disease."},{"id":"T4-125","a":4,"s":"A patient with rhabdomyolysis has a creatinine rise and a dark urine. What is the key nursing priority?","o":[{"t":"Restrict all fluids to protect the kidneys","c":false,"r":"This worsens the kidney injury."},{"t":"Give nonsteroidal drugs every six hours for the muscle pain","c":false,"r":"These worsen kidney injury."},{"t":"Maintain a good urine output and watch the potassium","c":true,"r":""},{"t":"Wait a day before checking the urine again","c":false,"r":"Delay increases the harm."}],"i":"Preventing acute kidney injury.","e":"Myoglobin damages the kidney tubules. Fluids are used to flush it, with a urine target of about 200 to 300 mL per hour in some protocols."},{"id":"T4-126","a":4,"s":"A patient on a ventilator for 4 days has a new fever and purulent secretions. Which bundle reduces ventilator associated pneumonia?","o":[{"t":"Keep the head of the bed flat for comfort","c":false,"r":"This raises the risk."},{"t":"Head of bed up 30 to 45 degrees, oral care, sedation review","c":true,"r":""},{"t":"Routine changes of the ventilator circuit each day of use","c":false,"r":"This does not lower the risk."},{"t":"Avoid oral care to prevent gagging","c":false,"r":"This raises the risk."}],"i":"Preventing VAP.","e":"Elevation lowers aspiration. Oral care with chlorhexidine as per policy, subglottic suction, and early weaning are also used."},{"id":"T4-127","a":4,"s":"A hospitalized older trauma patient is at high risk of falls. Which intervention is most effective?","o":[{"t":"A bed alarm, low bed, rounding and toileting help","c":true,"r":""},{"t":"Full restraints applied to the patient","c":false,"r":"These increase the injury risk."},{"t":"Bed rails raised on all four sides","c":false,"r":"These can increase injury."},{"t":"Sedation given at night to all older patients on the unit","c":false,"r":"This raises the risk of falls."}],"i":"Preventing falls.","e":"A multi factor approach is best. Restraints and sedatives increase delirium and harm."},{"id":"T4-128","a":4,"s":"A patient 3 days after a severe car crash has nightmares and avoidance. Which approach is appropriate?","o":[{"t":"Screen for acute stress and offer referral","c":true,"r":""},{"t":"Tell the patient to forget about the crash","c":false,"r":"This dismisses the problem."},{"t":"Prescribe nothing and dismiss the symptoms","c":false,"r":"This misses the need."},{"t":"Force the patient to describe the crash in detail","c":false,"r":"This can worsen the distress."}],"i":"Addressing psychological distress.","e":"Early screening finds patients at risk of posttraumatic stress. The patient is linked to trauma informed care."},{"id":"T4-129","a":4,"s":"When should rehabilitation planning begin for a trauma patient?","o":[{"t":"After the patient is discharged from the hospital","c":false,"r":"This is too late."},{"t":"After six months of recovery","c":false,"r":"This is too late."},{"t":"At admission, with early mobility once stable","c":true,"r":""},{"t":"If the family asks for therapy","c":false,"r":"Planning should be routine."}],"i":"Starting rehabilitation early.","e":"Early mobilization prevents weakness, clots, and pneumonia. The team includes therapy, nursing, and case management."},{"id":"T4-130","a":4,"s":"Who should approach a family about organ donation after a patient is declared dead?","o":[{"t":"The bedside nurse working alone","c":false,"r":"This causes a conflict of interest."},{"t":"A trained representative of the procurement organization","c":true,"r":""},{"t":"The trauma surgeon who cared for the patient in the unit this week","c":false,"r":"This causes a conflict of interest."},{"t":"A hospital volunteer who is on the unit","c":false,"r":"This is not trained."}],"i":"Approaching families about donation.","e":"The nurse notifies the organ procurement organization on a trigger. The trained team makes the request separately from the death notification."},{"id":"T4-131","a":4,"s":"A patient arrives unconscious, and the family presents a valid advance directive that refuses ventilation. What should the team do?","o":[{"t":"Set it aside and intubate the patient to buy time","c":false,"r":"This violates the patient's rights."},{"t":"Verify the document and honor the wishes","c":true,"r":""},{"t":"Ask a friend of the patient to decide instead","c":false,"r":"The document guides care."},{"t":"Wait for a court order first","c":false,"r":"This is not needed for a valid directive."}],"i":"Honoring advance directives.","e":"A valid directive reflects the patient's wishes. The team verifies it, talks to the surrogate, and documents."},{"id":"T4-132","a":4,"s":"Which finding is required before a brain death exam is begun?","o":[{"t":"A normal CT of the head on admission","c":false,"r":"The CT would be abnormal."},{"t":"A pupil that reacts to light on the left","c":false,"r":"Pupils would be fixed."},{"t":"A temperature of 32 degrees Celsius after recent cooling therapy","c":false,"r":"The patient must be normothermic."},{"t":"A known devastating brain injury and exclusion of confounders","c":true,"r":""}],"i":"Preparing for brain death testing.","e":"The patient should be warm, with normal pressure and no drug effects. The exam includes coma, absent brainstem reflexes, and an apnea test."},{"id":"T4-133","a":4,"s":"Which strategy is the most effective in reducing the number of injuries from motor vehicle crashes in a community?","o":[{"t":"A single flyer placed in a clinic","c":false,"r":"This alone is not effective."},{"t":"Combining education, enforcement and engineering","c":true,"r":""},{"t":"Education offered alone to drivers","c":false,"r":"This alone is less effective."},{"t":"A program run with no community partners or funding support","c":false,"r":"This does nothing."}],"i":"Using the 3 E model.","e":"Education, enforcement, and engineering together, such as helmet laws and road design, produce the most lasting results."},{"id":"T4-134","a":4,"s":"Paramedics report a patient with penetrating chest trauma and 8 minutes of transport time. What do the guidelines support?","o":[{"t":"Long on scene procedures before transport","c":false,"r":"This delays definitive care."},{"t":"Rapid transport, limited scene time, bleeding control","c":true,"r":""},{"t":"Full spinal imaging in the field before the patient is moved","c":false,"r":"This delays transport."},{"t":"Large volumes of crystalloid on the way in","c":false,"r":"This can worsen bleeding."}],"i":"Prehospital care in penetrating trauma.","e":"Scoop and run is favored for penetrating torso injuries. Airway, hemorrhage control and notification of the trauma team are prioritized."},{"id":"T4-135","a":4,"s":"Which prehospital criterion supports activating the trauma team?","o":[{"t":"A systolic pressure of 120 and a heart rate of 80 per minute","c":false,"r":"This is normal."},{"t":"A GCS of 15 with no other findings","c":false,"r":"This is normal."},{"t":"A respiratory rate of 16 with no distress","c":false,"r":"This is normal."},{"t":"A systolic pressure under 90 or a GCS of 13 or less","c":true,"r":""}],"i":"Using field triage criteria.","e":"Physiologic criteria come first in the field triage decision scheme, followed by anatomy, mechanism and special considerations."},{"id":"T4-136","a":4,"s":"A critically ill trauma patient is going from the ED to CT. Which preparation is most important?","o":[{"t":"A monitor, oxygen, suction, drugs and a trained escort","c":true,"r":""},{"t":"A blanket and a pillow","c":false,"r":"This is not enough."},{"t":"Sedation given without monitoring","c":false,"r":"This is not safe."},{"t":"No report to the receiving unit before the patient arrives","c":false,"r":"This is unsafe."}],"i":"Preparing for intrafacility transport.","e":"The patient is stabilized, equipment is checked, and a handoff is given. Transport carries a risk of deterioration."},{"id":"T4-137","a":4,"s":"Which federal law requires a hospital to screen, stabilize and appropriately transfer a patient with an emergency condition?","o":[{"t":"HIPAA","c":false,"r":"This protects privacy."},{"t":"OSHA","c":false,"r":"This covers workplace safety."},{"t":"JCAHO","c":false,"r":"The Joint Commission sets accreditation standards and is not the federal law on screening and transfer."},{"t":"EMTALA","c":true,"r":""}],"i":"Knowing EMTALA.","e":"EMTALA requires a screening exam, stabilization within the capability of the hospital, and an appropriate transfer with consent, records and an accepting physician."},{"id":"T4-138","a":4,"s":"Which instruction should a patient with a healing spleen injury be given at discharge?","o":[{"t":"Take aspirin for the pain at home","c":false,"r":"This raises the bleeding risk."},{"t":"Resume contact sports in a week once the pain is fully gone","c":false,"r":"This is unsafe."},{"t":"Return for worsening belly, shoulder pain or dizziness","c":true,"r":""},{"t":"Dismiss light headedness since it is expected","c":false,"r":"This may signal bleeding."}],"i":"Teaching warning signs.","e":"Delayed bleeding can occur. The patient and family receive written instructions."},{"id":"T4-139","a":4,"s":"A patient is ready for discharge but lives alone and has no ride, no medicine money, and difficulty reading the instructions. What is best?","o":[{"t":"Involve case management and social work","c":true,"r":""},{"t":"Discharge and hope for the best","c":false,"r":"This ignores risk."},{"t":"Hand over the paper instructions alone","c":false,"r":"This does not address the barriers."},{"t":"Delay all care until the barriers resolve","c":false,"r":"This does not help."}],"i":"Addressing barriers to discharge.","e":"Barriers to care lead to readmission. The team arranges transport, medication assistance, and teaching at the right level."},{"id":"T4-140","a":4,"s":"Which teaching method best confirms that a caregiver is ready to care for a patient with a new tracheostomy at home?","o":[{"t":"A short handout given alone","c":false,"r":"This does not confirm skill."},{"t":"Verbal instructions given once at the bedside","c":false,"r":"This does not confirm skill."},{"t":"Return demonstration of suctioning and care","c":true,"r":""},{"t":"A video watched without practice","c":false,"r":"This does not confirm skill."}],"i":"Checking home readiness.","e":"Return demonstration confirms skill. Equipment, emergency plans and home health follow up are arranged."},{"id":"T4-141","a":5,"s":"In START triage, what is done first with patients who are able to walk?","o":[{"t":"They are told to move to a safe area and are tagged minor, green","c":true,"r":""},{"t":"They are tagged delayed, yellow and moved to the treatment area","c":false,"r":"Walking patients are tagged minor, green and are not moved first."},{"t":"They are assessed for breathing and perfusion before moving","c":false,"r":"Walking patients are sent to a safe area first and not examined."},{"t":"They are tagged immediate, red until a nurse can examine them","c":false,"r":"Walking patients are not tagged immediate on the basis of walking."}],"i":"Applying the first step of START triage.","e":"Calling walking patients away clears the scene and lets the team reach the patients who cannot walk. Those who walk are tagged minor and rechecked later."},{"id":"T4-142","a":5,"s":"At a chemical incident, which action should the receiving hospital take first?","o":[{"t":"Bring patients in first and wash them in the resuscitation room later","c":false,"r":"This spreads the contamination."},{"t":"Decontaminate patients at the entrance with protective equipment","c":true,"r":""},{"t":"Skip decontamination to save time","c":false,"r":"This endangers staff."},{"t":"Send staff in with no protective equipment","c":false,"r":"This causes injury."}],"i":"Handling contaminated patients.","e":"Clothing removal removes most of the contaminant. Staff wear the level of protective equipment recommended for the agent."},{"id":"T4-143","a":5,"s":"Which tool is used to review a case against a standard to find a system problem and prevent its recurrence?","o":[{"t":"A personal reprimand of the staff member who was involved","c":false,"r":"This does not fix the system."},{"t":"A review that is left to the unit manager alone","c":false,"r":"This misses the learning."},{"t":"A multidisciplinary peer review with corrective actions","c":true,"r":""},{"t":"A short summary posted on the staff board","c":false,"r":"This is not appropriate."}],"i":"Using performance improvement.","e":"The approach looks at the system, uses filters such as audit measures, and tracks results through a loop closure."},{"id":"T4-144","a":5,"s":"Why does a trauma program send outcome feedback to prehospital providers?","o":[{"t":"To assign blame to the crews","c":false,"r":"Feedback should be constructive."},{"t":"To reduce the staffing of the crews","c":false,"r":"This is not the aim."},{"t":"To share identifiable patient details widely","c":false,"r":"Privacy rules protect patient information."},{"t":"It supports education and better field care","c":true,"r":""}],"i":"Closing the loop with outcomes.","e":"Feedback links care to outcomes and encourages learning and trust between agencies."},{"id":"T4-145","a":5,"s":"A nurse wants to change a practice based on new research. What is the first step in an evidence based practice process?","o":[{"t":"Implement the change at once on the unit without review","c":false,"r":"Evidence must be reviewed first."},{"t":"Ask a colleague and use that advice","c":false,"r":"This is not enough."},{"t":"Ask a clear clinical question, then find evidence","c":true,"r":""},{"t":"Wait for a rule from the hospital","c":false,"r":"This is passive."}],"i":"Starting evidence based practice.","e":"The steps include a question, a search, appraisal, application, and evaluation of the result."},{"id":"T4-146","a":5,"s":"When is a critical incident debrief most effective after a traumatic resuscitation?","o":[{"t":"Months later when the staff have had time to forget the event","c":false,"r":"This loses the benefit."},{"t":"Not at all, since talking about it raises distress","c":false,"r":"Staff may need support."},{"t":"Soon after the event, with a facilitator in a safe setting","c":true,"r":""},{"t":"In a public area so the blame is shared by staff","c":false,"r":"This is harmful."}],"i":"Supporting staff.","e":"A structured debrief reviews what happened, what went well, and what to improve. It supports staff and lowers burnout."},{"id":"T4-147","a":5,"s":"A nurse calls a physician about a patient with a worsening condition. Which SBAR element states the nurse's recommendation?","o":[{"t":"Situation","c":false,"r":"This states the problem."},{"t":"Background","c":false,"r":"This gives context."},{"t":"Assessment","c":false,"r":"This gives the nurse's view."},{"t":"Recommendation","c":true,"r":""}],"i":"Using SBAR.","e":"The recommendation says what the nurse needs, such as an order, a visit to the bedside, or a transfer."},{"id":"T4-148","a":5,"s":"A nurse gives a wrong dose of a drug, and the patient is not harmed. What should the nurse do?","o":[{"t":"Hide it since no harm came to the patient","c":false,"r":"This prevents learning."},{"t":"Blame a colleague who was nearby","c":false,"r":"This is unprofessional."},{"t":"Change the chart so the dose looks correct","c":false,"r":"This is unethical."},{"t":"Report the event in the facility system","c":true,"r":""}],"i":"Reporting events.","e":"Near misses and events are reported without blame, so the system can be improved."},{"id":"T4-149","a":5,"s":"A visitor becomes verbally aggressive toward an ED nurse. What should be done first?","o":[{"t":"Argue back to show the visitor that staff will not be bullied","c":false,"r":"This raises the danger."},{"t":"Use a calm voice, keep distance, call security if needed","c":true,"r":""},{"t":"Corner the person to stop the behavior","c":false,"r":"This raises the danger."},{"t":"Dismiss the behavior and keep working alone","c":false,"r":"This does not keep staff safe."}],"i":"Managing workplace violence.","e":"A zero tolerance policy, a safe exit, and a report of the event protect staff."},{"id":"T4-150","a":5,"s":"Which body verifies a trauma center, and which one designates it?","o":[{"t":"The state verifies and the American College of Surgeons designates","c":false,"r":"This reverses the roles."},{"t":"The hospital verifies itself and designates itself","c":false,"r":"This is not independent."},{"t":"Both are done by the insurer of the hospital","c":false,"r":"This is not correct."},{"t":"The American College of Surgeons verifies, the state designates","c":true,"r":""}],"i":"Separating verification from designation.","e":"Verification confirms that a center meets standards. Designation is the legal act of the authority that names the center."},{"id":"T5-1","a":0,"s":"A teenager is struck by a baseball and has a brief loss of consciousness, then talks normally for an hour before becoming drowsy with a dilating pupil. What is the most likely injury?","o":[{"t":"Epidural hematoma from a torn middle meningeal artery","c":true,"r":""},{"t":"Subdural hematoma from torn bridging veins in the brain","c":false,"r":"These bleed more slowly and do not usually show a clear lucid interval after a skull fracture."},{"t":"Diffuse axonal injury with a normal CT of the head","c":false,"r":"This causes immediate and lasting loss of consciousness, not a lucid interval."},{"t":"A simple concussion that is resolving without a lesion","c":false,"r":"A concussion improves with time and does not cause a new decline."}],"i":"Recognizing the lucid interval of an epidural hematoma.","e":"Arterial bleeding between the skull and the dura expands quickly after the lucid period. CT shows a lens shaped clot, and urgent surgery is lifesaving."},{"id":"T5-2","a":0,"s":"Under the Canadian CT Head Rule, which patient with a minor head injury needs a CT scan?","o":[{"t":"A 30 year old with a GCS of 15 and a brief headache","c":false,"r":"Age under 65 with no other risk factor does not meet the rule."},{"t":"A 25 year old with a scalp bruise and no symptoms","c":false,"r":"This patient has no high risk or medium risk finding."},{"t":"A 40 year old with a GCS of 15 and no vomiting","c":false,"r":"The rule requires two or more episodes of vomiting."},{"t":"A 70 year old with a GCS of 15 after a fall","c":true,"r":""}],"i":"Applying a decision rule for head CT.","e":"Age of 65 or older is a high risk factor in the rule, along with a GCS under 15 at two hours, a suspected skull fracture, and two or more episodes of vomiting."},{"id":"T5-3","a":0,"s":"A patient with a head injury has a GCS of 7 and an oxygen saturation that is falling on a facemask. Which action is indicated?","o":[{"t":"Place the patient in a prone position to drain secretions","c":false,"r":"The prone position does not protect the airway and raises pressure in the head."},{"t":"Secure the airway with endotracheal intubation","c":true,"r":""},{"t":"Give a higher flow of oxygen by the same mask","c":false,"r":"A patient with a GCS of 8 or less cannot protect the airway."},{"t":"Repeat the neurologic exam in thirty minutes","c":false,"r":"Delay risks hypoxia, which worsens the brain injury."}],"i":"Protecting the airway in severe brain injury.","e":"A GCS of 8 or less, or the inability to protect the airway, calls for intubation. Hypoxia is a major cause of secondary brain injury."},{"id":"T5-4","a":0,"s":"Which drug should not be given to improve outcomes in a patient with a traumatic brain injury?","o":[{"t":"Hypertonic saline for signs of herniation","c":false,"r":"This is an accepted drug for raised pressure in the head."},{"t":"High dose methylprednisolone infusion","c":true,"r":""},{"t":"Levetiracetam for early seizure prevention","c":false,"r":"This is commonly used for seizure prophylaxis in the first week."},{"t":"Mannitol for a blown pupil and posturing","c":false,"r":"This is an accepted drug to lower pressure in the head."}],"i":"Avoiding steroids in brain injury.","e":"Large trials showed higher mortality with high dose steroids after head injury, so they are not recommended in this setting."},{"id":"T5-5","a":0,"s":"Two weeks after a concussion, a student has headache, light sensitivity and trouble concentrating. Which advice is best?","o":[{"t":"Return gradually to school and activity as symptoms allow","c":true,"r":""},{"t":"Stay in a dark room with no screens for weeks","c":false,"r":"Long strict rest can slow recovery and worsen mood."},{"t":"Return to full activity at once since symptoms are expected","c":false,"r":"Full return can worsen symptoms and risks a second injury."},{"t":"Have a daily head CT until symptoms resolve","c":false,"r":"Repeat imaging adds radiation and does not guide recovery."}],"i":"Teaching recovery after concussion.","e":"After a short period of rest, light activity is encouraged. The student moves forward in steps as long as symptoms do not worsen, with school support."},{"id":"T5-6","a":0,"s":"A patient has a deep scalp laceration that bleeds heavily. What is the best first approach?","o":[{"t":"Place a loose bandage and let the patient wait","c":false,"r":"The scalp is highly vascular and bleeding can cause real blood loss."},{"t":"Apply pressure, then explore for a skull defect","c":true,"r":""},{"t":"Close the skin right away without exploring the wound","c":false,"r":"A skull fracture or foreign body may be missed under the skin."},{"t":"Pack the wound with gauze soaked in alcohol","c":false,"r":"Alcohol damages the tissue and does not control bleeding."}],"i":"Managing a scalp laceration.","e":"The scalp has a rich blood supply, so bleeding can be large, especially in children. After control, the wound is explored and irrigated before closure."},{"id":"T5-7","a":0,"s":"Which statement about concussion is correct?","o":[{"t":"It can occur without any loss of consciousness","c":true,"r":""},{"t":"It requires a loss of consciousness of five minutes","c":false,"r":"Most concussions occur with no loss of consciousness at all."},{"t":"It shows a bleed or bruise on the CT scan","c":false,"r":"Imaging is usually normal because the injury is functional."},{"t":"It occurs after a direct blow to the head alone","c":false,"r":"A force transmitted to the head from the body can also cause it."}],"i":"Defining concussion.","e":"Concussion is a change in brain function after force to the head or body. Dizziness, confusion, headache and amnesia are common, and unconsciousness is not required."},{"id":"T5-8","a":0,"s":"Which level of complete spinal cord injury is most likely to need immediate ventilator support?","o":[{"t":"T6, because the intercostal and abdominal muscles are lost","c":false,"r":"The diaphragm still works well at this level."},{"t":"L2, because the leg muscles are weak","c":false,"r":"Breathing is not affected at this level."},{"t":"S1, because the foot muscles are weak","c":false,"r":"Breathing is not affected at this level."},{"t":"C3 or above, because the phrenic nerve supply is lost","c":true,"r":""}],"i":"Linking level of injury to breathing.","e":"The phrenic nerve arises from C3, C4 and C5. Injury at or above C3 paralyzes the diaphragm, and patients need a ventilator."},{"id":"T5-9","a":0,"s":"Which statement about corticosteroids in acute spinal cord injury is correct?","o":[{"t":"It is given to patients within three days of injury","c":false,"r":"Current guidance does not support routine use."},{"t":"High dose methylprednisolone is not routinely advised","c":true,"r":""},{"t":"It restores full function if started within one hour","c":false,"r":"No trial shows full recovery with steroids."},{"t":"It replaces the need for surgery to decompress the cord","c":false,"r":"Steroids are not a substitute for decompression."}],"i":"Knowing current guidance on steroids.","e":"Studies showed infection, bleeding and sepsis risks with little benefit, so major guidelines advise against routine use."},{"id":"T5-10","a":0,"s":"A patient who has had a spinal cord injury for six weeks has a swollen, warm hip with a loss of range of motion and no fever. Which complication is suspected?","o":[{"t":"Acute rupture of the spleen","c":false,"r":"This does not cause a warm swollen hip over weeks."},{"t":"Neurogenic shock","c":false,"r":"This occurs in the first days and causes low pressure."},{"t":"Tension pneumothorax","c":false,"r":"This causes breathing distress, not hip swelling."},{"t":"Heterotopic ossification","c":true,"r":""}],"i":"Recognizing heterotopic ossification.","e":"Bone forms in soft tissue below the level of injury, often at the hip. It limits motion, and early therapy and medicines can reduce it."},{"id":"T5-11","a":0,"s":"An obtunded patient has a negative high quality CT of the cervical spine. What is the usual approach to clearing the collar?","o":[{"t":"Leave the collar on for six weeks","c":false,"r":"Prolonged collars cause pressure injury and pneumonia."},{"t":"Clear it from the negative CT per institutional protocol","c":true,"r":""},{"t":"Order flexion and extension films in the unresponsive patient","c":false,"r":"These films are not useful when the patient cannot cooperate."},{"t":"Remove it when the patient is fully awake and talking","c":false,"r":"Many protocols allow clearance without waiting."}],"i":"Clearing the spine in an obtunded patient.","e":"A high quality negative CT has a very high negative predictive value. The decision follows the trauma center protocol."},{"id":"T5-12","a":0,"s":"Which anatomic landmark corresponds to the T10 dermatome?","o":[{"t":"The nipple line","c":false,"r":"This is T4."},{"t":"The umbilicus","c":true,"r":""},{"t":"The xiphoid process","c":false,"r":"This is T7."},{"t":"The inguinal ligament","c":false,"r":"This is L1."}],"i":"Identifying sensory levels.","e":"T4 is the nipple line, T7 the xiphoid, T10 the umbilicus, and L1 the groin. Landmarks help locate the level quickly."},{"id":"T5-13","a":0,"s":"Which finding is needed to call a spinal cord injury incomplete?","o":[{"t":"Pain in the neck with movement of the head or shoulders","c":false,"r":"Pain does not show preserved cord function."},{"t":"Muscle spasm below the level of injury and some movement","c":false,"r":"Reflex spasm can occur in complete injury."},{"t":"A normal heart rate and blood pressure at rest and in motion","c":false,"r":"Vital signs do not define completeness."},{"t":"Sacral sparing, such as perianal sensation or anal contraction","c":true,"r":""}],"i":"Classifying completeness of injury.","e":"Any preserved function at the lowest sacral segments means the injury is incomplete, which carries a better chance of recovery."},{"id":"T5-14","a":0,"s":"What blood glucose range is generally recommended for a critically ill patient with a traumatic brain injury?","o":[{"t":"About 140 to 180 mg/dL, avoiding both highs and lows","c":true,"r":""},{"t":"Below 80 mg/dL to protect the brain from injury","c":false,"r":"Tight control raises the risk of hypoglycemia."},{"t":"Above 250 mg/dL so the injured brain has fuel","c":false,"r":"High glucose worsens brain injury and infection risk."},{"t":"A wide range, since glucose has little effect on the brain","c":false,"r":"Both high and low glucose cause secondary injury."}],"i":"Controlling glucose.","e":"Hypoglycemia starves the brain and hyperglycemia worsens swelling and infection, so a moderate range is preferred."},{"id":"T5-15","a":0,"s":"A patient with a brain injury on a high dose propofol infusion for four days develops metabolic acidosis, rising triglycerides and rhabdomyolysis. What is suspected?","o":[{"t":"Neuroleptic malignant syndrome","c":false,"r":"The patient is not taking an antipsychotic and the drug is propofol."},{"t":"Propofol infusion syndrome","c":true,"r":""},{"t":"Serotonin syndrome","c":false,"r":"The picture does not match a serotonergic drug."},{"t":"Malignant hyperthermia","c":false,"r":"This follows exposure to anesthetic gases or succinylcholine."}],"i":"Recognizing a sedation complication.","e":"Long infusions at high doses impair cell energy use and cause acidosis, heart failure and muscle breakdown. The drug is stopped and another agent is chosen."},{"id":"T5-16","a":0,"s":"When is a decompressive craniectomy considered for a patient with a severe brain injury?","o":[{"t":"As the first treatment for a patient with a GCS of 13 or lower","c":false,"r":"Surgery is not first line for mild injury."},{"t":"After the patient has been declared brain dead","c":false,"r":"It is meant to save brain tissue, not after death."},{"t":"When the CT scan of the head is normal","c":false,"r":"A normal CT does not call for removal of bone."},{"t":"When intracranial pressure stays high despite medical treatment","c":true,"r":""}],"i":"Knowing when surgery lowers pressure.","e":"A large piece of skull is removed to give the swollen brain room. It is a last tier option for refractory pressure, and the bone is replaced later."},{"id":"T5-17","a":0,"s":"What oxygen saturation should the nurse maintain for a patient with a severe traumatic brain injury?","o":[{"t":"About 85 percent to avoid oxygen toxicity","c":false,"r":"Low saturation starves the injured brain."},{"t":"Exactly 100 percent at all times at high pressure","c":false,"r":"Hyperoxia gives no benefit and may cause harm."},{"t":"A value above 70 percent is acceptable","c":false,"r":"This is too low and increases secondary injury."},{"t":"At least 94 percent, avoiding hypoxia","c":true,"r":""}],"i":"Preventing hypoxia.","e":"A single episode of hypoxia worsens outcomes. The goal is to keep oxygenation normal without excess."},{"id":"T5-18","a":0,"s":"Which nursing technique lowers the rise in ICP during endotracheal suctioning?","o":[{"t":"Suction for 30 seconds each pass so all secretions clear","c":false,"r":"Long passes cause hypoxia and a rise in ICP."},{"t":"Preoxygenate and limit each suction pass to 10 seconds","c":true,"r":""},{"t":"Suction without preoxygenation to save time","c":false,"r":"This invites hypoxia."},{"t":"Turn the head fully to the side during suctioning","c":false,"r":"This can obstruct venous drainage and raise the ICP."}],"i":"Reducing ICP surges.","e":"Suction can cause coughing, hypoxia, and a pressure rise. Brief passes, preoxygenation, and good analgesia limit the effect."},{"id":"T5-19","a":0,"s":"When should enteral nutrition begin for a patient with a severe brain injury who cannot eat?","o":[{"t":"Within 24 to 72 hours after injury","c":true,"r":""},{"t":"After the patient wakes up and asks for food","c":false,"r":"Waiting for this delays needed nutrition."},{"t":"After two weeks of intravenous fluids alone","c":false,"r":"Delay increases infection and muscle loss."},{"t":"Not at all, since the gut is not used after injury","c":false,"r":"The gut should be used when it works."}],"i":"Starting nutrition early.","e":"Early feeding supports healing and lowers complications. The aim is to reach full feeding by about day seven."},{"id":"T5-20","a":0,"s":"When may chemical venous thromboembolism prophylaxis usually be started in a patient with a brain injury?","o":[{"t":"Within minutes, before CT is done","c":false,"r":"Bleeding must be excluded first."},{"t":"At 24 to 72 hours, if repeat CT is stable","c":true,"r":""},{"t":"Not at all, since patients bleed from the brain","c":false,"r":"Clots are a major risk and prophylaxis is needed once stable."},{"t":"After one month of bed rest in the unit","c":false,"r":"This is too late and leaves patients at risk."}],"i":"Timing anticoagulant prophylaxis.","e":"Mechanical devices start at once. Low molecular weight heparin is added after a stable CT, per the neurosurgeon."},{"id":"T5-21","a":0,"s":"A patient hit in the eye by a fist has double vision on upward gaze and numbness of the cheek. Which injury is suspected?","o":[{"t":"A fracture of the nasal bone with swelling and a nosebleed","c":false,"r":"This does not limit upward gaze."},{"t":"An orbital floor blowout fracture with inferior rectus entrapment","c":true,"r":""},{"t":"A fracture of the mandibular condyle with trismus","c":false,"r":"This affects the jaw, not eye movement."},{"t":"A tear of the eyelid margin with a small bleed","c":false,"r":"This does not limit eye movement."}],"i":"Recognizing blowout fractures.","e":"The floor breaks and muscle or fat is caught in the defect, which limits upward gaze. The infraorbital nerve is often injured, causing numbness."},{"id":"T5-22","a":0,"s":"Which finding most suggests a mandible fracture?","o":[{"t":"Malocclusion with a hematoma under the tongue","c":true,"r":""},{"t":"Clear fluid from one nostril and a bruise behind the ear","c":false,"r":"This suggests a skull base fracture."},{"t":"A flat nose with a bruise at the bridge","c":false,"r":"This suggests a nasal fracture."},{"t":"Bleeding from the ear canal with hearing loss","c":false,"r":"This suggests a temporal bone injury."}],"i":"Recognizing mandible fractures.","e":"Patients say their teeth do not meet right. Floor of mouth bruising, trismus, and a step off along the jaw are also seen."},{"id":"T5-23","a":0,"s":"An adult tooth is knocked out completely during a fall. What is the best way to transport it for reimplantation?","o":[{"t":"Scrub the root clean and keep it dry in a tissue for the trip","c":false,"r":"Scrubbing destroys the cells needed for reattachment."},{"t":"Hold by the root and rinse with tap water for a minute or more","c":false,"r":"Touching the root and water harm the cells."},{"t":"Hold the crown and keep it in milk or saline","c":true,"r":""},{"t":"Place it in alcohol so that it stays sterile on the trip","c":false,"r":"Alcohol kills the root cells."}],"i":"Preserving an avulsed tooth.","e":"Cells on the root survive for a short time. Milk, saline, or the patient's own cheek keeps them alive until reimplantation."},{"id":"T5-24","a":0,"s":"A patient with bilateral mandibular body fractures is supine and has noisy breathing. What is the likely cause?","o":[{"t":"Fluid in the lungs from heart failure after the fractures","c":false,"r":"This does not match a jaw injury."},{"t":"The tongue falls back because it lost its forward support","c":true,"r":""},{"t":"Narrowing of the bronchi from asthma","c":false,"r":"This does not match the injury."},{"t":"A collapsed lung from a tension pneumothorax","c":false,"r":"This causes absent breath sounds, not noisy upper airway sounds."}],"i":"Understanding airway obstruction with jaw fractures.","e":"The jaw muscles that hold the tongue forward are detached. The patient may need to sit forward, or have a jaw thrust or a surgical airway."},{"id":"T5-25","a":0,"s":"A patient has severe eye pain, a bulging eye and vision loss after blunt trauma, and the eye pressure is very high. What is the emergency treatment?","o":[{"t":"Cover the eye with a tight pressure patch","c":false,"r":"This raises the pressure further."},{"t":"Lateral canthotomy to relieve pressure","c":true,"r":""},{"t":"Apply warm compresses and recheck in the morning","c":false,"r":"Delay causes permanent blindness."},{"t":"Instill steroid drops and send the patient home","c":false,"r":"This does not relieve the pressure."}],"i":"Treating retrobulbar hematoma.","e":"Blood behind the eye acts like a compartment syndrome and damages the optic nerve in hours. Canthotomy is done at the bedside."},{"id":"T5-26","a":0,"s":"What is the first assessment to document in most patients with an eye injury?","o":[{"t":"Eye pressure with a tonometer in the patient","c":false,"r":"This is unsafe if the globe may be open."},{"t":"Eyelid eversion in the patient before anything else","c":false,"r":"This can harm an eye that may be ruptured."},{"t":"Visual acuity, unless a chemical burn is present","c":true,"r":""},{"t":"Color of the iris compared with the other eye","c":false,"r":"This does not guide care."}],"i":"Prioritizing eye assessment.","e":"Visual acuity is the vital sign of the eye and is recorded before treatment. The only exception is a chemical splash, which is irrigated at once."},{"id":"T5-27","a":0,"s":"After a blunt injury, the pupil is peaked like a teardrop pointing toward the wound. What is suspected?","o":[{"t":"A normal variant of the pupil","c":false,"r":"The shape of the pupil is changed by the injury."},{"t":"A corneal abrasion with no deeper injury","c":false,"r":"An abrasion does not change the pupil shape."},{"t":"A subconjunctival hemorrhage","c":false,"r":"This leaves the pupil normal."},{"t":"An open globe injury","c":true,"r":""}],"i":"Recognizing an open globe.","e":"The iris is pulled toward the wound. A rigid shield is placed, no pressure is applied, and the eye specialist is called."},{"id":"T5-28","a":0,"s":"Which statement about cervical collars in a patient with a penetrating neck wound is correct?","o":[{"t":"A collar must be applied tightly to protect the neck","c":false,"r":"It can hamper the exam and the airway."},{"t":"A collar prevents bleeding from the wound","c":false,"r":"It does not control bleeding."},{"t":"A collar is not routinely needed and can hide an expanding hematoma","c":true,"r":""},{"t":"A collar is needed to protect the airway","c":false,"r":"It does not protect the airway."}],"i":"Handling the spine in penetrating injury.","e":"Unstable spinal injury is rare in isolated penetrating neck wounds, and a collar can hide a swelling and limit airway care."},{"id":"T5-29","a":0,"s":"Which findings suggest a laryngeal fracture after blunt neck trauma?","o":[{"t":"A clear voice with a normal neck contour","c":false,"r":"These are not signs of laryngeal injury."},{"t":"Hoarseness and subcutaneous emphysema","c":true,"r":""},{"t":"A stiff neck with pain on one side","c":false,"r":"This suggests a muscle strain."},{"t":"Pain in the shoulder with normal breathing","c":false,"r":"This does not suggest laryngeal injury."}],"i":"Recognizing laryngeal fracture.","e":"Voice change, crepitus, and flattened contour suggest a broken larynx. The airway can fail suddenly, so an expert prepares for a surgical airway."},{"id":"T5-30","a":0,"s":"After blunt neck trauma, a patient has a drooping eyelid, a small pupil on the same side and a headache. Which injury is suspected?","o":[{"t":"A fracture of the clavicle with a bruise over the shoulder","c":false,"r":"This does not cause these signs."},{"t":"A sprain of the neck muscles from the blow","c":false,"r":"This does not cause these signs."},{"t":"A carotid artery dissection with Horner syndrome","c":true,"r":""},{"t":"A pneumothorax on the same side as the blow","c":false,"r":"This does not cause these signs."}],"i":"Recognizing carotid dissection.","e":"Injury to the sympathetic fibers around the carotid causes ptosis and a small pupil. CT angiography confirms it, and treatment prevents a stroke."},{"id":"T5-31","a":0,"s":"A child falls from a swing and has brief numbness and weakness in all limbs that is improving. X-ray and CT of the spine are normal. Which condition is considered?","o":[{"t":"A normal exam, so no further evaluation is needed","c":false,"r":"Symptoms mean the cord may be injured despite normal films."},{"t":"A fracture of the odontoid that CT has missed","c":false,"r":"CT shows odontoid fractures reliably."},{"t":"A muscle strain needing a soft collar and a day of rest","c":false,"r":"Neurologic symptoms are not explained by a strain."},{"t":"Spinal cord injury without radiographic abnormality","c":true,"r":""}],"i":"Recognizing SCIWORA in children.","e":"The elastic spine of a child can stretch and injure the cord without bone damage. MRI shows the cord, and the child needs spinal protection."},{"id":"T5-32","a":1,"s":"A worker is crushed between a forklift and a wall. He has a purple face, petechiae over the head and neck, and swollen eyes, but the abdomen looks normal. Which condition is this?","o":[{"t":"Neurogenic shock from a lesion of the cervical cord","c":false,"r":"This causes warm skin and a slow pulse, not facial discoloration."},{"t":"Superior vena cava syndrome from a slow growing chest tumor","c":false,"r":"This builds slowly and is not due to a crush injury."},{"t":"Traumatic asphyxia from a sudden rise in chest pressure","c":true,"r":""},{"t":"Anaphylaxis from an allergen exposure at the shop","c":false,"r":"This causes hives and airway swelling, not petechiae above the level of the crush."}],"i":"Recognizing traumatic asphyxia.","e":"Compression of the chest forces blood back into the veins of the head and neck. The patient needs oxygen and a search for underlying lung, heart and rib injuries."},{"id":"T5-33","a":1,"s":"A patient has a posterior sternoclavicular dislocation after a crash. Which problem is the main concern?","o":[{"t":"Weakness of the thumb from a stretched wrist nerve","c":false,"r":"This is not a typical complication of this joint."},{"t":"A fracture of the hip joint on the same side","c":false,"r":"This joint is distant."},{"t":"A tear of the knee ligament on the same side","c":false,"r":"This is unrelated."},{"t":"Compression of the trachea, esophagus or great vessels","c":true,"r":""}],"i":"Recognizing a dangerous chest wall injury.","e":"The head of the clavicle is pushed behind the sternum. Breathing difficulty, trouble swallowing or a weak arm pulse are warning signs."},{"id":"T5-34","a":1,"s":"A 76 year old has four fractured ribs after a fall and has a stable oxygen saturation with pain on deep breaths. Which disposition is most appropriate?","o":[{"t":"Discharge home with a rib belt, acetaminophen and follow up","c":false,"r":"Older adults with several rib fractures often decline and develop pneumonia."},{"t":"Discharge home after a dose of oral opioid","c":false,"r":"The risk of respiratory failure is high in this patient."},{"t":"Transfer to a general unit with no monitoring","c":false,"r":"Monitoring is needed for the risk of failure."},{"t":"Admission to a monitored unit with pain control","c":true,"r":""}],"i":"Managing rib fractures in older adults.","e":"Mortality rises with age and with each rib broken. Regional analgesia, incentive spirometry and early mobility lower the risk of pneumonia and failure."},{"id":"T5-35","a":1,"s":"A patient with a chest tube on suction has air under the skin that is spreading from the chest to the neck and face. What should the nurse suspect first?","o":[{"t":"A normal finding that needs no action","c":false,"r":"Spreading air under the skin shows air is escaping into the tissue."},{"t":"An allergy to the adhesive in the dressing","c":false,"r":"An allergy does not cause air under the skin."},{"t":"A blocked chest tube or a large air leak","c":true,"r":""},{"t":"A new kidney injury from the trauma","c":false,"r":"This does not cause air under the skin."}],"i":"Responding to subcutaneous emphysema.","e":"Air that cannot leave through the tube tracks into tissue. The nurse checks the tube and connections, assesses the airway, and informs the provider."},{"id":"T5-36","a":1,"s":"A patient has a sucking wound in the right chest and is breathing fast. Which first aid is correct?","o":[{"t":"Seal all four sides tightly with tape","c":false,"r":"This can trap air and cause a tension pneumothorax."},{"t":"Pack the wound with gauze and press hard","c":false,"r":"This does not allow air to escape."},{"t":"Apply an occlusive dressing taped on three sides","c":true,"r":""},{"t":"Leave it open to the air and observe","c":false,"r":"An open wound allows air to enter the chest."}],"i":"Treating an open pneumothorax.","e":"A valve effect lets air out when the patient breathes out but blocks entry on breathing in. A chest tube is placed away from the wound."},{"id":"T5-37","a":1,"s":"Which finding after chest tube placement for a hemothorax is an indication for operative exploration?","o":[{"t":"Over 1500 mL at once or 200 mL per hour for hours","c":true,"r":""},{"t":"A drainage of 100 mL over the first day of the stay","c":false,"r":"This is a small amount and is expected."},{"t":"A small amount of pink fluid that then stops","c":false,"r":"This does not show ongoing bleeding."},{"t":"A drainage of 50 mL in the first hour","c":false,"r":"This is a small amount."}],"i":"Knowing criteria for thoracotomy.","e":"A massive initial drainage or continued high output shows major bleeding from a vessel, which needs surgical control."},{"id":"T5-38","a":1,"s":"A patient with a lung contusion looks stable at the time of arrival. When is the oxygen need most likely to peak?","o":[{"t":"About 24 to 48 hours after injury","c":true,"r":""},{"t":"At the moment of arrival, before fluid is given","c":false,"r":"The injury evolves over hours."},{"t":"After about 2 weeks, when most patients improve","c":false,"r":"The injury improves by then."},{"t":"After about 3 months, once the lung has healed","c":false,"r":"The injury has resolved by then."}],"i":"Anticipating contusion course.","e":"Bleeding and edema build gradually, so the patient may worsen on day one or two. Close monitoring is needed."},{"id":"T5-39","a":1,"s":"A patient has a small pneumothorax seen only on CT and is about to begin positive pressure ventilation for surgery. What is usually done?","o":[{"t":"Do nothing, because a small pneumothorax will not grow","c":false,"r":"It can enlarge quickly under positive pressure."},{"t":"Wait until the patient has chest pain","c":false,"r":"Waiting can cause collapse."},{"t":"Give a large fluid bolus to expand the lungs","c":false,"r":"Fluids do not treat air in the pleural space."},{"t":"Place a chest tube before positive pressure","c":true,"r":""}],"i":"Managing an occult pneumothorax.","e":"Positive pressure forces air into the pleural space. A small leak can become a tension pneumothorax, so a drain is placed first."},{"id":"T5-40","a":1,"s":"Which ultrasound view best detects pericardial fluid in a trauma patient?","o":[{"t":"The subxiphoid view, looking at the heart through the liver","c":true,"r":""},{"t":"A view of the left flank over the spleen and kidney","c":false,"r":"This view looks for abdominal fluid, not fluid around the heart."},{"t":"A view of the pelvis above the pubic bone and bladder","c":false,"r":"This view looks for pelvic fluid, not fluid around the heart."},{"t":"A view of the right upper quadrant over the liver and kidney","c":false,"r":"This view looks for abdominal fluid, not fluid around the heart."}],"i":"Using FAST for the heart.","e":"The pericardial window of the FAST exam shows blood around the heart as a dark rim. It supports tamponade in a patient in shock."},{"id":"T5-41","a":1,"s":"A young athlete collapses after a blow to the chest from a baseball and has no pulse. Which rhythm is most likely and what is the treatment?","o":[{"t":"Asystole, treated with cardiac pacing alone","c":false,"r":"The typical rhythm is fibrillation and early shock is needed."},{"t":"Sinus tachycardia, treated with a beta blocker","c":false,"r":"This does not cause arrest."},{"t":"Ventricular fibrillation, treated by shock","c":true,"r":""},{"t":"Atrial fibrillation, treated with a diuretic","c":false,"r":"This does not cause sudden arrest."}],"i":"Recognizing commotio cordis.","e":"A blow during a vulnerable moment of the cardiac cycle causes fibrillation. Survival depends on rapid CPR and defibrillation."},{"id":"T5-42","a":1,"s":"Several hours after a blunt chest injury, a patient has sudden shortness of breath, pulmonary edema and a new loud murmur. What is the likely cause?","o":[{"t":"A simple rib fracture with a small pneumothorax","c":false,"r":"This does not cause a new murmur."},{"t":"Papillary muscle rupture with acute MR","c":true,"r":""},{"t":"A hiatal hernia with acid reflux after the crash","c":false,"r":"This does not cause a new murmur."},{"t":"A mild lung contusion with some pain","c":false,"r":"This does not cause a new murmur."}],"i":"Recognizing valve injury.","e":"Blood flows back into the left atrium and lungs. Echocardiography confirms it, and the patient needs urgent surgery."},{"id":"T5-43","a":1,"s":"Which patient may need an emergency resuscitative thoracotomy?","o":[{"t":"A patient with a rib fracture and stable vital signs","c":false,"r":"This patient does not need it."},{"t":"A patient with a small pneumothorax and a pulse","c":false,"r":"This patient does not need it."},{"t":"A chest stab wound patient who loses pulses in the ED","c":true,"r":""},{"t":"A patient with an isolated head injury and stable vitals","c":false,"r":"This patient does not need it."}],"i":"Knowing thoracotomy indications.","e":"The best outcomes follow penetrating chest injury with a short period of lost signs of life. The goal is to relieve tamponade and control bleeding."},{"id":"T5-44","a":1,"s":"Which chest film finding raises concern for blunt aortic injury?","o":[{"t":"A normal mediastinum and clear lungs on the upright film","c":false,"r":"This lowers the concern."},{"t":"A single healed rib fracture on the left","c":false,"r":"This is not a sign of aortic injury."},{"t":"A widened mediastinum with a displaced nasogastric tube","c":true,"r":""},{"t":"Mild hyperinflation of the lungs with flat diaphragms","c":false,"r":"This is not a sign of aortic injury."}],"i":"Reading the chest film.","e":"Blood in the mediastinum pushes structures aside. CT angiography is done for any suspicious film or high energy mechanism."},{"id":"T5-45","a":1,"s":"A patient has a stab wound near the clavicle, a blood pressure of 140 in the right arm and 90 in the left arm, and a cool left hand. What is suspected?","o":[{"t":"A tension pneumothorax on the right","c":false,"r":"This does not cause a difference in arm pressures."},{"t":"Left subclavian artery injury","c":true,"r":""},{"t":"A rib fracture alone","c":false,"r":"This does not cause a difference in arm pressures."},{"t":"A cervical spine fracture","c":false,"r":"This does not cause a difference in arm pressures."}],"i":"Recognizing arterial injury.","e":"A pressure difference between arms, weak pulses and a cool hand are hard signs of arterial injury and call for urgent imaging or surgery."},{"id":"T5-46","a":1,"s":"CT shows a small intimal tear of the descending aorta with no external bleeding in a stable patient. What is the usual plan?","o":[{"t":"Discharge with no follow up","c":false,"r":"This injury can progress."},{"t":"Heavy exercise to improve flow","c":false,"r":"This raises the stress on the wall."},{"t":"Control pressure and rate, then reimage","c":true,"r":""},{"t":"Anticoagulation with a high dose of heparin","c":false,"r":"This can worsen bleeding."}],"i":"Managing minimal aortic injuries.","e":"Small injuries may be treated medically with strict blood pressure control and close imaging. Larger injuries are repaired by stent graft."},{"id":"T5-47","a":1,"s":"Which finding strongly suggests injury to the superior vena cava or a great vein in a patient with a penetrating chest wound?","o":[{"t":"Massive bleeding with face and arm swelling and neck vein distension","c":true,"r":""},{"t":"A normal pressure and a calm patient","c":false,"r":"This does not suggest injury."},{"t":"A dry cough with a normal pulse and a blood pressure of 130 over 80","c":false,"r":"This does not suggest injury."},{"t":"A bruise on the thigh with normal pulses","c":false,"r":"This does not suggest injury."}],"i":"Recognizing venous injury.","e":"Large veins bleed heavily in the chest. Patients are in shock, and they need immediate surgical control."},{"id":"T5-48","a":1,"s":"A patient with a suspected hollow viscus injury is going to the operating room. Which antibiotic plan is appropriate?","o":[{"t":"Coverage for gram positive skin bacteria alone","c":false,"r":"Bowel contents hold gram negative and anaerobic organisms."},{"t":"An antiviral drug given after surgery","c":false,"r":"This does not treat bacterial contamination."},{"t":"Gram negative and anaerobic coverage","c":true,"r":""},{"t":"No antibiotics, since surgery cleans the abdomen","c":false,"r":"Early antibiotics lower the rate of infection."}],"i":"Giving antibiotics for bowel injury.","e":"Bacteria spill from the gut into the abdomen. Early drugs that cover these organisms lower abscess and wound infection."},{"id":"T5-49","a":1,"s":"A stable patient has equivocal findings after blunt abdominal trauma and a negative CT. What is the best next step?","o":[{"t":"Discharge at once with no instructions","c":false,"r":"Hollow organ injury can be delayed."},{"t":"Give oral contrast, repeat the scan, and send the patient home","c":false,"r":"This does not exclude injury."},{"t":"Admit for serial abdominal examinations over the next hours","c":true,"r":""},{"t":"Perform an exploratory laparotomy in all patients","c":false,"r":"Many patients do not need surgery."}],"i":"Using serial exams.","e":"Bowel injury can be missed early. Repeat exams, labs and a low threshold for repeat imaging find injuries before they progress."},{"id":"T5-50","a":1,"s":"A child hits the abdomen on a bicycle handlebar and then has repeated bilious vomiting. Which injury is suspected?","o":[{"t":"A fracture of the skull base with a fluid leak","c":false,"r":"This does not cause bilious vomiting."},{"t":"A duodenal hematoma or perforation","c":true,"r":""},{"t":"A bruise of the knee from the bicycle frame","c":false,"r":"This does not cause bilious vomiting."},{"t":"A broken wrist from the fall onto the road","c":false,"r":"This does not cause bilious vomiting."}],"i":"Linking mechanism to injury.","e":"The handlebar compresses the duodenum against the spine. A hematoma can obstruct the lumen, and imaging confirms it."},{"id":"T5-51","a":1,"s":"After a pelvic crash, a digital rectal exam shows blood on the glove. What does this suggest?","o":[{"t":"A normal finding after a fall needing no further study","c":false,"r":"Blood suggests a tear in the rectum or bowel."},{"t":"A rectal injury or a pelvic fracture open to the rectum","c":true,"r":""},{"t":"A urinary tract infection with blood in the urine","c":false,"r":"This does not cause blood on the glove."},{"t":"A hemorrhoid that is present in most patients","c":false,"r":"This should not be assumed in trauma."}],"i":"Using the rectal exam.","e":"A rectal tear contaminates the pelvis and needs imaging, endoscopy and often a diverting colostomy."},{"id":"T5-52","a":1,"s":"A stable patient has a grade III liver laceration on CT. What is the usual management?","o":[{"t":"Immediate removal of the liver in the operating room","c":false,"r":"This is not an option."},{"t":"Discharge home the same day with oral pain medicine","c":false,"r":"The risk of delayed bleeding is high."},{"t":"Heavy physical exertion to improve healing of the liver","c":false,"r":"This risks bleeding."},{"t":"Nonoperative care with monitoring and serial hemoglobin","c":true,"r":""}],"i":"Managing liver injury.","e":"Most stable patients are managed without surgery. Angioembolization is used if bleeding continues, and surgery if the patient becomes unstable."},{"id":"T5-53","a":1,"s":"A surgeon uses the Pringle maneuver during a liver operation. What is its purpose?","o":[{"t":"It rotates the liver to the left side of the abdomen","c":false,"r":"This is not its function."},{"t":"It briefly clamps the hepatic artery and portal vein","c":true,"r":""},{"t":"It drains bile from the gallbladder through a tube","c":false,"r":"This is not its function."},{"t":"It measures the pressure of the portal vein","c":false,"r":"This is not its function."}],"i":"Understanding liver hemorrhage control.","e":"Clamping the portal triad reduces inflow to the liver. If bleeding continues, the hepatic veins or the vena cava are injured."},{"id":"T5-54","a":1,"s":"Which spleen injury is graded as AAST grade V?","o":[{"t":"A small subcapsular hematoma under 10 percent","c":false,"r":"This is grade I."},{"t":"A laceration under 1 cm deep in the surface of the spleen","c":false,"r":"This is grade I."},{"t":"A shattered spleen or a completely devascularized spleen","c":true,"r":""},{"t":"A hematoma that is contained and under 5 cm","c":false,"r":"This is a lower grade."}],"i":"Grading splenic injury.","e":"Grade V includes a shattered spleen or an injury to the hilar vessels that cuts off blood supply. These patients usually need surgery."},{"id":"T5-55","a":1,"s":"Which injury is least likely to be found on a FAST examination?","o":[{"t":"Blood in the hepatorenal space of the abdomen","c":false,"r":"This is a standard finding."},{"t":"Blood around the heart seen in the pericardial window","c":false,"r":"This is a standard finding."},{"t":"Retroperitoneal bleeding or an early bowel injury","c":true,"r":""},{"t":"Free fluid in the pelvis of the patient","c":false,"r":"This is a standard finding."}],"i":"Knowing the limits of FAST.","e":"FAST detects free fluid in the abdomen and around the heart. It misses deep retroperitoneal bleeding and many hollow organ injuries."},{"id":"T5-56","a":1,"s":"A stab wound lies between the nipple line and the costal margin on the left. Which injury must be excluded?","o":[{"t":"A fracture of the thoracic spine","c":false,"r":"This is not the main concern for an anterior wound."},{"t":"A superficial chest wall bruise","c":false,"r":"A penetrating wound cannot be assumed to be superficial."},{"t":"A pneumothorax of the right lung","c":false,"r":"The wound is on the left side."},{"t":"A diaphragm injury","c":true,"r":""}],"i":"Knowing the thoracoabdominal zone.","e":"Wounds in this zone can enter the chest and abdomen. The diaphragm may be torn, so imaging or laparoscopy is used."},{"id":"T5-57","a":1,"s":"A patient had a missed diaphragm tear after an injury and now presents weeks later with vomiting and chest pain. What has happened?","o":[{"t":"Herniation and obstruction of bowel in the chest","c":true,"r":""},{"t":"A new fracture of a rib from the original injury","c":false,"r":"This does not match."},{"t":"A simple muscle strain of the abdominal wall","c":false,"r":"This does not match."},{"t":"A new skin infection around the old wound","c":false,"r":"This does not match."}],"i":"Recognizing late complications.","e":"Negative pressure in the chest draws organs through the defect over time. Surgery repairs the diaphragm."},{"id":"T5-58","a":1,"s":"Which chest film finding raises concern for a left diaphragm rupture?","o":[{"t":"Clear lungs with sharp diaphragm borders","c":false,"r":"This is normal."},{"t":"A small rib fracture on the right with a normal diaphragm","c":false,"r":"This does not suggest a rupture."},{"t":"A normal heart size with a clear costophrenic angle","c":false,"r":"This does not suggest a rupture."},{"t":"An elevated left hemidiaphragm with bowel gas above it","c":true,"r":""}],"i":"Reading the film for rupture.","e":"The film may be nondiagnostic, so CT or direct visualization is needed when suspicion remains."},{"id":"T5-59","a":1,"s":"Which retroperitoneal hematoma should generally not be opened during surgery for blunt trauma?","o":[{"t":"A pelvic hematoma that is stable","c":true,"r":""},{"t":"A central hematoma over the aorta","c":false,"r":"This usually needs exploration."},{"t":"An expanding hematoma near the aorta","c":false,"r":"This usually needs exploration."},{"t":"A pulsatile hematoma at the kidney","c":false,"r":"This needs exploration."}],"i":"Using retroperitoneal zones.","e":"Opening a pelvic hematoma releases tamponade and causes uncontrollable bleeding. Pelvic bleeding is managed with packing or angioembolization."},{"id":"T5-60","a":1,"s":"CT of a patient with blunt injury shows retroperitoneal air around the right kidney. Which injury is suspected?","o":[{"t":"A fractured rib on the left","c":false,"r":"This does not explain the air."},{"t":"A duodenal perforation","c":true,"r":""},{"t":"A pneumothorax on the right","c":false,"r":"This does not explain retroperitoneal air."},{"t":"A bladder injury from the lap belt","c":false,"r":"This does not explain retroperitoneal air."}],"i":"Recognizing duodenal injury.","e":"The duodenum is retroperitoneal. Perforation puts air behind the abdomen without peritonitis at first."},{"id":"T5-61","a":1,"s":"Which pancreatic finding most changes management after blunt abdominal trauma?","o":[{"t":"A small contusion of the gland with no duct injury","c":false,"r":"This is managed without surgery."},{"t":"A mildly raised lipase on the first blood test","c":false,"r":"This does not determine surgery."},{"t":"A normal pancreas on the first CT scan","c":false,"r":"This needs no treatment."},{"t":"Disruption of the main pancreatic duct","c":true,"r":""}],"i":"Identifying duct injuries.","e":"Duct injury leaks enzymes and causes fistulas and abscesses. It needs drainage, a stent or resection."},{"id":"T5-62","a":1,"s":"Which complication is associated with a lateral compression pelvic fracture?","o":[{"t":"Bladder or urethral injury from sharp bone fragments","c":true,"r":""},{"t":"Opening of the pelvis with massive bleeding","c":false,"r":"This is the pattern with anteroposterior compression."},{"t":"Total loss of the blood volume at once","c":false,"r":"This is an overstatement."},{"t":"Injury to the shoulder joint from the same crash force","c":false,"r":"This is unrelated."}],"i":"Linking pattern to injury.","e":"The pelvis rotates inward and the volume shrinks, but bone fragments can pierce the bladder or urethra."},{"id":"T5-63","a":1,"s":"A patient with an open pelvic fracture has a wound near the perineum. Which assessment is essential?","o":[{"t":"A plain film of the chest to look for rib fractures","c":false,"r":"This does not find a tear in the rectum or vagina."},{"t":"A rectal and vaginal exam for a communicating tear","c":true,"r":""},{"t":"A glucose check and a urine pregnancy test","c":false,"r":"These do not find a communicating tear."},{"t":"A test of the strength of the arms and shoulders","c":false,"r":"This does not find a communicating tear."}],"i":"Evaluating open pelvic fractures.","e":"A tear in the rectum or vagina makes the fracture
