e head without contrast","c":false,"r":"This does not examine the ureters."},{"t":"A chest x-ray in the upright position","c":false,"r":"This does not show the ureters."},{"t":"A CT with a delayed excretory phase","c":true,"r":""},{"t":"A blood test for the hemoglobin level","c":false,"r":"This does not find a ureteral injury."}],"i":"Diagnosing ureteral injury.","e":"Ureteral injuries are easy to miss because they often show no blood in the urine. A delayed CT phase shows contrast leaking from the ureter."},{"id":"T2-70","a":2,"s":"A patient dove into shallow water and has severe neck pain. The x-ray shows a burst fracture of the ring of C1. What is this fracture called?","o":[{"t":"A Jefferson fracture caused by axial loading","c":true,"r":""},{"t":"A Hangman fracture caused by hyperextension","c":false,"r":"This is a fracture of the C2 pedicles, usually from hanging or a crash."},{"t":"A Chance fracture caused by a lap belt","c":false,"r":"This is a flexion injury of the thoracolumbar spine."},{"t":"A clay shoveler fracture caused by a muscle pull","c":false,"r":"This is an avulsion of a spinous process in the lower neck."}],"i":"Naming a cervical fracture by its mechanism.","e":"A force down the spine, as in a dive, drives the skull onto C1 and breaks the ring. The injury is often unstable, so the patient needs strict spinal precautions."},{"id":"T2-71","a":2,"s":"A patient has a fracture through the base of the odontoid process of C2 after a fall. What is the main concern?","o":[{"t":"Loss of function of the sciatic nerve","c":false,"r":"The sciatic nerve is far below this level."},{"t":"Slow bleeding in the large muscles of the thigh","c":false,"r":"This is not related to a neck fracture."},{"t":"A sprain of the ligaments in the ankle","c":false,"r":"This is unrelated to the cervical spine."},{"t":"Instability that can compress the upper cord","c":true,"r":""}],"i":"Recognizing the danger of an odontoid fracture.","e":"The odontoid holds the first vertebra to the second. A type II fracture at the base may not heal and is unstable, so movement can injure the upper cord. It needs a collar, halo, or surgery."},{"id":"T2-72","a":2,"s":"An obtunded adult trauma patient has a negative high quality CT of the cervical spine. Which statement is correct?","o":[{"t":"The collar may be removed per hospital protocol","c":true,"r":""},{"t":"The collar must stay on for six weeks or more","c":false,"r":"This is not needed after a high quality negative scan under protocol."},{"t":"The patient must have a daily MRI","c":false,"r":"Daily MRI is not a standard step."},{"t":"The collar is changed to a heavier brace","c":false,"r":"This is not needed when the CT is negative."}],"i":"Clearing the cervical spine in an obtunded patient.","e":"Many centers accept a negative high quality CT in an obtunded patient and remove the collar under protocol. The nurse follows the facility policy and the provider's order."},{"id":"T2-73","a":2,"s":"A patient with severe forearm swelling has a palpable radial pulse but severe pain with finger stretch. Why can a pulse be present in compartment syndrome?","o":[{"t":"The pulse is felt when the muscle is dead","c":false,"r":"A pulse does not show muscle death."},{"t":"Pressure exceeds capillary pressure but not arterial pressure","c":true,"r":""},{"t":"The compartment pressure is lower than normal","c":false,"r":"The pressure is higher than normal."},{"t":"The arteries are protected from swelling by bone","c":false,"r":"The pressure can still compress small vessels."}],"i":"Understanding why pulses can remain in compartment syndrome.","e":"Pressure high enough to close small vessels and starve the muscle can still be lower than the pressure in a large artery. A pulse may be present, and pulselessness is a late sign."},{"id":"T2-74","a":2,"s":"A patient had a repaired arterial injury after seven hours of limb ischemia, and the leg is now swelling. What does the surgeon often do?","o":[{"t":"Apply a tight wrap to reduce the swelling","c":false,"r":"A tight wrap raises compartment pressure."},{"t":"Perform a prophylactic fasciotomy","c":true,"r":""},{"t":"Raise the leg above the heart for a day","c":false,"r":"Raising the limb can reduce blood flow and worsen ischemia."},{"t":"Give an oral diuretic and observe the leg","c":false,"r":"This does not relieve compartment pressure."}],"i":"Preventing reperfusion compartment syndrome.","e":"Returning blood flow to ischemic muscle causes swelling. A fasciotomy relieves pressure before permanent damage occurs, so it is often done during the repair."},{"id":"T2-75","a":2,"s":"Which factor most often prevents replantation of an amputated limb?","o":[{"t":"The amputation happened during the daytime","c":false,"r":"The time of day does not matter."},{"t":"The patient is a young adult under forty years","c":false,"r":"Young age favors replantation."},{"t":"The part was kept cool and wrapped well","c":false,"r":"This preserves the part and favors replantation."},{"t":"An unstable patient with life threatening injuries","c":true,"r":""}],"i":"Knowing when replantation is not appropriate.","e":"The patient's life comes first. A patient who is unstable, or has severe crush, or multiple level injury to the limb, is not a candidate. A clean cut part in a stable patient is the best case."},{"id":"T2-76","a":2,"s":"Three days after a leg amputation, a patient reports burning pain in the foot that is no longer there. How should the nurse respond?","o":[{"t":"Tell the patient that the pain is imaginary","c":false,"r":"Phantom pain is real and common."},{"t":"Treat the pain as real with the provider","c":true,"r":""},{"t":"Set aside the report since there is no limb","c":false,"r":"Untreated pain can become chronic."},{"t":"Remove the dressing to look for the foot","c":false,"r":"This does not help the pain."}],"i":"Responding to phantom limb pain.","e":"Phantom pain is a real nerve pain. It is treated with medicines such as gabapentin and opioids, and with mirror therapy and positioning."},{"id":"T2-77","a":2,"s":"How much blood loss should the nurse expect from a closed femoral shaft fracture?","o":[{"t":"Less than 50 mL since the skin is not broken","c":false,"r":"A closed femur fracture can hide a large amount of blood."},{"t":"About 100 mL, which is a small amount","c":false,"r":"This underestimates the loss."},{"t":"Up to 1,000 to 1,500 mL into the thigh","c":true,"r":""},{"t":"None, since bone does not bleed at all","c":false,"r":"Bone and muscle bleed freely."}],"i":"Estimating blood loss with a long bone fracture.","e":"The thigh can hold a large volume, so a patient may go into shock from the fracture alone. Traction splinting reduces the volume and the bleeding."},{"id":"T2-78","a":2,"s":"A patient has pain in the anatomical snuffbox and a normal wrist x-ray after a fall on an outstretched hand. What is the best action?","o":[{"t":"Splint in a thumb spica and arrange repeat imaging","c":true,"r":""},{"t":"Discharge with no splint since the x-ray is normal","c":false,"r":"An early scaphoid fracture can be hidden on an x-ray."},{"t":"Apply a heating pad and allow the wrist to move","c":false,"r":"Movement risks displacement and poor healing."},{"t":"Order a chest x-ray to check the ribs closely","c":false,"r":"This does not address the wrist."}],"i":"Managing a suspected scaphoid fracture.","e":"The scaphoid has a weak blood supply, so a missed fracture can lead to death of the bone. The wrist is splinted and imaged again after some days or with a CT or MRI."},{"id":"T2-79","a":2,"s":"A worker was hit by a high pressure paint gun on the index finger. The finger has a tiny wound and little pain at first. What is the priority?","o":[{"t":"Cleaning with a small bandage, then discharge home","c":false,"r":"The small wound hides a large injury under the skin."},{"t":"Urgent surgical review for a limb threatening injury","c":true,"r":""},{"t":"Massaging the finger to spread the paint out","c":false,"r":"This causes greater damage."},{"t":"Warm soaks for several days and observation","c":false,"r":"This delays surgery."}],"i":"Recognizing a high pressure injection injury.","e":"The substance spreads through tissue planes and causes swelling and loss of blood flow within hours. Early surgical decompression is needed to save the finger."},{"id":"T2-80","a":2,"s":"A heavily contaminated wound from a farm injury is seen eight hours after injury. What is the best closure plan?","o":[{"t":"Close at once with tight sutures to seal the wound","c":false,"r":"This can trap bacteria and cause infection."},{"t":"Leave it unclean to allow natural healing","c":false,"r":"The wound needs cleaning."},{"t":"Clean thoroughly and consider delayed closure","c":true,"r":""},{"t":"Seal it with glue and send the patient home","c":false,"r":"Glue does not clean a contaminated wound."}],"i":"Choosing the timing of closure.","e":"Dirty wounds are cleaned, debrided, and often left open and closed after several days. Tetanus status and antibiotics are also checked."},{"id":"T2-81","a":2,"s":"A patient with a posterior elbow dislocation has a cool, pale hand and a weak pulse. Which structure is likely injured?","o":[{"t":"The brachial artery at the elbow","c":true,"r":""},{"t":"The radial artery at the wrist","c":false,"r":"The elbow dislocation is more likely to injure the brachial artery."},{"t":"The femoral artery in the groin","c":false,"r":"This is not at the elbow."},{"t":"The jugular vein in the neck","c":false,"r":"This is not at the elbow."}],"i":"Recognizing vascular injury with an elbow dislocation.","e":"The brachial artery runs in front of the elbow joint and can be stretched or torn. The limb needs urgent reduction and vascular evaluation."},{"id":"T2-82","a":2,"s":"A patient has an ankle fracture dislocation with an absent pedal pulse and a pale foot. What is the correct action?","o":[{"t":"Wait for the morning rounds to decide on care","c":false,"r":"Delay risks permanent loss of the foot."},{"t":"Reduce the ankle promptly and recheck the pulse","c":true,"r":""},{"t":"Apply ice and elevate the leg and nothing else","c":false,"r":"This does not restore the blood flow."},{"t":"Give an oral pain medicine and observe overnight","c":false,"r":"This does not address the loss of blood flow."}],"i":"Restoring perfusion after a dislocation.","e":"A displaced joint can kink or compress the artery. Prompt realignment often restores the pulse, and the nurse documents the pulse and sensation before and after."},{"id":"T2-83","a":3,"s":"Under the field triage guidelines, which systolic blood pressure is a high risk value for an older adult?","o":[{"t":"Less than 110 mmHg systolic","c":true,"r":""},{"t":"Less than 90 mmHg systolic","c":false,"r":"This is the cutoff used for younger adults."},{"t":"Less than 70 mmHg systolic","c":false,"r":"This is the cutoff for a young child."},{"t":"Less than 60 mmHg systolic","c":false,"r":"This is a severe value and is too low as a cutoff."}],"i":"Knowing the triage threshold for older adults.","e":"An older adult may be in shock with a pressure that looks normal. A systolic pressure below 110 mmHg is treated as a high risk sign."},{"id":"T2-84","a":3,"s":"An older adult has a fracture and becomes confused and agitated. Which medicine should be avoided if possible?","o":[{"t":"Acetaminophen at the usual dose given","c":false,"r":"This is a safe first choice for pain."},{"t":"A benzodiazepine such as lorazepam","c":true,"r":""},{"t":"A low dose regional nerve block given","c":false,"r":"This reduces the need for sedating drugs."},{"t":"Scheduled orientation with a clock in the room","c":false,"r":"These are nondrug measures that help."}],"i":"Avoiding drugs that worsen delirium.","e":"Benzodiazepines and sedating antihistamines increase delirium and falls in older adults. Nondrug approaches and treating pain are the first steps."},{"id":"T2-85","a":3,"s":"Why are lactate and base deficit more useful than vital signs for assessing shock in an older adult?","o":[{"t":"Older adults rarely have a normal lactate level","c":false,"r":"Lactate levels are normal when perfusion is good."},{"t":"Vital signs are accurate in older adult patients","c":false,"r":"Medicines and age change the vital signs."},{"t":"Laboratory tests are too slow to be of use","c":false,"r":"Blood gas results are rapid."},{"t":"Vital signs may look normal despite poor perfusion","c":true,"r":""}],"i":"Recognizing hidden shock in older adults.","e":"Beta blockers, a stiff heart, and long standing hypertension hide the usual signs. A high lactate or a base deficit warns of poor perfusion."},{"id":"T2-86","a":3,"s":"A 2 year old in shock has two failed attempts at intravenous access. What should the nurse prepare?","o":[{"t":"A central line in the neck by the nurse","c":false,"r":"This takes longer and carries greater risk in a crisis."},{"t":"An intraosseous needle in the proximal tibia","c":true,"r":""},{"t":"More attempts at peripheral lines for ten minutes","c":false,"r":"Delays in fluid are harmful in shock."},{"t":"Oral rehydration solution with small sips","c":false,"r":"The child cannot absorb oral fluid in shock."}],"i":"Obtaining vascular access in a child in shock.","e":"Intraosseous access is fast and reliable. It is used after a brief attempt at an intravenous line fails, and fluids and drugs flow through the bone marrow."},{"id":"T2-87","a":3,"s":"Which tool helps the nurse choose the size of equipment and drug doses for an injured child when the weight is unknown?","o":[{"t":"A calendar of the child's birthdays","c":false,"r":"This does not estimate size."},{"t":"The parent's height recorded in the chart","c":false,"r":"This does not give the child's weight."},{"t":"A length based resuscitation tape","c":true,"r":""},{"t":"A growth chart for the first year","c":false,"r":"This does not give a quick size estimate."}],"i":"Estimating size and dosing in an emergency.","e":"A length based tape estimates weight from height and gives equipment sizes and doses in a color coded system. It speeds up and reduces errors in pediatric resuscitation."},{"id":"T2-88","a":3,"s":"Which organ is most commonly injured in blunt abdominal trauma in children?","o":[{"t":"The pancreas","c":false,"r":"This is injured less often."},{"t":"The gallbladder","c":false,"r":"This is injured rarely."},{"t":"The spleen","c":true,"r":""},{"t":"The appendix","c":false,"r":"This is not a common blunt injury."}],"i":"Knowing common pediatric abdominal injuries.","e":"Children have a thin abdominal wall and less protection from the ribs, so the spleen and liver are the main organs injured. Most are treated without surgery."},{"id":"T2-89","a":3,"s":"A woman who is 28 weeks pregnant is lying flat and is hypotensive after a fall. Which action helps?","o":[{"t":"Place the patient in a head down position","c":false,"r":"This does not relieve pressure on the vena cava."},{"t":"Displace the uterus or tilt the patient to the left","c":true,"r":""},{"t":"Place the patient flat with the legs raised","c":false,"r":"This keeps the weight of the uterus on the veins."},{"t":"Place the patient sitting upright on the stretcher","c":false,"r":"This does not relieve pressure on the vena cava."}],"i":"Relieving vena cava compression in late pregnancy.","e":"After about 20 weeks the uterus presses on the vena cava and lowers the blood returning to the heart. Left uterine displacement or a left tilt improves the blood pressure."},{"id":"T2-90","a":3,"s":"A pregnant trauma patient has a Kleihauer Betke test ordered. What does it measure?","o":[{"t":"The amount of fetal blood in the mother's circulation","c":true,"r":""},{"t":"The level of sugar in the mother's blood","c":false,"r":"This is a glucose test."},{"t":"The strength of the fetal heartbeat now","c":false,"r":"This is measured by monitoring."},{"t":"The size of the baby by weight in grams","c":false,"r":"This is measured by ultrasound."}],"i":"Understanding the Kleihauer Betke test.","e":"The test counts fetal red cells in the maternal blood. It helps decide the dose of Rh immune globulin that an Rh negative mother needs."},{"id":"T2-91","a":3,"s":"A pregnant patient has vaginal bleeding, a tender and rigid uterus, and a falling fetal heart rate after a crash. Which complication is likely?","o":[{"t":"Placental abruption with concealed bleeding","c":true,"r":""},{"t":"Placenta previa with a painless bleed","c":false,"r":"This causes painless bright bleeding and a soft uterus."},{"t":"A normal show of labor late in pregnancy","c":false,"r":"This does not cause a rigid uterus."},{"t":"A urinary tract infection of the bladder","c":false,"r":"This does not cause vaginal bleeding and a rigid uterus."}],"i":"Recognizing placental abruption after trauma.","e":"The placenta separates from the uterine wall. It is the leading cause of fetal loss after blunt trauma and can occur even with a minor injury."},{"id":"T2-92","a":3,"s":"A worker has a hydrofluoric acid splash on the hand and has severe pain that seems out of proportion to the skin changes. Which treatment is specific?","o":[{"t":"Sodium bicarbonate paste on the skin","c":false,"r":"This may cause a further reaction."},{"t":"Silver cream under a dry dressing","c":false,"r":"This does not neutralize the acid."},{"t":"Ice packs for the first hour","c":false,"r":"Ice does not treat the acid injury."},{"t":"Calcium gluconate gel or injections","c":true,"r":""}],"i":"Treating a hydrofluoric acid burn.","e":"Fluoride ions bind calcium and cause deep tissue damage and low calcium. After irrigation, calcium gluconate binds the fluoride, and the nurse watches the ECG for the effects of low calcium."},{"id":"T2-93","a":3,"s":"A patient with a high voltage electrical injury has dark red urine. What is the best treatment?","o":[{"t":"Restrict fluids to protect the kidneys from strain","c":false,"r":"This causes pigment to block the kidney tubules."},{"t":"Give a nonsteroidal drug for the pain","c":false,"r":"This can harm the kidneys."},{"t":"Place a warm pack over the lower back","c":false,"r":"This does not prevent kidney injury."},{"t":"Increase fluids to keep the urine output high","c":true,"r":""}],"i":"Preventing kidney injury from muscle breakdown.","e":"Dark urine means myoglobin from damaged muscle. Fluid keeps the pigment moving through the kidneys, and the urine output goal is higher than usual."},{"id":"T2-94","a":3,"s":"A patient has a full thickness burn that goes around the chest and has difficulty expanding the chest. What procedure may be needed?","o":[{"t":"A bronchoscopy to remove the mucus plug","c":false,"r":"This does not release the tight burned skin."},{"t":"A skin graft done at the bedside now","c":false,"r":"A graft does not release the pressure."},{"t":"An escharotomy to release the tight eschar","c":true,"r":""},{"t":"A chest tube placed on the right side","c":false,"r":"This does not treat a tight band of eschar."}],"i":"Managing a circumferential burn.","e":"Stiff burned skin cannot stretch and restricts breathing or blood flow. A surgeon cuts through the eschar to release the pressure."},{"id":"T2-95","a":3,"s":"A patient from an enclosed house fire is comatose and hypotensive, has a lactate of 11 mmol/L, and has a normal carbon monoxide level. Which treatment is indicated?","o":[{"t":"Oral vitamin C and fluids for the burns","c":false,"r":"This does not treat cyanide poisoning."},{"t":"A tetanus booster and a period of rest","c":false,"r":"This does not treat the poisoning."},{"t":"Inhaled albuterol for the wheezing heard","c":false,"r":"This does not treat cyanide poisoning."},{"t":"Hydroxocobalamin for cyanide poisoning","c":true,"r":""}],"i":"Recognizing cyanide poisoning from smoke.","e":"Burning plastics and other materials release cyanide, which stops cells from using oxygen. A high lactate with coma and shock suggests it, and hydroxocobalamin is the antidote."},{"id":"T2-96","a":3,"s":"Why does a patient weighing 180 kg desaturate quickly during intubation?","o":[{"t":"The lungs are larger than normal and hold more air","c":false,"r":"The reserve is smaller, not larger."},{"t":"A low functional residual capacity limits oxygen reserve","c":true,"r":""},{"t":"The patient has a faster metabolism and uses less oxygen","c":false,"r":"Oxygen use is higher, not lower."},{"t":"The airway is wider and easier to protect","c":false,"r":"The airway is often harder, not easier."}],"i":"Preparing to manage the airway of a bariatric patient.","e":"Extra weight reduces lung volume at rest, so the oxygen supply drains in seconds. Preoxygenation in a ramped or reverse Trendelenburg position and oxygen during the attempt help."},{"id":"T2-97","a":3,"s":"How should the nurse document the history from a patient who reports abuse by a partner?","o":[{"t":"Write a summary of the nurse's opinion about the partner","c":false,"r":"Documentation should stay factual."},{"t":"Leave out the patient's words to save time","c":false,"r":"The patient's words are important evidence."},{"t":"Record the patient's words in quotes with body maps and photographs","c":true,"r":""},{"t":"Record that the patient was upset today","c":false,"r":"This does not describe the injuries or history."}],"i":"Documenting intimate partner violence.","e":"The record may be used as evidence. Quotes, a body map, and consented photographs with a scale give a clear account without opinion."},{"id":"T2-98","a":3,"s":"An infant has a scald with sharp lines on both feet and legs, with spared areas in the skin creases. What does this pattern suggest?","o":[{"t":"A splash burn from a spilled cup","c":false,"r":"Splashes leave irregular, dripping patterns."},{"t":"A sunburn from the outdoors","c":false,"r":"Sunburn does not have sharp lines like this."},{"t":"An immersion burn, which may be inflicted","c":true,"r":""},{"t":"A burn from a hot surface that was touched","c":false,"r":"This leaves a shape matching the surface."}],"i":"Recognizing patterns that suggest child abuse.","e":"Sharp edges, a stocking or glove pattern, and sparing of the creases mean the child was held in hot water. The nurse reports it and follows the child protection policy."},{"id":"T2-99","a":3,"s":"A patient with a gunshot wound arrives in wet clothing. How should the nurse preserve the clothing as evidence?","o":[{"t":"Put it in a sealed plastic bag at once","c":false,"r":"Plastic traps moisture and damages evidence."},{"t":"Wash it to remove the blood before storage","c":false,"r":"Washing destroys the evidence."},{"t":"Throw it out to save space in the room","c":false,"r":"The clothing may be evidence."},{"t":"Air dry it and place it in labeled paper bags","c":true,"r":""}],"i":"Preserving evidence and the chain of custody.","e":"Paper allows air flow and prevents mold. The nurse avoids cutting through holes, labels each bag, and records each person who handles it."},{"id":"T2-100","a":3,"s":"A patient is admitted after a self inflicted gunshot wound and is awake. After the injury is treated, which action is most important?","o":[{"t":"Leave the patient alone to rest in a private room","c":false,"r":"The patient has a high risk of a repeat attempt."},{"t":"Wait for the patient to ask for a mental health visit","c":false,"r":"Assessment should not wait for a request."},{"t":"Discharge with a pamphlet on the same day","c":false,"r":"A patient with a recent attempt needs evaluation first."},{"t":"Provide constant observation and a safe room","c":true,"r":""}],"i":"Caring for a patient after an intentional injury.","e":"The patient has a high risk of another attempt. A sitter, a safe room, and an early psychiatric evaluation are needed, and the nurse stays supportive and nonjudgmental."},{"id":"T2-101","a":3,"s":"A patient who receives hemodialysis has a fistula in the left arm. Which action should the nurse avoid?","o":[{"t":"Checking the thrill and bruit of the fistula each shift","c":false,"r":"This is a recommended check."},{"t":"Using the right arm for the intravenous line","c":false,"r":"This protects the fistula arm."},{"t":"Taking a blood pressure or an IV in the fistula arm","c":true,"r":""},{"t":"Reporting the loss of the thrill at once","c":false,"r":"This is a recommended action."}],"i":"Protecting a dialysis access.","e":"Pressure or needle sticks can clot or damage the fistula, which is the patient's lifeline. The other arm is used, and a change in the thrill is reported."},{"id":"T2-102","a":3,"s":"A patient who takes dabigatran has a life threatening bleed. Which medicine reverses the drug?","o":[{"t":"Idarucizumab","c":true,"r":""},{"t":"Protamine sulfate","c":false,"r":"This reverses heparin."},{"t":"Vitamin K","c":false,"r":"This reverses warfarin more slowly and does not reverse dabigatran."},{"t":"Naloxone","c":false,"r":"This reverses opioids."}],"i":"Reversing a direct oral anticoagulant.","e":"Idarucizumab binds dabigatran. Andexanet alfa or prothrombin complex concentrate is used for the factor Xa drugs."},{"id":"T2-103","a":3,"s":"A patient who used methamphetamine is agitated, has a heart rate of 140, and a blood pressure of 190/110. Which drug class is the first choice?","o":[{"t":"A beta blocker given alone as the first drug","c":false,"r":"This can cause unopposed alpha effects and worsen the pressure."},{"t":"A benzodiazepine such as lorazepam","c":true,"r":""},{"t":"An opioid given to calm the patient","c":false,"r":"This does not treat the stimulant effect."},{"t":"An antihistamine given to induce drowsiness","c":false,"r":"This is not the first choice for stimulant toxicity."}],"i":"Treating stimulant toxicity.","e":"Benzodiazepines lower agitation, heart rate, and blood pressure. They are first line, and the nurse watches temperature and muscle breakdown."},{"id":"T2-104","a":3,"s":"Which tool does the nurse use to rate the severity of alcohol withdrawal and guide treatment?","o":[{"t":"The CIWA Ar alcohol withdrawal scale","c":true,"r":""},{"t":"The Braden scale for pressure injury risk","c":false,"r":"This assesses the risk of pressure injury."},{"t":"The Glasgow Coma Scale for coma","c":false,"r":"This rates the level of consciousness."},{"t":"The Morse Fall Scale for fall risk","c":false,"r":"This rates the risk of falls."}],"i":"Assessing alcohol withdrawal.","e":"The CIWA Ar scores symptoms such as tremor, sweating, and agitation. The score guides how much medicine to give."},{"id":"T2-105","a":4,"s":"During the primary survey, which assessment belongs to the D step, disability?","o":[{"t":"Glasgow Coma Scale, pupils, and blood glucose","c":true,"r":""},{"t":"Auscultation of breath sounds in both lungs","c":false,"r":"This belongs to the breathing step."},{"t":"Palpation of the femoral and radial pulses","c":false,"r":"This belongs to the circulation step."},{"t":"Removal of all clothing and use of warm blankets","c":false,"r":"This belongs to the exposure step."}],"i":"Knowing the steps of the primary survey.","e":"Disability is a quick neurologic exam with level of consciousness, pupils, and glucose. Exposure then removes clothing to find injuries while preventing heat loss."},{"id":"T2-106","a":4,"s":"When should the secondary survey begin?","o":[{"t":"Before the airway is secured and breathing is checked","c":false,"r":"Life threats come first."},{"t":"After the patient has reached the intensive care unit","c":false,"r":"It should begin in the emergency department as soon as it is safe."},{"t":"As soon as the patient arrives, before the primary survey","c":false,"r":"The primary survey always comes first."},{"t":"After life threats are treated and the patient is stabilizing","c":true,"r":""}],"i":"Sequencing the survey.","e":"The secondary survey is a head to toe exam with history. It starts once the airway, breathing, and circulation problems are handled, and it is repeated if the patient changes."},{"id":"T2-107","a":4,"s":"Which scoring system helps predict the need for massive transfusion and counts penetrating mechanism, positive FAST, systolic pressure of 90 or less, and heart rate of 120 or more?","o":[{"t":"The Glasgow Coma Scale score for brain function","c":false,"r":"This rates neurologic function."},{"t":"The Assessment of Blood Consumption score","c":true,"r":""},{"t":"The Injury Severity Score for injury burden","c":false,"r":"This is calculated after injuries are known."},{"t":"The Braden scale for pressure injury risk","c":false,"r":"This assesses pressure injury risk."}],"i":"Recognizing tools that predict massive transfusion.","e":"Each of the four items scores one point. A score of two or more predicts the need for massive transfusion, so the protocol is activated early."},{"id":"T2-108","a":4,"s":"What is the dose of tranexamic acid used in bleeding trauma patients?","o":[{"t":"500 mg every four hours for a day","c":false,"r":"This is not the studied dose."},{"t":"1 gram over 10 minutes, then 1 gram over 8 hours","c":true,"r":""},{"t":"10 grams in one bolus over a single minute","c":false,"r":"This is a dangerous overdose."},{"t":"A 100 mg dose given once by mouth","c":false,"r":"This is not an effective trauma dose."}],"i":"Knowing the tranexamic acid regimen.","e":"The CRASH 2 regimen is 1 gram over 10 minutes followed by 1 gram over 8 hours, started within 3 hours of injury."},{"id":"T2-109","a":4,"s":"A bleeding trauma patient has a fibrinogen level of 90 mg/dL after massive transfusion. Which product is most appropriate?","o":[{"t":"Cryoprecipitate or fibrinogen concentrate","c":true,"r":""},{"t":"Normal saline given rapidly in large amounts","c":false,"r":"This dilutes clotting factors."},{"t":"Packed red cells given alone as the sole product","c":false,"r":"These do not correct the low fibrinogen."},{"t":"Oral vitamin K given by mouth","c":false,"r":"This does not rapidly restore fibrinogen."}],"i":"Correcting coagulopathy during massive transfusion.","e":"Fibrinogen forms the clot, and levels drop early in hemorrhage. Cryoprecipitate is rich in fibrinogen, and viscoelastic testing helps guide replacement."},{"id":"T2-110","a":4,"s":"A patient has a pH of 7.08, a temperature of 33.5 degrees Celsius, and a coagulopathy in the operating room. Which surgical strategy applies?","o":[{"t":"Damage control surgery with packing and closure","c":true,"r":""},{"t":"A long definitive repair of the injuries","c":false,"r":"The patient is too sick to tolerate a long operation."},{"t":"Delay the surgery until the patient warms on the ward","c":false,"r":"The bleeding must be controlled."},{"t":"Close the abdomen tightly with permanent sutures","c":false,"r":"This increases abdominal pressure."}],"i":"Recognizing when to use damage control surgery.","e":"In a patient with acidosis, hypothermia, and coagulopathy, surgeons control bleeding and contamination quickly, pack, close temporarily, and return after resuscitation in the intensive care unit."},{"id":"T2-111","a":4,"s":"After damage control laparotomy with the abdomen left open, what is the nurse's priority in the intensive care unit?","o":[{"t":"Early walking and a regular diet","c":false,"r":"The patient is not ready."},{"t":"Discharge planning with the patient's family","c":false,"r":"The patient is critically ill."},{"t":"Removal of all lines and the monitors","c":false,"r":"The patient needs more monitoring."},{"t":"Warming and correcting acidosis and clotting","c":true,"r":""}],"i":"Caring for a patient after damage control surgery.","e":"The goal is to restore physiology before the next operation, usually within 24 to 48 hours. The nurse also watches for bleeding and abdominal compartment syndrome."},{"id":"T2-112","a":4,"s":"Why does hypothermia worsen bleeding in a trauma patient?","o":[{"t":"The blood vessels grow wider at low temperatures","c":false,"r":"Cold causes narrowing of vessels, not widening."},{"t":"The heart rate speeds up and thins the blood","c":false,"r":"Cold slows the heart rate."},{"t":"Clotting enzymes and platelets work poorly when cold","c":true,"r":""},{"t":"Cold raises the amount of fibrinogen in the blood supply","c":false,"r":"Cold impairs clot formation."}],"i":"Understanding the lethal triad.","e":"Clotting enzymes work best at normal body temperature. Below about 35 degrees Celsius, clot formation slows, so rewarming is part of bleeding control."},{"id":"T2-113","a":4,"s":"Why does a low blood pH of 7.1 add to the risk of death in a bleeding patient?","o":[{"t":"Acidosis increases the activity of clotting factors","c":false,"r":"The opposite is true."},{"t":"Acidosis protects the heart from irregular rhythms","c":false,"r":"It makes the heart less responsive."},{"t":"Acidosis lowers the activity of clotting factors and the heart","c":true,"r":""},{"t":"Acidosis has no effect when oxygen is normal","c":false,"r":"It matters even if the oxygen is normal."}],"i":"Understanding acidosis in the lethal triad.","e":"A low pH slows the clotting cascade, reduces the heart's response to drugs, and stops blood vessels from reacting. Correcting the cause, which is poor perfusion, is the treatment."},{"id":"T2-114","a":4,"s":"A patient with hypotension needs rapid sequence intubation. Which induction drug is the best choice?","o":[{"t":"Propofol at a standard dose","c":false,"r":"This causes a large drop in blood pressure."},{"t":"Etomidate at a reduced dose","c":true,"r":""},{"t":"Midazolam at a full dose","c":false,"r":"This can cause a drop in blood pressure."},{"t":"Thiopental at a full dose","c":false,"r":"This can cause a drop in blood pressure."}],"i":"Choosing induction agents for an unstable patient.","e":"Etomidate and ketamine have little effect on blood pressure, and doses are reduced in shock. Resuscitation with blood and a vasopressor should be ready before induction."},{"id":"T2-115","a":4,"s":"A patient has lost about 45 percent of the blood volume. Which finding fits class IV hemorrhage?","o":[{"t":"Confusion, severe hypotension, and a very fast heart rate","c":true,"r":""},{"t":"A normal blood pressure and a calm patient","c":false,"r":"This matches class I."},{"t":"A slightly raised heart rate and a normal pulse pressure","c":false,"r":"This matches class I."},{"t":"A narrow pulse pressure with mild anxiety and normal urine","c":false,"r":"This matches class II."}],"i":"Classifying hemorrhage.","e":"Class IV loss of more than 40 percent causes confusion, severe hypotension, a heart rate over 140, and almost no urine. These patients need massive transfusion."},{"id":"T2-116","a":4,"s":"A trauma patient is hypotensive with distended neck veins. What does the finding suggest about the type of shock?","o":[{"t":"Hemorrhagic shock, since the neck veins are full","c":false,"r":"Bleeding causes flat veins."},{"t":"Obstructive shock, such as tension pneumothorax","c":true,"r":""},{"t":"Neurogenic shock, since the pulse is slow","c":false,"r":"Neurogenic shock gives flat veins and warm skin."},{"t":"Septic shock, since the temperature is raised","c":false,"r":"This does not explain the full veins."}],"i":"Differentiating shock types in trauma.","e":"Full neck veins in a hypotensive trauma patient mean blood cannot return to the heart. Bleeding gives flat veins. The nurse looks for tension pneumothorax, tamponade, and other causes."},{"id":"T2-117","a":4,"s":"Ten minutes after an antibiotic is given, a patient has hives, wheezing, and a blood pressure of 70/40. Which drug is given first?","o":[{"t":"Oral diphenhydramine alone","c":false,"r":"This is too slow and is not first line."},{"t":"Intramuscular epinephrine","c":true,"r":""},{"t":"Intravenous furosemide","c":false,"r":"This does not treat anaphylaxis."},{"t":"A dextrose bolus","c":false,"r":"This does not treat anaphylaxis."}],"i":"Treating anaphylactic shock.","e":"Anaphylaxis is a distributive shock with vasodilation and airway swelling. Epinephrine in the thigh is first, with airway support, fluids, and later antihistamines and steroids."},{"id":"T2-118","a":4,"s":"A patient with septic shock remains hypotensive after a fluid bolus. Which vasopressor is the usual first line?","o":[{"t":"Dopamine at a high dose as one agent","c":false,"r":"This has more arrhythmias and is no longer first line."},{"t":"Nitroglycerin","c":false,"r":"This lowers blood pressure."},{"t":"Norepinephrine","c":true,"r":""},{"t":"Furosemide","c":false,"r":"This is a diuretic and lowers the pressure."}],"i":"Treating septic shock.","e":"Norepinephrine raises the vascular tone and the pressure. Vasopressin or other drugs can be added if needed."},{"id":"T2-119","a":4,"s":"Which finding best separates cardiogenic shock from hypovolemic shock?","o":[{"t":"A fast heart rate with cool and clammy skin","c":false,"r":"Both types of shock have these."},{"t":"Crackles and distended neck veins with hypotension","c":true,"r":""},{"t":"A narrow pulse pressure and a weak thready pulse","c":false,"r":"This can occur in both types."},{"t":"Reduced urine output over the last several hours","c":false,"r":"Both types reduce urine."}],"i":"Identifying cardiogenic shock.","e":"A failing heart backs blood into the lungs and veins. Hypovolemic shock gives clear lungs and flat veins."},{"id":"T2-120","a":4,"s":"Why must fluids be given with caution to a patient in cardiogenic shock?","o":[{"t":"Fluids raise the heart's strength and its output","c":false,"r":"A weak heart cannot use the extra volume."},{"t":"The failing heart cannot move the extra volume, so the lungs fill","c":true,"r":""},{"t":"Fluids lower the blood pressure by thinning the blood","c":false,"r":"This is not the main reason."},{"t":"Fluids cause the body temperature to drop","c":false,"r":"This is not the main concern."}],"i":"Managing fluids in pump failure.","e":"A weak heart cannot pump extra volume, so fluids cause pulmonary edema. Care involves treating the cause and supporting the pump."},{"id":"T2-121","a":4,"s":"A patient has normal blood pressure and heart rate after resuscitation, but the lactate is still 5 mmol/L. What should the nurse conclude?","o":[{"t":"Hypoperfusion may remain, so continue resuscitation","c":true,"r":""},{"t":"Resuscitation is complete and the patient is stable","c":false,"r":"A high lactate shows poor perfusion."},{"t":"The lactate is high because of the patient's diet","c":false,"r":"Lactate reflects tissue perfusion."},{"t":"The vital signs are too normal to be correct","c":false,"r":"Normal vital signs can occur with hidden shock."}],"i":"Reassessing with end points of resuscitation.","e":"Normal vital signs can hide ongoing shock. A rising or persistent lactate means tissues are not getting enough blood, so the team looks for bleeding and adjusts care."},{"id":"T2-122","a":4,"s":"A patient develops transfusion related acute lung injury. Which treatment is correct?","o":[{"t":"Give a large dose of a diuretic and continue","c":false,"r":"The cause is not fluid overload, so a diuretic does not help."},{"t":"Continue the transfusion more slowly and watch","c":false,"r":"Transfusion should stop."},{"t":"Give another unit of plasma from the same donor","c":false,"r":"This may worsen the injury."},{"t":"Stop the transfusion and give oxygen or ventilation","c":true,"r":""}],"i":"Managing a transfusion lung injury.","e":"TRALI causes leaky lungs from antibodies in donor blood. Supportive care with lung protective ventilation is the main treatment, and the blood bank is notified."},{"id":"T2-123","a":4,"s":"When is the tertiary survey performed?","o":[{"t":"At discharge from the hospital","c":false,"r":"This is too late to find missed injuries."},{"t":"Before the primary survey is complete in the bay","c":false,"r":"The tertiary survey comes later."},{"t":"If the patient has a new fall","c":false,"r":"It is routine for patients with major trauma."},{"t":"Within 24 hours of admission and when awake","c":true,"r":""}],"i":"Timing the tertiary exam.","e":"The tertiary exam repeats the head to toe exam, reviews labs and imaging, and listens for new complaints once the patient is alert. It finds injuries missed early."},{"id":"T2-124","a":4,"s":"A trauma patient has bilateral lung infiltrates and a PaO2 to FiO2 ratio of 90 on PEEP. How is the ARDS classified?","o":[{"t":"Mild, since the ratio is above 200","c":false,"r":"The ratio is far below that."},{"t":"Severe, since the ratio is 100 or less","c":true,"r":""},{"t":"Moderate, since the ratio is above 300","c":false,"r":"The ratio is far below that."},{"t":"Not ARDS, since the film shows infiltrates","c":false,"r":"The infiltrates and the low ratio meet the definition."}],"i":"Classifying ARDS.","e":"The Berlin definition grades mild as 200 to 300, moderate as 100 to 200, and severe as 100 or less. Severe ARDS may need prone positioning and neuromuscular blockade."},{"id":"T2-125","a":4,"s":"When should the prophylactic antibiotic be given before a trauma laparotomy?","o":[{"t":"Two days before the surgery starts","c":false,"r":"This is too early."},{"t":"After the wound is closed","c":false,"r":"This misses the key period."},{"t":"Within 60 minutes before the incision","c":true,"r":""},{"t":"If the wound later looks infected","c":false,"r":"The aim is prevention."}],"i":"Preventing surgical site infection.","e":"The antibiotic should be in the tissues when the incision is made. It is repeated for long surgery or major blood loss."},{"id":"T2-126","a":4,"s":"A patient in the intensive care unit has a temperature of 38.8 degrees Celsius, a heart rate of 120, and a rising lactate. What is the first hour bundle for sepsis?","o":[{"t":"Wait for the culture results before treatment","c":false,"r":"Delay raises the risk of death."},{"t":"Give an antipyretic and recheck in four hours","c":false,"r":"This does not treat the sepsis."},{"t":"Get cultures, give broad antibiotics, and start fluids","c":true,"r":""},{"t":"Restrict all fluids and observe the patient","c":false,"r":"Fluid and antibiotics are needed."}],"i":"Starting sepsis care.","e":"The bundle includes lactate, blood cultures before antibiotics, broad spectrum antibiotics, and 30 mL/kg of crystalloid for hypotension or high lactate. Vasopressors are added for persistent low pressure."},{"id":"T2-127","a":4,"s":"On day six after prolonged opioid and benzodiazepine infusions were stopped, a patient is sweating, yawning, and restless. What is the likely cause?","o":[{"t":"A new brain bleed that needs a CT scan alone","c":false,"r":"The pattern matches withdrawal after the drugs stopped."},{"t":"A normal recovery that needs no care","c":false,"r":"The patient is in distress and needs treatment."},{"t":"An allergic reaction to the last antibiotic","c":false,"r":"This does not match the symptoms."},{"t":"Iatrogenic withdrawal needing a gradual taper","c":true,"r":""}],"i":"Recognizing drug withdrawal.","e":"Long infusions cause physical dependence. Stopping suddenly causes withdrawal, so doses are tapered and signs are monitored."},{"id":"T2-128","a":4,"s":"A hospital wants to reduce reinjury among young patients who were shot. Which program is most effective?","o":[{"t":"A discharge pamphlet with advice about staying safe","c":false,"r":"Education alone does not reduce reinjury."},{"t":"Shortening the hospital stay of each patient","c":false,"r":"This does not address risk."},{"t":"A hospital violence intervention program with case management","c":true,"r":""},{"t":"A note in the chart stating the patient is at high risk","c":false,"r":"A label does not reduce risk."}],"i":"Addressing violence related injury.","e":"Programs with trained counselors begin at the bedside and continue in the community. They link patients to jobs, housing, and mental health care and lower reinjury."},{"id":"T2-129","a":4,"s":"After a severe brain injury and a tracheostomy, which team member evaluates swallowing and speech?","o":[{"t":"The physical therapist for mobility","c":false,"r":"This role focuses on mobility."},{"t":"The social worker for the family","c":false,"r":"This role focuses on resources and coping."},{"t":"The pharmacist for the medicines","c":false,"r":"This role focuses on medicines."},{"t":"The speech language pathologist","c":true,"r":""}],"i":"Knowing the rehabilitation team roles.","e":"The speech language pathologist tests swallowing, plans the diet, and works on communication and cognition. This helps prevent aspiration."},{"id":"T2-130","a":4,"s":"A patient with a devastating brain injury is nearing death. Who should the nurse notify about the possible donation?","o":[{"t":"The hospital billing and records office","c":false,"r":"This office has no role in referring a donor."},{"t":"The organ procurement organization","c":true,"r":""},{"t":"The local police department","c":false,"r":"The police are not the right agency, and sharing would breach privacy."},{"t":"The chief executive officer of the hospital","c":false,"r":"The executive has no role in the donation referral."}],"i":"Referring a potential donor.","e":"Federal rules require early referral to the organization when death is imminent. Their trained staff, not the treating team, approach the family about donation."},{"id":"T2-131","a":4,"s":"A dying patient has severe shortness of breath and distress. Which treatment is appropriate?","o":[{"t":"Withholding all drugs to avoid ending life sooner","c":false,"r":"Comfort care allows appropriate dosing."},{"t":"A rapid fluid bolus to improve the breathing","c":false,"r":"This may worsen the congestion."},{"t":"Opioids titrated to relieve breathlessness","c":true,"r":""},{"t":"Restraints to keep the patient quiet","c":false,"r":"This increases distress."}],"i":"Providing comfort at the end of life.","e":"Opioids relieve the sensation of breathlessness. The aim is comfort, and the doses are adjusted to the symptoms."},{"id":"T2-132","a":4,"s":"Before testing for brain death, which condition must be met?","o":[{"t":"The family must have agreed to organ donation","c":false,"r":"The diagnosis does not depend on this."},{"t":"The patient must be able to breathe without help","c":false,"r":"A patient with brain death has no breathing drive."},{"t":"Core temperature of 36 degrees Celsius or higher, with no sedatives","c":true,"r":""},{"t":"The patient must be receiving large doses of sedatives","c":false,"r":"Sedatives can mimic brain death and must be cleared."}],"i":"Preparing for a brain death exam.","e":"Cold, low blood pressure, drugs, and severe metabolic problems can mimic brain death. They are corrected before the exam and the apnea test."},{"id":"T2-133","a":4,"s":"Which program asks about alcohol use, gives a brief talk, and refers high risk patients to treatment?","o":[{"t":"Advanced trauma life support course for nurses","c":false,"r":"This is a course on trauma care."},{"t":"Mass casualty triage in the field","c":false,"r":"This is a system for disaster care."},{"t":"Massive transfusion protocol in the bay","c":false,"r":"This is a blood product plan."},{"t":"Screening, brief intervention, and referral","c":true,"r":""}],"i":"Using injury prevention in the hospital.","e":"The brief approach lowers repeated injury in patients who drink. The trauma center uses it as a part of its prevention work."},{"id":"T2-134","a":4,"s":"A bleeding groin wound is too high for a tourniquet. What should the prehospital team do?","o":[{"t":"Elevate the leg and wait for the bleeding to slow","c":false,"r":"This does not control junctional bleeding."},{"t":"Apply a tourniquet around the abdomen","c":false,"r":"This is not safe or effective."},{"t":"Clean the wound before applying pressure","c":false,"r":"This delays the control of bleeding."},{"t":"Pack the wound with gauze and hold firm pressure","c":true,"r":""}],"i":"Controlling junctional hemorrhage.","e":"Wounds at the groin, armpit, or neck cannot be controlled with a limb tourniquet. Packing the wound and applying direct pressure for at least three minutes controls most bleeding."},{"id":"T2-135","a":4,"s":"In the field, which patient needs the highest level of trauma care under the triage guidelines?","o":[{"t":"A patient with a minor ankle sprain and swelling","c":false,"r":"This does not meet a criterion."},{"t":"A patient with a small bruise on the arm and no pain","c":false,"r":"This does not meet a criterion."},{"t":"A patient with a systolic pressure of 85 mmHg","c":true,"r":""},{"t":"A patient with a minor scalp abrasion","c":false,"r":"This does not meet a criterion."}],"i":"Using field triage criteria.","e":"Low blood pressure is an abnormal physiologic finding that needs a high level trauma center. Minor limb injuries do not."},{"id":"T2-136","a":4,"s":"Which action should not delay the transfer of an unstable patient to a trauma center?","o":[{"t":"Stopping the bleeding and securing the airway before leaving","c":false,"r":"These are life saving steps."},{"t":"Calling the receiving physician to arrange the transfer","c":false,"r":"This arranges care."},{"t":"Sending the images and records with the patient","c":false,"r":"This prevents duplicate testing."},{"t":"Extra imaging that will be repeated at the receiving center","c":true,"r":""}],"i":"Avoiding delays in interfacility transfer.","e":"Definitive care is the goal. The sending team performs only life saving steps, calls early, and sends what they have."},{"id":"T2-137","a":4,"s":"A patient with an external ventricular drain is moved to the CT scanner. Which action is correct?","o":[{"t":"Leave the drain open and lower it to the cart floor","c":false,"r":"This can drain too much fluid."},{"t":"Clamp the drain and reopen it at the right level","c":true,"r":""},{"t":"Remove the drain to make the move easier","c":false,"r":"The drain is needed."},{"t":"Disconnect the monitor and skip the readings","c":false,"r":"The patient needs monitoring."}],"i":"Moving a patient with a drain.","e":"The drain is usually clamped during movement to prevent overdrainage and then leveled at the tragus and reopened. The nurse follows the facility policy."},{"id":"T2-138","a":4,"s":"A patient is going home in a new cast. Which sign should the patient report at once?","o":[{"t":"Mild itching under the edge of the cast","c":false,"r":"This is common."},{"t":"Rising pain with numbness or color change in the digits","c":true,"r":""},{"t":"A slight musty smell after a day","c":false,"r":"This is not an emergency by itself."},{"t":"Slight swelling that goes away with elevation","c":false,"r":"This is expected."}],"i":"Teaching cast care.","e":"Pain that increases, numbness, or color change may mean compartment syndrome or poor blood flow. The patient must return immediately."},{"id":"T2-139","a":4,"s":"A patient with low health literacy receives discharge instructions. Which approach is best?","o":[{"t":"Use medical terms to be accurate and brief","c":false,"r":"This can cause confusion."},{"t":"Hand over a long document and leave","c":false,"r":"The patient may not understand."},{"t":"Teach the family and leave out the patient","c":false,"r":"The patient should be included."},{"t":"Use plain language, pictures, and teach back","c":true,"r":""}],"i":"Supporting health literacy.","e":"Plain words, visuals, and teach back confirm understanding and reduce readmission."},{"id":"T2-140","a":4,"s":"Which finding best shows that a patient is ready to go home with a caregiver after a long hospital stay?","o":[{"t":"The caregiver says that the patient is a quick learner","c":false,"r":"This does not show skill."},{"t":"The patient has been in the hospital for two weeks","c":false,"r":"Length of stay does not prove readiness."},{"t":"The caregiver shows wound care and equipment use correctly","c":true,"r":""},{"t":"The caregiver has a copy of the discharge paper","c":false,"r":"This does not show skill."}],"i":"Assessing home readiness.","e":"A return demonstration proves that the caregiver can do the tasks. The team also checks equipment, follow up visits, and home safety."},{"id":"T2-141","a":5,"s":"During a mass casualty incident, a 6 year old is not breathing, and the airway has been opened. What does JumpSTART direct?","o":[{"t":"Tag the child expectant at once","c":false,"r":"Children often respond to rescue breaths."},{"t":"Give five rescue breaths and reassess","c":true,"r":""},{"t":"Begin chest compressions for two minutes","c":false,"r":"The system starts with breaths in this case."},{"t":"Move on to the next patient with no action","c":false,"r":"The child may be saved with breaths."}],"i":"Triaging a child in a disaster.","e":"Children often stop breathing before the heart stops. If breathing resumes after rescue breaths, the child is tagged immediate. If not, the child is tagged expectant."},{"id":"T2-142","a":5,"s":"A patient arrives covered in an unknown chemical. What is the first step in decontamination?","o":[{"t":"Move the patient into the trauma bay","c":false,"r":"This spreads the contaminant."},{"t":"Remove the contaminated clothing first","c":true,"r":""},{"t":"Apply a neutralizing agent to the skin","c":false,"r":"This may cause a reaction."},{"t":"Wait for the laboratory to name the chemical","c":false,"r":"This delays care."}],"i":"Beginning decontamination.","e":"Removing clothing eliminates most of the contaminant. The patient is then washed with water, and staff wear protective gear."},{"id":"T2-143","a":5,"s":"Which finding is reviewed as a missed injury in a performance improvement audit?","o":[{"t":"An injury found during the primary survey itself","c":false,"r":"This was found promptly."},{"t":"An injury found on the first CT scan","c":false,"r":"This was found promptly."},{"t":"An injury found over 24 hours after admission","c":true,"r":""},{"t":"An injury found by the paramedics","c":false,"r":"This was found early."}],"i":"Defining a missed injury.","e":"A missed injury is discovered after the initial evaluation. Programs track these events to improve the secondary and tertiary surveys."},{"id":"T2-144","a":5,"s":"Which national program benchmarks trauma center outcomes using risk adjusted data?","o":[{"t":"The Joint Commission sentinel event alert","c":false,"r":"This is not a trauma data benchmark."},{"t":"The Emergency Medical Treatment and Labor Act","c":false,"r":"This is a law on emergency care."},{"t":"The Health Insurance Portability Act","c":false,"r":"This is a privacy law."},{"t":"The Trauma Quality Improvement Program","c":true,"r":""}],"i":"Knowing national quality programs.","e":"The program of the American College of Surgeons compares outcomes with those of similar centers after adjusting for the injury severity."},{"id":"T2-145","a":5,"s":"A trauma center wants to know how patients are doing six months after discharge. Which measure fits?","o":[{"t":"The number of beds in the hospital","c":false,"r":"This is not a patient outcome."},{"t":"The number of nurses on the unit","c":false,"r":"This is not a patient outcome."},{"t":"Functional outcome and return to work","c":true,"r":""},{"t":"The cost of the building and its furniture","c":false,"r":"This is not a patient outcome."}],"i":"Using follow up outcomes.","e":"Long term follow up looks at function, quality of life, and return to work. These data show the real benefit of trauma care."},{"id":"T2-146","a":5,"s":"After a traumatic death, the team holds a meeting within hours to share facts and feelings without blame. What is this?","o":[{"t":"A disciplinary hearing","c":false,"r":"This is punishment based."},{"t":"A hot debriefing","c":true,"r":""},{"t":"A billing review","c":false,"r":"This is a financial process."},{"t":"A research study","c":false,"r":"This is a study."}],"i":"Supporting the team after an event.","e":"A prompt, structured debrief lets staff discuss what happened, what went well, and what to change. It helps the team cope."},{"id":"T2-147","a":5,"s":"A nurse says, 'The patient was admitted two days ago after a fall with a splenic laceration and takes warfarin.' Which SBAR part is this?","o":[{"t":"Background","c":true,"r":""},{"t":"Situation","c":false,"r":"This states the current problem."},{"t":"Assessment","c":false,"r":"This gives the nurse's view."},{"t":"Recommendation","c":false,"r":"This states what is needed."}],"i":"Using SBAR.","e":"Background gives the history and context, including the diagnosis, medicines, and allergies."},{"id":"T2-148","a":5,"s":"Which event is a sentinel event that must be reported?","o":[{"t":"A retained surgical sponge after an operation","c":true,"r":""},{"t":"A late meal tray delivered to the patient room today","c":false,"r":"This is a service issue."},{"t":"A broken television in a patient waiting area today","c":false,"r":"This is a maintenance issue."},{"t":"A visitor delayed at the front desk of the hospital","c":false,"r":"This is not a patient harm."}],"i":"Recognizing sentinel events.","e":"A sentinel event is a patient safety event that causes death or serious harm. A retained object is a never event and is reviewed in depth."},{"id":"T2-149","a":5,"s":"Which strategy best reduces workplace violence in the emergency department?","o":[{"t":"Asking staff to avoid reporting incidents","c":false,"r":"Reporting is essential."},{"t":"Letting staff manage the violence on their own","c":false,"r":"Staff need support."},{"t":"Removing all signs and security from the area","c":false,"r":"This would increase risk."},{"t":"A prevention program with training, security, and reporting","c":true,"r":""}],"i":"Preventing workplace violence.","e":"A coordinated program includes training in calming agitated patients, security presence, reporting, and follow up for staff who are hurt."},{"id":"T2-150","a":5,"s":"Which organization verifies a trauma center, as distinct from designating it?","o":[{"t":"The local fire department","c":false,"r":"This has no role."},{"t":"The patient's insurance company","c":false,"r":"This has no role."},{"t":"The American College of Surgeons","c":true,"r":""},{"t":"The hospital's food service department","c":false,"r":"This has no role."}],"i":"Knowing verification and designation.","e":"The college verifies that a center meets its standards through a site visit. The state or local government designates the center, and levels differ in resources and research."},{"id":"T3-1","a":0,"s":"A head CT shows a crescent shaped collection of blood that crosses suture lines. Which injury is most likely?","o":[{"t":"Epidural hematoma from a torn meningeal artery","c":false,"r":"An epidural bleed is lens shaped and stops at the suture lines."},{"t":"Intraventricular hemorrhage from a tear in the vessels","c":false,"r":"This blood lies inside the ventricles and does not form a crescent."},{"t":"Acute subdural hematoma from torn bridging veins","c":true,"r":""},{"t":"Cerebral contusion with scattered small bleeding spots","c":false,"r":"A contusion appears as patchy areas within the brain, not a crescent."}],"i":"Reading the shape of a bleed on a head CT.","e":"A subdural hematoma spreads over the brain surface and follows its curve, so it crosses the sutures. It often comes with severe brain injury and a high risk of death."},{"id":"T3-2","a":0,"s":"After a fall, a patient has clear fluid dripping from the left ear. What should the nurse do?","o":[{"t":"Cover the ear loosely with a sterile dressing","c":true,"r":""},{"t":"Pack the ear canal firmly to stop the drainage fully","c":false,"r":"Packing can trap fluid and raise the risk of meningitis."},{"t":"Irrigate the ear canal with warm sterile saline solution","c":false,"r":"Irrigation can push bacteria into the skull and worsen infection."},{"t":"Place a cotton swab deep in the canal to collect fluid","c":false,"r":"Deep swabs can injure the ear and introduce bacteria."}],"i":"Caring for a patient with possible cerebrospinal fluid leakage.","e":"Clear fluid from the ear or nose after a head injury may be spinal fluid from a skull base fracture. The nurse lets it drain, avoids packing or suction, and reports it to the provider."},{"id":"T3-3","a":0,"s":"A patient with a severe head injury is intubated and sedated. How should the nurse record the verbal part of the Glasgow Coma Scale?","o":[{"t":"As not testable because of the tube, shown as T","c":true,"r":""},{"t":"As a score of 5 since the patient is breathing well","c":false,"r":"The patient cannot speak with a tube, so no verbal score applies."},{"t":"As a score of 1 because the patient makes no sound","c":false,"r":"A score of 1 would wrongly lower the total for a patient who cannot speak."},{"t":"As a score of 3 so the total is an average value","c":false,"r":"The scale does not allow an estimated or average verbal score."}],"i":"Scoring the Glasgow Coma Scale in an intubated patient.","e":"The verbal response cannot be judged when an airway tube is in place. The record shows the eye and motor scores with a T for the tube, and trends in the motor score guide care."},{"id":"T3-4","a":0,"s":"A patient has a growing bleed inside the skull, and the pressure is rising. Which principle explains why the pressure rises sharply once the brain can no longer compensate?","o":[{"t":"The Frank Starling law of the heart and its stretch","c":false,"r":"This law explains how the heart muscle fills and pumps blood."},{"t":"The Bohr effect of carbon dioxide on oxygen release","c":false,"r":"This effect explains how acidity changes hemoglobin oxygen binding."},{"t":"The Monro Kellie doctrine of a fixed skull space","c":true,"r":""},{"t":"The Fick principle of cardiac output measurement","c":false,"r":"This principle is used to measure the output of the heart."}],"i":"Understanding intracranial pressure.","e":"The skull is rigid and holds brain, blood, and spinal fluid. If one part grows, the others must shrink. Once those shifts are used up, a small further rise in volume causes a large rise in pressure."},{"id":"T3-5","a":0,"s":"A patient with a brain injury has a generalized seizure that has lasted five minutes. Which medicine is the first line treatment?","o":[{"t":"Intravenous lorazepam as the first drug","c":true,"r":""},{"t":"Intravenous phenytoin as the first drug","c":false,"r":"This is a second line drug after a benzodiazepine."},{"t":"Intravenous mannitol to lower the pressure","c":false,"r":"This lowers pressure but does not stop a seizure."},{"t":"Intravenous propranolol to slow the heart rate","c":false,"r":"This does not treat a seizure."}],"i":"Treating a prolonged seizure.","e":"A seizure longer than five minutes is status epilepticus. A benzodiazepine such as lorazepam is given first, then a longer acting drug such as levetiracetam or phenytoin, while the airway is protected."},{"id":"T3-6","a":0,"s":"A patient has a knife blade protruding from the skull above the right ear and is awake. What is the best action?","o":[{"t":"Stabilize the object and prepare for imaging and surgery","c":true,"r":""},{"t":"Pull the blade out and apply direct pressure to the site","c":false,"r":"Removal can tear vessels and cause a fatal bleed."},{"t":"Cut the blade short and remove the rest from the skull","c":false,"r":"Cutting causes movement and can injure the brain further."},{"t":"Rotate the blade gently to see how deep it extends in","c":false,"r":"Movement can cause further damage to the brain."}],"i":"Managing a penetrating head injury.","e":"The object may be plugging a torn vessel. It is stabilized with bulky dressings, the patient is kept still, and the team prepares for CT imaging and removal in the operating room."},{"id":"T3-7","a":0,"s":"A patient with a T3 spinal cord injury has a blood pressure of 78/40 mmHg, a heart rate of 48, and warm dry skin after fluids. Which drug is most appropriate?","o":[{"t":"Furosemide to remove extra body fluid","c":false,"r":"This would lower blood volume and make the pressure worse."},{"t":"Nitroglycerin to dilate the vessels further","c":false,"r":"This lowers the pressure further."},{"t":"Labetalol to lower the heart rate and pressure","c":false,"r":"This slows the heart and lowers the pressure more."},{"t":"Norepinephrine as a vasopressor agent","c":true,"r":""}],"i":"Treating neurogenic shock.","e":"Loss of sympathetic tone widens the blood vessels and slows the heart. After volume is given, a vasopressor such as norepinephrine restores tone, and atropine is ready for severe slowing."},{"id":"T3-8","a":0,"s":"A patient has an incomplete spinal injury with sacral sensation present, and at least half of the key muscles below the injury level are grade 3 or better. Which grade of the ASIA Impairment Scale applies?","o":[{"t":"Grade A, with no motor or sensory function in the sacrum","c":false,"r":"Grade A is a complete injury with no sacral function at all."},{"t":"Grade B, with sensation kept but no movement","c":false,"r":"Grade B has sensation below the level but no movement."},{"t":"Grade C, with under half of key muscles strong","c":false,"r":"Grade C applies when fewer than half of the key muscles are grade 3 or better."},{"t":"Grade D, with at least half of key muscles strong","c":true,"r":""}],"i":"Using the ASIA Impairment Scale.","e":"In grade D the injury is motor incomplete, and at least half of the key muscles below the level have a grade of 3 or more. Grade E means that function is normal."},{"id":"T3-9","a":0,"s":"A patient with a cervical spinal cord injury has a temperature of 34.8 degrees Celsius in a cool room. What explains this?","o":[{"t":"Loss of temperature control below the injury level","c":true,"r":""},{"t":"A normal response to rest in a cool room","c":false,"r":"A drop to this level is not normal and needs correction."},{"t":"Overactive sweating that lowers the core temperature","c":false,"r":"Sweating is reduced, not increased, below the injury level."},{"t":"A side effect of pain medicines given earlier","c":false,"r":"The cause is the cord injury itself, not the medicines."}],"i":"Recognizing poikilothermia.","e":"The sympathetic pathways that control shivering and blood vessels are cut off from the brain. The patient takes on the temperature of the room, so the nurse uses warm blankets and monitors the core temperature."},{"id":"T3-10","a":0,"s":"When should the nurse expect low molecular weight heparin to begin for a patient with a spinal cord injury and no active bleeding?","o":[{"t":"After the patient has left the hospital for home","c":false,"r":"Delay leaves the patient at high risk for blood clots."},{"t":"At no time, since clots do not form in paralyzed limbs","c":false,"r":"Paralysis greatly increases the risk of clots."},{"t":"Within 72 hours, together with mechanical devices","c":true,"r":""},{"t":"After six months, once rehabilitation is complete","c":false,"r":"Treatment is needed in the first weeks and not many months later."}],"i":"Preventing venous thromboembolism after spinal injury.","e":"Paralysis, immobility, and vessel injury create a very high clot risk. Compression devices begin early, and anticoagulants are added once bleeding is controlled, usually within the first 72 hours."},{"id":"T3-11","a":0,"s":"A football player has a suspected cervical injury and is wearing a helmet and shoulder pads. How should the helmet and pads be managed?","o":[{"t":"Remove the pads and leave the helmet on the head","c":false,"r":"The head and shoulders will then sit at unequal heights."},{"t":"Remove the helmet and leave the pads on the chest","c":false,"r":"The head would then tilt back and flex the neck."},{"t":"Cut off both and tilt the head back for the airway","c":false,"r":"Tilting the head can worsen a cervical injury."},{"t":"Leave both on and stabilize them with the head","c":true,"r":""}],"i":"Managing sports equipment in a spinal injury.","e":"Together the helmet and pads keep the neck in a neutral position. They are left on unless the airway cannot be reached, and in that case both are removed by a team with the head held steady."},{"id":"T3-12","a":0,"s":"Three days after a high thoracic cord injury, a patient has abdominal distension and no bowel sounds. Which problem is likely?","o":[{"t":"A paralytic ileus needing gastric decompression","c":true,"r":""},{"t":"A normal return of bowel function after the injury","c":false,"r":"Absent sounds with distension are not a normal finding."},{"t":"An overactive bowel that needs a medicine to slow it","c":false,"r":"The bowel is slowed, not overactive, in this patient."},{"t":"Hunger from a lack of food after a long fasting time","c":false,"r":"Hunger does not cause distension without bowel sounds."}],"i":"Recognizing bowel complications of spinal injury.","e":"Cord injury stops the nerve signals that move the gut. An ileus is common in the first days, and the patient needs a gastric tube, no oral intake, and later a bowel program."},{"id":"T3-13","a":0,"s":"A patient with a C6 cord injury has a weak cough and thick secretions. Which technique best helps clear the airway?","o":[{"t":"Deep suctioning every 30 minutes without positioning","c":false,"r":"Frequent suctioning irritates the airway and causes bradycardia."},{"t":"An assisted cough by pressing up on the abdomen","c":true,"r":""},{"t":"Lying flat with the head down through the night","c":false,"r":"This increases the work of breathing in a patient with weak muscles."},{"t":"A strong cough suppressant given at set times","c":false,"r":"This would reduce airway clearance further."}],"i":"Clearing secretions with weak breathing muscles.","e":"Abdominal and some chest muscles are paralyzed, so the cough is weak. A trained helper pushes upward under the ribs as the patient tries to cough, and chest physiotherapy and suctioning support this."},{"id":"T3-14","a":0,"s":"A patient with a severe brain injury has a serum sodium of 124 mEq/L, high urine output, and signs of low blood volume. Which condition is likely?","o":[{"t":"Cerebral salt wasting, treated with saline and sodium","c":true,"r":""},{"t":"Syndrome of inappropriate antidiuretic hormone secretion","c":false,"r":"This shows normal or high blood volume and is treated with fluid limits."},{"t":"Diabetes insipidus from loss of the antidiuretic hormone","c":false,"r":"This causes a high sodium with very dilute urine."},{"t":"Primary adrenal failure from a long standing illness","c":false,"r":"This is not the usual cause in a brain injury patient."}],"i":"Separating the causes of low sodium after brain injury.","e":"In cerebral salt wasting the kidneys lose sodium and water, so the patient is dry. The treatment is salt and fluid replacement, while SIADH is treated by limiting fluids."},{"id":"T3-15","a":0,"s":"Which therapy is a second tier treatment for intracranial pressure that stays high despite head elevation, sedation, and drainage of spinal fluid?","o":[{"t":"Placing the patient flat in bed for several hours","c":false,"r":"This raises pressure further."},{"t":"Giving large amounts of free water by vein","c":false,"r":"This worsens brain swelling."},{"t":"Stopping all sedation and pain relief medicines","c":false,"r":"This can raise the pressure through agitation."},{"t":"Barbiturate coma or decompressive craniectomy","c":true,"r":""}],"i":"Knowing the tiers of pressure treatment.","e":"First tier steps include head elevation, sedation, analgesia, drainage, and hyperosmolar therapy. Higher tier options include a barbiturate coma, mild hypothermia, and surgical decompression."},{"id":"T3-16","a":0,"s":"A patient with an external ventricular drain has no drainage and the waveform has been lost. What should the nurse do first?","o":[{"t":"Flush the drain with saline using a large syringe","c":false,"r":"Flushing can raise the pressure and cause infection."},{"t":"Raise the system far above the head to prevent leakage","c":false,"r":"This would stop drainage and raise the intracranial pressure."},{"t":"Check the drain for clamps and kinks and the level","c":true,"r":""},{"t":"Remove the drain and discard it at the bedside","c":false,"r":"The drain must be removed only by the provider."}],"i":"Troubleshooting a ventricular drain.","e":"A lost waveform may come from a clamp, a kink, an air bubble, or a wrong level. The nurse checks these first, assesses the patient, and calls the provider, since a blocked drain can cause a fast rise in pressure."},{"id":"T3-17","a":0,"s":"Which nutrition plan is appropriate for a patient with a severe brain injury?","o":[{"t":"Start enteral feeding early, within the first days","c":true,"r":""},{"t":"Withhold feeding until the brain swelling is gone","c":false,"r":"Long delay increases the risk of infection and loss of muscle."},{"t":"Give dextrose in water by vein for two weeks","c":false,"r":"This does not meet the needs and worsens swelling."},{"t":"Give a very high sugar diet to feed the brain","c":false,"r":"High glucose worsens the injury."}],"i":"Providing nutrition after brain injury.","e":"Injured patients burn a lot of energy. Early enteral feeding lowers infection and helps recovery, and the goal is to meet full needs by about the end of the first week."},{"id":"T3-18","a":0,"s":"Which statement about cooling the body of a patient with a severe brain injury is correct?","o":[{"t":"Routine early hypothermia is not recommended","c":true,"r":""},{"t":"Each patient should be cooled to 30 degrees on arrival","c":false,"r":"This is not recommended and has risks."},{"t":"Cooling improves the recovery of these patients","c":false,"r":"Studies have not shown a consistent benefit."},{"t":"Fever should be left untreated so the brain can heal","c":false,"r":"Fever raises brain metabolism and should be treated."}],"i":"Knowing the evidence on temperature control.","e":"Studies did not show better outcomes with routine early cooling. Fever is treated, and cooling may be used for high pressure that does not respond to other care."},{"id":"T3-19","a":0,"s":"Which intracranial pressure value does the Brain Trauma Foundation advise treating?","o":[{"t":"Above 5 mmHg","c":false,"r":"This is a normal pressure."},{"t":"Above 12 mmHg","c":false,"r":"This is mildly raised but is under the treatment threshold."},{"t":"Above 22 mmHg","c":true,"r":""},{"t":"Above 50 mmHg","c":false,"r":"This is far too high to wait for."}],"i":"Knowing the treatment threshold for intracranial pressure.","e":"A pressure above 22 mmHg is linked to higher mortality. The team starts treatment and checks the perfusion pressure at the same time."},{"id":"T3-20","a":0,"s":"A patient with a severe brain injury and a stable repeat CT is at high risk for blood clots in the legs. Which plan is correct?","o":[{"t":"Give a full dose of anticoagulant within the first hour","c":false,"r":"This risks growth of the bleed."},{"t":"Use no prevention since the patient is in bed","c":false,"r":"The patient has a high clot risk."},{"t":"Massage the legs vigorously every hour all day","c":false,"r":"Massage can dislodge a clot."},{"t":"Use compression devices early, add heparin when stable","c":true,"r":""}],"i":"Preventing clots after brain injury.","e":"Mechanical devices start at once. Low dose heparin begins after a stable CT, often within 24 to 72 hours, weighing the risk of bleeding against the risk of a clot."},{"id":"T3-21","a":0,"s":"Before a nurse gives a local anesthetic for a cheek laceration, which assessment should be documented?","o":[{"t":"The amount of urine passed in the last hour","c":false,"r":"This does not relate to the nerve function of the face."},{"t":"Facial nerve function, such as smiling","c":true,"r":""},{"t":"The patient's blood type and the antibody screen","c":false,"r":"This does not relate to the nerve function of the face."},{"t":"The bowel sounds in the lower abdomen","c":false,"r":"This does not relate to the nerve function of the face."}],"i":"Checking for nerve injury before treatment.","e":"Anesthetic can hide a facial nerve injury. A deep cheek wound can also cut the parotid duct, so the nurse checks movement and notes it before the wound is closed."},{"id":"T3-22","a":0,"s":"A patient has a nosebleed after a blow to the nose. Which first aid is correct?","o":[{"t":"Lie flat with the head back and pinch the bony bridge","c":false,"r":"This lets blood run into the throat and pinching the bone does not stop it."},{"t":"Tilt the head far back and stuff tissue deep in the nostril","c":false,"r":"This lets blood run into the throat and is unsafe."},{"t":"Sit forward and pinch the soft part of the nose","c":true,"r":""},{"t":"Blow the nose hard to clear the clot from each side","c":false,"r":"This dislodges the clot and restarts the bleeding."}],"i":"Controlling an anterior nosebleed.","e":"Leaning forward keeps blood out of the airway and the stomach. Pressure on the soft lower part closes the bleeding vessels, and a bleed that continues or follows a fracture needs the provider."},{"id":"T3-23","a":0,"s":"A boxer has a swollen, purple, tense area on the ear after a blow. What is the correct treatment?","o":[{"t":"Cold packs and no further treatment for the swelling","c":false,"r":"A hematoma left in place can destroy the cartilage."},{"t":"Heat packs applied to the ear for a week","c":false,"r":"Heat can increase the bleeding."},{"t":"Prompt drainage with a pressure dressing","c":true,"r":""},{"t":"Reassurance since the ear will heal on its own soon","c":false,"r":"It can result in a permanent deformity called cauliflower ear."}],"i":"Managing an auricular hematoma.","e":"Blood between the cartilage and the skin cuts off the cartilage blood supply. Drainage with a compression dressing prevents the cauliflower ear deformity."},{"id":"T3-24","a":0,"s":"A patient has a laceration at the inner corner of the eyelid near the nose. Which structure should the nurse suspect is injured?","o":[{"t":"The optic nerve in the back of the orbit","c":false,"r":"This is behind the eye and is not at the eyelid corner."},{"t":"The parotid gland on the side of the cheek and face","c":false,"r":"This is far from the inner corner of the eye."},{"t":"The thyroid gland in the front of the neck","c":false,"r":"This is in the neck and is not near the eye."},{"t":"The lacrimal drainage system, needing repair","c":true,"r":""}],"i":"Recognizing injury to the tear drainage system.","e":"The tear ducts open at the inner eyelid margin. A cut here can sever them and cause constant tearing, so an eye specialist repairs it."},{"id":"T3-25","a":0,"s":"Which test best shows a corneal abrasion?","o":[{"t":"A urine dipstick for blood and protein","c":false,"r":"This does not detect a scratch on the eye."},{"t":"A pulse oximeter on the finger of the patient","c":false,"r":"This does not detect a scratch on the eye."},{"t":"A gentle touch of the cornea with a cotton swab","c":false,"r":"This can worsen the injury and is not a test."},{"t":"Fluorescein dye under a cobalt blue light","c":true,"r":""}],"i":"Detecting damage to the surface of the eye.","e":"The dye stains the area where the surface cells are missing. Under blue light the abrasion glows green, and a numbing drop is often used first to help the exam."},{"id":"T3-26","a":0,"s":"After a blow to the brow, a patient has sudden loss of vision in one eye, and the pupil of that eye reacts poorly to direct light but the other pupil reacts normally. What should the nurse suspect?","o":[{"t":"A simple tear in the white of the eye surface","c":false,"r":"This does not cause sudden vision loss."},{"t":"Traumatic optic neuropathy with a pupil defect","c":true,"r":""},{"t":"A stye on the lower eyelid margin","c":false,"r":"This does not cause sudden vision loss."},{"t":"A bruise of the eyelid skin with no deeper damage","c":false,"r":"This does not cause loss of vision."}],"i":"Recognizing optic nerve injury.","e":"Injury or swelling around the optic nerve reduces the signal from the eye, and the pupil reacts poorly. This is an urgent problem that needs eye specialist review, imaging, and sometimes steroids or surgery."},{"id":"T3-27","a":0,"s":"A welder has severe burning pain in both eyes and tearing six hours after work without protective glasses. What is the likely cause?","o":[{"t":"Ret
