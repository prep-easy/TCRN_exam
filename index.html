i":"Assuring home readiness.","e":"Equipment, support and a person who can respond to alarms are in place before the patient leaves."},{"id":"T6-141","a":5,"s":"Which system do hospitals use to organize leadership and roles during a disaster?","o":[{"t":"The Braden skin risk scale","c":false,"r":"This is a skin risk tool."},{"t":"The Glasgow Coma Scale","c":false,"r":"This is a neurologic tool."},{"t":"The Revised Trauma Score","c":false,"r":"This is a physiologic score."},{"t":"The Hospital Incident Command System","c":true,"r":""}],"i":"Using an incident command system.","e":"The system gives a clear chain of command and defined roles. It is scalable to the size of the event."},{"id":"T6-142","a":5,"s":"Which level of protective equipment is commonly used by hospital staff decontaminating patients?","o":[{"t":"Level A, with a fully encapsulating suit and supplied air","c":false,"r":"This level is for unknown high hazard environments."},{"t":"Level C, with an air purifying respirator and chemical suit","c":true,"r":""},{"t":"Standard scrubs and a surgical mask","c":false,"r":"This does not protect against chemical agents."},{"t":"A paper gown and gloves","c":false,"r":"This is not enough."}],"i":"Selecting protective equipment.","e":"Level C is used when the agent is known. Staff are trained and fitted before use."},{"id":"T6-143","a":5,"s":"During a morbidity and mortality review, a death is classified as potentially preventable. What does this mean?","o":[{"t":"The death was certain and nothing could change it","c":false,"r":"This is a nonpreventable death."},{"t":"The patient is to blame for the outcome","c":false,"r":"Reviews are not meant to assign blame."},{"t":"The case is closed with no action taken","c":false,"r":"Action is needed."},{"t":"Changes in care might have changed the outcome","c":true,"r":""}],"i":"Classifying events.","e":"Reviews classify deaths and identify opportunities for improvement. Action plans are tracked."},{"id":"T6-144","a":5,"s":"Which scoring system combines anatomic injury severity, physiologic score and age to estimate the probability of survival?","o":[{"t":"ASIA","c":false,"r":"This grades spinal cord injury."},{"t":"TRISS","c":true,"r":""},{"t":"APGAR","c":false,"r":"This scores newborns."},{"t":"CIWA","c":false,"r":"This scores alcohol withdrawal."}],"i":"Using registry data.","e":"TRISS uses the ISS, the revised trauma score and age. Programs use it to compare expected and actual outcomes."},{"id":"T6-145","a":5,"s":"Which tool is often used to measure functional outcome after a brain injury?","o":[{"t":"The Braden scale for skin","c":false,"r":"This is a skin tool."},{"t":"The Glasgow Outcome Scale Extended","c":true,"r":""},{"t":"The Morse Fall Scale","c":false,"r":"This is a fall tool."},{"t":"The CIWA scale for alcohol","c":false,"r":"This is a withdrawal tool."}],"i":"Measuring outcomes.","e":"The scale rates return to independence and work. It is used in follow up."},{"id":"T6-146","a":5,"s":"In the PICO format for a clinical question, what does the C stand for?","o":[{"t":"Comparison","c":true,"r":""},{"t":"Cost","c":false,"r":"This is not part of the format."},{"t":"Complication","c":false,"r":"This is not part of the format."},{"t":"Compliance","c":false,"r":"This is not part of the format."}],"i":"Framing questions.","e":"PICO stands for population, intervention, comparison and outcome."},{"id":"T6-147","a":5,"s":"Which statement is the Situation part of an SBAR report?","o":[{"t":"The patient came in this morning after a crash with chest injuries","c":false,"r":"This is background."},{"t":"I am calling about bed 6, where the pressure is now 78 over 40","c":true,"r":""},{"t":"I think the patient is bleeding into the abdomen after the surgery","c":false,"r":"This is assessment."},{"t":"Please come and see the patient now and bring the blood ordered","c":false,"r":"This is recommendation."}],"i":"Using SBAR.","e":"The situation states who you are, who the patient is and what the problem is."},{"id":"T6-148","a":5,"s":"After an unexpected death during a procedure, the hospital must complete what review?","o":[{"t":"A root cause analysis of the sentinel event","c":true,"r":""},{"t":"A billing review of the charges for the event","c":false,"r":"This is not the purpose."},{"t":"A patient satisfaction survey of the unit","c":false,"r":"This is not the purpose."},{"t":"A staffing audit of the unit and nothing else","c":false,"r":"This is too narrow."}],"i":"Responding to sentinel events.","e":"The analysis looks for system causes. The Joint Commission expects a report within a set time."},{"id":"T6-149","a":5,"s":"Which tool is used to predict the risk of violence in an emergency department patient?","o":[{"t":"The Braden Scale","c":false,"r":"This tool predicts the risk of pressure injury."},{"t":"The Revised Trauma Score","c":false,"r":"This score estimates the severity of physiologic injury."},{"t":"The CIWA scale","c":false,"r":"This scale measures alcohol withdrawal."},{"t":"The Broset Violence Checklist","c":true,"r":""}],"i":"Preventing workplace violence.","e":"The checklist scores confusion, irritability, boisterousness, threats and attacks on objects. A high score leads to preventive steps such as a calm approach and security support."},{"id":"T6-150","a":5,"s":"Which feature distinguishes an ACS verified Level I trauma center from a Level III center?","o":[{"t":"A single operating room open during the weekday daytime","c":false,"r":"This does not distinguish the levels."},{"t":"Research, residency education and round the clock specialty care","c":true,"r":""},{"t":"A helipad on the roof, with no other resources","c":false,"r":"This does not distinguish the levels."},{"t":"No emergency department, but a large outpatient clinic","c":false,"r":"This is not correct."}],"i":"Knowing trauma center levels.","e":"Level I centers lead the system with research and education."}];
const AREAS=["Head and Neck","Trunk and Pelvis","Musculoskeletal and Wound","Special Populations","Continuum of Care for Trauma","Professional Practice"];
const SCORED=[31,38,13,22,36,10],UNS=[5,6,2,4,6,2];
const PASS=96,EXAMMIN=180,TOTAL=175;
const BY={};BANK.forEach(q=>BY[q.id]=q);
const $=id=>document.getElementById(id);
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const fmt=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')};
let A=ld('tcrnsim_attempt',null),tick=null,view='home',rv={f:'all',i:0};
function seen(){return new Set(ld('tcrnsim_seen',[]))}
function pickFrom(ai,n,sn){const pool=BANK.filter(q=>q.a===ai);const fresh=shuf(pool.filter(q=>!sn.has(q.id))),old=shuf(pool.filter(q=>sn.has(q.id)));return fresh.concat(old).slice(0,n)}
function start(mode,opts){
 const sn=seen();let qs=[],uns={};
 if(mode==='exam'){AREAS.forEach((_,ai)=>{const g=pickFrom(ai,SCORED[ai]+UNS[ai],sn);const u=shuf(g.map(q=>q.id)).slice(0,UNS[ai]);u.forEach(id=>uns[id]=1);qs=qs.concat(g)});qs=shuf(qs)}
 else{const ai=opts.area;qs=ai<0?shuf(BANK.slice()).slice(0,opts.n):pickFrom(ai,opts.n,sn);qs=shuf(qs)}
 const ord={};qs.forEach(q=>ord[q.id]=shuf([0,1,2,3]));
 A={mode,ids:qs.map(q=>q.id),ord,ans:{},flag:{},uns,start:Date.now(),limit:mode==='exam'?EXAMMIN*60:(opts.timed?Math.round(opts.n*60*(EXAMMIN/TOTAL)):0),cur:0,done:false,chk:{}};
 sv('tcrnsim_attempt',A);view='test';run()}
function run(){render();clearInterval(tick);if(A&&!A.done&&A.limit)tick=setInterval(timer,1000)}
function left(){return A.limit-(Date.now()-A.start)/1000}
function timer(){const t=$('tm');if(!t)return;const l=left();t.textContent=fmt(l);t.className='tm'+(l<600?' low':'');if(l<=0){finish(true)}}
function home(){view='home';render()}
function render(){const app=$('app');
 if(view==='home'||!A&&view!=='home')return app.innerHTML=homeHTML();
 if(view==='results')return app.innerHTML=resultsHTML();
 if(view==='review')return app.innerHTML=reviewHTML();
 app.innerHTML=testHTML();timer()}
function homeHTML(){const H=ld('tcrnsim_hist',[]);
 const resume=A&&!A.done?`<div class="card"><b>You have an unfinished ${A.mode==='exam'?'exam':'practice set'}.</b> ${Object.keys(A.ans).length} of ${A.ids.length} answered.<div class="row" style="margin-top:8px"><button class="p" onclick="view='test';run()">Resume</button><button onclick="if(confirm('Abandon this attempt?')){A=null;sv('tcrnsim_attempt',null);home()}">Abandon</button></div></div>`:'';
 return `<div class="wrap"><h1>TCRN Exam Simulator</h1><p class="note">Built to mirror the real exam: ${TOTAL} questions in ${EXAMMIN} minutes, 150 scored and 25 unscored pretest items mixed in, and the same blueprint across the six exam areas. A score of ${PASS} of 150 (64 percent) is the pass mark used in this book.</p>${resume}
 <div class="grid"><div class="card"><h2 style="margin-top:0">Full exam</h2><p>${TOTAL} questions, ${EXAMMIN} minute timer, no answers shown until you finish. Questions you have not seen before are chosen first.</p><button class="p" onclick="start('exam')">Start full exam</button></div>
 <div class="card"><h2 style="margin-top:0">Practice set</h2><div class="row"><label>Area <select id="pa"><option value="-1">All areas</option>${AREAS.map((a,i)=>`<option value="${i}">${a}</option>`).join('')}</select></label><label>Questions <select id="pn"><option>10</option><option selected>25</option><option>50</option><option>75</option></select></label></div><p class="row"><label><input type="checkbox" id="pt"> Use a timer (exam pace)</label></p><button class="p" onclick="start('practice',{area:+$('pa').value,n:+$('pn').value,timed:$('pt').checked})">Start practice</button><p class="note">Practice sets show the answer and the reasons as soon as you check each question.</p></div></div>
 <h2>Your history</h2><div class="card">${H.length?`<table><tr><th>Date</th><th>Type</th><th class="r">Score</th><th class="r">Result</th></tr>${H.slice().reverse().slice(0,15).map(h=>`<tr><td>${new Date(h.d).toLocaleDateString()}</td><td>${h.m==='exam'?'Full exam':'Practice, '+h.n+' q'}</td><td class="r">${h.m==='exam'?h.s+' / 150':h.s+' / '+h.n}</td><td class="r">${h.m==='exam'?(h.s>=PASS?'<span class="pass">Pass</span>':'<span class="fail">Not yet</span>'):Math.round(h.s/h.n*100)+'%'}</td></tr>`).join('')}</table>`:'<span class="note">No attempts yet.</span>'}</div>
 <p class="note">Your progress is saved in this browser only. Questions come from the 900 question bank in the six practice tests.</p></div>`}
function optsOrder(q){return A.ord[q.id]}
function testHTML(){const id=A.ids[A.cur],q=BY[id],o=optsOrder(q),sel=A.ans[id],prac=A.mode!=='exam',chk=prac&&A.chk[id];
 const navs=A.ids.map((x,i)=>`<div class="nv${A.ans[x]!==undefined?' a':''}${i===A.cur?' c':''}${A.flag[x]?' f':''}" onclick="go(${i})">${i+1}</div>`).join('');
 const opts=o.map((oi,k)=>{const op=q.o[oi];let c='opt';if(chk){if(op.c)c+=' ok';else if(sel===k)c+=' no'}else if(sel===k)c+=' sel';
  return `<div class="${c}" onclick="pick(${k})"><b>${'ABCD'[k]}.</b><span>${esc(op.t)}</span></div>`}).join('');
 let fb='';if(chk){const ci=o.findIndex(oi=>q.o[oi].c);fb=`<div class="fb"><p><b>${sel===ci?'Correct.':'Incorrect.'} The answer is ${'ABCD'[ci]}.</b> ${esc(q.i)}</p><p>${esc(q.e)}</p>${o.map((oi,k)=>q.o[oi].c?'':`<p>Option ${'ABCD'[k]} is incorrect. ${esc(q.o[oi].r)}</p>`).join('')}</div>`}
 return `<div class="top"><b>${A.mode==='exam'?'Full exam':'Practice'}</b>${A.limit?`<span class="tm" id="tm"></span>`:''}<span>Question ${A.cur+1} of ${A.ids.length}</span><span class="note">${Object.keys(A.ans).length} answered</span><span style="flex:1"></span><button onclick="endAsk()">End and score</button></div>
 <div class="wrap"><div class="card"><div class="q">${A.cur+1}. ${esc(q.s)}</div>${opts}${fb}
 <div class="row" style="margin-top:12px"><button onclick="go(${A.cur-1})" ${A.cur?'':'disabled'}>Previous</button>${prac&&!chk?`<button class="p" onclick="check()" ${sel===undefined?'disabled':''}>Check answer</button>`:''}<button class="p" onclick="go(${A.cur+1})" ${A.cur<A.ids.length-1?'':'disabled'}>Next</button><button onclick="flag()">${A.flag[id]?'Unflag':'Flag for review'}</button></div></div>
 <div class="card"><b>Questions</b> <span class="note">(dark = answered, dot = flagged)</span><div class="nav" style="margin-top:8px">${navs}</div></div></div>`}
function go(i){if(i<0||i>=A.ids.length)return;A.cur=i;sv('tcrnsim_attempt',A);render();window.scrollTo(0,0)}
function pick(k){const id=A.ids[A.cur];if(A.mode!=='exam'&&A.chk[id])return;A.ans[id]=k;sv('tcrnsim_attempt',A);render()}
function check(){A.chk[A.ids[A.cur]]=1;sv('tcrnsim_attempt',A);render()}
function flag(){const id=A.ids[A.cur];A.flag[id]?delete A.flag[id]:A.flag[id]=1;sv('tcrnsim_attempt',A);render()}
function endAsk(){const un=A.ids.length-Object.keys(A.ans).length,fl=Object.keys(A.flag).length;if(confirm((un?un+' question'+(un>1?'s are':' is')+' unanswered. ':'')+(fl?fl+' flagged. ':'')+'End and score now? This cannot be undone.'))finish(false)}
function isRight(id){const q=BY[id],o=A.ord[id],k=A.ans[id];return k!==undefined&&q.o[o[k]].c}
function finish(auto){A.done=true;A.end=Date.now();const R=calc();const H=ld('tcrnsim_hist',[]);H.push({d:A.end,m:A.mode,s:A.mode==='exam'?R.sc:R.all,n:A.ids.length});sv('tcrnsim_hist',H);
 const sn=seen();A.ids.forEach(i=>sn.add(i));sv('tcrnsim_seen',[...sn]);sv('tcrnsim_attempt',A);clearInterval(tick);view='results';rv={f:'all',i:0};render();window.scrollTo(0,0);if(auto)alert('Time is up. Your exam has been scored.')}
function calc(){const ar=AREAS.map(()=>({n:0,c:0}));let sc=0,all=0,sn=0;A.ids.forEach(id=>{const q=BY[id],r=isRight(id);if(r)all++;if(A.uns[id]){return}ar[q.a].n++;if(r){ar[q.a].c++;sc++}});return {ar,sc,all}}
function resultsHTML(){const R=calc(),ex=A.mode==='exam',used=((A.end-A.start)/1000);
 const head=ex?`<div class="big ${R.sc>=PASS?'pass':'fail'}">${R.sc} / 150</div><div><b class="${R.sc>=PASS?'pass':'fail'}">${R.sc>=PASS?'PASS':'NOT YET'}</b> at the ${PASS} of 150 mark (${Math.round(R.sc/150*100)}%).</div><p class="note">Of the ${TOTAL} questions, 25 were unscored pretest items, as on the real exam. They were chosen at random and are marked in the review. Time used: ${fmt(used)}.</p>`:`<div class="big">${R.all} / ${A.ids.length}</div><div>${Math.round(R.all/A.ids.length*100)}% correct. Time used: ${fmt(used)}.</div>`;
 const tb=ex?R.ar.map((a,i)=>`<tr><td>${AREAS[i]}</td><td class="r">${a.c} / ${a.n}</td><td class="r">${a.n?Math.round(a.c/a.n*100):0}%</td></tr>`).join(''):(()=>{const m=AREAS.map(()=>({n:0,c:0}));A.ids.forEach(id=>{const q=BY[id];m[q.a].n++;if(isRight(id))m[q.a].c++});return m.map((a,i)=>a.n?`<tr><td>${AREAS[i]}</td><td class="r">${a.c} / ${a.n}</td><td class="r">${Math.round(a.c/a.n*100)}%</td></tr>`:'').join('')})();
 return `<div class="wrap"><h1>Results</h1><div class="card">${head}</div><div class="card"><table><tr><th>Exam area</th><th class="r">Correct</th><th class="r">Percent</th></tr>${tb}</table></div>
 <div class="row"><button class="p" onclick="view='review';rv={f:'all',i:0};render()">Review every question</button><button onclick="A=null;sv('tcrnsim_attempt',null);home()">Back to start</button></div></div>`}
function rlist(){return A.ids.filter(id=>rv.f==='all'||(rv.f==='miss'&&!isRight(id))||(rv.f==='flag'&&A.flag[id]))}
function reviewHTML(){const L=rlist();if(rv.i>=L.length)rv.i=Math.max(0,L.length-1);const id=L[rv.i];
 const bar=`<div class="top"><b>Review</b><label>Show <select onchange="rv.f=this.value;rv.i=0;render()"><option value="all" ${rv.f==='all'?'selected':''}>All</option><option value="miss" ${rv.f==='miss'?'selected':''}>Missed or unanswered</option><option value="flag" ${rv.f==='flag'?'selected':''}>Flagged</option></select></label><span>${L.length?rv.i+1:0} of ${L.length}</span><span style="flex:1"></span><button onclick="view='results';render()">Back to results</button></div>`;
 if(!id)return bar+`<div class="wrap"><div class="card">Nothing to show here.</div></div>`;
 const q=BY[id],o=A.ord[id],sel=A.ans[id],ci=o.findIndex(oi=>q.o[oi].c),n=A.ids.indexOf(id)+1;
 const opts=o.map((oi,k)=>{const op=q.o[oi];let c='opt';if(op.c)c+=' ok';else if(sel===k)c+=' no';return `<div class="${c}"><b>${'ABCD'[k]}.</b><span>${esc(op.t)}${sel===k?' <span class="tag">your answer</span>':''}</span></div>`}).join('');
 return bar+`<div class="wrap"><div class="card"><div class="row"><span class="tag">${AREAS[q.a]}</span>${A.uns[id]?'<span class="tag">Unscored pretest item</span>':''}<span class="tag">${isRight(id)?'Correct':sel===undefined?'Unanswered':'Incorrect'}</span></div><div class="q">${n}. ${esc(q.s)}</div>${opts}
 <div class="fb"><p><b>Correct answer: ${'ABCD'[ci]}.</b> ${esc(q.i)}</p><p>${esc(q.e)}</p>${o.map((oi,k)=>q.o[oi].c?'':`<p>Option ${'ABCD'[k]} is incorrect. ${esc(q.o[oi].r)}</p>`).join('')}</div>
 <div class="row" style="margin-top:12px"><button onclick="rv.i--;render();window.scrollTo(0,0)" ${rv.i?'':'disabled'}>Previous</button><button class="p" onclick="rv.i++;render();window.scrollTo(0,0)" ${rv.i<L.length-1?'':'disabled'}>Next</button></div></div></div>`}
if(A&&A.done){view='results'}
if(A&&!A.done&&A.limit&&left()<=0){finish(false)}else if(A&&!A.done){view='home'}
render();
</script></body></html>
