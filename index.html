","e":"Selective protocols save time and reduce harm from boards. Patients with pain, a deficit, confusion, intoxication, or a distracting injury stay in motion restriction."},{"id":"T3-135","a":4,"s":"Where should a tourniquet be placed on a bleeding limb?","o":[{"t":"Directly over the wound and over the clothing","c":false,"r":"It must be placed above the wound on skin."},{"t":"High on the limb, on bare skin, above the wound","c":true,"r":""},{"t":"Over the knee or the elbow joint of the limb","c":false,"r":"A joint prevents good compression."},{"t":"Below the wound at the ankle or wrist","c":false,"r":"It must be above the wound."}],"i":"Applying a tourniquet.","e":"The tourniquet is placed above the wound on bare skin, tightened until bleeding stops, and the time is recorded. A second tourniquet can be placed if the bleeding continues."},{"id":"T3-136","a":4,"s":"Which preparation is essential before moving a ventilated patient to the CT scanner?","o":[{"t":"A plan to remove the ventilator for the trip","c":false,"r":"The patient needs breathing support."},{"t":"A lower oxygen supply to save weight on the cart","c":false,"r":"Oxygen should be more than enough."},{"t":"A portable ventilator or PEEP bag and oxygen","c":true,"r":""},{"t":"No monitor so the patient can rest on the trip","c":false,"r":"Monitoring is needed."}],"i":"Preparing for intrafacility transport.","e":"A move can cause loss of oxygen, pressure, or a tube. The nurse takes monitors, drugs, suction, and extra oxygen, and sends a trained person."},{"id":"T3-137","a":4,"s":"Which check is made just before an interfacility transfer?","o":[{"t":"The patient's hair has been combed neatly","c":false,"r":"This is not a safety check."},{"t":"The airway, chest tubes, lines, and bleeding are secure","c":true,"r":""},{"t":"The patient's room has been cleaned for the next patient","c":false,"r":"This is not a safety check."},{"t":"The patient's visitors have signed the guest book","c":false,"r":"This is not a safety check."}],"i":"Preparing for interfacility transfer.","e":"The patient is stabilized for the trip. The airway, drains, lines, and splints are secured, and records and images accompany the patient."},{"id":"T3-138","a":4,"s":"A patient is learning to use crutches. Which instruction is correct?","o":[{"t":"Bear the weight on the armpits to rest the hands","c":false,"r":"This can injure the nerves in the armpit."},{"t":"Bear weight on the hands, not the armpits","c":true,"r":""},{"t":"Keep the crutches as high as the shoulders","c":false,"r":"This is too high and can injure nerves."},{"t":"Move the crutches far in front of the body each step","c":false,"r":"This is unstable and can cause a fall."}],"i":"Teaching crutch use.","e":"Weight on the armpit can cause nerve damage, called crutch palsy. The hands carry the weight, and a nurse or therapist checks the fit."},{"id":"T3-139","a":4,"s":"A patient who speaks little English needs discharge teaching. What is the best approach?","o":[{"t":"Ask the patient's young child to translate","c":false,"r":"This is not appropriate."},{"t":"Use gestures and skip the written instructions","c":false,"r":"This is not reliable."},{"t":"Use a qualified medical interpreter","c":true,"r":""},{"t":"Give instructions in English and hope for the best","c":false,"r":"The patient may not understand."}],"i":"Overcoming language barriers.","e":"Qualified interpreters improve accuracy and safety. Written materials in the patient's language and the teach back method confirm understanding."},{"id":"T3-140","a":4,"s":"Which finding supports readiness for discharge home after trauma?","o":[{"t":"Pain that needs intravenous medicine every two hours","c":false,"r":"This is not ready for home."},{"t":"A new fever and a rising white cell count","c":false,"r":"This is not ready for home."},{"t":"The patient is unable to take food or fluids","c":false,"r":"This is not ready for home."},{"t":"Pain controlled on oral medicine and moving safely","c":true,"r":""}],"i":"Assessing discharge readiness.","e":"The patient should be stable, eating, moving at a safe level, and have a plan and supplies for care and follow up."},{"id":"T3-141","a":5,"s":"During a mass casualty incident, an adult is breathing at 24 breaths per minute, has a radial pulse, and follows simple commands. Which START category applies?","o":[{"t":"Delayed, yellow","c":true,"r":""},{"t":"Immediate, red","c":false,"r":"The criteria for red are not met."},{"t":"Minor, green","c":false,"r":"This category is for patients who can walk."},{"t":"Expectant, black","c":false,"r":"The patient is breathing and has a pulse."}],"i":"Using START triage.","e":"Patients who cannot walk but have a normal respiratory rate, a pulse, and follow commands are delayed. Immediate patients have a rate over 30, no radial pulse, or cannot follow commands."},{"id":"T3-142","a":5,"s":"A patient who was exposed to a radioactive material arrives with a bleeding wound and low blood pressure. What is the priority?","o":[{"t":"Delay all care until the patient is fully decontaminated","c":false,"r":"Life threats come first."},{"t":"Send the patient home to bathe in the morning","c":false,"r":"The patient needs care."},{"t":"Treat life threats first, then decontaminate","c":true,"r":""},{"t":"Wait for specialists from another city to arrive","c":false,"r":"Treatment cannot wait."}],"i":"Caring for a contaminated patient.","e":"Life saving care is not delayed, and staff wear protective equipment. Removing clothing and washing remove most of the contamination."},{"id":"T3-143","a":5,"s":"What is the target rate of undertriage in a trauma system, according to the American College of Surgeons?","o":[{"t":"Below 5 percent","c":true,"r":""},{"t":"Above 50 percent","c":false,"r":"This is far too high."},{"t":"Exactly 25 percent","c":false,"r":"This is too high."},{"t":"Above 75 percent","c":false,"r":"This is far too high."}],"i":"Knowing quality targets.","e":"Undertriage is a severely injured patient taken to a lower level center. A low rate matters most, while higher rates of overtriage are tolerated to prevent undertriage."},{"id":"T3-144","a":5,"s":"How is the Injury Severity Score calculated?","o":[{"t":"By adding the ages of all patients in the hospital","c":false,"r":"This is not used."},{"t":"By counting the days spent in the hospital and the ICU","c":false,"r":"This is not used."},{"t":"By multiplying the heart rate by the blood pressure","c":false,"r":"This is not used."},{"t":"By adding the squares of the highest scores in three regions","c":true,"r":""}],"i":"Understanding injury scoring.","e":"Each region is scored on the Abbreviated Injury Scale from 1 to 6. The top three scores are squared and added, so the range is 1 to 75."},{"id":"T3-145","a":5,"s":"Which level of evidence is the strongest for guiding practice?","o":[{"t":"A single case report about one patient","c":false,"r":"This is the weakest."},{"t":"A systematic review of randomized trials","c":true,"r":""},{"t":"An opinion of an expert in the field","c":false,"r":"This is weaker evidence."},{"t":"A story told by a colleague at work","c":false,"r":"This is not evidence."}],"i":"Applying evidence based practice.","e":"Combining several high quality trials reduces bias and chance. Expert opinion and case reports are lower on the hierarchy."},{"id":"T3-146","a":5,"s":"After a pediatric death, a nurse is distressed. Which support is most helpful?","o":[{"t":"Tell the nurse to work through the distress alone","c":false,"r":"This does not provide support."},{"t":"Assign the nurse to another child immediately","c":false,"r":"This does not provide support."},{"t":"Peer support and the employee assistance program","c":true,"r":""},{"t":"Avoid talk about the event on the unit","c":false,"r":"This does not provide support."}],"i":"Supporting staff.","e":"Support from colleagues and counseling can reduce stress and burnout. Debriefing and time away may also help."},{"id":"T3-147","a":5,"s":"A physician gives a verbal order for a blood product during a resuscitation. Which action reduces the risk of error?","o":[{"t":"Read back the order and confirm it before giving it","c":true,"r":""},{"t":"Give the product at once without repeating the order","c":false,"r":"Errors can happen."},{"t":"Wait to write the order after the patient has left","c":false,"r":"It should be confirmed."},{"t":"Have a student relay the order to the blood bank","c":false,"r":"This adds risk."}],"i":"Using closed loop communication.","e":"Reading back the drug, dose, and route confirms that the order was heard correctly. It is a basic safety step in a noisy resuscitation."},{"id":"T3-148","a":5,"s":"At the bedside check before a transfusion, the nurse finds that the unit is labeled for another patient and stops. How is this event classified?","o":[{"t":"A sentinel event with a death","c":false,"r":"No harm occurred."},{"t":"A normal event that needs no report","c":false,"r":"It should be reported."},{"t":"A near miss that is reported","c":true,"r":""},{"t":"An event that must be hidden from the manager","c":false,"r":"It should be reported."}],"i":"Reporting near misses.","e":"An error caught before it reaches the patient is a near miss. Reporting these events teaches the system how to prevent harm."},{"id":"T3-149","a":5,"s":"A friend of a patient calls the unit and asks for the patient's condition. What should the nurse do?","o":[{"t":"Give a full report to anyone who calls","c":false,"r":"This breaches privacy."},{"t":"Post the patient's condition on a social media site","c":false,"r":"This breaches privacy."},{"t":"Share the information if the caller says they are family","c":false,"r":"The caller cannot be verified."},{"t":"Share only if the patient agrees or policy allows it","c":true,"r":""}],"i":"Protecting privacy.","e":"Patient information is released with the patient's permission or as the law allows. Many hospitals use a password or contact person."},{"id":"T3-150","a":5,"s":"When can an unstable patient be transferred out under EMTALA?","o":[{"t":"Whenever the patient has no insurance coverage","c":false,"r":"Insurance cannot be a reason."},{"t":"When a physician certifies benefit and the receiver accepts","c":true,"r":""},{"t":"Once the patient is fully stabilized in each case","c":false,"r":"A certified transfer is allowed before stabilization."},{"t":"When the nurse thinks that the unit is too busy","c":false,"r":"A busy unit is not a reason."}],"i":"Knowing the rules of emergency transfer.","e":"The law requires a medical screening exam, stabilizing care within capacity, and a safe transfer. An unstable patient may move when the benefits outweigh the risks, and the receiving hospital agrees."},{"id":"T4-1","a":0,"s":"A patient with a cerebral contusion has a stable first CT of the head, but the exam worsens six hours later. What is the most likely explanation?","o":[{"t":"A normal reaction to the sedation in the unit","c":false,"r":"Sedation does not explain a new neurologic decline after injury."},{"t":"Resolution of the swelling seen earlier on CT","c":false,"r":"Resolving swelling would lead to improvement, not worsening."},{"t":"A side effect of oxygen by facemask","c":false,"r":"Oxygen does not cause a decline in neurologic function."},{"t":"Hemorrhagic progression of the contusion","c":true,"r":""}],"i":"Recognizing blossoming of a brain contusion.","e":"Contusions often grow in the first 24 hours as damaged vessels keep bleeding. A decline in the exam calls for a repeat CT and a call to the provider."},{"id":"T4-2","a":0,"s":"A student athlete has recovered from a concussion and is starting a stepwise return to play. The headache returns during one step. What should the athlete do?","o":[{"t":"Continue to the next step to prove fitness","c":false,"r":"Symptoms mean the brain is not ready for more activity."},{"t":"Skip the remaining steps and play in the next game","c":false,"r":"Steps may not be skipped."},{"t":"Stop and return to the previous step after rest","c":true,"r":""},{"t":"Take a double dose of ibuprofen and keep playing","c":false,"r":"Medicine hides symptoms and does not make the brain safe."}],"i":"Teaching safe return to activity after concussion.","e":"Each step lasts at least 24 hours and moves forward only if no symptoms appear. If symptoms return, the athlete drops back one step and tries again after rest."},{"id":"T4-3","a":0,"s":"A patient with a blown pupil and posturing is being prepared for surgery. Which short term measure may be used as a bridge for active herniation?","o":[{"t":"Sustained hyperventilation to a PaCO2 of 15 mmHg","c":false,"r":"Severe hyperventilation causes loss of blood flow to the brain."},{"t":"Lowering the head of the bed to flat","c":false,"r":"Lying flat raises the pressure further."},{"t":"Giving a large volume of free water by vein","c":false,"r":"Free water worsens the brain swelling."},{"t":"Brief hyperventilation to a PaCO2 of 30 to 35","c":true,"r":""}],"i":"Using hyperventilation only as a temporary rescue.","e":"Lowering carbon dioxide narrows brain vessels and lowers blood volume and pressure quickly. The effect is short and the lower range is risky, so it is used only until definitive treatment."},{"id":"T4-4","a":0,"s":"A patient has air within the skull on CT after a basilar skull fracture. Which instruction is most important?","o":[{"t":"Blow the nose gently every hour to relieve pressure","c":false,"r":"This can force air into the skull."},{"t":"Use a nasal CPAP mask to improve breathing","c":false,"r":"This can push more air into the skull."},{"t":"Avoid blowing the nose and nasal pressure","c":true,"r":""},{"t":"Place a nasal tube to drain the fluid from the nose","c":false,"r":"This can enter the brain through the fracture."}],"i":"Preventing tension pneumocephalus.","e":"Air can be forced into the skull through the fracture and compress the brain. The nurse avoids nasal tubes, nose blowing, and nasal positive pressure."},{"id":"T4-5","a":0,"s":"A patient with a severe brain injury opens the eyes and has sleep wake cycles but does not follow commands or fix on objects. Which term describes this state?","o":[{"t":"Unresponsive wakefulness, formerly the vegetative state","c":true,"r":""},{"t":"Brain death with loss of all brainstem reflexes","c":false,"r":"The patient has wake cycles and brainstem function."},{"t":"Locked in syndrome with full awareness of the surroundings","c":false,"r":"In locked in syndrome the patient is aware and can blink to communicate."},{"t":"Normal sleep that follows the injury to the head","c":false,"r":"The patient is not able to respond when awake."}],"i":"Naming states of disordered consciousness.","e":"The patient is awake without awareness. This differs from coma, where the eyes are closed, and from brain death, where all brain function has stopped."},{"id":"T4-6","a":0,"s":"Which CT finding is a typical indication for surgical evacuation of an acute subdural hematoma?","o":[{"t":"A thickness of 2 mm with no shift of the midline","c":false,"r":"A thin clot without shift is usually observed."},{"t":"A thickness over 10 mm or a midline shift over 5 mm","c":true,"r":""},{"t":"A shift of 1 mm with a normal level of consciousness","c":false,"r":"This is a minor shift."},{"t":"A small amount of blood in a single sulcus of the brain","c":false,"r":"This does not need surgery."}],"i":"Knowing surgical thresholds for subdural hematoma.","e":"A thick clot or significant shift compresses the brain. Surgery is also advised when the score drops by 2 points or more or the pupils become abnormal."},{"id":"T4-7","a":0,"s":"Mannitol is ordered every six hours for a patient with high intracranial pressure. Which result should lead the nurse to hold the dose and call the provider?","o":[{"t":"A serum osmolality of 285 mOsm/L","c":false,"r":"This is a normal value."},{"t":"A urine output of 80 mL per hour","c":false,"r":"This is an expected effect."},{"t":"A serum osmolality above 320 mOsm/L","c":true,"r":""},{"t":"A heart rate of 82 beats per minute","c":false,"r":"This is not a reason to hold the drug."}],"i":"Monitoring osmotic therapy.","e":"A high osmolality raises the risk of kidney injury. Most protocols hold the drug when the level passes about 320 mOsm/L."},{"id":"T4-8","a":0,"s":"A patient with a spinal cord injury becomes dizzy and pale with a pressure of 76/44 when the head of the bed is raised. What helps?","o":[{"t":"Raise the head in steps and use a binder and stockings","c":true,"r":""},{"t":"Raise the patient fully upright at once to improve blood flow","c":false,"r":"This worsens the drop in pressure."},{"t":"Stop all fluids and keep the patient flat for good","c":false,"r":"This does not fix the problem."},{"t":"Give a large dose of a drug that lowers the pressure","c":false,"r":"This would make the pressure lower."}],"i":"Managing orthostatic hypotension after spinal injury.","e":"Blood pools in the legs and the gut because the vessels cannot tighten. Gradual changes in position, binders, stockings, and sometimes a drug to raise the pressure help."},{"id":"T4-9","a":0,"s":"A patient with a spinal cord injury has a sudden increase in leg spasms. What should the nurse do first?","o":[{"t":"Assume it is a normal change and give no care","c":false,"r":"A sudden change usually has a trigger."},{"t":"Increase the dose of the muscle relaxant without a provider review","c":false,"r":"The cause must be found first."},{"t":"Hold the leg firmly to stop the spasm movement","c":false,"r":"This can worsen spasm."},{"t":"Look for a trigger such as infection or a full bladder","c":true,"r":""}],"i":"Responding to increased spasticity.","e":"Irritating stimuli below the level of the injury, such as a urinary infection, pressure injury, or a clot, increase spasm. Treating the cause is the first step before changing the drugs."},{"id":"T4-10","a":0,"s":"The patient wears a halo vest. Which item should always be kept with the patient?","o":[{"t":"The wrench for the vest, taped to the vest","c":true,"r":""},{"t":"The key to the patient's home, taped to the vest","c":false,"r":"This is not needed for care."},{"t":"A spare set of the patient's hearing aids","c":false,"r":"This is not needed for emergency access."},{"t":"A bag of ice for the pin sites at night","c":false,"r":"Ice is not used for this."}],"i":"Preparing for emergencies with a halo device.","e":"If the patient needs CPR, the front of the vest is removed quickly to reach the chest. The head stays stabilized, and the wrench is kept on the vest."},{"id":"T4-11","a":0,"s":"A patient with a T4 injury in neurogenic shock receives a large amount of fluid and then has crackles and an oxygen saturation of 88 percent. What happened?","o":[{"t":"The patient has a new air leak in the lung","c":false,"r":"This does not match the history."},{"t":"Fluid overload with pulmonary edema from volume","c":true,"r":""},{"t":"The patient has a drug allergy to the saline","c":false,"r":"Saline does not cause pulmonary edema from allergy."},{"t":"The patient has a normal response and it will clear","c":false,"r":"The crackles show the fluid has gone into the lungs."}],"i":"Avoiding over resuscitation in neurogenic shock.","e":"The low pressure comes from wide vessels, not from lost volume. After adequate volume, a vasopressor is used, because more fluid leads to lung edema."},{"id":"T4-12","a":0,"s":"A patient with a spinal cord injury reports burning, shooting pain in the legs, where sensation is otherwise lost. Which medicine class is first line?","o":[{"t":"A simple antacid taken with meals","c":false,"r":"This does not treat nerve pain."},{"t":"A drug that lowers the blood sugar in diabetic patients","c":false,"r":"This does not treat nerve pain."},{"t":"A gabapentinoid such as gabapentin or pregabalin","c":true,"r":""},{"t":"An antibiotic given through a vein","c":false,"r":"This does not treat nerve pain."}],"i":"Treating neuropathic pain.","e":"Pain at or below the level of the injury is from nerve damage. Gabapentinoids and other drugs that calm the nerves work better than ordinary pain relievers."},{"id":"T4-13","a":0,"s":"A patient who uses a wheelchair after a spinal cord injury asks how often to shift weight. What is the best advice?","o":[{"t":"Shift the weight once at the end of the day","c":false,"r":"This is not often enough to prevent pressure injury."},{"t":"Shift the weight every 15 to 30 minutes","c":true,"r":""},{"t":"Shift the weight when the skin feels sore","c":false,"r":"The patient may not feel pain."},{"t":"Stay in the same position to avoid skin friction","c":false,"r":"Prolonged pressure causes tissue death."}],"i":"Preventing pressure injury.","e":"Without feeling, the patient cannot sense pressure. Weight shifts, cushions, and daily skin checks prevent tissue damage."},{"id":"T4-14","a":0,"s":"Which key muscle movement is used to test the L3 level?","o":[{"t":"Knee extension","c":true,"r":""},{"t":"Elbow flexion","c":false,"r":"This tests C5."},{"t":"Great toe extension","c":false,"r":"This tests L5."},{"t":"Ankle plantar flexion","c":false,"r":"This tests S1."}],"i":"Testing key muscles.","e":"L2 is hip flexion, L3 is knee extension, L4 is ankle dorsiflexion, L5 is great toe extension, and S1 is ankle plantar flexion."},{"id":"T4-15","a":0,"s":"A patient with a brain injury is being cooled and starts to shiver. Why does this matter?","o":[{"t":"Shivering raises metabolism and skull pressure","c":true,"r":""},{"t":"Shivering lowers the oxygen use of the brain","c":false,"r":"Shivering increases oxygen use."},{"t":"Shivering is a sign that the brain is healing","c":false,"r":"It is a harmful response."},{"t":"Shivering protects the patient from low glucose","c":false,"r":"It does not protect the patient."}],"i":"Preventing shivering.","e":"Shivering increases the oxygen need and carbon dioxide production and can raise the pressure. Treatment includes warming the skin, and drugs when needed."},{"id":"T4-16","a":0,"s":"A brain tissue oxygen monitor shows a value of 12 mmHg. How is this value interpreted?","o":[{"t":"Normal, since the usual value is below 10 mmHg","c":false,"r":"The usual treatment threshold is about 20 mmHg."},{"t":"Low, suggesting too little oxygen to the brain","c":true,"r":""},{"t":"High, suggesting too much oxygen is delivered","c":false,"r":"The value is low."},{"t":"Unreliable, so it should be ignored","c":false,"r":"The value should be acted upon."}],"i":"Interpreting brain tissue oxygen.","e":"Values below about 20 mmHg suggest a risk of ischemia. The team raises oxygen, perfusion, or the hemoglobin and checks for causes."},{"id":"T4-17","a":0,"s":"What hemoglobin threshold is commonly used to guide red cell transfusion in a stable patient with a traumatic brain injury?","o":[{"t":"About 3 g/dL in brain injury","c":false,"r":"This is dangerously low."},{"t":"About 7 g/dL, with a higher target for some","c":true,"r":""},{"t":"About 14 g/dL in brain injury","c":false,"r":"A higher value is not needed for all patients."},{"t":"No threshold, since anemia does not harm the brain","c":false,"r":"Severe anemia harms the brain."}],"i":"Using a restrictive transfusion strategy.","e":"A level near 7 g/dL is used for most stable patients, and many centers use higher targets when the brain oxygen is low."},{"id":"T4-18","a":0,"s":"A patient with a severe brain injury has no response to commands or voice, but the exam shows fine twitching of the eyelids. What test finds seizures that cannot be seen?","o":[{"t":"Continuous EEG monitoring","c":true,"r":""},{"t":"A urine analysis for infection","c":false,"r":"This does not detect seizures."},{"t":"A plain x-ray of the skull for a fracture","c":false,"r":"This does not detect seizures."},{"t":"A fingerstick glucose by the nurse","c":false,"r":"This does not detect seizures."}],"i":"Finding nonconvulsive seizures.","e":"Nonconvulsive seizures keep the brain under stress and may cause a poor exam. Continuous EEG records them, and treatment is given."},{"id":"T4-19","a":0,"s":"A ventilated patient with a brain injury receives a stress ulcer prophylaxis order. Why is it given?","o":[{"t":"The medicine lowers the pressure in the skull by shrinking the brain","c":false,"r":"It does not lower this pressure."},{"t":"The medicine prevents seizures in the patient","c":false,"r":"It does not prevent seizures."},{"t":"The medicine treats a fever in the patient","c":false,"r":"It does not treat fever."},{"t":"Brain injury and ventilation raise the risk of stomach bleeding","c":true,"r":""}],"i":"Preventing complications of critical illness.","e":"Severe injury and ventilation raise stomach acid and reduce the protection of the stomach lining. Proton pump inhibitors or H2 blockers prevent bleeding."},{"id":"T4-20","a":0,"s":"After intubation of a patient with a brain injury, which end tidal carbon dioxide range is the usual target?","o":[{"t":"35 to 40 mmHg","c":true,"r":""},{"t":"15 to 20 mmHg","c":false,"r":"This is a low value that reduces brain blood flow."},{"t":"55 to 65 mmHg","c":false,"r":"This is a high value that raises brain pressure."},{"t":"80 to 90 mmHg","c":false,"r":"This is a very high value that raises brain pressure."}],"i":"Targeting carbon dioxide after intubation.","e":"High carbon dioxide widens brain vessels and raises pressure, while low levels narrow them. Waveform capnography keeps the range normal."},{"id":"T4-21","a":0,"s":"A patient has a mandible fracture with a tear in the mucosa of the mouth over the break. What treatment is needed beyond splinting?","o":[{"t":"No antibiotics, since the bone is not visible","c":false,"r":"The fracture is considered open if it communicates with the mouth."},{"t":"Antiviral treatment for the mouth infection","c":false,"r":"The main risk is bacterial infection."},{"t":"A tight wrap around the jaw and neck for firm support","c":false,"r":"This can block the airway."},{"t":"Antibiotics, since the fracture opens to the mouth","c":true,"r":""}],"i":"Caring for an open mandible fracture.","e":"The mouth holds many bacteria, and the fracture is contaminated. Antibiotics and early repair lower the risk of infection."},{"id":"T4-22","a":0,"s":"A patient has a fracture of the frontal sinus, and CT shows the posterior table is broken. Which complication is a concern?","o":[{"t":"A fracture of the cheekbone with double vision","c":false,"r":"The cheekbone is separate from the frontal sinus, and a broken posterior table points to the brain coverings."},{"t":"A cerebrospinal fluid leak with brain coverings infection","c":true,"r":""},{"t":"A fracture of the lower jaw with a bite change","c":false,"r":"A jaw fracture does not follow from a break in the posterior table of the frontal sinus."},{"t":"A dislocation of the jaw joint with locking","c":false,"r":"A jaw joint dislocation does not follow from a break in the posterior table of the frontal sinus."}],"i":"Recognizing complications of frontal sinus fracture.","e":"The back wall of the sinus lies against the brain coverings. Fracture there can tear the dura and allow a leak and meningitis, so the patient needs surgical review."},{"id":"T4-23","a":0,"s":"A patient cannot close the mouth after yawning, and the jaw feels locked open. What is the diagnosis?","o":[{"t":"A dislocation of the temporomandibular joint","c":true,"r":""},{"t":"A fracture of the nasal bone with swelling","c":false,"r":"The nose is not related to the locked jaw."},{"t":"A fracture of the zygomatic arch of the cheek","c":false,"r":"This limits opening, not closing."},{"t":"An injury to the thyroid cartilage in the neck","c":false,"r":"This does not cause a locked jaw."}],"i":"Recognizing jaw dislocation.","e":"The condyle slips forward out of the joint. A trained provider reduces it, often with sedation, and the patient avoids wide opening for a few weeks."},{"id":"T4-24","a":0,"s":"When is the best time for the nasal bone to be reduced after an isolated nasal fracture?","o":[{"t":"Right away, since the bones heal straight","c":false,"r":"Many need reduction to correct the shape."},{"t":"After six months when the bones have healed","c":false,"r":"This is too late for easy correction."},{"t":"Within minutes, before any swelling appears","c":false,"r":"Swelling makes assessment difficult after a few hours."},{"t":"After about 3 to 7 days, once the swelling has gone down","c":true,"r":""}],"i":"Timing nasal fracture care.","e":"Early swelling hides the true shape of the nose. Waiting a few days allows a better assessment, but reduction should be done within about two weeks."},{"id":"T4-25","a":0,"s":"A patient has a laceration through the margin of the upper eyelid. Why does this need a specialist?","o":[{"t":"Eyelid cuts are minor and need no stitches, since the lid heals fast","c":false,"r":"Poor repair can cause damage to the cornea."},{"t":"The eyelid heals back without a scar","c":false,"r":"A margin cut needs precise alignment."},{"t":"A nurse may close it with a single deep stitch","c":false,"r":"This can leave a notch that exposes the eye."},{"t":"The lid margin needs an exact repair to protect the eye","c":true,"r":""}],"i":"Caring for an eyelid injury.","e":"A notch or poor alignment prevents the lid from closing and exposes the cornea. A specialist repairs the margin and checks the eye and the tear ducts."},{"id":"T4-26","a":0,"s":"A contact lens wearer has a corneal abrasion. Which action is correct?","o":[{"t":"Leave the lens in and add more lubricating drops","c":false,"r":"The lens can trap bacteria and worsen the injury."},{"t":"Use a steroid drop alone to reduce the swelling","c":false,"r":"Steroids can worsen an infection."},{"t":"Remove the lens and treat with an antibiotic for Pseudomonas","c":true,"r":""},{"t":"Patch the eye with the lens in place for two days","c":false,"r":"The lens must be removed."}],"i":"Treating abrasions in lens wearers.","e":"Contact lens wearers are at risk of infection with Pseudomonas, which can destroy the cornea in a day. They receive a fluoroquinolone, and the lens is not used until healed."},{"id":"T4-27","a":0,"s":"After a violent cough, a patient has a bright red patch over the white of the eye, no pain, and normal vision. What is the diagnosis?","o":[{"t":"A retinal detachment that needs surgery at once","c":false,"r":"This causes vision changes, not a red patch."},{"t":"An open globe injury that needs a rigid shield right away","c":false,"r":"There is no trauma or loss of vision."},{"t":"A corneal ulcer that needs strong antibiotics","c":false,"r":"This causes pain and a white spot on the cornea."},{"t":"A subconjunctival hemorrhage that clears on its own","c":true,"r":""}],"i":"Recognizing a benign finding.","e":"A small vessel leaks under the conjunctiva. It looks dramatic but is harmless and fades in one to two weeks, unless it follows major trauma."},{"id":"T4-28","a":0,"s":"Which test should be avoided in a patient with a suspected ruptured globe?","o":[{"t":"A visual acuity check using a chart","c":false,"r":"This is safe and should be done."},{"t":"Measuring the eye pressure by tonometer","c":true,"r":""},{"t":"A pupil exam using a penlight","c":false,"r":"This is safe and should be done."},{"t":"A CT scan of the orbits without contrast","c":false,"r":"This is the best imaging test."}],"i":"Avoiding pressure on a damaged eye.","e":"Pressing on the eye can force out the contents. A rigid shield is placed, and no pressure or drops are applied until the eye specialist sees the patient."},{"id":"T4-29","a":0,"s":"A patient with blunt laryngotracheal injury needs an airway. What approach is usually safest?","o":[{"t":"Rapid sequence induction with forceful blind passage","c":false,"r":"A blind tube can complete a tear in the airway."},{"t":"Wait for the patient to stop breathing before acting","c":false,"r":"The patient needs a secure airway early."},{"t":"A tube passed through the nose with no visualization","c":false,"r":"A blind nasal tube is risky."},{"t":"An awake intubation by an expert or a surgical airway","c":true,"r":""}],"i":"Securing an airway after laryngotracheal injury.","e":"The tube can pass through a tear into the tissue and lose the airway. Direct view with a scope or a tracheostomy under local anesthetic is preferred."},{"id":"T4-30","a":0,"s":"A patient has sudden vertigo, double vision, and trouble walking one day after a neck injury. Which injury should be suspected?","o":[{"t":"A vertebral artery dissection with a stroke","c":true,"r":""},{"t":"A simple muscle strain of the neck treated with rest","c":false,"r":"A muscle strain does not cause vertigo, double vision and gait trouble."},{"t":"A fracture of the clavicle with arm pain","c":false,"r":"A clavicle fracture does not cause vertigo, double vision and gait trouble."},{"t":"A cervical disc herniation with arm numbness","c":false,"r":"A disc herniation causes arm symptoms and not a posterior circulation stroke picture."}],"i":"Recognizing posterior circulation stroke.","e":"The vertebral arteries supply the brainstem and cerebellum. Injury can cause a clot and stroke symptoms such as dizziness, double vision, and ataxia. CT angiography confirms it."},{"id":"T4-31","a":0,"s":"Which action should be avoided with a penetrating neck wound?","o":[{"t":"Probing the wound or clamping blindly in it","c":true,"r":""},{"t":"Applying direct pressure over the bleeding site","c":false,"r":"This is a correct first aid step."},{"t":"Keeping suction ready beside the patient","c":false,"r":"This is a correct preparation."},{"t":"Giving oxygen and watching the airway","c":false,"r":"This is a correct action."}],"i":"Avoiding harmful actions.","e":"Probing can dislodge a clot and cause fatal bleeding, and blind clamping can injure nerves and vessels. Pressure is used until the surgeon takes control."},{"id":"T4-32","a":1,"s":"A patient has pain, bruising and crepitus over the left lower chest after a fall. Which injury is most commonly missed on the first chest x-ray and found later on CT?","o":[{"t":"A large tension pneumothorax with a shifted trachea","c":false,"r":"This is obvious on exam and x-ray."},{"t":"A wide mediastinum from a torn aorta","c":false,"r":"This is a separate finding on imaging."},{"t":"Nondisplaced rib fractures that are hard to see","c":true,"r":""},{"t":"A dense whiteout of the whole lung field","c":false,"r":"This would be seen easily on x-ray."}],"i":"Knowing the limits of plain chest films.","e":"Rib fractures without displacement are often invisible on the first film. The patient is treated by the exam and pain, and a low rib fracture raises concern for spleen or liver injury."},{"id":"T4-33","a":1,"s":"A patient with six fractured ribs on the right has a respiratory rate of 30 and an oxygen saturation of 91 percent on a facemask. Which analgesic approach best improves breathing?","o":[{"t":"A regional block such as an erector spinae catheter","c":true,"r":""},{"t":"Large doses of IV opioid alone until the patient sleeps","c":false,"r":"Sedation can drop the breathing rate and worsen the failure."},{"t":"No analgesic so that the cough stays strong","c":false,"r":"Pain limits deep breaths and coughing."},{"t":"A tight chest binder around the ribs","c":false,"r":"Binding limits chest expansion and raises the risk of pneumonia."}],"i":"Using regional analgesia for rib fractures.","e":"Good pain control allows deep breathing and coughing. A regional block gives strong relief with less sedation than opioids alone."},{"id":"T4-34","a":1,"s":"Which finding in a patient with chest trauma best supports a sternal fracture?","o":[{"t":"Pain over the outer side of the left ankle","c":false,"r":"This is a different site."},{"t":"A tender lump in the right flank","c":false,"r":"This suggests a rib or kidney injury."},{"t":"Tenderness and a step off over the sternum","c":true,"r":""},{"t":"A heart rate of 58 with warm skin","c":false,"r":"This is unrelated."}],"i":"Recognizing a sternal fracture.","e":"A direct blow from a steering wheel or belt causes it. Because of the force, an ECG and monitoring are used to look for blunt cardiac injury."},{"id":"T4-35","a":1,"s":"A patient with a flail segment on the right is on a ventilator for respiratory failure. What is the main reason for the ventilator?","o":[{"t":"The ribs themselves are the sole cause of the failure","c":false,"r":"The contused lung is the larger cause."},{"t":"The ventilator will heal the broken ribs faster","c":false,"r":"It does not heal bone."},{"t":"The patient has a spinal cord injury at C3","c":false,"r":"There is no mention of this."},{"t":"Underlying lung contusion and pain limiting breathing","c":true,"r":""}],"i":"Understanding flail chest physiology.","e":"The paradoxical motion is a sign, but the lung bruise under the flail segment drives the hypoxia. Positive pressure supports the chest wall while the lung heals."},{"id":"T4-36","a":1,"s":"A patient develops a sudden fall in oxygen saturation, absent breath sounds on the left, and rising airway pressures after intubation. What is the most likely cause?","o":[{"t":"A pulmonary embolism from a clot in the leg","c":false,"r":"A pulmonary embolism does not cause absent breath sounds on one side with rising pressures."},{"t":"Right mainstem placement of the tube or a pneumothorax","c":true,"r":""},{"t":"Esophageal intubation with air in the stomach","c":false,"r":"Esophageal placement would cause absent breath sounds on both sides and no chest rise."},{"t":"A kinked ventilator circuit with low pressure","c":false,"r":"A kinked circuit lowers or blocks flow and does not explain absent breath sounds on one side."}],"i":"Troubleshooting after intubation.","e":"A tube that is too deep enters the right bronchus and leaves the left lung without air. A pneumothorax under positive pressure can also cause this. The nurse checks the tube depth and listens."},{"id":"T4-37","a":1,"s":"A patient has a pulmonary contusion. Which fluid strategy is best once the patient is resuscitated?","o":[{"t":"Give large amounts of crystalloid to flush the lung","c":false,"r":"This worsens the edema in the bruised lung."},{"t":"Stop all fluids and blood products at once","c":false,"r":"The patient needs perfusion."},{"t":"Give free water by mouth in large amounts","c":false,"r":"This does not treat the lung."},{"t":"Avoid fluid excess and give what perfusion needs","c":true,"r":""}],"i":"Fluid management in lung contusion.","e":"Contused lung leaks fluid easily. Once perfusion is restored, balanced fluid care limits swelling in the lung."},{"id":"T4-38","a":1,"s":"A patient with a chest tube has continuous bubbling in the water seal chamber. What does this suggest?","o":[{"t":"The tube is working as it should and needs no action","c":false,"r":"Continuous bubbling is not normal."},{"t":"An air leak from the lung or a loose connection","c":true,"r":""},{"t":"The lung has fully reexpanded","c":false,"r":"This would stop the bubbling."},{"t":"The suction pressure is too low","c":false,"r":"This does not cause bubbling in the water seal."}],"i":"Assessing a chest drainage system.","e":"Bubbling means air is entering the system. The nurse checks the connections from the patient to the box, and a persistent leak suggests a bronchopleural injury."},{"id":"T4-39","a":1,"s":"A patient has a large pneumothorax on a film after a stab wound and the chest tube is placed. Which finding shows the tube is working?","o":[{"t":"Fluctuation of the water level with each breath","c":true,"r":""},{"t":"A dry water seal chamber with no movement at all","c":false,"r":"No movement may show a blocked tube or a fully expanded lung."},{"t":"A rapid fall in the oxygen saturation","c":false,"r":"This suggests a problem."},{"t":"A new swelling of the neck and face","c":false,"r":"This suggests air under the skin."}],"i":"Recognizing a functioning chest tube.","e":"Tidaling moves with breathing. Its absence along with a poor exam may suggest a kink, a clot, or a lung that has fully expanded."},{"id":"T4-40","a":1,"s":"A patient has hypotension, distended neck veins and muffled heart sounds after a stab wound near the heart. What is the definitive treatment?","o":[{"t":"Large doses of a diuretic to remove the fluid","c":false,"r":"This lowers the filling pressure and worsens shock."},{"t":"Surgical relief of tamponade by thoracotomy","c":true,"r":""},{"t":"A beta blocker to slow the heart rate","c":false,"r":"This lowers the output."},{"t":"Oral anticoagulation therapy for several days","c":false,"r":"This increases bleeding."}],"i":"Treating cardiac tamponade.","e":"Needle drainage is temporary, since blood clots. The heart must be exposed and repaired. Fluids can raise the filling pressure while the patient goes to the operating room."},{"id":"T4-41","a":1,"s":"Which finding after blunt chest trauma is most worrisome for blunt cardiac injury?","o":[{"t":"New arrhythmia or ST changes with a raised troponin","c":true,"r":""},{"t":"A normal ECG and a normal troponin on repeat testing","c":false,"r":"This makes injury unlikely."},{"t":"A tender rib with a normal ECG and rhythm","c":false,"r":"This is a chest wall injury."},{"t":"Sinus rhythm at a rate of 72 with a normal ECG","c":false,"r":"This is normal."}],"i":"Screening for blunt cardiac injury.","e":"A normal ECG and troponin rule out clinically important injury. Abnormal findings call for monitoring and an echocardiogram."},{"id":"T4-42","a":1,"s":"A patient has a penetrating wound to the chest. The monitor shows a narrowing pulse pressure and the pressure falls with each breath in. Which sign is this?","o":[{"t":"Pulsus paradoxus, which is seen in tamponade","c":true,"r":""},{"t":"Cushing triad from a brain injury","c":false,"r":"This pattern includes slow heart rate and irregular breathing."},{"t":"Kussmaul breathing from diabetic acidosis","c":false,"r":"This is a breathing pattern."},{"t":"Pulsus alternans from a failing left ventricle","c":false,"r":"Pulsus alternans signals a failing left ventricle and not tamponade."}],"i":"Recognizing signs of tamponade.","e":"An exaggerated drop in pressure on inspiration occurs because the heart fills poorly. It supports tamponade along with distended veins and low pressure."},{"id":"T4-43","a":1,"s":"A patient with a suspected cardiac injury after a blunt chest injury is monitored. Which complication might develop days later?","o":[{"t":"A late tear of the thoracic duct with a chylous leak","c":false,"r":"A thoracic duct tear is not a recognized delayed result of a cardiac contusion."},{"t":"A late fracture of the sternum with a bone infection","c":false,"r":"Bone infection of the sternum is not a typical delayed result of a cardiac contusion."},{"t":"A delayed rupture of the diaphragm with herniation","c":false,"r":"Diaphragm rupture is a separate injury and is not a delayed result of a cardiac contusion."},{"t":"A delayed rupture of a valve or the septum","c":true,"r":""}],"i":"Knowing delayed cardiac complications.","e":"Bruised muscle or valves can fail later. A new murmur, heart failure, or shock calls for repeat echocardiography."},{"id":"T4-44","a":1,"s":"A patient with a suspected aortic injury has a pressure of 170/100 and a heart rate of 120. What is the main goal of treatment before repair?","o":[{"t":"Raise the pressure with fluids to 200 systolic","c":false,"r":"This increases the wall stress."},{"t":"Place the patient flat and wait for the scan","c":false,"r":"This does not reduce the stress."},{"t":"Lower the heart rate and pressure with a beta blocker","c":true,"r":""},{"t":"Give oral aspirin for the chest pain","c":false,"r":"This increases bleeding risk."}],"i":"Controlling impulse in aortic injury.","e":"Anti impulse therapy with a short acting beta blocker lowers the force on the torn aortic wall. A typical target is a systolic pressure of 100 to 120 and a heart rate under 80."},{"id":"T4-45","a":1,"s":"Which finding after blunt chest trauma most suggests a tracheobronchial injury?","o":[{"t":"Pain on deep breathing with a clear chest x-ray and normal oxygen saturation","c":false,"r":"This suggests a minor chest wall injury and not an airway tear."},{"t":"A persistent air leak with a lung that stays collapsed after chest tube placement","c":true,"r":""},{"t":"A large collection of blood that drains quickly from the chest tube","c":false,"r":"This suggests a vascular or lung bleed and not an airway tear."},{"t":"Bruising over the sternum with a normal breathing pattern at rest","c":false,"r":"This suggests a chest wall bruise and not an airway tear."}],"i":"Recognizing signs of a tracheobronchial injury.","e":"A torn large airway keeps leaking air into the pleural space, so the lung does not expand again even with suction. Bronchoscopy confirms the injury, and early surgery is often needed."},{"id":"T4-46","a":1,"s":"Which finding on CT angiography confirms a blunt thoracic aortic injury?","o":[{"t":"A small rib fracture on the right chest wall","c":false,"r":"This is not a vascular finding."},{"t":"An intimal flap or pseudoaneurysm","c":true,"r":""},{"t":"A clear lung field on both sides","c":false,"r":"This does not suggest injury."},{"t":"A normal sized heart shadow on the film","c":false,"r":"This does not confirm or exclude injury."}],"i":"Confirming aortic injury.","e":"CT angiography is the test of choice and detects the injury, grades it, and guides the choice between endovascular repair and observation."},{"id":"T4-47","a":1,"s":"A patient with a suspected thoracic aortic injury is in pain and agitated. Why is pain control important?","o":[{"t":"Pain control has no relation to the risk of aortic wall injury or its repair","c":false,"r":"Stress raises the pressure and can extend the tear."},{"t":"Pain makes the CT scan less accurate","c":false,"r":"This is not the main concern."},{"t":"Pain relief makes the blood pressure rise","c":false,"r":"Relief lowers the sympathetic response."},{"t":"Pain raises the pressure and heart rate and stresses the aortic wall","c":true,"r":""}],"i":"Reducing aortic wall stress.","e":"Agitation and pain raise the pressure and heart rate. Analgesia and calm care are part of the anti impulse plan."},{"id":"T4-48","a":1,"s":"A restrained driver has a seat belt mark on the lower abdomen and a pain in the back. X-ray shows a Chance fracture. Which injury is most associated with this fracture?","o":[{"t":"A fracture of the clavicle","c":false,"r":"A clavicle fracture does not follow a seat belt and Chance fracture pattern."},{"t":"A tear of the rotator cuff","c":false,"r":"A rotator cuff tear does not follow a seat belt and Chance fracture pattern."},{"t":"A fracture of the wrist from bracing","c":false,"r":"A wrist fracture from bracing is not the injury linked with a Chance fracture."},{"t":"Small bowel or mesenteric injury","c":true,"r":""}],"i":"Linking a Chance fracture to bowel injury.","e":"The belt pushes the bowel against the spine as the spine flexes. A seat belt sign plus a Chance fracture calls for a careful search for hollow organ injury."},{"id":"T4-49","a":1,"s":"Which finding after blunt abdominal trauma suggests a hollow organ perforation on CT?","o":[{"t":"Isolated free fluid when solid organ injury is seen","c":false,"r":"Fluid is explained by the solid organ injury."},{"t":"A normal bowel wall with no fluid at all","c":false,"r":"This suggests no injury."},{"t":"Free fluid without solid organ injury, or free air","c":true,"r":""},{"t":"A small pleural effusion on the right side","c":false,"r":"This is not a hollow organ finding."}],"i":"Recognizing hollow organ perforation.","e":"Fluid without a solid organ source, bowel wall thickening, and free air suggest perforation. Peritonitis calls for surgery."},{"id":"T4-50","a":1,"s":"A patient had a bowel repair for a gunshot wound. On day 3, the patient has fever, a high white count and a rising heart rate. What is the best next step?","o":[{"t":"Wait for another day as this is normal after surgery","c":false,"r":"These signs suggest a complication."},{"t":"Give a larger dose of the pain medicine","c":false,"r":"This hides the signs."},{"t":"Remove the drain at the bedside now","c":false,"r":"This would not address the cause."},{"t":"Notify the provider of a possible leak or abscess","c":true,"r":""}],"i":"Recognizing complications after bowel repair.","e":"Fever, tachycardia, and a rising white count suggest an anastomotic leak or abscess. CT and early return to the operating room may be needed."},{"id":"T4-51","a":1,"s":"A patient with a grade IV spleen injury is stable and managed without surgery. Which activity instruction is correct?","o":[{"t":"Avoid strenuous activity and contact sports for weeks","c":true,"r":""},{"t":"Return to football the next day","c":false,"r":"This risks a delayed rupture."},{"t":"Lift heavy boxes at work since bleeding has stopped","c":false,"r":"This risks bleeding."},{"t":"Take aspirin each day for the pain","c":false,"r":"This raises the risk of bleeding."}],"i":"Teaching after nonoperative spleen management.","e":"Healing takes weeks. The patient also learns the warning signs of bleeding, such as left shoulder pain, dizziness, or belly pain."},{"id":"T4-52","a":1,"s":"After a spleen injury or splenectomy, which vaccines are especially important?","o":[{"t":"A flu shot given once each year alone","c":false,"r":"More vaccines are needed."},{"t":"Rabies and yellow fever vaccines","c":false,"r":"These are not related to the spleen."},{"t":"Pneumococcal, meningococcal and Hib vaccines","c":true,"r":""},{"t":"Hepatitis A vaccine in a single dose","c":false,"r":"This is not the main concern."}],"i":"Preventing overwhelming infection.","e":"The spleen clears encapsulated bacteria. Patients without a spleen are at risk of overwhelming sepsis and need these vaccines."},{"id":"T4-53","a":1,"s":"A patient with a liver injury is receiving transfusions. Which complication of massive transfusion can occur and affects the heart?","o":[{"t":"Hypocalcemia from citrate in the blood products","c":true,"r":""},{"t":"Hypernatremia from the plasma given","c":false,"r":"This is not the main concern."},{"t":"Hyperglycemia from the red cells","c":false,"r":"This is not the main concern."},{"t":"Hypoxemia from the saline given","c":false,"r":"This is not the main concern."}],"i":"Recognizing complications of massive transfusion.","e":"Citrate binds calcium, and the liver is needed to clear citrate. Low calcium reduces cardiac contractility and clotting, so calcium is replaced."},{"id":"T4-54","a":1,"s":"A chest x-ray after a stab wound to the left lower chest shows the gastric tube curled above the diaphragm. What is the likely diagnosis?","o":[{"t":"A normal anatomic variant of the esophagus","c":false,"r":"The tube should be below the diaphragm."},{"t":"A pneumothorax on the right side","c":false,"r":"This does not explain the tube."},{"t":"A diaphragmatic rupture with stomach in the chest","c":true,"r":""},{"t":"A simple rib fracture with no other injury","c":false,"r":"This does not explain the tube."}],"i":"Recognizing diaphragm injury on film.","e":"The stomach moved through the tear. A gastric tube above the diaphragm is a classic sign. Surgery repairs the defect."},{"id":"T4-55","a":1,"s":"Why is diaphragm injury more often found on the left side?","o":[{"t":"The heart is larger than the lungs","c":false,"r":"This is not the reason."},{"t":"Right side injuries are not possible in trauma","c":false,"r":"They can occur."},{"t":"The liver protects the right side, so the left is weaker","c":true,"r":""},{"t":"The left side has more ribs than the right","c":false,"r":"This is not accurate."}],"i":"Understanding diaphragm injury.","e":"The liver cushions the right hemidiaphragm. Right side tears occur with high energy and are often missed."},{"id":"T4-56","a":1,"s":"A patient with a diaphragm tear has a nasogastric tube placed. Which finding would be of concern?","o":[{"t":"Resistance, or a tube above the diaphragm on x-ray","c":true,"r":""},{"t":"Return of gastric contents","c":false,"r":"This is normal."},{"t":"A tube that passes easily and sits in the stomach","c":false,"r":"This is normal."},{"t":"Clear secretions from the tube","c":false,"r":"This is normal."}],"i":"Using the tube as a clue.","e":"A tube that coils in the chest suggests herniated stomach. The nurse reports this and avoids forcing the tube."},{"id":"T4-57","a":1,"s":"Which mechanism most often causes a large radial tear of the diaphragm?","o":[{"t":"A slow rise in pressure from a large meal","c":false,"r":"This does not cause a tear."},{"t":"A mild cough that happens once in the morning","c":false,"r":"This does not cause a tear."},{"t":"Blunt force that suddenly raises abdominal pressure","c":true,"r":""},{"t":"A light touch to the abdomen by the nurse","c":false,"r":"This does not cause a tear."}],"i":"Knowing mechanisms of diaphragm injury.","e":"A high speed crash or crush injury raises abdominal pressure suddenly and tears the diaphragm, often with a large defect, while penetrating injury makes small holes."},{"id":"T4-58","a":1,"s":"Which finding is a classic late sign of retroperitoneal hemorrhage?","o":[{"t":"Bruising at the bridge of the nose","c":false,"r":"This is not a sign of bleeding behind the abdomen."},{"t":"Flank bruising, called the Grey Turner sign","c":true,"r":""},{"t":"A bruise on the knee after a bump","c":false,"r":"This is not a sign of bleeding behind the abdomen."},{"t":"Swelling of the foot after a long walk","c":false,"r":"This is not a sign of bleeding behind the abdomen."}],"i":"Recognizing signs of retroperitoneal bleeding.","e":"Blood tracks along tissue planes and appears in the flank. Cullen sign around the umbilicus is a similar finding. Both are late and not reliable."},{"id":"T4-59","a":1,"s":"A patient with a pancreatic injury has a normal first amylase. What is true?","o":[{"t":"The pancreas is certainly normal","c":false,"r":"Early values may be normal."},{"t":"A normal early value does not rule out injury","c":true,"r":""},{"t":"No more testing is needed at all","c":false,"r":"Injury can be delayed."},{"t":"Surgery is required for a pancreatic injury","c":false,"r":"This is not always required."}],"i":"Knowing the limits of amylase.","e":"Amylase may take hours to rise. Pancreatic injury is easy to miss, and a pancreatic duct injury is the key finding that changes treatment."},{"id":"T4-60","a":1,"s":"Which organ lies in the retroperitoneum and can be injured by blunt force against the spine?","o":[{"t":"The stomach","c":false,"r":"This is intraperitoneal."},{"t":"The transverse colon","c":false,"r":"This is intraperitoneal."},{"t":"The ovary","c":false,"r":"This lies in the pelvis, not behind the abdomen."},{"t":"The duodenum","c":true,"r":""}],"i":"Knowing retroperitoneal organs.","e":"The duodenum, pancreas, kidneys, adrenal glands, aorta and vena cava are retroperitoneal. Duodenal injury can be missed because of the lack of early signs."},{"id":"T4-61","a":1,"s":"A patient with a renal injury has gross hematuria and is stable. CT shows a grade III laceration. What is the usual management?","o":[{"t":"Nonoperative care with bed rest and serial blood counts","c":true,"r":""},{"t":"Immediate nephrectomy to remove the injured kidney","c":false,"r":"Most injuries in stable patients are managed without surgery."},{"t":"Discharge with no follow up visit","c":false,"r":"The patient needs monitoring."},{"t":"Heavy exercise to improve the flow of blood","c":false,"r":"This risks more bleeding."}],"i":"Managing renal trauma.","e":"Most renal injuries in stable patients heal without surgery. Surgery is for unstable patients or those with a pulsatile bleed or a pedicle injury."},{"id":"T4-62","a":1,"s":"A patient has a pelvis with a widened pubic symphysis after a head on crash. Which pattern is this?","o":[{"t":"A lateral compression injury that closes the pelvis","c":false,"r":"This closes the pelvis."},{"t":"A simple fracture of the tailbone","c":false,"r":"This does not widen the symphysis."},{"t":"An isolated fracture of the hip socket","c":false,"r":"This is a separate pattern."},{"t":"An anteroposterior compression injury, which opens the pelvis","c":true,"r":""}],"i":"Recognizing pelvic fracture patterns.","e":"The ring opens as the forces spread it, which enlarges the pelvic volume and allows more bleeding. A binder closes the volume."},{"id":"T4-63","a":1,"s":"A patient with a vertical shear injury of the pelvis is at risk of what?","o":[{"t":"A minor muscle strain that heals with rest","c":false,"r":"Vertical shear injuries are high energy and carry major bleeding risk, so a minor strain does not fit."},{"t":"Severe bleeding and instability of the hemipelvis","c":true,"r":""},{"t":"A fracture of the skull base with a leak","c":false,"r":"A skull base fracture is not a risk of a vertical shear pelvic injury."},{"t":"A sprain of the ankle with mild swelling","c":false,"r":"An ankle sprain is not the risk of a vertical shear pelvic injury."}],"i":"Understanding high energy pelvic injury.","e":"This pattern comes from a fall from height. The hemipelvis moves upward and the posterior ligaments tear, which causes major vascular injury."},{"id":"T4-64","a":1,"s":"An older adult falls from standing and has pain in the groin. X-ray is normal. What should be considered?","o":[{"t":"No injury since the film is normal","c":false,"r":"Occult fractures are common in the elderly."},{"t":"A muscle bruise that needs rest and no imaging","c":false,"r":"A fracture may be missed."},{"t":"An occult pubic ramus or acetabular fracture","c":true,"r":""},{"t":"A hip dislocation that was already reduced","c":false,"r":"A reduced dislocation does not explain new groin pain with a normal film in a fall from standing."}],"i":"Finding occult pelvic fractures.","e":"Weak bone makes low energy fractures common, and plain films miss many. Pain with weight bearing calls for further imaging."},{"id":"T4-65","a":1,"s":"A patient with an unstable pelvic fracture is hypotensive despite a binder and blood products. Which procedure may control the bleeding?","o":[{"t":"Oral iron therapy for the blood loss","c":false,"r":"This does not control active bleeding."},{"t":"A cast on the leg for support","c":false,"r":"This does not control pelvic bleeding."},{"t":"Observation for another day","c":false,"r":"The patient is in shock."},{"t":"Angioembolization or pelvic packing","c":true,"r":""}],"i":"Controlling pelvic hemorrhage.","e":"Arterial bleeding is controlled by embolization, while venous and bone bleeding responds to packing and external fixation."},{"id":"T4-66","a":1,"s":"Where is a pelvic binder correctly placed?","o":[{"t":"Over the waist and lower ribs","c":false,"r":"This is too high."},{"t":"Over the knees and thighs","c":false,"r":"This is too low."},{"t":"Over the ribs and upper abdomen","c":false,"r":"This is too high."},{"t":"Over the greater trochanters","c":true,"r":""}],"i":"Applying a pelvic binder.","e":"The binder must be centered at the trochanters to close the pelvic ring. Placing it too high is a common error and fails to reduce the volume."},{"id":"T4-67","a":1,"s":"A patient with a pelvic fracture has a new, rapidly expanding bruise of the perineum and thigh. What does this suggest?","o":[{"t":"Ongoing pelvic hemorrhage","c":true,"r":""},{"t":"A normal healing process","c":false,"r":"This suggests active bleeding."},{"t":"An allergy to the binder","c":false,"r":"This is not likely."},{"t":"A reaction to the pain medicine","c":false,"r":"This is not likely."}],"i":"Recognizing ongoing bleeding.","e":"Blood tracks into the perineum and thigh. The nurse reports this at once and prepares for more blood and a procedure."},{"id":"T4-68","a":1,"s":"Which finding suggests urethral injury and should delay urinary catheter placement?","o":[{"t":"Clear yellow urine at the meatus","c":false,"r":"This is normal."},{"t":"A small amount of dark urine","c":false,"r":"This does not suggest urethral injury."},{"t":"Blood at the meatus or a high riding prostate","c":true,"r":""},{"t":"A urine output of 60 mL per hour that is clear","c":false,"r":"This is normal."}],"i":"Recognizing urethral injury.","e":"A urethrogram is done before a catheter is passed, since blind placement can worsen a tear."},{"id":"T4-69","a":1,"s":"A patient with a pelvic fracture cannot void, and a catheter returns only a small amount of bloody urine. A CT cystogram shows contrast outside the bladder. What is the diagnosis?","o":[{"t":"A kidney stone","c":false,"r":"This is not shown."},{"t":"A bladder rupture","c":true,"r":""},{"t":"A normal bladder","c":false,"r":"The contrast leaks out."},{"t":"An enlarged prostate","c":false,"r":"This does not explain the leak."}],"i":"Diagnosing bladder rupture.","e":"A retrograde cystogram with bladder filling shows the leak. Intraperitoneal rupture needs surgery, and an extraperitoneal one is often managed with a catheter."},{"id":"T4-70","a":2,"s":"A patient has a burst fracture of L1 with retropulsed bone and mild leg weakness. Which finding makes the injury unstable?","o":[{"t":"Anterior and middle column failure with canal compromise","c":true,"r":""},{"t":"A pain score of 4 out of 10 at rest","c":false,"r":"Pain level does not define stability."},{"t":"A normal x-ray of the other vertebrae","c":false,"r":"This does not define stability."},{"t":"Muscle spasm along the spine on both sides of the lower back","c":false,"r":"Spasm is a common finding with any back injury."}],"i":"Judging spinal stability.","e":"The three column model describes injury. When two or more columns fail, the spine is unstable and bone can press on the cord or nerves."},{"id":"T4-71","a":2,"s":"How should a patient with a suspected thoracolumbar fracture be moved for transfer to a bed?","o":[{"t":"Twist the trunk to sit the patient up","c":false,"r":"This moves the unstable spine."},{"t":"Log roll with the spine kept in line by several people","c":true,"r":""},{"t":"Let the patient walk to the bed","c":false,"r":"This risks cord injury."},{"t":"Lift by the arms and legs without support from the team","c":false,"r":"This bends the spine."}],"i":"Protecting the spine during movement.","e":"The spine is moved as one unit. Neurologic checks are done before and after each move."},{"id":"T4-72","a":2,"s":"A patient with a compression fracture of the thoracic spine after a fall has a paralytic ileus. What is the likely reason?","o":[{"t":"Retroperitoneal bleeding and nerve injury that slow the gut","c":true,"r":""},{"t":"The patient ate too much dietary fiber in the days before the fall","c":false,"r":"This does not explain ileus."},{"t":"The patient has a healed stomach ulcer","c":false,"r":"This is not related."},{"t":"The patient walks too much after the fall","c":false,"r":"This is not related."}],"i":"Linking spinal fractures to ileus.","e":"Bleeding next to the spine and altered nerve control slow the gut. The patient needs a gastric tube, no food by mouth, and reassessment."},{"id":"T4-73","a":2,"s":"A patient with a forearm fracture reports pain that is out of proportion and worse with passive finger stretch. What is the first nursing action?","o":[{"t":"Elevate the arm well above the heart","c":false,"r":"This lowers arterial flow in a compartment syndrome."},{"t":"Apply ice and wait for an hour","c":false,"r":"Ice delays recognition."},{"t":"Loosen the cast, keep the limb level, and call the provider","c":true,"r":""},{"t":"Give a higher dose of opioid and reassess the patient in one hour","c":false,"r":"This masks the signs."}],"i":"Responding to suspected compartment syndrome.","e":"Pain out of proportion and pain with passive stretch are early signs. Pulses are often present until late. Fasciotomy relieves pressure."},{"id":"T4-74","a":2,"s":"Which patient is at highest risk of compartment syndrome?","o":[{"t":"A patient with a small cut on the finger from a knife","c":false,"r":"This is low risk."},{"t":"A patient with a sunburn on the back","c":false,"r":"This is low risk."},{"t":"A patient with a tibial shaft fracture from a crush","c":true,"r":""},{"t":"A patient with a sprained wrist from a fall","c":false,"r":"This is low risk."}],"i":"Identifying risk factors.","e":"Crush injury, long bone fractures, tight casts, and reperfusion after vascular repair raise the risk because swelling is trapped in a closed compartment."},{"id":"T4-75","a":2,"s":"A patient has a traumatic amputation of a finger. How should the part be prepared for transport?","o":[{"t":"Place the part directly on ice in an open cup for transport","c":false,"r":"Direct contact damages the tissue."},{"t":"Soak the part in alcohol","c":false,"r":"This destroys the tissue."},{"t":"Place the part in warm water","c":false,"r":"This speeds tissue death."},{"t":"Wrap in moist saline gauze, bag it, and place on ice","c":true,"r":""}],"i":"Preserving an amputated part.","e":"The part is kept cool but not frozen. The goal is to keep the tissue alive for replantation."},{"id":"T4-76","a":2,"s":"A patient with a traumatic above knee amputation has a tourniquet in place. What should the nurse do?","o":[{"t":"Remove it at once to check the wound and bleeding","c":false,"r":"This allows bleeding to restart."},{"t":"Loosen it every five minutes to check the limb","c":false,"r":"This allows bleeding to restart."},{"t":"Record the time of application and leave it on","c":true,"r":""},{"t":"Cover it so that it is not seen","c":false,"r":"The time must be visible."}],"i":"Managing a tourniquet.","e":"The time is written on the patient and tourniquet. It is not released outside of the operating room unless ordered."},{"id":"T4-77","a":2,"s":"A patient with a displaced femur fracture has a leg that is shortened and rotated. Which first aid measure reduces pain and bleeding?","o":[{"t":"Apply a traction splint if no pelvic or knee injury exists","c":true,"r":""},{"t":"Massage the thigh firmly to improve the blood flow to the limb","c":false,"r":"This causes more injury."},{"t":"Walk the patient with crutches","c":false,"r":"The patient must not bear weight."},{"t":"Apply heat to the thigh for comfort","c":false,"r":"This does not control bleeding."}],"i":"Stabilizing a femur fracture.","e":"Traction aligns the bone, reduces muscle spasm, and lowers the volume of the thigh. A femur fracture can lose over a liter of blood."},{"id":"T4-78","a":2,"s":"Which sign shows that an open fracture needs urgent antibiotics and surgery?","o":[{"t":"A wound that communicates with the fracture","c":true,"r":""},{"t":"Skin that is intact and unbroken over the bone","c":false,"r":"This describes a closed fracture."},{"t":"Mild bruising of the skin","c":false,"r":"This does not show an open fracture."},{"t":"Slight tenderness over the bone","c":false,"r":"This does not show an open fracture."}],"i":"Recognizing open fractures.","e":"Antibiotics are given within an hour of injury, and the wound is covered with moist sterile gauze. Tetanus status is checked."},{"id":"T4-79","a":2,"s":"A patient has a high pressure injection injury to the finger from a paint gun. The finger looks nearly normal with a small wound. What is the appropriate action?","o":[{"t":"Reassure the patient and send home","c":false,"r":"The damage under the skin is severe."},{"t":"Apply a warm soak, give antibiotics and review in a week","c":false,"r":"Delay increases the risk of amputation."},{"t":"Treat it as a surgical emergency and call a hand surgeon","c":true,"r":""},{"t":"Apply a tight bandage and a sling","c":false,"r":"This is not the priority."}],"i":"Recognizing a high pressure injection injury.","e":"The small wound hides material that spreads along tissue planes and causes ischemia. Urgent surgical cleaning is needed."},{"id":"T4-80","a":2,"s":"A patient has an animal bite to the hand. Which action is most important?","o":[{"t":"Close it tightly with stitches and send the patient home","c":false,"r":"Closure traps bacteria."},{"t":"Irrigate well and give antibiotics with a tetanus update","c":true,"r":""},{"t":"Cover the wound without washing it","c":false,"r":"Washing lowers the bacterial load."},{"t":"Soak the hand in hydrogen peroxide for an hour","c":false,"r":"This damages tissue."}],"i":"Managing bite wounds.","e":"Bites are contaminated by mouth bacteria. Rabies risk is considered, and hand bites carry a high risk of deep infection."},{"id":"T4-81","a":2,"s":"A patient has a posterior hip dislocation after a car crash. Which position is typical?","o":[{"t":"The leg is lengthened and turned out, as in a hip fracture","c":false,"r":"This suggests a hip fracture or anterior dislocation."},{"t":"The leg is shortened, adducted and internally rotated","c":true,"r":""},{"t":"The leg is straight with no rotation or shortening","c":false,"r":"A posterior dislocation changes the leg position, so a straight normal leg is not expected."},{"t":"The leg is bent at the knee and held out sideways","c":false,"r":"The leg is held shortened and turned inward, not bent and held out sideways."}],"i":"Recognizing hip dislocation.","e":"The hip must be reduced in hours to protect blood flow to the femoral head, and the nurse checks the sciatic nerve."},{"id":"T4-82","a":2,"s":"After a knee dislocation that has spontaneously reduced, the pulses are normal. Which injury must be excluded?","o":[{"t":"A popliteal artery injury","c":true,"r":""},{"t":"A tear of the anterior cruciate ligament alone","c":false,"r":"An isolated cruciate tear is common, but the key missed injury after a knee dislocation is the artery."},{"t":"A fracture of the kneecap alone","c":false,"r":"A kneecap fracture is not the injury that must be excluded when pulses are normal after a reduced dislocation."},{"t":"A sprain of the medial collateral ligament","c":false,"r":"A collateral sprain does not carry the limb threat that a popliteal artery injury does."}],"i":"Recognizing vascular injury with knee dislocation.","e":"Intimal injury may not show right away. The ankle brachial index and serial checks or CT angiography are used."},{"id":"T4-83","a":3,"s":"An older adult who takes a beta blocker is bleeding internally but has a normal heart rate of 78. Why can this mislead the nurse?","o":[{"t":"The drug raises the blood pressure during bleeding","c":false,"r":"This is not the issue."},{"t":"The drug blocks the heart rate response to bleeding","c":true,"r":""},{"t":"The drug stops the bleeding from the injured organ","c":false,"r":"This is not correct."},{"t":"The drug causes a fever that hides the bleeding","c":false,"r":"This is not the issue."}],"i":"Recognizing masked shock.","e":"Beta blockers blunt tachycardia. The nurse looks at lactate, base deficit, mental status, and skin and does not rely on heart rate."},{"id":"T4-84","a":3,"s":"An older adult is on warfarin and has a minor head injury. What should be done?","o":[{"t":"Discharge after short observation with no tests","c":false,"r":"This risks delayed bleeding."},{"t":"Obtain a CT scan and check the INR given the bleeding risk","c":true,"r":""},{"t":"Give a larger dose of the drug to thin the blood","c":false,"r":"This raises bleeding risk."},{"t":"Repeat the dose in the morning as ordered","c":false,"r":"This does not manage the risk."}],"i":"Managing head injury on anticoagulants.","e":"Older patients on anticoagulants have a higher risk of intracranial bleeding, including delayed bleeding. Reversal is considered."},{"id":"T4-85","a":3,"s":"Which change in an older adult after trauma is most likely to cause an increase in the risk of delirium?","o":[{"t":"Regular visits by family members and friends daily","c":false,"r":"This helps prevent delirium."},{"t":"Glasses and hearing aids used during the day","c":false,"r":"These help prevent delirium."},{"t":"Pain, infection, sleep loss and some medications","c":true,"r":""},{"t":"A quiet room with the lights lowered at night","c":false,"r":"This helps prevent delirium."}],"i":"Preventing delirium.","e":"Causes are treated, and measures that help orientation are used. Drugs such as benzodiazepines are avoided."},{"id":"T4-86","a":3,"s":"Which vital sign pattern in a 4 year old with abdominal trauma suggests compensated shock?","o":[{"t":"Hypotension with a slow heart rate and flushed skin","c":false,"r":"This is a late sign."},{"t":"Tachycardia with cool limbs and a normal pressure","c":true,"r":""},{"t":"A high pressure with a slow rate and warm limbs","c":false,"r":"This is not shock."},{"t":"Warm pink skin with a calm child and normal rate","c":false,"r":"This is reassuring."}],"i":"Recognizing pediatric shock.","e":"Children maintain pressure until they have lost about 30 percent of their blood volume. Hypotension is late and dangerous."},{"id":"T4-87","a":3,"s":"Which technique best protects the airway and spine of a small child on a standard backboard?","o":[{"t":"Place a pillow under the head of the child","c":false,"r":"This flexes the neck."},{"t":"Leave the head hanging over the edge of the board for comfort","c":false,"r":"This is unsafe."},{"t":"Tilt the board so that the head is high","c":false,"r":"This is not the correct technique."},{"t":"Pad under the torso or use a board with a head cut out","c":true,"r":""}],"i":"Positioning a child.","e":"A child has a large head, which flexes the neck on a flat board. Padding under the torso keeps the spine neutral."},{"id":"T4-88","a":3,"s":"A 2 year old has a suspected fractured femur and is not yet walking. What should be considered?","o":[{"t":"A normal event of play with a simple fall","c":false,"r":"The history may not fit."},{"t":"A fracture from a minor bump in a crib","c":false,"r":"A femur fracture in a child who is not walking needs a high force and cannot be explained by a minor bump."},{"t":"Child abuse, with a report if suspected","c":true,"r":""},{"t":"A pathologic fracture from a common cold","c":false,"r":"A cold does not cause a pathologic fracture."}],"i":"Considering abuse.","e":"A femur fracture in a child who does not walk is highly suspicious. A skeletal survey and a report to protective services follow."},{"id":"T4-89","a":3,"s":"A pregnant patient at 30 weeks is placed supine and becomes hypotensive. What should the nurse do?","o":[{"t":"Place the patient flat on the right side","c":false,"r":"The vena cava is on the right."},{"t":"Lower the head of the bed to flat","c":false,"r":"This is not helpful."},{"t":"Give more oxygen without changing the position","c":false,"r":"The cause is positional."},{"t":"Tilt to the left or displace the uterus to the left","c":true,"r":""}],"i":"Avoiding supine hypotension.","e":"The uterus presses on the vena cava and cuts venous return. Left lateral position corrects this."},{"id":"T4-90","a":3,"s":"Which test best detects a small amount of fetomaternal hemorrhage in a pregnant trauma patient who is Rh negative?","o":[{"t":"The glucose tolerance test","c":false,"r":"This is not used for this."},{"t":"The Kleihauer Betke test","c":true,"r":""},{"t":"The urine culture","c":false,"r":"This is not used for this."},{"t":"The bone density scan","c":false,"r":"This is not used for this."}],"i":"Using the Kleihauer Betke test.","e":"The test estimates fetal cells in the maternal blood, which guides the dose of Rh immune globulin."},{"id":"T4-91","a":3,"s":"A pregnant trauma patient at 28 weeks has vaginal bleeding, a rigid abdomen, and a tender uterus. What is the likely cause?","o":[{"t":"Placental abruption","c":true,"r":""},{"t":"A urinary tract infection","c":false,"r":"This does not match."},{"t":"Normal labor at term","c":false,"r":"The picture is of injury."},{"t":"Placenta previa with painless bleeding","c":false,"r":"Placenta previa causes painless bleeding, while this patient has a rigid and tender uterus."}],"i":"Recognizing abruption.","e":"Blunt trauma can separate the placenta. It is the most common cause of fetal loss in trauma."},{"id":"T4-92","a":3,"s":"A worker has a chemical burn from dry lime powder on the arm. What is the first step?","o":[{"t":"Start flushing at once without first removing the dry powder","c":false,"r":"Water can activate some dry chemicals, so brushing comes first."},{"t":"Brush off dry powder, then flush with large amounts of water","c":true,"r":""},{"t":"Apply a neutralizing acid to the burn","c":false,"r":"This causes heat and further injury."},{"t":"Cover with a dry dressing and transport","c":false,"r":"The chemical stays on the skin."}],"i":"Treating a chemical burn.","e":"Dry powders are brushed off first, then irrigation is done for a long period. Neutralizers are not used."},{"id":"T4-93","a":3,"s":"A patient has an electrical burn from a high voltage line with small skin marks. Which problem is most likely?","o":[{"t":"A mild skin burn that heals without special monitoring","c":false,"r":"The deeper tissue is often injured."},{"t":"Deep muscle damage with rhabdomyolysis and kidney risk","c":true,"r":""},{"t":"A small burn of the hand needing a dry dressing","c":false,"r":"This is unrelated."},{"t":"A mild dehydration that clears with oral fluids","c":false,"r":"This is not the main concern."}],"i":"Recognizing electrical injury.","e":"Current travels through deep tissue. Dark urine, high creatine kinase, and arrhythmia are watched. Fluids keep a high urine output."},{"id":"T4-94","a":3,"s":"Which finding best suggests a deep partial thickness burn?","o":[{"t":"A dry, red, painful area with no blisters that blanches with touch","c":false,"r":"This is a superficial burn."},{"t":"A leathery, painless, charred area","c":false,"r":"This suggests a full thickness burn."},{"t":"A wet, blistered wound that is red or white with less feeling","c":true,"r":""},{"t":"A pink area that blanches and hurts to touch","c":false,"r":"This is a superficial burn."}],"i":"Classifying burn depth.","e":"Deep partial thickness burns often need grafting. Full thickness burns are painless since nerves are destroyed."},{"id":"T4-95","a":3,"s":"A patient was trapped in a house fire. Which finding most strongly suggests an inhalation injury?","o":[{"t":"A burn to the toe with no other findings","c":false,"r":"This does not show airway injury."},{"t":"A normal voice and clear sputum","c":false,"r":"This does not suggest injury."},{"t":"A healed scar on the arm from an old house fire burn","c":false,"r":"This does not suggest injury."},{"t":"Singed nasal hairs, carbonaceous sputum, hoarseness","c":true,"r":""}],"i":"Recognizing inhalation injury.","e":"Swelling of the airway can progress quickly. Early intubation is favored when signs are present."},{"id":"T4-96","a":3,"s":"A bariatric patient is being intubated after trauma. Which positioning helps the most?","o":[{"t":"Flat on the back with the neck flexed forward","c":false,"r":"This worsens the view."},{"t":"Prone with the head turned to one side","c":false,"r":"This is not a position for intubation."},{"t":"Sitting with the head tipped down","c":false,"r":"This is not appropriate."},{"t":"Ramped position, ear level with the sternum","c":true,"r":""}],"i":"Airway care in obesity.","e":"Ramping improves lung volumes, delays desaturation, and aligns the airway axes. Preoxygenation is extended."},{"id":"T4-97","a":3,"s":"A patient presents with injuries at different stages of healing and gives a vague account. Her partner stays in the room and answers for her. What should the nurse do?","o":[{"t":"Ask the partner to explain the injuries to the staff","c":false,"r":"This risks the patient's safety."},{"t":"Confront the partner in the hallway","c":false,"r":"This can increase danger."},{"t":"Interview the patient alone in a private setting","c":true,"r":""},{"t":"Set aside the injuries and treat the chief complaint","c":false,"r":"This misses abuse."}],"i":"Screening for intimate partner violence.","e":"A private setting allows safe disclosure. The nurse documents with care, offers resources, and
