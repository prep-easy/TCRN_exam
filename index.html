 open to contamination, which carries a high risk of sepsis and needs diversion."},{"id":"T5-64","a":1,"s":"Which imaging is best to define a suspected acetabular fracture?","o":[{"t":"A plain film of the abdomen with the patient flat","c":false,"r":"This does not show the hip socket."},{"t":"CT of the pelvis with three dimensional reconstruction","c":true,"r":""},{"t":"An ultrasound of the hip done at the bedside","c":false,"r":"This does not show the hip socket."},{"t":"A bone scan of the pelvis done after three days","c":false,"r":"This does not show the fracture pattern in time."}],"i":"Selecting imaging.","e":"CT shows the fracture pattern for surgical planning and finds associated injuries."},{"id":"T5-65","a":1,"s":"Resuscitative endovascular balloon occlusion of the aorta is used for pelvic hemorrhage. Which zone is the balloon placed in?","o":[{"t":"Zone I, above the celiac artery","c":false,"r":"This zone is used for abdominal bleeding."},{"t":"Zone II, between the celiac and renal arteries","c":false,"r":"This zone is not used for the balloon."},{"t":"Zone III, below the renal arteries","c":true,"r":""},{"t":"The inferior vena cava below the renal veins","c":false,"r":"The aorta is the target, not a vein."}],"i":"Using aortic occlusion.","e":"Zone III placement controls pelvic and junctional bleeding while sparing flow to the kidneys and gut."},{"id":"T5-66","a":1,"s":"After internal iliac artery embolization for a pelvic fracture, which complication should the nurse monitor for?","o":[{"t":"Ischemia of the buttock muscles or skin","c":true,"r":""},{"t":"Numbness of the lower leg and foot from nerve ischemia","c":false,"r":"This is not the typical complication of this procedure."},{"t":"Injury to the cornea from the contrast dye","c":false,"r":"This is unrelated."},{"t":"Thyroid dysfunction from the iodine in the dye","c":false,"r":"This is unrelated."}],"i":"Monitoring after embolization.","e":"Blocking the vessels reduces flow to the gluteal region. Pain, skin changes and weakness are reported."},{"id":"T5-67","a":1,"s":"A patient falls astride a bar and has a perineal hematoma and blood at the urethral meatus. What study should be done before a catheter?","o":[{"t":"A chest x-ray to look for a pneumothorax","c":false,"r":"This does not evaluate the urethra."},{"t":"A blood culture to look for sepsis","c":false,"r":"This does not evaluate the urethra."},{"t":"A retrograde urethrogram","c":true,"r":""},{"t":"A skull series to look for a fracture","c":false,"r":"This does not evaluate the urethra."}],"i":"Evaluating straddle injury.","e":"The bulbar urethra is crushed against the pubis. The urethrogram shows the injury, and blind catheter placement is avoided."},{"id":"T5-68","a":1,"s":"A patient has a complete urethral disruption and cannot void. What is the usual way to drain the bladder?","o":[{"t":"A large urethral catheter passed with extra lubricant","c":false,"r":"This can worsen the tear."},{"t":"A suprapubic catheter placed by the surgeon","c":true,"r":""},{"t":"No drainage until the patient is awake and in a bed","c":false,"r":"The bladder will distend."},{"t":"Fluid restriction until the bladder stops filling","c":false,"r":"This does not solve it."}],"i":"Draining the bladder safely.","e":"The suprapubic route bypasses the injured urethra. Definitive repair is done later."},{"id":"T5-69","a":1,"s":"A CT cystogram after a pelvic fracture shows a bladder that is squeezed into a teardrop shape with no leak of contrast. What does this indicate?","o":[{"t":"An intraperitoneal bladder rupture needing repair","c":false,"r":"A rupture shows contrast outside the bladder, which is absent here."},{"t":"A complete urethral transection of the urethra","c":false,"r":"This would show contrast leaking from the urethra."},{"t":"Compression of the bladder by a pelvic hematoma","c":true,"r":""},{"t":"A normal bladder shape in a filled bladder","c":false,"r":"A teardrop shape is an abnormal finding."}],"i":"Interpreting a cystogram.","e":"Blood around the bladder squeezes it from outside. This is a sign of pelvic bleeding rather than a bladder tear."},{"id":"T5-70","a":2,"s":"A patient has a type II odontoid fracture after a fall. Which statement is correct?","o":[{"t":"The fracture is stable and heals with no support","c":false,"r":"The base of the odontoid has a poor blood supply and heals poorly."},{"t":"The fracture affects the lumbar spine and the pelvis","c":false,"r":"The odontoid process is part of C2."},{"t":"The fracture needs no immobilization of the neck","c":false,"r":"Immobilization is needed to protect the cord."},{"t":"The fracture is unstable and has a high risk of nonunion","c":true,"r":""}],"i":"Recognizing odontoid fractures.","e":"The tip is attached to C1 and the dens is at risk of displacement. Treatment is with a halo or surgery, and older adults are often affected."},{"id":"T5-71","a":2,"s":"A patient has bilateral jumped facets of the cervical spine on CT. What is true about this injury?","o":[{"t":"It is a stable injury that needs a soft collar for comfort","c":false,"r":"Both facets are out of place and the spine has lost its stability."},{"t":"It heals by itself within about two weeks","c":false,"r":"This injury needs reduction and fixation."},{"t":"It is highly unstable with a risk of complete cord injury","c":true,"r":""},{"t":"It affects the muscles of the neck and nothing else","c":false,"r":"The injury involves bone and ligaments."}],"i":"Recognizing facet dislocation.","e":"Bilateral dislocation disrupts all the ligaments. Traction and surgery restore alignment, and neurologic checks are frequent."},{"id":"T5-72","a":2,"s":"A patient has fractures of the transverse processes of L2 and L3 after a fall. Which associated injury should be considered?","o":[{"t":"A fracture of the odontoid process in the neck","c":false,"r":"This is unrelated to the lumbar injury."},{"t":"A tear of the aorta in the neck","c":false,"r":"This is unrelated to the lumbar injury."},{"t":"A fracture of the skull base","c":false,"r":"This is unrelated to the lumbar injury."},{"t":"Renal or other retroperitoneal organ injury","c":true,"r":""}],"i":"Looking for associated injuries.","e":"The transverse processes are stable bone, but a fracture signals strong force. The kidneys lie nearby, so urine and imaging are checked."},{"id":"T5-73","a":2,"s":"Which measurement is commonly used to diagnose compartment syndrome in an obtunded patient?","o":[{"t":"A heart rate of more than 100 beats per minute","c":false,"r":"Heart rate does not measure compartment pressure."},{"t":"A temperature of more than 38 degrees Celsius","c":false,"r":"Fever does not diagnose this condition."},{"t":"A blood glucose of more than 200 mg/dL","c":false,"r":"Glucose does not diagnose this condition."},{"t":"A delta pressure under 30 mmHg","c":true,"r":""}],"i":"Using compartment pressures.","e":"When the difference between diastolic pressure and compartment pressure falls below 30 mmHg, perfusion fails and fasciotomy is considered."},{"id":"T5-74","a":2,"s":"Which sign of compartment syndrome is the latest and least reliable?","o":[{"t":"Absent pulse","c":true,"r":""},{"t":"Pain with passive stretch","c":false,"r":"This is an early sign."},{"t":"Tense swollen limb","c":false,"r":"This is an early sign."},{"t":"Pain out of proportion","c":false,"r":"This is an early sign."}],"i":"Recognizing late signs.","e":"Pulses can be present until the pressure is above arterial pressure. Waiting for pulselessness delays treatment."},{"id":"T5-75","a":2,"s":"Which amputation is the best candidate for replantation?","o":[{"t":"A thumb cut cleanly by a sharp blade","c":true,"r":""},{"t":"A finger crushed and torn off by a roller","c":false,"r":"A crush injury destroys the vessels."},{"t":"A limb with severe contamination and multiple fractures","c":false,"r":"Severe damage lowers the success."},{"t":"A part from a patient who is unstable","c":false,"r":"The patient's life comes first."}],"i":"Selecting replantation candidates.","e":"Clean sharp cuts of the thumb, multiple digits, or the hand in a stable patient have the best result."},{"id":"T5-76","a":2,"s":"A patient with an amputation reports burning pain in the missing foot. Which statement is correct?","o":[{"t":"The pain is imagined and needs no treatment","c":false,"r":"This pain is real."},{"t":"Phantom limb pain is real and treated with nerve acting drugs","c":true,"r":""},{"t":"The pain means the surgery failed and the limb must be revised","c":false,"r":"This is not necessarily true."},{"t":"The pain occurs in older patients and nobody else","c":false,"r":"This pain occurs in all ages."}],"i":"Treating phantom pain.","e":"Gabapentinoids, antidepressants, and mirror therapy help. The nurse believes the patient and treats the pain."},{"id":"T5-77","a":2,"s":"Two days after a femur fracture, a patient is confused and short of breath and has small red spots on the chest and armpits. What is suspected?","o":[{"t":"Fat embolism syndrome","c":true,"r":""},{"t":"A simple allergic reaction","c":false,"r":"This does not explain the combination."},{"t":"A sprain of the ankle","c":false,"r":"This does not explain the signs."},{"t":"Hypoglycemia","c":false,"r":"This does not explain the spots."}],"i":"Recognizing fat embolism.","e":"Marrow fat enters the blood and lodges in the lungs, brain and skin. Early fixation of fractures lowers the risk, and care is supportive."},{"id":"T5-78","a":2,"s":"A child with a supracondylar fracture of the humerus has a weak radial pulse and cannot extend the thumb. What is the concern?","o":[{"t":"A normal finding with these injuries that can be watched at home","c":false,"r":"These findings are not normal."},{"t":"A minor strain that needs no action","c":false,"r":"These signs suggest vascular or nerve injury."},{"t":"A problem with the shoulder alone","c":false,"r":"The injury is at the elbow."},{"t":"Brachial artery and nerve injury needing urgent attention","c":true,"r":""}],"i":"Checking neurovascular status.","e":"The artery and nerves lie close to the break. A pulseless or white hand needs urgent reduction."},{"id":"T5-79","a":2,"s":"A patient has a dirty wound after a fall onto a farm field and has never been vaccinated against tetanus. What is appropriate?","o":[{"t":"A tetanus vaccine alone","c":false,"r":"Immune globulin is added for dirty wounds in unvaccinated patients."},{"t":"Immune globulin alone","c":false,"r":"The patient also needs active vaccination."},{"t":"Tetanus toxoid vaccine and tetanus immune globulin","c":true,"r":""},{"t":"No further treatment since the wound is clean","c":false,"r":"Cleaning does not prevent tetanus."}],"i":"Providing tetanus prophylaxis.","e":"Unvaccinated patients with a dirty wound need both passive and active protection."},{"id":"T5-80","a":2,"s":"A patient has severe pain, rapidly spreading redness, crepitus and a gray wound days after an injury. What is suspected?","o":[{"t":"A superficial skin rash that needs a cream","c":false,"r":"The features suggest deep infection."},{"t":"A healed scar from an old injury at the same site","c":false,"r":"The wound is active."},{"t":"A mild allergic reaction to the dressing from the scene","c":false,"r":"This does not cause crepitus."},{"t":"A necrotizing soft tissue infection needing urgent surgery","c":true,"r":""}],"i":"Recognizing necrotizing infection.","e":"Pain out of proportion and rapid spread suggest deep infection with gas. Antibiotics and surgical debridement are urgent."},{"id":"T5-81","a":2,"s":"After an anterior shoulder dislocation, which nerve should be tested before and after reduction?","o":[{"t":"The sciatic nerve, by testing sensation over the thigh","c":false,"r":"This nerve lies in the leg."},{"t":"The facial nerve, by testing the cheek muscles","c":false,"r":"This nerve lies in the face."},{"t":"The axillary nerve, by testing the lateral deltoid","c":true,"r":""},{"t":"The optic nerve, by testing the vision of the eye","c":false,"r":"This nerve lies in the eye."}],"i":"Checking nerves after dislocation.","e":"The axillary nerve wraps around the surgical neck of the humerus and is the most often injured."},{"id":"T5-82","a":2,"s":"After an elbow dislocation, which assessment is most important before and after reduction?","o":[{"t":"The strength of the knee and the pulse at the foot","c":false,"r":"This is not the priority."},{"t":"The brachial pulse and median and ulnar nerve function","c":true,"r":""},{"t":"The hearing in both ears and the vision of the eyes","c":false,"r":"This is not the priority."},{"t":"The size of the pupils and their reaction to light","c":false,"r":"This is not the priority."}],"i":"Checking neurovascular function.","e":"The brachial artery and these nerves run next to the joint and can be stretched or torn."},{"id":"T5-83","a":3,"s":"A 78 year old patient with long standing hypertension has a blood pressure of 108/60 after a fall with a fractured pelvis. How should this be interpreted?","o":[{"t":"As a normal finding in older adults","c":false,"r":"It may represent a large drop from baseline."},{"t":"As possible shock, since the usual pressure is higher","c":true,"r":""},{"t":"As a sign of mild dehydration that needs oral fluids","c":false,"r":"Blood loss must be considered."},{"t":"As a reason to delay imaging for a day","c":false,"r":"Imaging should proceed."}],"i":"Recognizing shock in older adults.","e":"Older patients may be in shock at pressures called normal in younger patients. Lactate and base deficit are used."},{"id":"T5-84","a":3,"s":"Which analgesic approach is preferred for an older adult with fractures?","o":[{"t":"Large doses of meperidine every four hours as needed","c":false,"r":"This drug causes confusion and seizures."},{"t":"No analgesia at all, to prevent delirium from medicines","c":false,"r":"Untreated pain causes delirium."},{"t":"High dose benzodiazepines for pain and anxiety together","c":false,"r":"These increase the risk of falls and delirium."},{"t":"Multimodal analgesia at low doses, avoiding meperidine","c":true,"r":""}],"i":"Managing pain safely.","e":"Regional blocks, acetaminophen, and low dose opioids give relief with fewer side effects."},{"id":"T5-85","a":3,"s":"Why does a prolonged stay on a rigid backboard carry a high risk for an older adult?","o":[{"t":"Thin skin gets pressure injury quickly","c":true,"r":""},{"t":"Older adults have thick skin that resists pressure","c":false,"r":"Aging thins the skin and the fat."},{"t":"The board prevents a fracture from occurring","c":false,"r":"The board does not prevent fractures."},{"t":"The board has no effect in older people","c":false,"r":"Pressure injury can form within hours."}],"i":"Preventing pressure injury in older adults.","e":"Age reduces the padding and the blood flow in the skin. The board is removed as soon as the spine is protected in another way."},{"id":"T5-86","a":3,"s":"Why is a length based resuscitation tape used for a critically injured child?","o":[{"t":"It measures the blood pressure and heart rate in minutes","c":false,"r":"It does not measure blood pressure."},{"t":"It replaces the need for a monitor on the child","c":false,"r":"It does not replace monitors."},{"t":"It shows the time of injury for the record","c":false,"r":"It does not show time."},{"t":"It estimates weight to choose doses and equipment","c":true,"r":""}],"i":"Using a pediatric tool.","e":"Children vary in size, and weight is rarely known. The tape gives a color zone with doses, tube size and fluid volumes."},{"id":"T5-87","a":3,"s":"In an infant, which response earns a verbal score of 5 on the pediatric GCS?","o":[{"t":"Irritable cry that settles when held","c":false,"r":"This scores a 4."},{"t":"Moans to painful stimuli","c":false,"r":"This scores a 2."},{"t":"Coos and babbles","c":true,"r":""},{"t":"No sound even to pain","c":false,"r":"This scores a 1."}],"i":"Using the pediatric GCS.","e":"A score of 5 describes normal age appropriate sounds. Lower scores follow irritable cry, cries to pain, moans, and none."},{"id":"T5-88","a":3,"s":"When is intraosseous access appropriate for a child in shock?","o":[{"t":"When IV access cannot be obtained quickly","c":true,"r":""},{"t":"After three hours of failed attempts at vein access","c":false,"r":"This delays care."},{"t":"Not in children, because the bone is too soft","c":false,"r":"It is a standard option."},{"t":"In adults alone, because children have small bones","c":false,"r":"It is used in all ages."}],"i":"Using intraosseous access.","e":"The proximal tibia is a common site. Attempts at vein access should not delay fluids and drugs."},{"id":"T5-89","a":3,"s":"How long should fetal monitoring be continued in a pregnant trauma patient at 28 weeks who has minor injury and no complaints?","o":[{"t":"About 10 minutes of tracing","c":false,"r":"This is too short."},{"t":"At least 4 hours of tracing","c":true,"r":""},{"t":"No monitoring if the mother feels well","c":false,"r":"Monitoring is advised for viable pregnancies."},{"t":"About 2 weeks in the hospital","c":false,"r":"This is not needed."}],"i":"Monitoring the fetus.","e":"At least four hours of monitoring finds abruption. Longer monitoring is needed if there are contractions, bleeding, or abnormal tracings."},{"id":"T5-90","a":3,"s":"Why may a pregnant patient lose a large amount of blood before the vital signs change?","o":[{"t":"Blood volume falls in pregnancy, so small losses cause shock","c":false,"r":"Volume increases."},{"t":"Resting heart rate falls in pregnancy so shock is easy to see","c":false,"r":"The rate rises."},{"t":"Pregnancy lowers the risk of bleeding from the uterus","c":false,"r":"It does not."},{"t":"Blood volume increases by about 50 percent in pregnancy","c":true,"r":""}],"i":"Understanding physiologic change.","e":"She can lose 1500 mL before signs appear, but the placenta may be starved of flow earlier."},{"id":"T5-91","a":3,"s":"A pregnant patient at 30 weeks has a cardiac arrest after trauma and resuscitation fails to return circulation. What is recommended?","o":[{"t":"Perform perimortem cesarean within 4 to 5 minutes","c":true,"r":""},{"t":"Wait about 30 minutes for the obstetric team to decide","c":false,"r":"This is too late."},{"t":"Stop all efforts at once, since the fetus cannot survive","c":false,"r":"The mother may benefit from delivery."},{"t":"Give fluids and continue the compressions for an hour","c":false,"r":"This does not address the problem."}],"i":"Performing perimortem delivery.","e":"Emptying the uterus relieves vena cava compression and improves the chance of maternal return of circulation."},{"id":"T5-92","a":3,"s":"A worker spills hydrofluoric acid on the hand. After washing, which treatment is specific?","o":[{"t":"Sodium bicarbonate paste left on the burn for an hour","c":false,"r":"This does not treat the toxin."},{"t":"Ice packs applied for several hours with no other care","c":false,"r":"This does not treat the toxin."},{"t":"Hydrocortisone cream applied twice a day for a week","c":false,"r":"This does not treat the toxin."},{"t":"Calcium gluconate gel or injection","c":true,"r":""}],"i":"Treating hydrofluoric acid burns.","e":"The fluoride ion binds calcium and causes severe pain and hypocalcemia. Calcium is replaced locally and systemically."},{"id":"T5-93","a":3,"s":"Which patient with an electrical injury needs cardiac monitoring?","o":[{"t":"A patient with syncope or an abnormal ECG","c":true,"r":""},{"t":"A patient with a mild tingle and a normal ECG","c":false,"r":"These patients may be discharged."},{"t":"A patient with no symptoms and a normal first ECG","c":false,"r":"These patients may be discharged."},{"t":"A patient with a minor skin mark and a normal ECG","c":false,"r":"These patients may be discharged."}],"i":"Selecting patients for monitoring.","e":"Arrhythmia is the main early cause of death. Those with loss of consciousness or an abnormal ECG are monitored for at least a day."},{"id":"T5-94","a":3,"s":"An adult has burns to the entire left arm and the entire front of the trunk. Which total body surface area is burned?","o":[{"t":"9 percent","c":false,"r":"This is the arm alone."},{"t":"27 percent","c":true,"r":""},{"t":"18 percent","c":false,"r":"This is the trunk alone."},{"t":"36 percent","c":false,"r":"This is too high."}],"i":"Estimating burn size.","e":"In the rule of nines, an arm is 9 percent and the front of the trunk is 18 percent. The total is 27 percent."},{"id":"T5-95","a":3,"s":"A patient rescued from a closed room fire has a headache and confusion and an oxygen saturation of 99 percent. What is the best treatment?","o":[{"t":"Room air since the saturation is normal","c":false,"r":"The reading cannot tell carbon monoxide from oxygen."},{"t":"A low flow of oxygen by nasal cannula","c":false,"r":"This does not clear the carbon monoxide quickly."},{"t":"No treatment until a blood test returns","c":false,"r":"Treatment should not wait."},{"t":"100 percent oxygen by a mask","c":true,"r":""}],"i":"Treating carbon monoxide poisoning.","e":"Carbon monoxide binds hemoglobin and is cleared faster with high oxygen. A co oximeter measures the level."},{"id":"T5-96","a":3,"s":"Which statement about abdominal assessment in a patient with obesity after trauma is correct?","o":[{"t":"The exam is less reliable, so the threshold for imaging is lower","c":true,"r":""},{"t":"The physical exam is more reliable than in other patients","c":false,"r":"Fat tissue limits the exam."},{"t":"Imaging is not needed because the exam is reliable in these patients","c":false,"r":"Imaging is often needed."},{"t":"Ultrasound is perfect in patients with obesity","c":false,"r":"Ultrasound is limited."}],"i":"Assessing patients with obesity.","e":"Fat tissue hides tenderness and limits ultrasound views. CT is used more liberally, and table limits are checked."},{"id":"T5-97","a":3,"s":"A patient says she was choked by her partner and has a hoarse voice and petechiae. What is the key concern?","o":[{"t":"No concern since the injuries are small and heal quickly","c":false,"r":"Strangulation injuries can be hidden."},{"t":"A skin bruise that needs routine care","c":false,"r":"Deep injuries are possible."},{"t":"A throat infection that needs oral antibiotics","c":false,"r":"This does not fit the history."},{"t":"Possible carotid or vertebral artery injury","c":true,"r":""}],"i":"Evaluating strangulation.","e":"Strangulation causes hidden vessel and airway injury and is a strong predictor of later homicide. A safety plan and advocate are offered."},{"id":"T5-98","a":3,"s":"A nurse suspects that a child's fracture was caused by abuse but has no proof. What is the legal duty?","o":[{"t":"Report to child protective services on reasonable suspicion","c":true,"r":""},{"t":"Wait until proof is found of the abuse","c":false,"r":"Proof is not required."},{"t":"Confront the parents and ask them to confess","c":false,"r":"This can endanger the child."},{"t":"Take no action, since the family has not asked for help","c":false,"r":"Nurses are mandated reporters."}],"i":"Reporting suspected abuse.","e":"The law requires a report on reasonable suspicion. Investigators determine the facts."},{"id":"T5-99","a":3,"s":"Which step in the chain of custody is correct for the clothing of an assault victim?","o":[{"t":"Place wet clothing in a sealed plastic bag to keep it fresh","c":false,"r":"Moisture damages evidence."},{"t":"Throw the clothing away to protect the privacy of the patient","c":false,"r":"This destroys evidence."},{"t":"Wash the clothing before storage in a locker","c":false,"r":"This destroys evidence."},{"t":"Separate paper bags, labeled, with each handler documented","c":true,"r":""}],"i":"Preserving evidence.","e":"Paper lets the clothing dry. A signed log shows that the evidence was never altered."},{"id":"T5-100","a":3,"s":"A patient arrives with a self inflicted gunshot wound to the abdomen and is stabilized. Which safety step follows?","o":[{"t":"Start suicide precautions with constant observation","c":true,"r":""},{"t":"Leave the patient alone in a quiet room to rest after surgery","c":false,"r":"The patient remains at high risk."},{"t":"Discharge once the wound is closed and the patient is stable","c":false,"r":"The patient needs evaluation."},{"t":"Give no sedation and no support to the patient or family","c":false,"r":"The patient needs care."}],"i":"Caring for self inflicted injury.","e":"A patient who has harmed himself remains at risk of another attempt. Observation and mental health care are part of the plan."},{"id":"T5-101","a":3,"s":"A diabetic patient on insulin is brought in confused after a crash. Which test should be done first?","o":[{"t":"A skull x-ray","c":false,"r":"This is not the first test."},{"t":"A urine drug screen","c":false,"r":"This is not the first test."},{"t":"A hip x-ray","c":false,"r":"This is not the first test."},{"t":"A bedside glucose","c":true,"r":""}],"i":"Checking glucose.","e":"Hypoglycemia causes confusion and may cause the crash. It is easy to test and treat, so it is checked at once."},{"id":"T5-102","a":3,"s":"A patient on hemodialysis has an arteriovenous fistula in the left arm. Where should the blood pressure cuff and IV be placed?","o":[{"t":"In the right arm, away from the fistula arm","c":true,"r":""},{"t":"In the fistula arm, below the elbow, since the veins are large","c":false,"r":"This can damage the fistula."},{"t":"On the same side as the fistula arm","c":false,"r":"This can damage the fistula."},{"t":"Around the fistula at the elbow crease","c":false,"r":"This can damage the fistula."}],"i":"Protecting the fistula.","e":"Pressure or needles can clot or damage the access. The arm is marked and protected."},{"id":"T5-103","a":3,"s":"A patient who used methamphetamine is agitated, has a temperature of 40 degrees Celsius and a heart rate of 150. What is the first line drug?","o":[{"t":"A benzodiazepine, with cooling measures","c":true,"r":""},{"t":"A beta blocker alone to slow the heart rate","c":false,"r":"This can worsen hypertension."},{"t":"An antipsychotic that lowers the seizure threshold","c":false,"r":"Drugs like this can raise the temperature and risk seizures."},{"t":"No treatment, since the effects wear off in hours","c":false,"r":"The patient is at risk."}],"i":"Managing stimulant toxicity.","e":"Benzodiazepines lower agitation, heart rate and temperature. Cooling and fluids prevent complications."},{"id":"T5-104","a":3,"s":"A patient with a high blood alcohol level has a depressed level of consciousness after a fall. What is the correct approach?","o":[{"t":"Assume intoxication and let the patient sleep it off","c":false,"r":"A brain bleed or hypoglycemia could be missed."},{"t":"Discharge once the patient can walk without help","c":false,"r":"Alcohol can mask serious injury."},{"t":"Evaluate for head injury, not alcohol alone","c":true,"r":""},{"t":"Give fluids and observe the patient at home","c":false,"r":"The patient still needs a full evaluation."}],"i":"Avoiding anchoring on alcohol.","e":"Intoxication hides signs of injury. The exam, glucose check and imaging continue as for any patient with a depressed consciousness."},{"id":"T5-105","a":4,"s":"A patient with facial trauma has gurgling respirations and blood in the mouth during the primary survey. What is the first airway action?","o":[{"t":"Suction the airway and do a jaw thrust with spine care","c":true,"r":""},{"t":"Insert a nasal airway through the blood and wait for swelling","c":false,"r":"A nasal airway is risky with midface trauma and does not clear the blood."},{"t":"Tilt the head back to open the airway","c":false,"r":"Neck extension is unsafe with possible spine injury."},{"t":"Give a fluid bolus and recheck in ten minutes","c":false,"r":"Airway problems must be fixed before circulation."}],"i":"Managing the airway in the primary survey.","e":"Airway comes first after hemorrhage control. Suction clears blood, and a jaw thrust opens the airway without moving the neck."},{"id":"T5-106","a":4,"s":"During the exposure step of the primary survey, which nursing action is most important after the patient is fully undressed?","o":[{"t":"Leave the patient uncovered to allow frequent inspection","c":false,"r":"Exposure to the room causes heat loss and worsens bleeding."},{"t":"Apply ice packs to bruised areas of the body","c":false,"r":"Cold worsens the risk of hypothermia."},{"t":"Delay warming until all imaging is complete","c":false,"r":"Warming should begin at once."},{"t":"Cover with warm blankets and use warmed fluids","c":true,"r":""}],"i":"Preventing hypothermia.","e":"Patients must be exposed to find injuries, then covered. Heat loss feeds the lethal triad, so warmers and warm fluids are started early."},{"id":"T5-107","a":4,"s":"Why is the last oral intake included in the AMPLE history of the secondary survey?","o":[{"t":"It affects aspiration risk and sedation timing","c":true,"r":""},{"t":"It shows whether the patient has an allergy","c":false,"r":"Allergies are a separate item in the history."},{"t":"It predicts the blood type and the need for transfusion","c":false,"r":"Diet does not affect the blood type."},{"t":"It shows how long the patient was unconscious","c":false,"r":"It does not measure this."}],"i":"Using the AMPLE history.","e":"A full stomach raises the risk of vomiting during anesthesia. The history also covers allergies, medications, past illness and events."},{"id":"T5-108","a":4,"s":"A patient who has received 12 units of stored red cells develops peaked T waves and a wide QRS complex. Which complication is likely?","o":[{"t":"Hyperkalemia from potassium in stored blood","c":true,"r":""},{"t":"Hypokalemia from dilution of potassium by the plasma","c":false,"r":"This causes flat T waves, not peaked T waves."},{"t":"Hyponatremia from the saline in the units","c":false,"r":"This does not cause peaked T waves."},{"t":"Hypoglycemia from the sugar in the donor blood","c":false,"r":"This does not cause these ECG changes."}],"i":"Recognizing complications of transfusion.","e":"Stored cells leak potassium, and acidosis and kidney injury worsen the load. Calcium protects the heart, and insulin with glucose shifts potassium."},{"id":"T5-109","a":4,"s":"Which tool gives a rapid whole blood view of clot formation to guide product replacement in a bleeding trauma patient?","o":[{"t":"A chest x-ray taken at the bedside after each unit","c":false,"r":"This does not assess clotting."},{"t":"Viscoelastic testing such as thromboelastography","c":true,"r":""},{"t":"A serum amylase level drawn every six hours","c":false,"r":"This does not assess clotting."},{"t":"A urine dipstick checked for blood every hour","c":false,"r":"This does not assess clotting."}],"i":"Guiding coagulation therapy.","e":"These tests show clot strength and breakdown within minutes. They help decide whether plasma, platelets, fibrinogen or antifibrinolytics are needed."},{"id":"T5-110","a":4,"s":"During damage control resuscitation, what blood pressure goal is accepted until bleeding is controlled in a patient without a brain injury?","o":[{"t":"A systolic pressure of about 80 to 90 mmHg","c":true,"r":""},{"t":"A systolic pressure above 160 mmHg","c":false,"r":"High pressure increases bleeding."},{"t":"A systolic pressure of 50 mmHg","c":false,"r":"This is too low for organ perfusion."},{"t":"A normal pressure restored by large fluid boluses","c":false,"r":"This dilutes clotting factors and disrupts clots."}],"i":"Using permissive hypotension.","e":"A lower pressure limits bleeding and clot disruption. It is not used with brain or spinal injury, where perfusion must be maintained."},{"id":"T5-111","a":4,"s":"What is the primary treatment of metabolic acidosis in a patient with hemorrhagic shock?","o":[{"t":"Give large doses of sodium bicarbonate to raise the pH","c":false,"r":"Bicarbonate is not routinely recommended and does not fix the cause."},{"t":"Restore perfusion by controlling bleeding and giving blood","c":true,"r":""},{"t":"Restrict all intravenous fluids and blood","c":false,"r":"The patient needs volume replacement."},{"t":"Increase the sedation to lower the oxygen demand of the body","c":false,"r":"This does not correct the acid."}],"i":"Treating acidosis.","e":"Acidosis comes from poor tissue perfusion and lactate. Reversing shock clears it, and a low pH worsens clotting and heart function."},{"id":"T5-112","a":4,"s":"A patient receiving massive transfusion has an ionized calcium of 0.8 mmol/L. What is the appropriate treatment?","o":[{"t":"Give more citrate to bind the extra potassium","c":false,"r":"Citrate lowers the calcium further."},{"t":"Give intravenous calcium chloride or calcium gluconate","c":true,"r":""},{"t":"Restrict all fluids until the calcium rises by itself","c":false,"r":"This does not correct calcium."},{"t":"Give a potassium infusion over the hour","c":false,"r":"This does not correct calcium."}],"i":"Correcting hypocalcemia.","e":"Citrate in stored blood binds calcium, which is needed for clotting and cardiac contraction."},{"id":"T5-113","a":4,"s":"A hypotensive trauma patient with a shock index of 1.2 needs intubation. What is done before induction?","o":[{"t":"Resuscitate with blood and reduce the induction dose","c":true,"r":""},{"t":"Intubate at once using the full dose of propofol","c":false,"r":"Induction drugs can cause collapse in shock."},{"t":"Delay all resuscitation until the tube is in the airway","c":false,"r":"Intubation in shock can cause arrest."},{"t":"Give a large dose of a sedative to calm the patient","c":false,"r":"This lowers the pressure further."}],"i":"Optimizing before intubation.","e":"Positive pressure and sedatives lower venous return and tone. Resuscitate first, then intubate."},{"id":"T5-114","a":4,"s":"Which method helps maintain oxygenation during laryngoscopy in a patient who is hard to oxygenate?","o":[{"t":"Removing the oxygen supply during the attempt","c":false,"r":"Oxygen is needed for the whole attempt."},{"t":"Apneic oxygenation by nasal cannula at 15 L per minute","c":true,"r":""},{"t":"Hyperventilating the patient with a bag before the attempt","c":false,"r":"This does not extend the safe apnea time."},{"t":"Placing the patient flat with no preoxygenation","c":false,"r":"This shortens the time to desaturation."}],"i":"Extending safe apnea time.","e":"Oxygen flows into the lungs as oxygen is absorbed, which delays desaturation. Preoxygenation with a tight mask comes first."},{"id":"T5-115","a":4,"s":"A patient has a heart rate of 130, a blood pressure of 90/60, a respiratory rate of 32 and is confused. Which class of hemorrhage is this?","o":[{"t":"Class I, with a loss of under 15 percent of blood volume","c":false,"r":"Class I has near normal vital signs."},{"t":"Class II, with a loss of 15 to 30 percent of blood volume","c":false,"r":"Class II has a normal pressure and mild changes."},{"t":"Class IV, with a loss of over 40 percent and very low pressure","c":false,"r":"Class IV has a very low pressure and a lethargic patient."},{"t":"Class III, with a loss of about 30 to 40 percent of blood volume","c":true,"r":""}],"i":"Classifying hemorrhage.","e":"Class III shows a fall in pressure, a fast pulse and confusion. Blood products are needed."},{"id":"T5-116","a":4,"s":"Which laboratory values best show ongoing hypoperfusion in a patient who has bled?","o":[{"t":"A normal lactate and a normal base deficit on repeat tests","c":false,"r":"These show good perfusion."},{"t":"An elevated lactate and a worsening base deficit","c":true,"r":""},{"t":"A low white cell count seen on the blood film","c":false,"r":"This does not measure perfusion."},{"t":"A high platelet count seen on the first sample","c":false,"r":"This does not measure perfusion."}],"i":"Using markers of shock.","e":"Anaerobic metabolism raises lactate and base deficit, and these values can show shock even when pressure looks normal."},{"id":"T5-117","a":4,"s":"Which finding separates a tension pneumothorax from cardiac tamponade in a patient with low blood pressure and distended neck veins?","o":[{"t":"Muffled heart sounds with clear lungs and distended veins","c":false,"r":"This fits tamponade."},{"t":"A narrow pulse pressure with low blood pressure","c":false,"r":"Both can show this."},{"t":"Absent breath sounds on one side with tracheal shift","c":true,"r":""},{"t":"A fast heart rate with distended neck veins","c":false,"r":"Both can show this."}],"i":"Distinguishing obstructive causes.","e":"Both have distended veins and low pressure. Tension pneumothorax has absent breath sounds on the affected side, while tamponade has clear lungs and muffled heart sounds."},{"id":"T5-118","a":4,"s":"Which bladder pressure with new organ dysfunction defines abdominal compartment syndrome?","o":[{"t":"Below 5 mmHg on repeated measurements","c":false,"r":"This is normal."},{"t":"A sustained pressure above 20 mmHg","c":true,"r":""},{"t":"Exactly 10 mmHg for one reading","c":false,"r":"This is mild."},{"t":"Below 12 mmHg with a normal urine output","c":false,"r":"This is not diagnostic."}],"i":"Defining abdominal compartment syndrome.","e":"High abdominal pressure impairs venous return, kidney flow and breathing. Decompression is the treatment."},{"id":"T5-119","a":4,"s":"A patient on long term prednisone has refractory hypotension after a major injury, despite fluids and vasopressors. Which drug should be considered?","o":[{"t":"Hydrocortisone for adrenal insufficiency","c":true,"r":""},{"t":"A higher dose of a beta blocker to slow the pulse","c":false,"r":"This lowers the pressure."},{"t":"An antiviral drug started at a high dose for a week","c":false,"r":"This does not treat adrenal crisis."},{"t":"A diuretic to remove fluid and raise the pressure","c":false,"r":"This reduces volume."}],"i":"Treating adrenal crisis.","e":"Long term steroid use suppresses the adrenal glands. Stress from injury needs more steroid than the body can make."},{"id":"T5-120","a":4,"s":"A patient with a blunt cardiac injury has a low cardiac output and a pressure of 80/50. Which drug improves contractility?","o":[{"t":"Large boluses of saline to fill the heart and raise output","c":false,"r":"These can worsen pulmonary edema."},{"t":"Dobutamine, with norepinephrine if the pressure remains low","c":true,"r":""},{"t":"A beta blocker to slow the heart rate","c":false,"r":"This reduces contractility."},{"t":"A calcium channel blocker to relax the vessels","c":false,"r":"This reduces contractility."}],"i":"Supporting cardiac output.","e":"An inotrope strengthens the contraction. A vasopressor is added to support the blood pressure."},{"id":"T5-121","a":4,"s":"How often should vital signs be reassessed in an unstable trauma patient?","o":[{"t":"Every 4 hours, since the patient is monitored","c":false,"r":"This is too infrequent."},{"t":"Once each shift, unless the patient is in pain","c":false,"r":"This is too infrequent."},{"t":"Continuously or about every 5 minutes, watching trends","c":true,"r":""},{"t":"When the family reports a new symptom to staff","c":false,"r":"Patients in shock may not complain."}],"i":"Reassessing the unstable patient.","e":"Early signs of change appear in trends. Frequent checks allow quick response to bleeding or failure."},{"id":"T5-122","a":4,"s":"Six hours after a transfusion, a patient has dyspnea, hypertension, a raised jugular venous pressure, and a high BNP. The symptoms improve with a diuretic. What is the diagnosis?","o":[{"t":"Transfusion related acute lung injury","c":false,"r":"This usually has low pressure and a normal BNP."},{"t":"A hemolytic reaction with fever and flank pain","c":false,"r":"This has different signs."},{"t":"Transfusion associated circulatory overload","c":true,"r":""},{"t":"Sepsis from a contaminated unit","c":false,"r":"This presents with fever and hypotension."}],"i":"Distinguishing TACO from TRALI.","e":"The patient has too much volume. Slower rates, diuretics and careful use of products prevent it."},{"id":"T5-123","a":4,"s":"Which injuries are most commonly found on a tertiary survey?","o":[{"t":"Extremity fractures and hand injuries missed earlier","c":true,"r":""},{"t":"Skull fractures and bleeding seen on the first CT","c":false,"r":"These are usually found early."},{"t":"Tension pneumothorax with a shifted trachea","c":false,"r":"This is found in the primary survey."},{"t":"Cardiac arrest during the first hour of care","c":false,"r":"This is not a missed finding."}],"i":"Knowing what the tertiary survey finds.","e":"Sedation, distraction and the focus on life threats hide small injuries. A repeat exam in 24 hours finds them."},{"id":"T5-124","a":4,"s":"Which PaO2 to FiO2 ratio defines severe ARDS?","o":[{"t":"100 or less with PEEP","c":true,"r":""},{"t":"Above 400 with PEEP of 5","c":false,"r":"This is normal."},{"t":"About 300 with PEEP of 5","c":false,"r":"This is mild."},{"t":"About 250 with PEEP of 5","c":false,"r":"This is mild to moderate."}],"i":"Classifying ARDS.","e":"Mild is 200 to 300, moderate is 100 to 200, and severe is 100 or less, with at least 5 cm H2O of PEEP."},{"id":"T5-125","a":4,"s":"Which bundle element reduces central line infection when a line is inserted?","o":[{"t":"Povidone dressing with no cap or gown","c":false,"r":"Maximal barrier is needed."},{"t":"Chlorhexidine skin preparation and maximal sterile barriers","c":true,"r":""},{"t":"Routine line change every day to prevent growth of bacteria","c":false,"r":"This increases the risk."},{"t":"Insertion at the groin in all patients","c":false,"r":"The site should be chosen to lower infection risk."}],"i":"Preventing CLABSI.","e":"A checklist, hand hygiene, full barrier, and daily review of the need for the line reduce infection."},{"id":"T5-126","a":4,"s":"Which measure best prevents catheter associated urinary tract infection?","o":[{"t":"Change the catheter every day to keep it clean","c":false,"r":"This introduces bacteria."},{"t":"Irrigate the bladder routinely with antibiotic solution","c":false,"r":"This increases the risk."},{"t":"Disconnect the bag to collect the samples","c":false,"r":"This breaks the closed system."},{"t":"Remove the catheter as soon as it is not needed","c":true,"r":""}],"i":"Preventing CAUTI.","e":"The longer the catheter stays, the higher the risk. A daily review and nurse led removal protocols help."},{"id":"T5-127","a":4,"s":"Which findings confirm delirium on the CAM ICU?","o":[{"t":"A stable course with full attention and clear thinking","c":false,"r":"This does not describe delirium."},{"t":"Slow and steady improvement in thinking and attention","c":false,"r":"This does not describe delirium."},{"t":"Fluctuation with inattention and disordered thinking","c":true,"r":""},{"t":"Sleep at night with a calm mood and normal alertness by day","c":false,"r":"This is normal."}],"i":"Screening for delirium.","e":"Delirium is a medical emergency and the cause is sought, including pain, infection, drugs and withdrawal."},{"id":"T5-128","a":4,"s":"Which action best helps a family during the first hours after a major trauma?","o":[{"t":"Ask the family to wait outside without information","c":false,"r":"This increases distress."},{"t":"Assign one contact person for regular updates","c":true,"r":""},{"t":"Give different information from each staff member","c":false,"r":"This causes confusion."},{"t":"Avoid talking to the family until the patient is awake","c":false,"r":"Families need honest updates."}],"i":"Supporting families.","e":"A named contact, a quiet space and social work help families cope and make decisions."},{"id":"T5-129","a":4,"s":"A patient with a brain injury at Rancho level IV is agitated and confused. Which approach is best?","o":[{"t":"A calm, low stimulation environment with a consistent routine","c":true,"r":""},{"t":"A crowded noisy room to keep the patient alert","c":false,"r":"Overstimulation worsens agitation."},{"t":"Physical restraints at all times to keep the patient safe","c":false,"r":"These increase agitation and risk."},{"t":"Frequent visits from many people to orient the patient","c":false,"r":"These increase confusion."}],"i":"Caring for agitated brain injury patients.","e":"Limited stimulation, redirection and safety measures work best."},{"id":"T5-130","a":4,"s":"Which approach is recommended when a family asks to be present during resuscitation?","o":[{"t":"Refuse in each case, since families are harmed by what they see","c":false,"r":"Presence is supported when it is safe."},{"t":"Offer presence with a staff member assigned to support the family","c":true,"r":""},{"t":"Allow it with no support for the family","c":false,"r":"Families need a guide."},{"t":"Ask the family to give up their place","c":false,"r":"This is not family centered."}],"i":"Supporting family presence.","e":"Many families find it helps with grief. A facilitator explains events and can escort them out if needed."},{"id":"T5-131","a":4,"s":"Which statement about palliative care in the trauma setting is correct?","o":[{"t":"It is for patients who are dying in the next hour","c":false,"r":"It can begin early."},{"t":"It means that all treatments must stop right away","c":false,"r":"It does not require stopping care."},{"t":"It is given at home after the patient is discharged","c":false,"r":"It can be given in the hospital."},{"t":"It can be given alongside life prolonging treatments","c":true,"r":""}],"i":"Understanding palliative care.","e":"The focus is relief of symptoms and support for patient and family, with goals of care discussions."},{"id":"T5-132","a":4,"s":"During an apnea test for brain death, which result is positive for apnea?","o":[{"t":"Breathing effort with a PaCO2 of 40 mmHg","c":false,"r":"The patient is breathing."},{"t":"No breathing with a PaCO2 of 35 mmHg after five minutes","c":false,"r":"The carbon dioxide has not risen enough."},{"t":"No breathing effort with a PaCO2 of at least 60 mmHg","c":true,"r":""},{"t":"A fast breathing rate with a PaCO2 of 60 mmHg","c":false,"r":"This is a respiratory effort."}],"i":"Interpreting the apnea test.","e":"The test shows that the brainstem does not respond to a strong stimulus to breathe."},{"id":"T5-133","a":4,"s":"Which action is an example of tertiary prevention?","o":[{"t":"A law that requires helmets for motorcycle riders","c":false,"r":"This is primary prevention."},{"t":"A school program that teaches safe driving habits","c":false,"r":"This is primary prevention."},{"t":"Rehabilitation to reduce disability after injury","c":true,"r":""},{"t":"A public campaign about wearing seat belts","c":false,"r":"This is primary prevention."}],"i":"Classifying prevention.","e":"Primary prevents the injury, secondary reduces its severity, and tertiary limits long term disability."},{"id":"T5-134","a":4,"s":"Which prehospital action is recommended for a patient with a suspected unstable pelvic fracture?","o":[{"t":"Apply a pelvic binder over the greater trochanters","c":true,"r":""},{"t":"Rock the pelvis from side to side to test for stability","c":false,"r":"Repeated stress on the pelvis can dislodge clots and restart bleeding."},{"t":"Place the patient in a seated position for transport","c":false,"r":"This increases pelvic movement and bleeding."},{"t":"Delay transport until the pelvic x-ray is available","c":false,"r":"Films are not taken in the field and delay care."}],"i":"Stabilizing the pelvis in the field.","e":"A binder reduces pelvic volume and bleeding. The patient is moved as a unit to the trauma center."},{"id":"T5-135","a":4,"s":"Which patient benefits most from air medical transport to a trauma center?","o":[{"t":"A patient with minor injuries and a short ground trip","c":false,"r":"Ground is faster and enough."},{"t":"A patient with a small cut on the hand","c":false,"r":"This is not needed."},{"t":"A critically injured patient far from the center by ground","c":true,"r":""},{"t":"A stable patient with a sprained ankle","c":false,"r":"This is not needed."}],"i":"Choosing transport mode.","e":"Air transport saves time when the ground trip is long, and it brings advanced care."},{"id":"T5-136","a":4,"s":"Which staff member should accompany a critically ill ventilated patient to CT?","o":[{"t":"A volunteer from the lobby who has no clinical training","c":false,"r":"The patient could deteriorate."},{"t":"No one, since the scan is brief","c":false,"r":"This is unsafe."},{"t":"A transport aide who does not manage the airway","c":false,"r":"This is unsafe."},{"t":"A critical care nurse or provider with monitoring","c":true,"r":""}],"i":"Staffing intrafacility transport.","e":"Skilled staff manage the airway and respond to change."},{"id":"T5-137","a":4,"s":"Which items should be sent with a patient being transferred to a trauma center?","o":[{"t":"The patient's valuables and the clothing from the room","c":false,"r":"These are not the needed items."},{"t":"Nothing, since the center will repeat all tests","c":false,"r":"This wastes time."},{"t":"Records, images, consent, and the acceptance","c":true,"r":""},{"t":"A verbal report with no records and no images","c":false,"r":"This is unsafe."}],"i":"Preparing transfer records.","e":"Records and images prevent repeat studies, and the acceptance confirms a bed and service."},{"id":"T5-138","a":4,"s":"Which instruction should be given to a patient discharged with a new arm cast?","o":[{"t":"Cover the cast with a tight elastic wrap for support","c":false,"r":"This can cause swelling and compartment problems."},{"t":"Use a sharp object to scratch under the cast","c":false,"r":"This breaks the skin."},{"t":"Elevate the arm and return for numbness or pain","c":true,"r":""},{"t":"Dismiss tingling since it is normal after a cast","c":false,"r":"This may signal a problem."}],"i":"Teaching cast care.","e":"Swelling can compress nerves and vessels. Early warning signs need quick return."},{"id":"T5-139","a":4,"s":"A patient who speaks little English is being discharged. Which action is correct for teaching?","o":[{"t":"Ask a young child in the family to translate","c":false,"r":"This is inappropriate."},{"t":"Use a stranger from the waiting room who speaks the language","c":false,"r":"This breaches privacy."},{"t":"Skip the teaching and give a printed sheet in English","c":false,"r":"This is unsafe."},{"t":"Use a qualified medical interpreter","c":true,"r":""}],"i":"Overcoming language barriers.","e":"Qualified interpreters give accurate teaching and protect privacy."},{"id":"T5-140","a":4,"s":"Which assessment best confirms home readiness for a patient who will use a wheelchair after discharge?","o":[{"t":"A home safety evaluation by occupational therapy","c":true,"r":""},{"t":"Asking the patient whether the house is a nice place to live","c":false,"r":"This does not assess safety."},{"t":"Checking the weather forecast for the first week","c":false,"r":"This is not related."},{"t":"No assessment, since the patient will manage at home","c":false,"r":"This is unsafe."}],"i":"Assessing the home.","e":"Stairs, doors and bathrooms may need changes, and equipment must be ready before discharge."},{"id":"T5-141","a":5,"s":"In START triage, a patient cannot walk, has a respiratory rate of 24, a normal capillary refill and follows commands. Which category applies?","o":[{"t":"Immediate, red","c":false,"r":"The criteria for this category are not met."},{"t":"Minor, green","c":false,"r":"The patient cannot walk."},{"t":"Delayed, yellow","c":true,"r":""},{"t":"Expectant, black","c":false,"r":"The patient is breathing."}],"i":"Applying START triage.","e":"The patient is injured but stable enough to wait. Red is used for respiratory rate over 30, poor perfusion or inability to follow commands."},{"id":"T5-142","a":5,"s":"After a radiation incident, which step removes most of the external contamination from patients?","o":[{"t":"Removing their clothing and bagging it","c":true,"r":""},{"t":"Giving them water to drink to flush out the contaminant","c":false,"r":"This does not remove external contamination."},{"t":"Placing them in a warm blanket before removing anything","c":false,"r":"This traps the contamination."},{"t":"Taking blood tests first to measure the radiation dose","c":false,"r":"This delays the decontamination."}],"i":"Decontaminating after radiation.","e":"Clothing removal can remove about 90 percent of the contamination. A shower follows if needed."},{"id":"T5-143","a":5,"s":"Which process helps ensure that trauma registry data are accurate?","o":[{"t":"Entering data from memory at the end of the year","c":false,"r":"This reduces accuracy."},{"t":"Allowing staff to enter data with no training or checks","c":false,"r":"Training is needed."},{"t":"Leaving blank fields without follow up","c":false,"r":"Missing data lowers accuracy."},{"t":"Regular validation audits and inter rater reliability checks","c":true,"r":""}],"i":"Ensuring data quality.","e":"Trained registrars follow definitions, and audits show whether coding is consistent."},{"id":"T5-144","a":5,"s":"Which measure best follows long term outcomes of trauma patients?","o":[{"t":"The day of the week of the injury and the arrival time","c":false,"r":"This does not measure outcome."},{"t":"The brand of the ambulance that brought the patient","c":false,"r":"This does not measure outcome."},{"t":"Patient reported function and quality of life","c":true,"r":""},{"t":"The color of the wristband applied on arrival","c":false,"r":"This does not measure outcome."}],"i":"Following outcomes.","e":"Long term follow up shows the effect of injury and care on function and return to work."},{"id":"T5-145","a":5,"s":"Which type of evidence is generally the highest level?","o":[{"t":"An expert opinion from a respected senior trauma surgeon","c":false,"r":"This is a lower level."},{"t":"A single case report from one patient","c":false,"r":"This is a lower level."},{"t":"A personal experience of a nurse","c":false,"r":"This is a lower level."},{"t":"A systematic review of randomized controlled trials","c":true,"r":""}],"i":"Ranking evidence.","e":"Combining trials reduces bias and gives the strongest basis for practice."},{"id":"T5-146","a":5,"s":"Which type of debriefing reviews team performance right after a resuscitation?","o":[{"t":"A cold debrief a month later","c":false,"r":"This is held later."},{"t":"An annual review","c":false,"r":"This is held later."},{"t":"A hot debrief","c":true,"r":""},{"t":"No debrief","c":false,"r":"This is not a type."}],"i":"Using debriefs.","e":"Hot debriefs are brief and held soon after the event to capture learning."},{"id":"T5-147","a":5,"s":"Which statement belongs in the Background part of an SBAR report?","o":[{"t":"The blood pressure is now 82 over 50 and falling","c":false,"r":"This is the situation or assessment."},{"t":"I would like you to come to the bedside to assess","c":false,"r":"This is the recommendation."},{"t":"Admitted this morning with a splenic laceration","c":true,"r":""},{"t":"I think the patient is bleeding from the spleen","c":false,"r":"This is the assessment."}],"i":"Using SBAR.","e":"Background gives context such as the history, the diagnosis and the care so far."},{"id":"T5-148","a":5,"s":"Where should an incident report be documented?","o":[{"t":"In the patient chart with the words incident report","c":false,"r":"Reports are kept separate."},{"t":"On a social media page so that nurses can learn from it","c":false,"r":"This is a breach of privacy."},{"t":"Nowhere, since the event did not harm the patient","c":false,"r":"Events must be reported."},{"t":"In the incident system, not in the medical record","c":true,"r":""}],"i":"Reporting events.","e":"The chart holds the facts of care. The incident system is used for quality review."},{"id":"T5-149","a":5,"s":"A neighbor calls to ask about a patient's injuries. What is the correct response?","o":[{"t":"Give a full description of the injuries to the caller","c":false,"r":"This violates privacy."},{"t":"Describe the treatment plan and the expected stay","c":false,"r":"This violates privacy."},{"t":"Release no details unless the patient has given permission","c":true,"r":""},{"t":"Share the diagnosis with the caller since the caller is a neighbor","c":false,"r":"This violates privacy."}],"i":"Protecting privacy.","e":"HIPAA limits release of information to what the patient allows."},{"id":"T5-150","a":5,"s":"What must a hospital with an emergency department do for any person who requests care?","o":[{"t":"Ask for insurance information first, then examine the patient once verified","c":false,"r":"This delays care."},{"t":"Provide a screening exam and stabilizing treatment regardless of ability to pay","c":true,"r":""},{"t":"Send the patient away to a clinic that accepts the insurance","c":false,"r":"This violates the law."},{"t":"Wait for payment before treatment is started","c":false,"r":"This violates the law."}],"i":"Knowing EMTALA duties.","e":"EMTALA bars delay of screening and stabilization for financial reasons."},{"id":"T6-1","a":0,"s":"An 80 year old has progressive confusion and headache three weeks after a minor fall. CT shows a crescent shaped collection over the hemisphere. What is the likely diagnosis?","o":[{"t":"An acute epidural hematoma from a torn meningeal artery","c":false,"r":"This forms in hours and has a lens shape, not a crescent over weeks."},{"t":"A traumatic aneurysm of the carotid artery in the neck","c":false,"r":"This would not show a crescent shaped collection on CT."},{"t":"A chronic subdural hematoma from leaking bridging veins","c":true,"r":""},{"t":"A diffuse axonal injury from rapid rotation of the head","c":false,"r":"This is seen at the time of injury with a normal or near normal CT."}],"i":"Recognizing chronic subdural hematoma.","e":"Brain shrinkage in older adults stretches the bridging veins, so small injuries cause slow bleeding. Symptoms develop over weeks, and burr hole drainage is common."},{"id":"T6-2","a":0,"s":"A patient loses the sense of smell after a fall onto the back of the head. Which nerve is most likely injured?","o":[{"t":"The optic nerve, cranial nerve II","c":false,"r":"Injury to this nerve changes vision, not smell."},{"t":"The facial nerve, cranial nerve VII","c":false,"r":"Injury to this nerve causes facial weakness and altered taste."},{"t":"The vagus nerve, cranial nerve X","c":false,"r":"Injury to this nerve causes hoarseness and trouble swallowing."},{"t":"The olfactory nerve, cranial nerve I","c":true,"r":""}],"i":"Linking cranial nerves to deficits.","e":"The thin olfactory filaments tear as the brain shifts against the skull base. Loss of smell often follows frontal or occipital blows."},{"id":"T6-3","a":0,"s":"Several weeks after a severe brain injury, a patient develops worsening gait, urinary incontinence and slowed thinking. Which complication is suspected?","o":[{"t":"Brain death from a large new infarct in the cortex","c":false,"r":"The patient is awake and has slow decline, not loss of all function."},{"t":"Post traumatic hydrocephalus that may need a shunt","c":true,"r":""},{"t":"Diabetes insipidus from pituitary injury","c":false,"r":"This causes large volumes of dilute urine and a high sodium."},{"t":"Early epidural bleeding from a skull fracture","c":false,"r":"This presents in the first hours, not weeks later."}],"i":"Recognizing delayed complications of brain injury.","e":"Blood or swelling blocks the flow of cerebrospinal fluid, which enlarges the ventricles. Gait trouble, incontinence and dementia form the typical triad, and a shunt relieves it."},{"id":"T6-4","a":0,"s":"A ventriculostomy drain is used to measure and drain ICP. Where should the transducer be leveled?","o":[{"t":"At the right atrium level at the fourth rib","c":false,"r":"This level is used for arterial and central venous pressures."},{"t":"At the level of the patient's umbilicus on the bed","c":false,"r":"This level has no relation to the cranial cavity."},{"t":"At the level of the pillow behind the neck","c":false,"r":"This changes with head position and is not a landmark."},{"t":"At the tragus of the ear, near the foramen of Monro","c":true,"r":""}],"i":"Leveling an ICP system.","e":"The ear canal or tragus matches the level of the ventricles. Poor leveling gives false readings that may lead to wrong treatment."},{"id":"T6-5","a":0,"s":"A patient has a contusion of the occipital lobe after a hard blow to the forehead. Which term describes this?","o":[{"t":"A coup injury directly under the point of impact","c":false,"r":"The bruise here lies on the opposite side from the blow."},{"t":"A penetrating injury from a foreign object","c":false,"r":"No object entered the skull in this case."},{"t":"A diffuse injury of the white matter fibers","c":false,"r":"This is a different pattern of injury with no focal bruise."},{"t":"A contrecoup injury opposite the site of impact","c":true,"r":""}],"i":"Naming injury patterns.","e":"The brain moves within the skull and strikes the bone on the opposite side. Frontal blows therefore bruise the occipital region."},{"id":"T6-6","a":0,"s":"A patient is alert and oriented after a direct blow to the eye, but one pupil is large and does not react to light. What is the most likely cause?","o":[{"t":"Traumatic mydriasis from iris muscle damage","c":true,"r":""},{"t":"Uncal herniation from a growing intracranial hematoma","c":false,"r":"Herniation occurs with a falling level of consciousness, not in an alert patient."},{"t":"Cushing reflex from raised skull pressure","c":false,"r":"This causes high blood pressure and slow pulse with a drowsy patient."},{"t":"Horner syndrome from a carotid injury","c":false,"r":"This causes a small pupil with a drooping lid, not a large pupil."}],"i":"Separating local eye injury from herniation.","e":"An alert patient with an isolated large pupil after an orbital blow often has direct iris injury. The exam stays normal otherwise, but imaging confirms there is no brain cause."},{"id":"T6-7","a":0,"s":"A patient with a cervical spinal cord injury develops a pulse of 38 and falling pressure during endotracheal suctioning. What is the best preventive step?","o":[{"t":"Suction longer to clear all secretions","c":false,"r":"Longer suction causes more hypoxia and vagal stimulation."},{"t":"Give a beta blocker before each pass","c":false,"r":"This lowers the heart rate further and worsens the bradycardia."},{"t":"Place the patient flat and avoid oxygen","c":false,"r":"Hypoxia triggers the vagal response and causes arrest."},{"t":"Preoxygenate and have atropine ready","c":true,"r":""}],"i":"Preventing vagal bradycardia.","e":"Unopposed vagal tone makes the heart slow when the airway is stimulated. Hypoxia worsens it, so oxygenation and atropine are used."},{"id":"T6-8","a":0,"s":"A patient has loss of vibration and position sense below the lesion but good strength and pain sensation. Which cord syndrome is this?","o":[{"t":"Posterior cord syndrome","c":true,"r":""},{"t":"Anterior cord syndrome with loss of motor and pain","c":false,"r":"Here motor function and pain are intact."},{"t":"Brown Sequard syndrome with one sided loss","c":false,"r":"This has weakness on one side and crossed sensory loss."},{"t":"Central cord syndrome with arm weakness","c":false,"r":"This affects the arms more than the legs."}],"i":"Recognizing incomplete cord syndromes.","e":"The dorsal columns carry proprioception and vibration. Isolated injury is rare and leaves the patient unable to sense limb position despite normal strength."},{"id":"T6-9","a":0,"s":"A patient has early loss of bladder and bowel control, saddle numbness and symmetric leg weakness after a fall at the T12 to L1 level. Which condition is likely?","o":[{"t":"Anterior cord syndrome of the cervical level","c":false,"r":"The level of injury and the signs do not match."},{"t":"Central cord syndrome of the cervical level","c":false,"r":"This affects the arms more than the legs."},{"t":"Conus medullaris syndrome","c":true,"r":""},{"t":"Spinal shock of the thoracic level","c":false,"r":"This gives flaccid loss below the level with no sacral pattern."}],"i":"Recognizing conus injury.","e":"The conus is the end of the cord. Injury causes early sphincter loss and saddle numbness, and surgery is urgent."},{"id":"T6-10","a":0,"s":"A patient with a cervical spinal cord injury has shallow breathing when sitting upright and a falling oxygen saturation. Which aid may improve ventilation?","o":[{"t":"A tight chest binder wrapped around the ribs","c":false,"r":"This limits chest expansion and worsens breathing."},{"t":"A heavy sedative to slow the breathing","c":false,"r":"This depresses ventilation further."},{"t":"An abdominal binder to support the diaphragm","c":true,"r":""},{"t":"A flat position with the head down","c":false,"r":"This worsens diaphragm work when the abdomen is not supported."}],"i":"Supporting breathing after high cord injury.","e":"Without abdominal tone the organs fall away from the diaphragm when upright. A binder holds them in place, and vital capacity improves."},{"id":"T6-11","a":0,"s":"A patient with a spinal cord injury has not had a bowel movement for four days and has a swollen abdomen. Which approach is part of the bowel program?","o":[{"t":"Heavy doses of opioids for the abdominal pain","c":false,"r":"Opioids slow the gut and worsen constipation."},{"t":"No intervention, since the bowel is paralyzed","c":false,"r":"A planned program can empty the bowel."},{"t":"A tight abdominal binder worn day and night","c":false,"r":"This does not empty the bowel."},{"t":"A scheduled digital stimulation or suppository","c":true,"r":""}],"i":"Managing neurogenic bowel.","e":"A routine at a set time uses the gastrocolic reflex. Fluids, fiber and stool softeners support it, and impaction is a trigger of autonomic dysreflexia."},{"id":"T6-12","a":0,"s":"According to current guidance, when is surgical decompression suggested for a patient with an acute cervical spinal cord injury?","o":[{"t":"After six weeks of strict bed rest","c":false,"r":"Delay risks permanent loss of cord function."},{"t":"Early, within about 24 hours of injury when feasible","c":true,"r":""},{"t":"If the patient loses pain sensation below the injury","c":false,"r":"Decompression is considered for many incomplete injuries."},{"t":"At no time, since surgery worsens the injuries","c":false,"r":"Early surgery is linked to better recovery in many patients."}],"i":"Timing decompression.","e":"Early relief of pressure on the cord is linked to better motor recovery. The decision depends on stability and on the status of the patient."},{"id":"T6-13","a":0,"s":"Which finding signals that spinal shock is ending after a cord injury?","o":[{"t":"Return of voluntary leg movement within the first hour","c":false,"r":"Voluntary movement is not the sign that spinal shock is ending."},{"t":"A rising blood pressure with a pounding headache","c":false,"r":"These findings describe autonomic dysreflexia and not the end of spinal shock."},{"t":"Return of the bulbocavernosus reflex and reflexes","c":true,"r":""},{"t":"A fall in heart rate and temperature with warm skin","c":false,"r":"These findings describe neurogenic shock and not the end of spinal shock."}],"i":"Recognizing the end of spinal shock.","e":"Reflexes return in a set order, often within days to weeks. The bulbocavernosus reflex is usually the first, and the true level of injury is judged after it returns."},{"id":"T6-14","a":0,"s":"A patient with refractory ICP is given pentobarbital and an EEG is monitored. What is the target and what is a major risk?","o":[{"t":"Burst suppression on EEG, with a risk of low pressure","c":true,"r":""},{"t":"A flat line on EEG, with the risk of hypertension","c":false,"r":"The target is a pattern of bursts, and the drug lowers pressure."},{"t":"High frequency spikes, with the risk of tachycardia","c":false,"r":"This pattern suggests seizure and not therapeutic effect."},{"t":"Normal rhythm, with the risk of diabetes insipidus","c":false,"r":"The drug is given to reduce brain activity."}],"i":"Using barbiturate coma.","e":"Barbiturates lower the metabolic rate of the brain and reduce ICP. They also cause low blood pressure, so vasopressors may be needed."},{"id":"T6-15","a":0,"s":"A patient with a severe brain injury has had no seizures. Which approach is recommended for early posttraumatic seizure prevention?","o":[{"t":"Phenytoin continued for two years to prevent late seizures","c":false,"r":"Prophylaxis has not been shown to prevent late seizures."},{"t":"Lorazepam given daily for the first month after injury","c":false,"r":"Benzodiazepines mask the neurologic exam and are used to treat seizures."},{"t":"Levetiracetam or phenytoin during the first seven days","c":true,"r":""},{"t":"Carbamazepine started after the second week of injury","c":false,"r":"Starting after the early period does not prevent early seizures."}],"i":"Preventing early posttraumatic seizures.","e":"Seizures raise intracranial pressure and metabolic demand. Prophylaxis is limited to the first week, and it does not change the risk of seizures later."},{"id":"T6-16","a":0,"s":"A patient with an isolated head injury has a prolonged clotting time and a falling fibrinogen with no external bleeding. What is the likely mechanism?","o":[{"t":"An inherited factor VIII deficiency, as in hemophilia A","c":false,"r":"The patient has no history and the trigger is the injury."},{"t":"A vitamin C deficiency from a poor diet","c":false,"r":"This does not cause this laboratory pattern in hours."},{"t":"Excess calcium from the use of antacids","c":false,"r":"This does not cause a clotting defect."},{"t":"Release of tissue factor from damaged brain tissue","c":true,"r":""}],"i":"Recognizing brain injury coagulopathy.","e":"Damaged brain tissue is rich in tissue factor, which triggers clotting and then consumption of factors. Platelets, fibrinogen and plasma may be needed."},{"id":"T6-17","a":0,"s":"A sedated patient with a brain injury needs a neurologic exam. When is a brief sedation interruption acceptable?","o":[{"t":"At no time, since exams need full sedation and paralysis","c":false,"r":"Without exams, deterioration would be missed."},{"t":"When the ICP is stable, so the exam can be done","c":true,"r":""},{"t":"When the pupils are fixed and the ICP is high and rising","c":false,"r":"Unstable pressure is a reason to avoid waking."},{"t":"After the patient has been weaned from the ventilator","c":false,"r":"The exam should not wait for weaning."}],"i":"Doing neurologic checks safely.","e":"A short pause allows a true exam. It is avoided in patients with unstable ICP or in those on drugs for raised pressure."},{"id":"T6-18","a":0,"s":"A patient with a severe brain injury develops sudden pulmonary edema with frothy sputum and a normal heart size. Which cause is likely?","o":[{"t":"Congestive heart failure from an old heart attack","c":false,"r":"The heart is normal in size and the trigger is the brain injury."},{"t":"Aspiration of a large meal before the injury","c":false,"r":"The edema is frothy and not due to a meal."},{"t":"Pulmonary embolism from a clot in the leg","c":false,"r":"This does not cause a frothy sputum and bilateral edema in this way."},{"t":"Neurogenic pulmonary edema from sympathetic surge","c":true,"r":""}],"i":"Recognizing neurogenic pulmonary edema.","e":"A massive catecholamine surge raises pulmonary capillary pressure and permeability. Treatment is supportive with lung protective ventilation and control of the ICP."},{"id":"T6-19","a":0,"s":"Which test is used to screen for cerebral vasospasm after a traumatic subarachnoid hemorrhage?","o":[{"t":"Transcranial Doppler of the cerebral arteries","c":true,"r":""},{"t":"A plain film of the chest repeated each day","c":false,"r":"This does not assess cerebral vessels."},{"t":"An electrocardiogram repeated each shift","c":false,"r":"This does not assess cerebral vessels."},{"t":"An ultrasound of the kidneys and the bladder","c":false,"r":"This does not assess cerebral vessels."}],"i":"Monitoring for vasospasm.","e":"Faster blood flow velocities in narrowed vessels can be detected at the bedside. Spasm usually peaks several days after the bleed."},{"id":"T6-20","a":0,"s":"Which nursing action helps preserve venous drainage from the brain in a patient with raised ICP?","o":[{"t":"Tie the tracheal tube tightly around the neck with cloth","c":false,"r":"This compresses the jugular veins and raises ICP."},{"t":"Turn the head far to one side for comfort","c":false,"r":"Rotation can obstruct venous outflow."},{"t":"Keep the neck midline and avoid tight collars or ties","c":true,"r":""},{"t":"Flex the neck forward over a pillow at night","c":false,"r":"Flexion raises venous pressure in the head."}],"i":"Protecting venous outflow.","e":"Compression of the jugular veins backs blood into the skull. Midline alignment and loose, well placed devices protect the flow."},{"id":"T6-21","a":0,"s":"A patient has widened space between the inner corners of the eyes and a flattened nasal bridge after a blow to the nose. Which injury is suspected?","o":[{"t":"An isolated fracture of the mandibular angle","c":false,"r":"This does not change the eye spacing."},{"t":"A fracture of the zygomatic arch alone","c":false,"r":"This causes limited jaw opening and a flat cheek."},{"t":"A nasal orbital ethmoid fracture with telecanthus","c":true,"r":""},{"t":"A dislocation of the temporomandibular joint","c":false,"r":"This causes an open locked jaw."}],"i":"Recognizing NOE fractures.","e":"The bones that support the medial canthus are driven back. Telecanthus, epiphora, and CSF leak are warning signs, and CT is needed."},{"id":"T6-22","a":0,"s":"A patient with a unilateral condylar fracture of the mandible opens the mouth wide. Which finding is expected?","o":[{"t":"The jaw deviates toward the injured side","c":true,"r":""},{"t":"The jaw deviates toward the uninjured side","c":false,"r":"The muscle on the injured side cannot pull the jaw forward."},{"t":"The jaw opens evenly with no shift","c":false,"r":"Deviation is a classic finding."},{"t":"The jaw cannot be closed at all","c":false,"r":"This would suggest a different problem."}],"i":"Assessing mandibular function.","e":"The injured side lacks the pull of the lateral pterygoid, so the jaw moves toward it. Malocclusion is also common."},{"id":"T6-23","a":0,"s":"A patient has a deep laceration across the cheek and a watery clear drainage from the wound while chewing. Which structure may be injured?","o":[{"t":"The tear duct in the medial eyelid","c":false,"r":"This lies near the eye, not the cheek."},{"t":"The thyroid gland in the neck","c":false,"r":"This lies in the neck."},{"t":"The submandibular gland duct","c":false,"r":"This lies under the jaw and not in the cheek."},{"t":"The parotid duct","c":true,"r":""}],"i":"Recognizing salivary duct injury.","e":"Saliva leaks from a cut duct during meals. The wound is explored, the duct is repaired or stented, and the facial nerve branches are checked."},{"id":"T6-24","a":0,"s":"A patient has a dilated pupil that appears to dilate when the light swings from the normal eye to the injured eye. What is this called, and what does it show?","o":[{"t":"Anisocoria from a normal variant with no clinical meaning","c":false,"r":"A pupil that dilates to a swinging light is abnormal."},{"t":"A consensual reflex that proves the eye is healthy","c":false,"r":"This finding suggests a defect in the pathway."},{"t":"A relative afferent pupillary defect","c":true,"r":""},{"t":"Argyll Robertson pupil from an old infection","c":false,"r":"This pupil does not react to light but does react to near effort."}],"i":"Using the swinging flashlight test.","e":"The damaged eye sends a weak signal, so both pupils widen when light moves to it. It signals serious injury to the nerve or retina."},{"id":"T6-25","a":0,"s":"A patient has proptosis, severe eye pain, a tense eyelid and falling vision after a blow to the orbit. What is the likely diagnosis and urgent treatment?","o":[{"t":"Retrobulbar hematoma, treated by lateral canthotomy","c":true,"r":""},{"t":"Corneal abrasion, treated with an eye patch and drops","c":false,"r":"An abrasion does not push the eye forward or cause tense lids."},{"t":"Hyphema, treated with an eye shield and bed rest","c":false,"r":"Blood in the front chamber does not cause proptosis and a tense orbit."},{"t":"Blowout fracture, treated with antibiotics and observation","c":false,"r":"A fracture causes double vision and sunken eye, and pressure is not the issue."}],"i":"Recognizing orbital compartment syndrome.","e":"Pressure in the orbit threatens the optic nerve within about two hours. The canthotomy relieves the pressure at the bedside before imaging."},{"id":"T6-26","a":0,"s":"Three days after an orbital fracture, a patient has fever, a red swollen eyelid, pain with eye movement and a bulging eye. What is suspected?","o":[{"t":"Orbital cellulitis that needs imaging and IV antibiotics","c":true,"r":""},{"t":"A simple bruise of the eyelid that will fade in days","c":false,"r":"Fever and a bulging eye suggest infection."},{"t":"Allergic conjunctivitis that needs antihistamine eye drops","c":false,"r":"This does not cause fever and pain on movement."},{"t":"A new corneal abrasion that needs a patch and drops","c":false,"r":"This does not explain the swelling and fever."}],"i":"Recognizing orbital cellulitis.","e":"Infection spreads from the sinuses through the fracture. It can threaten sight and the brain, so treatment is urgent."},{"id":"T6-27","a":0,"s":"A patient has pain, tearing and sensitivity to light in both eyes when a light is shone in only one eye after blunt eye trauma. What is suspected?","o":[{"t":"A normal reaction to the blow that needs no treatment","c":false,"r":"This finding is not normal."},{"t":"A corneal foreign body that needs a saline rinse","c":false,"r":"This usually has a different pattern."},{"t":"A retinal tear that needs an antibiotic and a patch","c":false,"r":"This is not treated with antibiotics."},{"t":"Traumatic iritis, treated with a cycloplegic","c":true,"r":""}],"i":"Recognizing traumatic iritis.","e":"Inflammation of the iris causes consensual photophobia. A dilating drop rests the muscle, and a steroid drop may be added by the specialist."},{"id":"T6-28","a":0,"s":"A patient with a penetrating neck wound has a rapidly growing hematoma and a changing voice. What is the first priority?","o":[{"t":"Early definitive airway management","c":true,"r":""},{"t":"A CT scan of the neck before airway action","c":false,"r":"Delay risks loss of the airway as swelling grows."},{"t":"Gentle massage over the swelling to disperse it","c":false,"r":"This worsens bleeding."},{"t":"Oral fluids and observation for several hours","c":false,"r":"The patient needs urgent airway control."}],"i":"Securing the airway in neck hematoma.","e":"Swelling in the neck can close the airway fast and make intubation impossible. Early intubation or a surgical airway comes first."},{"id":"T6-29","a":0,"s":"A patient with a left neck stab wound has milky white drainage from the wound two days after repair. What is the likely injury?","o":[{"t":"A tear of the carotid artery in the neck","c":false,"r":"This causes bright red bleeding."},{"t":"A tear of the trachea at the wound","c":false,"r":"This causes air leak and not milky fluid."},{"t":"Thoracic duct injury with a chyle leak","c":true,"r":""},{"t":"An injury to the parotid gland at the wound","c":false,"r":"This causes clear saliva."}],"i":"Recognizing chyle leak.","e":"The duct drains lymph and fat from digestion. Low fat feeding, drainage and sometimes surgery treat it."},{"id":"T6-30","a":0,"s":"Where is the incision made for a surgical cricothyrotomy?","o":[{"t":"Through the thyrohyoid membrane, between the hyoid bone and the thyroid cartilage","c":false,"r":"This site lies above the vocal cords and is not used
